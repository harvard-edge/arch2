[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arch2"
version = "0.1.0"
description = "Architecture 2.0: Principles of AI-Native System and Chip Design CLI & Workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1",
    "rich>=13,<16",
    "pypdf",
    "pdfplumber",
    "PyYAML>=6,<7",
    "jsonschema>=4.18,<5",
    "referencing>=0.28,<1",
    "pybtex",
    "jupyter",
    "matplotlib",
    "numpy",
    "pandas",
    "pre-commit",
    "pytest>=8,<10",
    "defusedxml>=0.7,<1",
    "pyslang==11.0.0",
]

[project.optional-dependencies]
card = [
    "typer>=0.12,<1",
    "rich>=13,<16",
    "PyYAML>=6,<7",
    "jsonschema>=4.18,<5",
    "referencing>=0.28,<1",
]
cff = [
    "cffconvert==2.0.0",
]

[project.scripts]
arch2 = "cli:main"

[tool.setuptools]
packages = ["cli"]
