verified: "2026-09-29: two runs on existing clones and a third from cold clones of the six pinned commits wrote byte-identical CSVs and summaries. Every manifest file's SHA-256 is checked before measurement. 342 of 344 files measured; 2 excluded with a recorded reason."
not_verified: "Binding covers 97% of syntactic references to declared signals; the 1,170 unbound references are not measured and their cause is not established. Five measured files carry 13 semantic errors from elaboration. BaseJump modules with required parameters are elaborated with those parameters set to 4, so parameter-dependent generate structure reflects that choice. The file list was inherited from the deleted dataset; its original selection rule is unknown. Tree distances omit 170 of the 40,995 token-distance pairs across 18 files; the panels use different available pair sets. File bootstrap intervals do not establish transfer beyond this convenience corpus. The different-signal baseline as repaired is unaudited. Its thresholds are post hoc, set after the outcome was known from an audit estimate, and no commit pins them. Unrelated there means only a different declaration. It depends on study 23's extracted archives, which are gitignored and refetchable by pinned URL and hash."
