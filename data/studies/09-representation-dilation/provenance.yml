verified: "2026-09-29: two runs on existing clones and a third from cold clones of the six pinned commits wrote byte-identical CSVs and summaries. Every manifest file's SHA-256 is checked before measurement. 342 of 344 files measured; 2 excluded with a recorded reason."
not_verified: "Binding covers 97% of syntactic references to declared signals; unbound references (mostly in generate branches that default parameters leave inactive) are not measured. BaseJump modules with required parameters are elaborated with those parameters set to 4, so parameter-dependent generate structure reflects that choice. The file list was inherited from the deleted dataset; its original selection rule is unknown."
