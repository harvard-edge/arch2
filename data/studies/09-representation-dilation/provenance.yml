study: 09-representation-dilation
title: "Declaration-to-use distance in token order and in the syntax tree"
claim: "In pinned public Verilog and SystemVerilog files, the mean token distance from a signal's declaration to its uses grows almost in proportion to file length (log-log slope 0.96, 95% bootstrap CI 0.92 to 0.99, 342 files), while the syntax-tree path between the same pairs stays near ten edges."
evidence_class: measured   # mined | measured | transcribed
status: verified

