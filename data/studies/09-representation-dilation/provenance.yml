study: 09-representation-dilation
title: "Declaration-to-use distance in token order and in the syntax tree"
claim: "In pinned public Verilog and SystemVerilog files, the mean token distance from a signal's declaration to its uses grows almost in proportion to file length (log-log slope 0.96, 95% bootstrap CI 0.92 to 0.99, 342 files), while the syntax-tree path for the recoverable subset (40,825 pairs in 341 files) stays near ten edges. At the file level, a use of a different declared signal in the same module has about the same tree-path length (median ratio 0.999, 95% CI 0.998 to 1.000, 336 files; strictly longer in a median 41.5 percent of draws, tied 17.4, shorter 40.4). The 5.3 percent of in-module pairs that meet below the module do separate (ratio 1.36, 2,120 pairs), which may be partly selection. The 589 pairs in package functions of one file have no enclosing module and are outside the baseline. Different declaration does not establish no dependency, and the comparison is post hoc."
evidence_class: measured   # mined | measured | transcribed
status: producer_checked_audit_failed  # data/audits/fig-ch04-spatial-semantic-dilation.yml, FAIL 2026-11-02; repaired, needs a fresh audit

