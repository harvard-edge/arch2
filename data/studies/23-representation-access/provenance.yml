schema: arch2-provenance/v1
study: 23-representation-access
title: Pair-level source accessibility in pinned RTL
evidence_class: measured
status: verified
claim_class: evidence-backed descriptive source analysis
claim: >-
  In the exact matched set of 40,825 bound declaration/use pairs with both
  token intervals and syntax paths recoverable, the share covered by a minimum
  256-token contiguous source interval is 21.9% under pair weighting and 84.9%
  under equal-file weighting. One BaseJump source file contributes 40.3% of
  matched pairs and 84.0% of matched pairs with intervals longer than 4,096
  tokens. These statistics describe an inherited convenience corpus and are
  sensitive to its sampling unit.
measurement_unit:
  source_interval: minimum contiguous non-trivia token interval including declaration and use, abs(token index difference) + 1
  syntax_path: concrete syntax tree edges from declaration node to use-name node
  source_location: UTF-8 source byte offsets and one-based source line numbers
population: Public Verilog/SystemVerilog source files listed in the inherited 09 corpus manifest
selection: >-
  344 files across six repositories selected by data/studies/09-representation-dilation/corpus_manifest.csv;
  the earlier selection rationale is undocumented. Two Ibex package files with no module/interface
  declaration remain listed as excluded in derived/file_summary.csv. All conditional-generate source
  branches are part of the source-layout measurement, regardless of the selected top-level parameter;
  the plotted quantity is not an active-hardware population.
sources:
  retained_archives: raw/*.tar.gz
  manifest: source_manifest.json
  repository_commits:
    - https://github.com/NVlabs/verilog-eval/tree/c498220d0a52248f8e3fdffe279075215bde2da6
    - https://github.com/hkust-zhiyao/RTLLM/tree/51ed553d0ffd32797a1a0a13e051656bf302c81f
    - https://github.com/bespoke-silicon-group/basejump_stl/tree/b48037e28544425839dbd617d45b1a82631bc1a9
    - https://github.com/olofk/serv/tree/41e8aeedfd1e9ad5f95902c5b0dfc83d1c99e5d2
    - https://github.com/lowRISC/ibex/tree/8b8ee086aef72e0833b7f0493d9d33f1e4d3c8e2
    - https://github.com/YosysHQ/picorv32/tree/a473fc8fca393771d83b0ffcf0b14db3393339d8
upstream_attribution:
  prior_corpus_and_measurement: data/studies/09-representation-dilation
  parser: pyslang 11.0.0
  notes: >-
    The upstream study owns its original file selection, definitions, and file-level
    analysis. This study contributes retained pair-level source locations and hashes,
    exact matched token/tree pairs, minimum-interval coverage distributions, and
    pair-versus-file weighting sensitivity.
outputs:
  - derived/pairs.csv
  - derived/file_summary.csv
  - derived/budget_coverage.csv
  - derived/summary.json
  - diagnostics/bsg_scatter_gather_generate_scope.json
  - figures/fig-representation-source-access.svg
  - figures/fig-representation-source-access.pdf
  - figures/fig-representation-source-access.png
limits:
  - Pair spans reflect the source layout and are not prompt lengths or model-context observations.
  - Syntax edge counts and source token counts are different units and are not directly proportional.
  - No model attention, retrieval, accuracy, hardware behavior, or design outcome was measured.
  - Binding and tree-path recoverability depend on parser/elaboration choices; 1,170 of 42,341 same-file signal-name references are unbound and 170 bound pairs lack syntax paths.
  - The corpus contains related files and is not a sample from a defined RTL population.
datasets:
  - file: derived/file_summary.csv
    rows: 344
    row_provenance: [repo, file_path, source_sha256, matched_pairs]
  - file: derived/budget_coverage.csv
    rows: 9
    row_provenance: [token_budget, pair_weighted_share, file_weighted_share]
  - file: derived/summary.json
    rows: 1
    row_provenance: [matched_pairs, pair_weighted_256_pct, file_weighted_256_pct]
chapter_placement: book/contents/chapters/04-representations
produced_by: data/studies/23-representation-access/reproduce.py
reproduce: python3 data/studies/23-representation-access/reproduce.py
