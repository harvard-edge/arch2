schema: arch2-provenance/v1
study: 12-mlperf-latency-contract
title: Throughput depends on the latency contract
claim: The retained paired MLPerf v5.0 submissions achieve 42–64 percent of standard Server throughput under the stricter interactive latency contract.
evidence_class: mined
status: extraction_verified
sources:
  - name: MLPerf Inference v5.0 submissions
    type: git_repository
    id: 0bc17ab3f4b33f730d7869e04cc29cb70835e513
    url: https://github.com/mlcommons/inference_results_v5.0
    license: No root license found in this snapshot. Repository README points to MLCommons policies; check attribution and redistribution terms before publication.
datasets:
  - file: paired_throughput.csv
    rows: 19
    row_provenance: [system_id, submitter, platform, standard_source, interactive_source]
source_manifest: source_manifest.json
produced_by: reproduce.py
reproduce: python3 data/studies/12-mlperf-latency-contract/reproduce.py
collect: python3 data/studies/12-mlperf-latency-contract/collect.py
verified: All 59 retained source files match SHA-256 receipts. All 38 logs report VALID with performance constraints satisfied; throughput agrees with the summary to its published precision. All 19 system files specify eight accelerators. Reported platform, precision and software match within each pair. Latency targets agree across all pairs.
not_verified: GPU runs, accuracy evaluation, MLPerf compliance tests, actual hardware identity, original submission review, or identical batch and scheduling configurations were not independently repeated.
defects:
  - Results are submitted operating points, not measured maxima or a controlled one-variable latency intervention.
  - Vendors can share implementations and configurations; the 19 pairs are not 19 independent experimental replications.
  - Selection uses the complete root summary file; the recursively queried GitHub tree was truncated and was not used as a complete population inventory.
  - Accelerator precision differs across families; ratios compare conditions within each submitted system, not hardware efficiency between families.
outputs: [figure.svg, figure.pdf, figure.png]
