schema: arch2-provenance/v1
study: 12-mlperf-latency-contract
title: Interactive and standard throughput on matched MLPerf submissions
claim: In the retained paired MLPerf v5.0 submissions, interactive throughput is 42-66 percent of standard Server throughput, and each share follows the ratio of the two logged target query rates. The share is not a measured cost of the stricter latency contract.
evidence_class: mined
status: extraction_verified
sources:
  - name: MLPerf Inference v5.0 submissions
    type: git_repository
    id: 0bc17ab3f4b33f730d7869e04cc29cb70835e513
    url: https://github.com/mlcommons/inference_results_v5.0
    license: No root license found in this snapshot. Repository README points to MLCommons policies; check attribution and redistribution terms before publication.
datasets:
  - file: paired_throughput.csv
    rows: 20
    row_provenance: [system_id, submitter, platform, standard_source, interactive_source]
source_manifest: source_manifest.json
produced_by: reproduce.py
reproduce: python3 data/studies/12-mlperf-latency-contract/reproduce.py
collect: python3 data/studies/12-mlperf-latency-contract/collect.py
check_user_conf: python3 data/studies/12-mlperf-latency-contract/check_user_conf.py
verified: "All 62 declared source files match SHA-256 receipts in the rebuild of 2026-11-02, including raw/summary_results.json, which that run refetched from the pinned commit; pair selection and filter counts were rechecked against it. All 40 logs report VALID with performance constraints satisfied; throughput agrees with the summary to its published precision. All 20 system files specify eight accelerators. Reported platform, precision and software match within each pair. Latency targets agree across all pairs."
not_verified: GPU runs, accuracy evaluation, MLPerf compliance tests, actual hardware identity, original submission review, or identical batch and scheduling configurations were not independently repeated.
defects:
  - "raw/summary_results.json is gitignored, so a fresh clone lacks it until collect.py refetches it. Without it reproduce.py cannot hash it and skips the select_pairs recheck, reusing selected_pairs.json and the stored filter counts. build_receipt.json records which case applied under source_verification."
  - "An unjustified has_power filter silently dropped the Fujitsu H100-NVL-94GB pair from builds before 2026-11-02, which published 19 pairs and a 63.9 percent maximum. It was removed after the red-team audit in data/audits. README lists rows dropped by each remaining filter."
  - Results are submitted operating points, not measured maxima or a controlled one-variable latency intervention.
  - "Each interactive share lies within 0.51 percent of the ratio of the pair's logged target_qps values, and no log reports a 99th-percentile latency at its bound, so the share records chosen targets. The rules ask for the maximum supported rate and judge runs on an early-stopping estimate the summary logs do not print, so this shows no forced limit and does not show that none exists."
  - "31 of the 40 pinned user.conf files give a target_qps different from the log, 27 of them at about 0.92 of the log value. The sources do not explain this. See user_conf_targets.json."
  - Vendors can share implementations and configurations; the 20 pairs are not 20 independent experimental replications.
  - Selection uses the complete root summary file; the recursively queried GitHub tree was truncated and was not used as a complete population inventory.
  - Accelerator precision differs across families; ratios compare conditions within each submitted system, not hardware efficiency between families.
outputs: [figure.svg, figure.pdf, figure.png, user_conf_targets.json]
