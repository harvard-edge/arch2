schema: arch2-provenance/v1
study: 26-compiler-thread-scaling
title: Workload-dependent IREE CPU thread scaling in a public benchmark report
claim: In one historical IREE report, all ten retained model/input configurations show lower reported mean latency at four local-task groups than at one; the eight-group response varies from a further reduction to a small increase relative to four groups.
evidence_class: mined
status: extraction_verified
sources:
  - name: IREE GitHub Actions bot benchmark report 1559
    type: public_operational_benchmark_summary
    url: https://gist.github.com/iree-github-actions-bot/536b0ea87b0be6e93adf4118de88a1b8/e17830877c662d2e4caec8c68c64a52aaaa4a116
    id: Pinned Gist revision e17830877c662d2e4caec8c68c64a52aaaa4a116, created 2022-10-03T21:04:38Z; tested commit 91a524d6c77646eb18d12fb79ad0a62124e1f8d7 against base baf38ecc5f4496f85389bfb012afaac762006f75. Retained bytes and SHA-256 in source_manifest.json.
    license: Report/data redistribution terms not established. Preserve attribution and review applicable terms before external redistribution.
  - name: IREE benchmark configuration at tested commit
    type: versioned_source_code_configuration
    url: https://github.com/iree-org/iree/tree/91a524d6c77646eb18d12fb79ad0a62124e1f8d7/build_tools
    id: Exact committed definitions, device spec, invocation settings, argument defaults, Linux runner, and Buildkite pipeline are retained and hashed in source_manifest.json.
    license: Referenced source files declare Apache-2.0 WITH LLVM-exception.
datasets:
  - file: extracted.csv
    rows: 30
    row_provenance: [source_row_id, source_section, benchmark_name, series_url, model_and_input, precision_and_shape, framework, thread_count, backend, machine_label, architecture_label, reported_mean_ms, reported_median_ms, reported_stdev_ms]
  - file: latency_inventory.csv
    rows: 40
    row_provenance: [source_row_id, source_section, benchmark_name, backend, machine_label, architecture_label, reported_mean_ms, reported_median_ms, reported_stdev_ms, included_in_thread_scaling_extract, selection_reason]
  - file: plot_data.csv
    rows: 30
    row_provenance: [source_row_id, model_and_input, thread_count, mean_latency_ms, reported_stdev_ms, relative_mean_latency, relative_reported_stdev, speedup_vs_one_thread, speedup_per_group_count]
observation_unit: One reported model/input/runtime group-count configuration mean, median, and standard deviation in one bot report; each retained workload contributes its 1-, 4-, and 8-group configurations.
selection: All 30 rows in the report's two average-latency tables with explicit 1-, 4-, or 8-thread local-task tags, IREE-LLVM-CPU backend, and the GCP-c2-standard-16 / x86_64 Cascade Lake labels. The ten same-table CPU-Sync rows are retained in latency_inventory.csv and excluded because local-sync is a separate driver without the matching group-count sweep. No selection depends on the direction or size of a latency change.
source_manifest: source_manifest.json
produced_by: scripts/extract.py and plot.py
collect: python3 data/studies/26-compiler-thread-scaling/collect.py
reproduce: python3 data/studies/26-compiler-thread-scaling/reproduce.py
transformations:
  - Parse each row from both complete average-latency sections of the retained bot report and inventory all 40 entries with a source row ID and inclusion decision.
  - Preserve the report's current mean, base mean, reported relative change, median, and standard deviation without recalculating them from absent run-level samples.
  - Divide each current mean and its reported standard deviation by that workload's reported 1-thread mean to produce the plotted values.
  - Compute 1-thread-relative speedup and speedup per group as derived descriptive values in plot_data.csv.
verified:
  - SHA-256 of each pinned Gist and IREE configuration source file matches source_manifest.json.
  - The full report yields 40 average-latency rows; 30 satisfy the explicit thread/backend/device selection, and all ten selected workloads have exactly one row at 1, 4, and 8 groups.
  - Ten local-sync rows remain in the inventory with a stated exclusion reason.
  - All 30 plotted points map to unique source Markdown line IDs.
  - Plot files are generated from the retained CSV, with SVG/PDF and 300-DPI PNG; the PNG has been visually inspected.
not_verified:
  - Original run-by-run JSON, reported sample rows, or independent recalculation of mean, median, and standard deviation.
  - Physical host identity, affinity, power state, thermal state, cache state, or repeated builds on separate hosts.
  - Causal explanation for workload-specific scaling differences, transfer to other CPUs or IREE versions, or current performance.
  - Any AI contribution, architecture quality, energy, throughput, area, or total system cost.
defects:
  - Historical perf.iree.dev series links timed out during collection; the public Buildkite build page returned HTTP 403. The report's raw benchmark-results JSON was not recovered.
  - The report names a GCP machine type and CPU architecture, not a specific physical host.
  - The benchmark source config requests ten repetitions for embedded-ELF runs, but the summary does not expose individual observations. The displayed standard deviations are descriptive run spread, not confidence intervals.
  - Results are from a 2022 PR benchmark report and should not be presented as representative of current IREE or general CPU behavior.
outputs: [figure.svg, figure.pdf, figure.png]
