verified: 1513 rows, 168/1125 medians and 6.70x ratio recompute exactly; all 6 commits resolve upstream; reproduces byte-for-byte (2026-09-09)
revalidation_2026_09_29: "Headline ratios (6.70x, 4.77x diagnostic-free, 4.27x ratio of medians of repository medians), source-reference shares (VerilogEval 0%, production 45% to 63%, max depth 13) and clocking shares (5.1% vs 0.5%) recomputed from the CSV. Every VerilogEval and CV32E40P row (279 of 1,513) re-parsed with pyslang 11.0.0 at the pinned commits and matched exactly; the Chapter 4 audit reported a cold re-run reproducing all 1,513 rows cell for cell. The website figure copy, which still labeled VeeR EH1 as EL2, was regenerated from the plot script."
sensitivity_2026_11_02: "Reparse with repository HDL directories on the include path: pooled ratio 8.57x (168 vs 1,440), 5.46x on modules still free of substantive diagnostics; substantive-diagnostic production modules fall from 703 to 378. Chapter 4 prints 4.0x from a separate filter that ignores only DiagCode(NewlineEOF); the 4.77x row here drops any diagnostic and requires a valid tree. Two runs, one failed on the SHA-256 check, logged in REPRODUCE.md. A third logged run added written tokens: 90 vs 602, 6.69x under both parses, so 8.57x is a preprocessed count. The 2026-11-02 audit reproduced 8.57x and 378 and reported the same 6.69x from its own diagnostic; the JSON stays outside the figure's declared inputs."
not_verified: "Full-design elaboration, active generate branches, and transfer beyond the selected public repositories. Source-reference depth is not a bound on elaborated instance depth. BlackParrot children in its BaseJump submodule are outside the pinned repository, and build-time generated headers stay unresolved."
