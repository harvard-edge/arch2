# Provenance record for offload-break-even
# Schema: arch2-provenance/v1. One file per data folder. This is the only
# provenance record; anything not listed here has no recorded source.

schema: arch2-provenance/v1
study: offload-break-even
title: "The unamortized offload wall: where accelerator offload breaks even against an optimized host"
claim: "On an M5 Max with Accelerate BLAS, a resident FP32 MPS matmul first beats the host at n=768 (pooled; 768, 1024, 768 across three runs), the same product including copies in and out at n=1024 (1024, 1024, 768), sixteen separate MPS launches beat host bmm from n=384 and one batched launch from n=256 (both stable across runs); the resident launch floor is 1.82e-4 s and sixteen launches cost 3.21x one batched launch for n<=256."
evidence_class: measured   # mined | measured | transcribed
status: measured_pilot_one_host
observation_unit: One timed repetition of one arm at one matrix size in one run (process)
selection: "All 16 sizes in the declared grid, all 6 arms, all 31 repetitions, all 3 runs are retained. Nothing was dropped."

host:
  machine: "Apple M5 Max laptop (12 performance + 6 efficiency CPU cores, 64 GiB unified memory)"
  os: "macOS 26.4 (Darwin 25.4.0)"
  python: "3.14.4 (Homebrew)"
  torch: "2.11.0, BLAS_INFO=accelerate (Apple Accelerate / veclib), USE_MPS, OpenMP, 6 intra-op threads by default"
  accelerator: "Apple GPU through the PyTorch MPS backend; same physical DRAM as the CPU (unified memory)"
  power: "AC power, battery charging; recorded per run in raw/run-<k>.host.json"
  thermal: "pmset -g therm output recorded per run; no active cooling control"

sources:
  - name: "This study's own measurement"
    type: measured_run
    note: "collect.py executed three times as three fresh processes on 2026-11-02; see raw/run-<k>.host.json for timestamps and host state."
  - name: "Pilot that motivated the grid and arms"
    type: pilot_script
    path: (pilot retained in private review notes)
    note: "15-rep pilot with 8 sizes and panel (a) only; superseded by this study."

datasets:
  - file: raw/run-1.csv
    rows: 2976
    row_provenance: [run_id, n, panel, arm, arm_order, rep, seconds]
  - file: raw/run-2.csv
    rows: 2976
    row_provenance: [run_id, n, panel, arm, arm_order, rep, seconds]
  - file: raw/run-3.csv
    rows: 2976
    row_provenance: [run_id, n, panel, arm, arm_order, rep, seconds]
  - file: raw/run-1.host.json
  - file: raw/run-2.host.json
  - file: raw/run-3.host.json
    note: "Host state per run: CPU model, cores, OS, Python, torch version and build config, thread count, BLAS backend, power source, thermal state, seed, command, start and end timestamps, elapsed seconds."
  - file: medians.csv
    note: "Derived. One row per (run | pooled) x arm x n with n_samples, median, q1, q3, iqr, min, max."
  - file: summary.json
    note: "Derived. Crossovers, launch floor, launch ratio, non-monotone flags, dispersion at crossovers."

produced_by: reproduce.py
collect: |
  for k in 1 2 3; do python3 collect.py --run-id $k; sleep 5; done
reproduce: python3 reproduce.py

measurement:
  dtype: float32
  sizes: [16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512, 768, 1024, 1536, 2048, 3072]
  batch_for_panel_b: 16
  warmup_per_arm_per_n: 5
  timed_repetitions_per_arm_per_n: 31
  runs: 3
  timer: time.perf_counter around the call; torch.mps.synchronize() inside the timed region for every MPS arm
  arm_order: "The six arms are shuffled per n with random.Random(1000 + run_id); the position is recorded in the arm_order column."
  operands: "torch.randn, seeded with torch.manual_seed(1000 + run_id); the same A, B (and A16, B16) feed all six arms at a given n."
  output_allocation: "Inside the timed region for every arm (fresh output each repetition), as for an ordinary caller."
  arms:
    cpu_single: "torch.matmul(A, B) on the host; synchronous"
    mps_resident: "torch.matmul(Ad, Bd) with operands already on MPS; then synchronize"
    mps_copy: "torch.matmul(A.to('mps'), B.to('mps')).cpu(); then synchronize"
    cpu_bmm: "torch.bmm(A16, B16) on the host over a (16, n, n) batch"
    mps_16_launch: "sixteen torch.matmul(A16d[i], B16d[i]) launches on resident operands; one synchronize after the sixteenth"
    mps_bmm: "one torch.bmm(A16d, B16d) launch on resident operands; then synchronize"

transformations:
  - Per (run, arm, n): median and inclusive-method quartiles over the 31 samples; pooled statistics over all 93 samples.
  - Crossover: first n in the grid at which the MPS arm's median is below the CPU arm's median for the same panel; stays_ahead is true when every larger n in the grid is also ahead. Reported per run and on pooled medians; stable means the same n in all three runs and stays_ahead in each.
  - Launch floor: median over all samples with n <= 256 for a resident MPS arm.
  - Sixteen-launch over one-launch ratio: ratio of medians per n for n <= 256, summarized by its median across those sizes.
  - Non-monotone: a point where the median is lower than at the previous grid size; a point is recurring when it appears in every run.
  - Dispersion at crossover: spread of the three per-run medians as a fraction of the pooled median, and pooled IQR as a fraction of the median.

verified: "reproduce.py recomputes summary.json from raw/ alone; every number in README.md is taken from its output."
not_verified: "No second machine, no discrete GPU, no other BLAS, no other dtype, no independent timer (for example Metal GPU timestamps), no power or energy measurement."

caveats:
  - One machine, one session, three runs; the dispersion measured is within-session run-to-run dispersion, not across-machine or across-day dispersion.
  - Unified memory. The copy arm measures an in-DRAM copy between CPU-visible and MPS-visible buffers plus synchronization, not a discrete-link (PCIe, NVLink) transfer. On a discrete accelerator the copy penalty would be larger and the copy crossover later.
  - The CPU arm uses Apple Accelerate (vendor BLAS) through torch.matmul with the default 6 intra-op threads; it is an optimized host, not a naive loop. A naive host would move every crossover to a smaller n.
  - FP32 only. Reduced-precision kernels change both the accelerator's kernel time and the host's, and so the crossover.
  - No overlap of transfer and compute was attempted; the copy arm is serial copy-in, compute, copy-out.
  - Timings include Python dispatch and PyTorch operator overhead on both sides; the MPS floor includes command-buffer encode, commit, and the synchronize wait.
  - The sixteen-launch arm synchronizes once after the sixteenth launch; it measures sixteen submissions and one round trip, not sixteen round trips.
  - Output allocation is inside the timed region (allocator-cached after warmup on both devices).
  - Panel (b) host arm is torch.bmm; its scaling relative to sixteen single matmul calls was not studied separately.
  - The grid is coarse between powers of two; a crossover reported at n means the first grid point, and the true crossover lies between the previous grid point and n.

outputs: [summary.json, medians.csv]
