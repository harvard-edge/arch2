schema: arch2-provenance/v1
study: 11-kernelagent-feedback
title: Kernel time, occupancy, and DRAM throughput
claim: Faster retained candidates can have lower achieved occupancy; individual hardware counters do not determine performance.
evidence_class: mined   # data/datasets/provenance.yml records this as transcribed; its enum has no mined class
status: extraction_verified
sources:
  - name: KernelAgent optimization artifacts
    type: git_repository
    id: 56cf9183b527307538ccbe8f554a88502918d2d1
    url: https://github.com/kaiming-cheng/kernelagent-optimization-artifacts
    license: No license file found in the pinned tree, and the GitHub API reported no license on 2026-11-02; redistribution permission is unresolved.
    date: Repository created 2026-02-16; the pinned initial commit is authored 2026-02-23 and committed 2026-02-24.
datasets:
  - file: paired_metrics.csv
    rows: 10
    row_provenance: [problem, round, profile_source, timing_source, profiled_kernel]
  - file: readme_timing_check.csv
    rows: 40
    row_provenance: [problem, round]
source_manifest: source_manifest.json
produced_by: reproduce.py
reproduce: python3 data/studies/11-kernelagent-feedback/reproduce.py
collect: python3 data/studies/11-kernelagent-feedback/collect.py
verified: All 126 source files match retained SHA-256 receipts. The first and minimum-time candidates are selected from all eight retained rounds per task. Each selected profile contains one kernel whose name occurs in its associated kernel.py source.
not_verified: No GPU execution, profiler rerun, causal ablation, confidence interval, or independent correctness check. Matching folder and kernel name do not replace a source hash recorded at the original execution.
defects:
  - Original profiling records lack executable hashes and complete launch context.
  - Timing and profiling are different measurements; profiler counters are not a direct timing decomposition.
  - The source is curated and retains only one worker per round.
  - RMSNorm's small timing difference may be noise; it is included to preserve the full five-task population.
  - Round 1 is the first optimization round, not the input kernel or a torch.compile baseline. The upstream README reports matrix-vector at 1.06x against torch.compile.
  - The upstream README table disagrees with the per-round records used here (readme_timing_check.csv). Transposed conv. 3D reads 1.4448 to 1.4495 times the records in every round, 14.839 and 7.821 ms against 10.271 and 5.412 ms, while its first-to-best ratio is 0.5271 against 0.5269. Matrix-vector and RMSNorm differ by up to 0.22 and 0.44 percent, and the README puts RMSNorm's best in round 3 where the records put it in round 8. The cause is unknown. All 40 per-round records use warmup 25 and repeat 100, whereas upstream benchmark.py uses warmup 500; whether that explains the gap was not tested.
outputs: [figure.svg, figure.pdf, figure.png, paired_metrics.csv, readme_timing_check.csv]
