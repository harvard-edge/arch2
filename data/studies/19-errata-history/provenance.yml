schema: arch2-provenance/v1
study: 19-errata-history
title: Explicit errata additions by document revision year
claim: Four retained vendor revision histories record errata additions across multiple calendar years; the dated changes remain a partial document history.
evidence_class: mined
evidence_class_note: Mined is the study-level term for values extracted by script from a published record. The figure manifest data/datasets/provenance.yml has no mined class and lists the same figure as transcribed. Both name this extraction.
status: extraction_verified_with_source_gaps
source_manifest: source_manifest.json
sources:
  - name: Intel Broadwell-EP and Ice Lake-SP specification updates; AMD Family 17h 00h–0Fh and Family 1Ah 00h–0Fh revision guides
    type: shared_frozen_vendor_PDFs
    path: ../13-errata-dispositions/raw/pdf/
    license: Vendor PDFs are gitignored at this path and not in the repository; redistribution rights not established. source_manifest.json pins each by URL and sha256, and a rerun depends on those URLs still serving the pinned bytes. All four URLs served the pinned bytes when last fetched on 2026-11-02.
datasets:
  - file: revision_rows.csv
    rows: 40
    row_provenance: [pdf_file, date, revision, description, pdf_page_1based]
  - file: annual_counts.csv
    rows: 21
    row_provenance: [family, year, revision_rows, explicit_added_id_count]
selection: Four illustrative histories with directly inspectable tables; not an exhaustive or representative sample
produced_by: reproduce.py
reproduce: python3 data/studies/19-errata-history/reproduce.py
verified: Four PDF identities; 40 visible table rows; inclusive ranges; separation of additions, removals, and references; all annual additions checked against source pages; chart and PDF rendering inspected.
not_verified: Discovery dates, complete historical inventories, initial populations, independent defects, defect incidence, or comparative verification effectiveness.
defects:
  - Broadwell BDF92 has an undated removal outside its revision table, so a cumulative dated inventory fails reconciliation.
  - Ice Lake-SP's table starts at revision 003US; its initial baseline is not observed.
  - Naples-associated history has revision-number gaps; no missing changes are imputed.
  - AMD family-guide scope can exceed the named reference server family.
  - Annual figures include partial first/last years and count only explicit additions; missing rows are not evidence of no defects.
outputs: [figure.svg, figure.pdf, figure.png]
