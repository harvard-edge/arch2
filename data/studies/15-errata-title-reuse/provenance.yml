schema: arch2-provenance/v1
study: 15-errata-title-reuse
title: Repeated titles in an architecture dataset
evidence_class: derived_from_mined_records
status: calculation_verified
sources:
  - name: Versioned vendor erratum extraction
    type: linked_local_study
    path: ../13-errata-dispositions
    identities: raw/source_manifest.json
    license: Underlying vendor documents retain their original terms.
datasets:
  - file: raw/errata.csv
    rows: 1774
    row_provenance: [family, vendor, erratum_id, doc_number, revision]
  - file: title_groups.csv
    rows: 1045
    row_provenance: [group_sha256, normalized_title, family_names, entry_ids]
source_manifest: source_manifest.json
produced_by: reproduce.py
collect: python3 data/studies/15-errata-title-reuse/collect.py
reproduce: python3 data/studies/15-errata-title-reuse/reproduce.py
verified: Local and shared source hashes; identity with study 13 extraction; partition of every record into a title group; arithmetic under three normalization rules.
not_verified: Hardware root-cause equivalence; statistical independence; training contamination; generalization performance.
defects:
  - Matching titles may describe defects with different applicability conditions or root causes.
  - Different titles can describe related defects; matching is not exhaustive semantic deduplication.
  - Vendor disclosure and the original family selection limit generalization beyond this corpus.
outputs: [figure.svg, figure.pdf, figure.png]
