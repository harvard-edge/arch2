# Provenance record for 28-ibex-nightly-history. Schema: arch2-provenance/v1.
schema: arch2-provenance/v1
study: ibex-nightly-history
title: "Nightly OpenTitan-configuration Ibex regression history, 2023 to 2026"
evidence_class: measured
status: complete_snapshot
observation_unit: One test group on one night
selection: "Every dated JSON report in the public bucket at collection on 2026-11-02; 1,214 objects, 1,213 distinct nights. On 2024-07-03 two uploads exist and the canonical key is used. The uploads differ: the kept one has 1,350 of 1,415 passing (54 groups), and the dropped one, about 13 hours later, has 1,396 of 1,430 (55 groups). Using the dropped one moves the plateau boundary from 2024-07-04 to 2024-07-03 and leaves every value the chapter prints unchanged."
sources:
  - name: "lowRISC Ibex nightly report archive"
    type: public_bucket
    url: https://ibex.reports.lowrisc.org/
    note: "Raw JSON is not retained here (11 MB). manifest.csv records key, size, sha256, and fetch time; scripts/collect.py re-fetches."
  - name: "lowRISC Ibex commit comparisons for the two largest steps"
    type: public_api
    url: https://api.github.com/repos/lowRISC/ibex/compare/
    note: "scripts/step_commits.py refetches the sibling HTML reports and the comparisons, and records their commits, files, and report hashes."
datasets:
  - file: manifest.csv
  - file: derived/nightly.csv
  - file: derived/group_night.csv
  - file: derived/plateaus.csv
  - file: derived/step_attribution.csv
  - file: derived/step_commits.json
  - file: derived/summary.json
limits:
  - "Nonpassing runs include timeouts and simulator diagnostics and are not counts of RTL defects."
  - "The JSON carries no RTL commit, but each sibling HTML report records one. derived/step_commits.json lists the commits and files between the reports on either side of the two largest steps. Neither window is bisected. The first merges PR 2183, and the second holds debug-module and co-simulation changes, with no functional RTL change in either; why the second moved the group is not established."
  - "The segment count in plateaus.py is a chosen parameter."
  - "34 date gaps total 123 missing days; six groups enter or leave mid-series."
