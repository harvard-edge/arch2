# Provenance record for 28-ibex-nightly-history. Schema: arch2-provenance/v1.
schema: arch2-provenance/v1
study: ibex-nightly-history
title: "Nightly OpenTitan-configuration Ibex regression history, 2023 to 2026"
evidence_class: measured
status: complete_snapshot
observation_unit: One test group on one night
selection: "Every dated JSON report in the public bucket at collection on 2026-11-02; 1,214 objects, 1,213 distinct nights. On 2024-07-03 two uploads exist and the canonical key is used."
sources:
  - name: "lowRISC Ibex nightly report archive"
    type: public_bucket
    url: https://ibex.reports.lowrisc.org/
    note: "Raw JSON is not retained here (11 MB). manifest.csv records key, size, sha256, and fetch time; scripts/collect.py re-fetches."
datasets:
  - file: manifest.csv
  - file: derived/nightly.csv
  - file: derived/group_night.csv
  - file: derived/plateaus.csv
  - file: derived/summary.json
limits:
  - "Nonpassing runs include timeouts and simulator diagnostics and are not counts of RTL defects."
  - "The JSON carries no RTL commit, so plateau boundaries are not attributed to any cause."
  - "34 date gaps total 123 missing days; six groups enter or leave mid-series."
