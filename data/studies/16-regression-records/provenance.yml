schema: arch2-provenance/v1
study: 16-regression-records
title: Individual checks behind an aggregate regression score
claim: One retained Ibex regression reports 95.7 percent passing runs overall while 15 of 56 test groups have nonpassing records.
evidence_class: mined
status: extraction_verified
sources:
  - name: lowRISC Ibex public OpenTitan-configuration regression
    type: public_operational_report
    url: https://ibex.reports.lowrisc.org/opentitan/latest/report.html
    id: Retained October 16, 2026 04:16 UTC report at commit 96a34a5617b2904f4172a350199217d82359c13b
    license: The pinned report-generator files declare Apache-2.0. Separate report-data redistribution terms were not established; retain attribution and review before publication.
datasets:
  - file: derived/test_summary.csv
    rows: 56
    row_provenance: [test_name, passing_runs, total_runs]
  - file: derived/failure_details.csv
    rows: 66
    row_provenance: [run_id, test_name, seed, raw_detail]
observation_unit: Reported test-run record, grouped by the source test name
selection: All 56 groups in one retained report; not a longitudinal or representative sample
source_manifest: source_manifest.json
produced_by: reproduce.py
collect: python3 data/studies/16-regression-records/collect.py
reproduce: python3 data/studies/16-regression-records/reproduce.py
transformations:
  - Parse every row of the named HTML summary table and reconcile counts with the total row, failure details, and companion JSON.
  - Sort the 15 groups with nonpassing records by pass fraction and combine the 41 entirely passing groups.
  - Retain full test identifiers in derived/plot_rows.csv and calculate fractions from integer counts.
verified: Source and response-header hashes; source-generator inspection; complete table accounting; 66 unique failure-detail identifiers; HTML/JSON agreement; rounded percentages; plotted counts; rendered PNG and PDF inspection.
not_verified: Simulation execution, chip defect rate, independent bug count, probability of future correctness, AI advantage, all scheduled attempts, or the completeness of public reporting.
defects:
  - The report URL is mutable. Use retained bytes, internal timestamp, and commit; an immutable upstream address is unavailable.
  - Passing run identifiers, CI job identity, and all scheduled/build/generator attempts are not exposed in this report.
  - Failure diagnostics and timeouts do not establish hardware root causes or independent defects.
  - HTML and JSON are formats from one pipeline, not independent experiments. JSON lacks the HTML timestamp and revision.
  - Coverage percentages are retained separately; their underlying populations are not exposed and are not plotted.
outputs: [figure.svg, figure.pdf, figure.png]
