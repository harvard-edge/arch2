schema: arch2-provenance/v1
study: 20-implementation-stage-costs
title: Accounting boundaries in one completed physical-design run
claim: One LibreLane CI job records 106.292 seconds across 78 outer flow steps, inside a 108-second Run Test job step and a 288-second design CI job.
evidence_class: transcribed   # measured upstream by LibreLane and GitHub Actions; extracted here by script
status: extraction_verified
observation_unit: One outer flow step for panel a; three nested time boundaries for panel b
selection: One purposively selected completed spm design run from a pull_request build of the development branch donn/nixeda_7p11, chosen because its artifact held a complete run directory. All 78 outer steps are included. No other run was examined for this figure.
sources:
  - name: LibreLane public design CI
    url: https://github.com/librelane/librelane/actions/runs/37749124131/job/113223652131
    type: public_operational_artifact
    id: 36aa197408e1b6508fc4862b7758d21ec8853048
    license: LibreLane is Apache-2.0 (source/librelane/License) and the IHP Open PDK is Apache-2.0 at the pinned commit. spm.v carries an Apache-2.0 header, but librelane-ci-designs has no repository license file. The CI output ZIP carries no license of its own and includes layout generated from PDK cells, so redistribution of the complete ZIP is not cleared. The retained subset holds timing records, metrics, configuration, and logs, with no layout.
source_manifest: source_manifest.json
retention:
  durable: raw/run-records-subset.tar.gz (144 of 915 ZIP members, exact bytes), raw/artifact-index.tsv (all 915 members with sizes and CRC-32 values), and raw/job-113223652131.log.gz (complete job log).
  not_retained: The complete 7.7 MB ZIP is not tracked, because its license is not cleared and the figure does not need it. Its DEF, GDS, ODB, netlists, reports, per-step configurations, and remaining logs have no durable copy here. An untracked local copy does not survive a fresh clone.
  upstream_expiry: The ZIP expires upstream on 2027-01-06. After that, its SHA-256 can no longer be rechecked, and subset bytes rest on the CRC-32 index.
datasets:
  - file: stage-costs.csv
    rows: 78
    row_provenance: [step_id, step_name, runtime_seconds, process_stats_files]
  - file: plot_rows.csv
    rows: 7
    row_provenance: [label, step_ids, seconds]
  - file: time_boundaries.json
    rows: 1
    row_provenance: [sum_step_intervals_seconds, run_test_job_step_seconds, complete_design_job_seconds]
  - file: process-costs.csv
    rows: 55
    row_provenance: [step_id, step_name, process_stats_file]
produced_by: data/studies/20-implementation-stage-costs/reproduce.py
collect: python3 data/studies/20-implementation-stage-costs/collect.py
reproduce: python3 data/studies/20-implementation-stage-costs/reproduce.py
transformations:
  - Parse durations from every outer runtime.txt record in the retained subset, excluding two nested antenna-repair intervals from the sum.
  - Plot the six longest intervals separately and combine the other 72 without dropping their cost.
  - Compute the Run Test job-step and whole-job intervals from the saved API timestamps; keep them separate from the enclosing step sum.
verified: Source hashes, GitHub artifact digest, unique ZIP members, subset bytes against the ZIP while it was available, 78 complete outer steps, source timing implementation, API identity matching, arithmetic, and plotted PNG and PDF rendering.
not_verified: Original EDA execution, independent replication, physical signoff, total human cost, all attempted CI jobs, or incremental AI benefit.
limitations:
  - One selected run on a development branch shows that boundaries differ. It does not show typical stage costs, a typical ratio, or variation across runs.
  - 33 of the 78 steps have no process record; together they total 0.031 seconds and several were skipped.
  - Step intervals include nested work; subprocess durations and nested step intervals are not additional independent costs.
  - API timestamps have one-second resolution, so the Run Test job step and the job are reported in whole seconds; recorded flow-step durations have millisecond precision. The retained job log's sub-second timestamps give 108.117 seconds from the start of Run Test to the start of the next step.
  - Missing subprocess resource telemetry remains unknown and does not mean zero memory.
  - The flow emits warnings and skips a long-wire check; job success is not evidence of comprehensive physical validity.
  - Some runtime tool version strings are absent even though source and dependency pins are retained.
outputs: [figure.svg, figure.pdf, figure.png]
