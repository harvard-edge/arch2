schema: arch2-provenance/v1
study: 22-ibex-triage
title: Regression failures as diagnostic evidence, not hardware verdicts
claim: The issue author's retained Ibex triage separates reported failing test observations from diagnoses and identifies many non-RTL explanations plus one possible low-concern RTL behavior.
evidence_class: mined
status: extraction_verified
sources:
  - name: lowRISC Ibex issue 2187
    type: public_issue_and_attached_regression_reports
    url: https://github.com/lowRISC/ibex/issues/2187
    id: Issue JSON, body, and attached first/second regression logs retained with SHA-256 hashes in source_manifest.json.
    license: Unknown. Preserve attribution; review applicable terms before external redistribution.
  - name: lowRISC Ibex issue 2186 and pull request 2183
    type: linked_issue_and_patch
    url: https://github.com/lowRISC/ibex/pull/2183
    id: Raw issue and pull request records and referenced patch bytes are retained in source/.
    license: Unknown. Preserve attribution; review applicable terms before external redistribution.
datasets:
  - file: run-results.csv
    rows: 2845
    row_provenance: [run, commit, test_case, test, seed, status, source_log]
  - file: failure-observations.csv
    rows: 134
    row_provenance: [run, commit, test_case, seed, raw_failure_evidence, detail_heading]
  - file: issue-explicit-mappings.csv
    rows: 45
    row_provenance: [run, commit, test_case, issue_signature, reported_signature, reported_explanation]
  - file: retriaged-groups.csv
    rows: 4
    row_provenance: [test_group, first_failed, second_failed, second_run_relation]
observation_unit: One reported test case in one of two distinct local regression runs; a failure observation is not a unique root cause.
selection: All case outcomes present in the two attached reports. The issue explicitly maps 32 first-run cases and 13 second-run cases; four first-run families were excluded from that mapping and stated to be re-triaged in the second run. Other outcomes remain present without invented issue-signature assignments.
source_manifest: source_manifest.json
produced_by: scripts/extract.py
collect: python3 data/studies/22-ibex-triage/collect.py
reproduce: python3 data/studies/22-ibex-triage/scripts/extract.py
transformations:
  - Parse all case status rows and reconcile them against each report's declared summary.
  - Retain every failed case and its first raw failure line from its own report detail block.
  - Parse only explicit issue-body test-case-to-signature mappings; do not infer a second-run mapping from signature text similarity.
  - Aggregate four issue-designated test families for descriptive run reconciliation only. The commits and test identifiers differ, so the comparison is not a causal before/after estimate.
verified: Source hashes; unique case and detail-block identifiers; all 134 failure detail blocks; 9 first-run and 5 second-run signature explanations; all 45 explicit mapping keys and explanations; report summary totals; offline extraction build receipt.
not_verified: Simulation execution, independent reproduction, hardware defect count, root-cause truth, defect probability, causal effect of fixes, all possible seeds, or representativeness of the selected local runs.
defects:
  - The issue author's diagnosis is source-reported and was not independently reproduced by this packet.
  - A failing test, timeout, checker assertion, coverage error, or co-simulation mismatch is not by itself an RTL defect.
  - The author describes one possible low-concern RTL behavior; it is not independently resolved here.
  - The second report contains failures whose issue-signature mapping is not explicit; they remain unmapped.
  - The two reports are different commits and seed ranges, so changing failure counts do not establish a causal reduction.
  - License and redistribution terms for the issue attachments and generated regression reports were not established.
outputs: [run-results.csv, failure-observations.csv, issue-explicit-mappings.csv, retriaged-groups.csv]
