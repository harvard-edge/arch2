schema: arch2-provenance/v1
study: 14-linux-errata-workarounds
title: Hardware workarounds in Linux
evidence_class: mined
status: extraction_verified
sources:
  - name: Linux source at ten release commits
    type: git_repository
    url: https://github.com/torvalds/linux
    identities: pins.json
    license: Linux GPL-2.0 and source-specific SPDX notices; COPYING retained per release.
datasets:
  - file: release_counts.csv
    rows: 10
    row_provenance: [tag, date, commit]
  - file: options.csv
    row_provenance: [tag, commit, path, source_line, symbol]
source_manifest: source_manifest.json
produced_by: reproduce.py
collect: python3 data/studies/14-linux-errata-workarounds/collect.py
reproduce: python3 data/studies/14-linux-errata-workarounds/reproduce.py
verified: Source hashes; complete config-block extraction within each selected file; explicit selection and exclusions; symbol persistence; plotted arithmetic; retained documentation discrepancies.
not_verified: Kernel execution; workaround correctness; performance cost; severity; defect rates; completeness beyond the selected Kconfig path.
defects:
  - Support for additional CPUs and changes in maintenance policy affect option counts.
  - A configuration option is not equivalent to a unique erratum or root cause.
  - Persistence is established at sampled releases, not at every intervening commit.
  - Documentation and source names differ; documentation rows do not define the plotted population.
outputs: [figure.svg, figure.pdf, figure.png]
