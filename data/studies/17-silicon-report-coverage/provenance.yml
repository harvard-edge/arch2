schema: arch2-provenance/v1
study: 17-silicon-report-coverage
title: Public community feedback coverage for Tiny Tapeout TT06
evidence_class: derived_from_public_operational_records
status: snapshot_captured_and_extracted
sources:
  - name: Tiny Tapeout TT06 index API
    type: versioned_public_index
    path: raw/tt06-index.json
    identity: tt06 index commit e489ecbad5ceda454c5b4ca0b86b81bc24bfe40c; index repository revision 953ee731882f3710306f9d4ac2667caf10207738
    license: CC0 1.0 for index data
  - name: Tiny Tapeout TT06 shuttle page
    type: official_shuttle_status_page
    path: raw/tt06-shuttle.html
    identity: https://www.tinytapeout.com/chips/tt06/
  - name: Tiny Tapeout public feedback API
    type: public_operational_api_snapshot
    path: raw/feedback/*.json
    identity: queried once for each of the 238 indexed TT06 macros on 2026-10-16
  - name: Tiny Tapeout site implementation
    type: pinned_public_source_code
    path: raw/site-source/
    identity: tinytapeout_www revision c8a667269685a38bd10a41aefb8a25a7e3660cdb
datasets:
  - file: project-feedback.csv
    rows: 238
    row_provenance: [shuttle, macro, address, title, repo, submitted_commit]
  - file: feedback-records.csv
    rows: 97
    row_provenance: [shuttle, macro, feedback_ordinal_in_response, status, user]
source_manifest: source_manifest.json
capture_manifest: capture-manifest.json
produced_by: extract.py
collect: python3 data/studies/17-silicon-report-coverage/collector.py
refresh: python3 data/studies/17-silicon-report-coverage/collector.py --refresh --output <new-absent-directory>
reproduce: python3 data/studies/17-silicon-report-coverage/extract.py
verified: All 248 retained raw responses match source_manifest and capture-manifest hashes; detail API working counts match the public aggregate endpoint for every TT06 macro.
not_verified: Independent silicon functionality; distinct test runs, chips, boards, or operators; complete reporting; standardized conditions; any failure or yield rate.
defects:
  - No feedback record means public feedback was not returned; physical state is unknown.
  - Feedback statuses are community-entered labels and do not constitute independent silicon validation.
  - The API has no structured report timestamps, chip/die/board identifiers, standardized test conditions, or measured-value fields; free text and optional links may contain such details and were not normalized or followed.
  - The population is indexed project macros, not distinct people or necessarily unique conceptual projects.
outputs: [project-feedback.csv, feedback-records.csv, summary.json]
