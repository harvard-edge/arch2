schema: arch2-provenance/v1
study: 13-errata-dispositions
title: Published errata and vendor fix dispositions
evidence_class: mined
status: extraction_verified_with_declared_limits
sources:
  - name: Nineteen Intel specification updates and AMD revision guides
    type: vendor_documents
    identities: source_manifest.json
    metadata: derived/sources.csv
    license: Vendor documents retained locally; no redistribution license inferred.
datasets:
  - file: derived/errata.csv
    rows: 1774
    row_provenance: [family, vendor, erratum_id, doc_number, revision]
  - file: dispositions.csv
    rows: 19
source_manifest: source_manifest.json
produced_by: reproduce.py
collect: python3 data/studies/13-errata-dispositions/collect.py
reproduce: python3 data/studies/13-errata-dispositions/reproduce.py
verified: PDF hashes; all 19 parser completeness checks; comparison to the prior extracted records; arithmetic; five selected erratum dispositions and one revised title page inspected visually.
not_verified: Independent semantic audit of every entry; completeness of vendor disclosure; defect severity or incidence; workaround body fields; subsystem classifications.
defects:
  - Documents have different dates, scopes, and disclosure policies; counts cannot rank product or vendor quality.
  - Least-resolved disposition across steppings does not describe every shipped stepping.
  - Entries can recur across families and are not independent hardware failure observations.
  - Raptor Lake PDF changed to revision 032; all extracted IDs, titles, and dispositions agree with revision 031.
outputs: [figure.svg, figure.pdf, figure.png]
