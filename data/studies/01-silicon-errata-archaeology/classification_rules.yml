# Subsystem classification rules for published CPU errata.
#
# Applied by data/studies/01-silicon-errata-archaeology/classify_errata.py.
#
# Matching semantics (the script implements exactly this, nothing more):
#   * Each pattern is a literal word or phrase. It matches only on whole-word
#     boundaries: the characters on either side must not be letters or digits.
#     "alu" does not match "value"; "sev" does not match "several".
#   * Internal spaces in a pattern match any run of whitespace or a hyphen, so
#     "c state" matches "C-state" and "C state".
#   * Matching is case-insensitive unless the pattern is listed under
#     `case_sensitive`, which is used for short acronyms that collide with
#     English words (for example "PT", "MC").
#   * An optional plural "s" is allowed after every pattern.
#   * Classes are tried in the order listed. The first class with any match
#     wins. The order encodes a decision: an erratum titled after the
#     mechanism that observes or reports a fault (a performance counter, a
#     machine-check bank) is assigned to that mechanism, because that is the
#     logic the erratum says is wrong.
#   * The erratum title is matched first. Only when no class matches the
#     title is the first sentence-bearing field of the erratum body (Intel
#     "Problem", AMD "Description") matched, and the row records
#     matched_on = description.
#   * No match on either field gives "Unclassified". There is no default
#     class.
#
# Frozen on 2026-09-29 before the audit sample was drawn. Any later change
# must re-run the audit.

version: 1
frozen: "2026-09-29"

