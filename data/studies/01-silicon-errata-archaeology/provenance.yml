defects: []

verified: "2026-09-29: every document's extracted errata equal its own summary table (Intel Summary Tables of Changes, AMD Cross-Reference of Processor Revision to Errata); removed errata are marked removed in both places; Intel numbering has no unexplained gap; 1,665 of 1,774 detailed titles contain the title fragment printed on the summary-table row, and the rest have no fragment on that row. A second, cold download matched all 19 SHA-256 hashes and reproduced errata.csv byte for byte. audit_sample.py re-draws the committed sample exactly from the seed."
not_verified: "Audit labels are one model-assisted reading (the auditor also wrote the rules; the worksheet was blind to the rule label and shuffled), not an independent human panel. No inter-rater agreement was measured. Descriptions are parsed for classification fallback and audit reading but are not committed, so a reader re-running the audit needs the vendor PDFs. The sample is 18 errata per class, so per-class precision intervals are wide."
