reproduce: "From the committed CSVs: pip install -r data/studies/01-silicon-errata-archaeology/requirements.txt && cd data/studies/01-silicon-errata-archaeology && python3 audit_sample.py && python3 audit_metrics.py && python3 merge_rule_sensitivity.py && python3 plot_errata_subsystems.py. The full path from the PDFs (python3 data/scrapers/mine_cpu_errata.py --verify-hashes, then classify_errata.py) stops at Alder Lake because five pinned revisions are unobtainable; see README section 4 and run 20261102T144156Z."

defects:
  - "2026-11-02: the written merge rule and the applied grouping disagree for coherence, graphics, and machine check, and the file stated no merge passes for graphics, which is false. Shares under both are in merge_rule_sensitivity.json. Author decision open; the figure still draws the applied grouping."
  - "2026-11-02, second audit FAIL: the written rule's machine-check target rests on 3 rows to 2, or a 2 to 2 tie by distinct title, so the about 30 percent stated after the first repair does not hold across readings. Stated values withdrawn; no tiebreak or merge rule added; every branch and one-label change is in merge_rule_sensitivity.json. README statements corrected: largest class same in every reading, conventions applied consistently, the files state the rule was fixed before any merge."
  - "2026-11-02, third audit FAIL: the 19 to 35 percent span and none near half of the corpus omitted class order, which puts the largest merged class at up to 50.4 percent by rule. Both withdrawn, with at least six classes, which the class-order reading does not test. The span is now stated as a property of the classifier, and the caption, legend, and text no longer say model-assisted audit or audit-adjusted, since no person reviewed the labels."
  - "2026-11-02: classification_rules.yml said an optional plural s; classify_errata.py allows s or es. The comment now says so. The code and the labels did not change."
  - "2026-11-02: six rows have no reachable source (withdrawn_rows.csv). The study has no independent human labels."
  - "2026-11-06, audit F2: the six rows stayed in every count although no primary text for them is retained or retrievable. After checking errata-pdfs-pinned, errata-pdfs-revised-upstream-2026-11-02, and .cache/pdf (only the removing revisions are held), all six are excluded through audit_metrics.load_population() and recorded in excluded_rows.csv; the rows stay in errata.csv and errata_classified.csv. None was in the audit sample, so no label changed. Metrics, sensitivity, and figure rerun over 1,768 rows (runs.jsonl, 2026-11-06)."
  - "2026-11-06, audit F1: class-order spans reorder title matches only and hold the 109 other rows, 94 of them description matches. The chapter now says so where it quotes the spans; the full title-and-description reordering was not recomputed."
  - "2026-10-10: workaround subgroup counts withdrawn and workaround_status.csv removed. Eight checked fields falsely indicated guidance and two continuations were omitted; see README for records and source pages. No corrected global split is claimed."
  - "Body-field extraction can retain page furniture or misorder continuations. Description/implication fields used for classification fallback and audit reading need field-level source review; title/ID completeness does not establish body-field correctness."

verified: "2026-10-10 cold download again matched all 19 hashes and reproduced errata.csv, errata_classified.csv, the seeded sample, and audit_metrics.json; workaround semantic validation failed as recorded above. 2026-09-29: every document's extracted errata equal its own summary table (Intel Summary Tables of Changes, AMD Cross-Reference of Processor Revision to Errata); removed errata are marked removed in both places; Intel numbering has no unexplained gap; 1,665 of 1,774 detailed titles contain the title fragment printed on the summary-table row, and the rest have no fragment on that row. A second, cold download matched all 19 SHA-256 hashes and reproduced errata.csv byte for byte. audit_sample.py re-draws the committed sample exactly from the seed."
not_verified: "Sample labels are one model's reading (recorded as the same model that wrote the rules, which the files cannot show), with no human label audit. The study has no independent human labels, and no inter-rater agreement was measured. The worksheet was not retained, so the claim that it hid rule labels cannot be checked. The claims that rules were frozen before sampling, and that the merge rule was fixed before any merge, cannot be checked: rules, sample, rule, and outcomes first appear together in commit 75cc61153. Six rows have no reachable source and are excluded from the counts (excluded_rows.csv). Five pinned revisions cannot be obtained, so the study cannot be rerun from its PDFs. Descriptions are parsed for classification fallback and audit reading but are not committed, so a reader re-running the audit needs the vendor PDFs. The sample is 18 errata per class, so per-class precision intervals are wide."
