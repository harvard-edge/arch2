study: 01-silicon-errata-archaeology
title: "Published CPU errata by subsystem"
claim: "Across 1,768 errata published for 19 Intel and AMD CPU families (six further rows with no retained or retrievable primary text excluded), a rule-based, model-assisted classifier with no human label audit assigned subsystem classes. The ranking of those classes depends on how the classifier orders them, so no largest share and no ranking is reported as a finding about silicon errata: over 2,000 random orders of the classes for title matches only, with description matches held as assigned, the largest class by rule runs about 16 to 41 percent in the applied grouping and about 24 to 51 percent under the written merge rule. Memory controllers, coherence, and caches stay a minority, about 13 percent by rule in the committed class order (7 to 25 percent over the title-only random orders) and about 8 percent adjusted, and arithmetic datapaths about 2 percent of the relabeled sample."
evidence_class: mined   # mined | measured | transcribed
status: producer_checked_audit_failed  # data/audits/fig-errata-subsystem-shares.yml, FAIL 2026-11-02; F1 and F2 repaired 2026-11-06 (excluded_rows.csv, title-only scope stated), author decision on the merge rule open, needs a fresh audit

