study: 01-silicon-errata-archaeology
title: "Published CPU errata by subsystem"
claim: "Across 1,774 errata published for 19 Intel and AMD CPU families, no audited subsystem class holds more than about a fifth; memory, coherence, and I/O hold about 20 percent, core execution with caches and TLBs a comparable share, and arithmetic datapaths about 2 percent."
evidence_class: mined   # mined | measured | transcribed
status: verified

