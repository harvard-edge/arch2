# Reporting classes: how the twelve rule classes are merged or dropped for
# reporting, decided AFTER the audit (audit_sample.csv, audit_metrics.py).
#
# Written rule: a class is reported on its own only if its audited precision is
# at least 0.70 and the lower bound of its Wilson 95% interval is at least 0.50.
# A class that fails is merged with the class it is most often confused with,
# when the merged class passes the same test; otherwise it is dropped. A dropped
# class is not reported as a subsystem. Its errata stay in the data, and in the
# figure they are counted in the "not resolved" bar together with the
# Unclassified errata.
#
# This file used to say the criterion was fixed before any class was merged. The
# record cannot show that: the rule and the outcomes below first appear together
# in commit 75cc61153 (2026-09-29), and no earlier draft or worksheet survives.
#
# The groupings below are what the study did. They do NOT follow the written rule
# for three of the five failed classes. The rule has not been amended to fit and
# the groupings have not been changed; that choice is the author's.
# merge_rule_sensitivity.json gives every merge and the shares under both.
#
# Outcome of the 2026-09-29 audit (per-class precision, n = 18 each):
#   Class (agree/18)        Most confused with   Merge test     Applied
#   Caches (6)              Instruction exec.    32/36 passes   merged, follows rule
#   Security (13)           Virtualization       34/36 passes   merged, follows rule
#   Coherence (10)          Power                31/36 passes   joined I/O and memory controller instead
#   Graphics (12)           I/O                  32/36 passes   dropped instead
#   Machine check (10)      Instruction exec.    30/36 passes   dropped instead
# Memory controller (15/18) and I/O (16/18) each passed alone. The rule gives no
# ground for reporting them together; that follows from the coherence choice.
#
# An earlier version of this comment said no merge passes for graphics and gave
# "confused with five different classes" for machine check. The first is false.
# The second is true of the labels but is not a ground the rule contains.
# The rule set itself is unchanged; merging only coarsens what is reported.

reporting:
  - name: Memory controller, coherence fabric, and I/O
    short: I/O, memory controller, coherence
    group: memory_interconnect
    members:
      - Memory controller and DRAM
      - Coherence and on-die or socket fabric
      - I/O and peripheral interfaces
  - name: Debug, performance monitoring, and trace
    short: Debug and performance monitoring
    group: observability
    members:
      - Debug, performance monitoring, and trace
  - name: Virtualization, isolation, and security features
    short: Virtualization and security
    group: virtualization
    members:
      - Virtualization and IOMMU
      - Security and isolation features
  - name: Core execution, caches, and TLBs
    short: Core execution, caches, TLBs
    group: core
    members:
      - Instruction execution and exceptions
      - Caches, TLBs, and load-store ordering
  - name: Power, clocking, and thermal management
    short: Power, clocking, thermal
    group: power
    members:
      - Power, clocking, and thermal management
  - name: Interrupts, timers, reset, and system management
    short: Interrupts, reset, SMM
    group: platform
    members:
      - Interrupts, timers, reset, and system management

not_resolved:
  name: Not resolved to a reported class
  short: Not resolved
  members:
    - Machine check and error reporting
    - Graphics, display, and on-die accelerators
    - Unclassified
