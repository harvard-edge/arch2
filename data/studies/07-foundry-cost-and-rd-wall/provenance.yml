study: 07-foundry-cost-and-rd-wall
title: "Design cost and the R&D wall"
claim: "The binding constraint on leading-edge silicon is design and verification cost, not fabrication. R&D intensity passes 32% of revenue."
evidence_class: mined   # mined | measured | transcribed
status: defective

sources:
  - name: "SEC EDGAR 10-K filings"
    type: regulatory_filing
    url: https://www.sec.gov/edgar
    note: "Covers the revenue, rd_expense and rd_intensity columns only."
  - name: "Foundry economics estimates"
    type: unsourced
    note: "wafer_cost_usd, full_reticle_mask_cost_usd_million and design_cost_per_soc_usd_million have NO recorded source. SEC filings do not report these. Currently mislabeled as SEC EDGAR in source_type."

datasets:
  - file: sec_edgar_semiconductor_rd_economics.csv
    rows: 189
    row_provenance: [sec_accession_number, filing_url, sec_form]
    note: "Provenance columns cover the financial fields only, not the foundry fields."

produced_by: data/scrapers/mine_sec_edgar_semiconductor_rd.py
reproduce: "python3 data/scrapers/mine_sec_edgar_semiconductor_rd.py"

defects:   # open, not yet repaired
  - where: sec_edgar_semiconductor_rd_economics.csv
    what: "source_type reads 'SEC EDGAR 10-K' on rows whose wafer and design cost columns cannot come from a 10-K. Split the receipt or drop those columns."
  - where: plot_foundry_wafer_cost_and_rd_wall.py:83
    what: "Panel A is drawn from an in-script nodes_data table including density and cost_100m, neither of which exists in the CSV. The transistor cost inversion claim has no receipt."
  - where: sec_edgar_semiconductor_rd_economics.csv
    what: "The 2026 NVIDIA row lists $265.0B revenue and $22.8B R&D against a real accession number whose filing reports $215.938B and $18.497B. A forecast is carrying a filing identifier."
  - where: README.md
    what: "Claims NVIDIA R&D grew from $81.6M in FY2001, a 230x surge. The CSV gives FY2001 as $151M and FY2000 as $82M, so the multiple is computed off the wrong year. The 71% / $514.8M design budget split has no backing column at all."

verified: 189 rows; 75/75 sampled firm-years for NVDA, INTC, AMD and QCOM reconcile against the SEC XBRL companyconcept API within 5% (2026-09-09). Strongest external verification in the collection.
not_verified: "The foundry economics columns are not verifiable from any recorded source. Apple is included in a semiconductor R&D population without a documented inclusion rule; total-company R&D is not silicon R&D."
