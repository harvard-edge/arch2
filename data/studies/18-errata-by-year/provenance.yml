schema: arch2-provenance/v1
study: 18-errata-by-year
title: Published errata by processor-family introduction year
claim: The retained errata inventories can be located on a reference-product introduction timeline without treating counts as annual defect discoveries.
evidence_class: mined
status: extraction_verified
source_manifest: source_manifest.json
sources:
  - name: Retained Intel and AMD specification updates and revision guides
    type: shared_study
    path: ../13-errata-dispositions/
  - name: Official Intel and AMD product launch pages and releases
    type: public_primary_sources
    path: launch_sources/manifest.json
    license: Public source access does not establish redistribution rights; source PDFs are preserved locally and excluded from Git.
datasets:
  - file: launch_years.csv
    rows: 19
    row_provenance: [family, launch_year, source_url, source_sha256, scope_note]
  - file: family_year_counts.csv
    rows: 19
    row_provenance: [family, document_date, document_revision, errata_source_sha256, launch_source_url]
produced_by: reproduce.py
collect: python3 data/studies/18-errata-by-year/collect.py
reproduce: python3 data/studies/18-errata-by-year/reproduce.py
verified: All families join once; counts match the retained source inventory; primary launch-year passages and source hashes checked; PNG and PDF rendering inspected.
not_verified: Annual discoveries, exhaustive industry coverage, defect density, equal observation age, chip quality trends, or vendor-quality comparisons.
outputs: [figure.svg, figure.pdf, figure.png]
