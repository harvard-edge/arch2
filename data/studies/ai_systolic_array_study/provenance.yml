study: ai_systolic_array_study
title: "Recorded AI-assisted SCALE-Sim systolic array study"
claim: "Under a preregistered four-evaluation budget on a synthetic three-layer XR-like GEMM slice in SCALE-Sim 3.0.0, both the model arm and the fixed aspect-ratio heuristic tie the 32x32 baseline (13,917 compute-window cycles, 41.196% unweighted mean layer utilization, local score 33,782.40) via 16x64, and the model's transposed-orientation reversal prediction fails (16x64 remains 7.57% better than 64x16 after transposing M and N)."
evidence_class: measured
status: verified

