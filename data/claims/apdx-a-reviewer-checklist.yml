scope: apdx-a-reviewer-checklist
claims:
- claim_id: CLM-A-001
  description: A learned optimizer at 10^5 evaluations versus a baseline capped at 10^2 cannot separate
    algorithm from budget.
  verbatim_quote: When a multi-GPU learned optimizer runs $10^5$ design evaluations while a simulated-annealing
    or genetic baseline is capped at $10^2$ evaluations on a single CPU core
  label: constructed
  origin: author-example
  headline: false
  citations: []
  source_files: []
  assumptions: Author-constructed illustration. Nothing was run.
  check: Conditional wording reads as a hypothetical. It describes no specific published study.
- claim_id: CLM-A-002
  description: Rank correlation within the top 1 to 5 percent is much more informative than aggregate
    accuracy.
  verbatim_quote: Ranking correlation (Kendall's $\tau$ or Spearman's $\rho$) within the top 1% to 5%
    of candidates is much more informative
  label: assumed
  origin: author-model
  headline: false
  citations: []
  source_files: []
  assumptions: Review guidance. The band and the comparative carry no citation or measurement in this
    appendix.
- claim_id: CLM-A-003
  description: SKY130 is a planar 130 nm process.
  verbatim_quote: planar SkyWater SKY130 at $130\ \text{nm}$
  label: measured
  origin: transcribed
  headline: false
  citations:
  - SkyWater2020SKY130PDK
  - BlockloveEtAl2023ChipChat
  source_files: []
  stated_value: 130
  unit: nm
  check: The sentence cites nothing. The SKY130 documentation index opened on 2026-11-02 states neither
    130 nm nor planar; the Chip-Chat abstract says Skywater 130nm. Planar is not confirmed by a page opened
    here.
- claim_id: CLM-A-004
  description: Statistical comparison must account for run-to-run variability.
