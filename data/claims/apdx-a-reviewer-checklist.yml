  label: measured
  origin: third-party-reported
  headline: false
  citations:
  - AgarwalEtAl2021StatisticalPrecipice
  source_files: []
  check: Abstract opened. It addresses uncertainty from a finite number of training runs.
- claim_id: CLM-A-005
