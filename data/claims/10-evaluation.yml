- claim_id: CLM-10-005
  description: 'ArchEval: with the simulator and feedback withdrawn, three of four agents reach the baseline on
    fewer than half of challenges and the fourth stays above half (13 of 20). Sec. A says most baselines are
    hand-written references; the CSV labels 18 of 20 reference, one LRU, one Gibbon. The authors read the drop as
    simulator dependence.'
  verbatim_quote: Preliminary single-seed comparisons in ArchEval, for instance, show that of four agents that
    appear effective when iterating with a simulator in the loop, three reach the baseline, most often a
    hand-written reference design, on fewer than half of the challenges once the simulator and its feedback are
    withdrawn, and the fourth stays above half. The study's authors read this drop as a sign that much of an
    apparent capability can reside in simulator access and feedback rather than in a reliable internal model of
    performance
  label: measured
  origin: transcribed
  headline: true
  citations:
  - WangEtAl2026ArchEval
  source_files:
