- claim_id: CLM-01-010
  description: From 2010 to 2020 the mean share of project time that survey respondents reported for verification never fell below 53 percent, the 2018 value. Vendor-sponsored survey self-report, not logged project time.
  verbatim_quote: 'From `{python} verif_year_lo` to `{python} verif_year_hi` the mean share of project time that respondents reported for verification, for designs other than field-programmable gate arrays (FPGAs) through 2012 and for integrated circuit (IC) and application-specific integrated circuit (ASIC) projects from 2014, never fell below `{python} f''{verif_share_min:.0f}''`%'
  label: measured
  origin: transcribed
  headline: true
  stated_value: 53
  unit: percent of project time, mean of biennial studies
  citations: [Foster2013WilsonPart5, Foster2021WilsonPart8]
  source_files:
  - path: data/datasets/chapter7-wilson-verification-scissors-gap.csv
    sha256: 96545b30723ec6b04819efcd784aba910048d295ca13d54fde244e7c331cb0c2
  inline_values:
  - verif_year_lo
  - verif_year_hi
  - f'{verif_share_min:.0f}'
  checked: "Foster 2013 text prints 2010 and 2012 means of 56 for non-FPGA designs; Foster 2021 Fig. 8-1 prints 2014 to 2020 averages of 57, 54, 53, 56 for ASIC/IC projects (image reread 2026-11-02). The sentence names both populations. The 53 minimum is from 2018, inside the IC/ASIC series. Vendor-sponsored survey self-report: Foster's 2020 prologue says 'we commissioned Wilson Research Group to execute our study' and describes a questionnaire of self-identified engineers and managers; Fig. 8-1 credits 'Wilson Research Group and Mentor, A Siemens Business'. Foster 2013 calls verification effort a 'controversial topic', says the industry is 'already biased to respond', and treats project time as 'one data point'. Favorable limits on that bias, for 2020: the sampling frame excluded the vendor's own customer list, n=1492, stated margin of error 3 percent at 95 percent confidence. The 2020 prologue has no bib key, so the chapter does not state these. The window excludes the 2007 Far West Research value because Foster's sources disagree (49 in Foster 2013; 46 in DAC 2015 per the dataset header, not opened, ACM 403). A floor of 49 gives 2.04 times and 46 gives 2.17 times, so the bound would loosen but the argument holds."
- claim_id: CLM-01-011
  description: Under the mean allocation with nonoverlapping work, RTL drafting is at most 47 percent of project time.
  verbatim_quote: 'If a project follows that mean allocation and the work is treated as nonoverlapping, RTL drafting occupies only part of the remaining time, so its share $f$ is at most `{python} f''{drafting_share_max:.0f}''`%'
  label: modeled
  origin: author-model
  headline: false
  stated_value: 47
  unit: percent of project time, upper bound
  citations: [Foster2013WilsonPart5, Foster2021WilsonPart8]
  source_files:
  - path: data/datasets/chapter7-wilson-verification-scissors-gap.csv
    sha256: 96545b30723ec6b04819efcd784aba910048d295ca13d54fde244e7c331cb0c2
  inline_values:
  - f'{drafting_share_max:.0f}'
  assumptions: A project follows the lowest mean allocation in the series, tasks do not overlap, and all nonverification time is drafting.
  formula: 100 - verification_share
  raw_inputs: {verification_share: 53}
  tolerance: 0.5
- claim_id: CLM-01-012
  description: Instantaneous drafting gives an overall speedup of at most 1.9 times under the stated assumptions.
  verbatim_quote: 'Even instantaneous drafting then gives $S_{\text{max}} = 1/(1-f) \le$ `{python} f''{drafting_speedup_max:.1f}''`$\times$ under these assumptions'
  label: modeled
  origin: author-model
  headline: true
  stated_value: 1.9
  unit: x overall speedup, upper bound
  citations: [Amdahl1967ValiditySingleProcessor, Foster2013WilsonPart5, Foster2021WilsonPart8]
  source_files:
  - path: data/datasets/chapter7-wilson-verification-scissors-gap.csv
    sha256: 96545b30723ec6b04819efcd784aba910048d295ca13d54fde244e7c331cb0c2
  inline_values:
  - f'{drafting_speedup_max:.1f}'
  assumptions: Same as CLM-01-011, plus no added overhead and an original allocation that still applies after acceleration.
  formula: 1 / (1 - f)
  raw_inputs: {f: 0.47}
  tolerance: 0.05
- claim_id: CLM-01-013
  description: VerilogEval tests whether generated hardware descriptions pass functional unit testbenches and does not measure architecture efficiency or timing closure.
  verbatim_quote: VerilogEval tests whether generated hardware descriptions pass functional unit testbenches
  label: measured
  origin: third-party-reported
  headline: false
  citations: [VerilogEval]
  checked: VerilogEval compares simulation of generated code with reference solutions and says it does not evaluate downstream implementations. Revisiting VerilogEval (arXiv 2408.11053) was opened as text.
- claim_id: CLM-01-014
  description: Learned cost models can rank tensor-program schedules before running them on hardware.
  verbatim_quote: Learned cost models can rank tensor-program schedules before running them on hardware
  label: measured
  origin: third-party-reported
  headline: false
  citations: [ChenEtAl2018AutoTVM]
  checked: arXiv 1805.08166 PDF read directly. The cost model trains with a rank loss, and each iteration selects the top-performing batch of candidates to run on real hardware.
- claim_id: CLM-01-015
  description: Whether learned macro placement beats tuned conventional placers on a matched baseline remains disputed.
  verbatim_quote: It demonstrates optimization inside a prescribed structure, although whether it beats tuned conventional placers on a matched baseline remains disputed
  label: measured
  origin: third-party-reported
  headline: false
  citations: [ChengEtAl2026UpdatedAssessment, GoldieEtAl2024ThatChipHasSailed]
  checked: "arXiv 2302.11014v3 and 2411.10053 read directly. Cheng et al. conclude SA and human baselines remain superior to AlphaChip on their testcases, and call the question open. Goldie et al. answer the ISPD 2023 version. The TCAD text states it responds to Goldie et al. (Section I and Table XII, 'Addressing Criticisms of ISPD23'), so the pair is a direct exchange and both citations stay."
- claim_id: CLM-01-016
  description: Learned macro placement searches block coordinates within a fixed netlist.
  verbatim_quote: Learned macro placement instead searches block coordinates within a fixed netlist
  label: measured
  origin: third-party-reported
  headline: false
  citations: [MirhoseiniEtAl2021GraphPlacement]
  unopened: true
  checked: "Nature abstract read; the body is paywalled and no open copy was found, so unopened stays. arXiv 2004.10746, which Goldie et al. call the preprint of the Nature paper, was read: the agent places each macro of a given netlist on a grid cell of the canvas. That preprint is not the cited source."
- claim_id: CLM-01-017
  description: OpenAI's accounts credit models with arithmetic-circuit optimization and software kernels, with AI-generated implementations 1.5 to 1.8 times faster than expert code on selected blocks. Vendor self-report.
  verbatim_quote: credit models with optimizing arithmetic circuits and generating software kernels, including implementations that ran 1.5 to 1.8 times faster than expert-written code on selected blocks
  label: measured
  origin: third-party-reported
  headline: false
  stated_value: 1.8
  unit: x speed, selected software blocks, upper end of vendor-reported range
  citations: [OpenAI2026JalapenoFirstResults, Smith2026JalapenoIEEE]
  checked: "OpenAI post reread 2026-11-02 in Wayback snapshot 20261013002031 of the cited URL (live URL returns 403), HTML sha256 160bc6be292639ee70e3dae796ceff9f1de23f9615325173880690511b762fff, against cb164a73774283921796d91e659f060d17a4692a570b1a684eab5ec0e6ea5f0d in the earlier read: 'AI also helped optimize the chip's arithmetic circuits'; 'For selected GPT-OSS attention and mixture-of-experts blocks, AI-generated implementations ran 1.5 to 1.8 times faster than the existing human-expert-written implementations. Those figures apply to the selected blocks, not the full model'. Page HTML changes per fetch and neither copy is retained, so the hashes identify a read, not a stable receipt. These are vendor statements, and the sentence attributes them to OpenAI. Spectrum carries OpenAI staff interviews, so the two citations are one party, not corroboration."
- claim_id: CLM-01-021
  description: OpenAI handed much of the physical design to Broadcom, with its own engineers guiding floor plan and routing, and claims a 10 percent area reduction for its matrix multiplication units from AI-guided physical design optimization. Vendor self-report.
  verbatim_quote: The company handed much of the physical design to Broadcom, with its own engineers guiding the floor plan and routing, and claims that AI-guided physical design optimization cut the area of its matrix multiplication units by 10% against an optimized human baseline
  label: measured
  origin: third-party-reported
  headline: false
  stated_value: 10
  unit: percent area reduction, one block, vendor claim
  citations: [Smith2026JalapenoIEEE]
  checked: "Spectrum reread 2026-11-02, HTML sha256 5e8c0d13a05af9b99733fc4c0c5abb61f7fb5dcddd7f1de6274222227737544d, against 3f7006b789c4e28ec1608618fdb1254b39a44e0049ba6fde1efb8b23dc6d1096 in the earlier read; copy not retained. 'generally split between design and implementation'; Broadcom handled 'physical design from the gates onward,' Ho says; 'Much of the backend design ... was handed off to Broadcom'; 'That's not to say OpenAI's workflow ignored the backend'; physical design engineers 'provide guidance on the chip's floor plan and routing'; at Hot Chips 2026 Ho and Leary gave 'an area reduction of 10 percent for the matrix multiplication units as measured against an optimized human baseline', and Spectrum writes 'OpenAI claims'. The Hot Chips talk itself was not read."
- claim_id: CLM-01-022
  description: OpenAI credits AI with helping it reach tapeout nine months after first RTL; outside experts rated the schedule highly, and one called Broadcom's help essential.
  verbatim_quote: It also credits these tools with helping it reach tapeout nine months after first RTL, a schedule that outside experts quoted by Spectrum rated highly, although one called Broadcom's help essential to it
  label: measured
  origin: third-party-reported
  headline: false
  stated_value: 9
  unit: months from first RTL to tapeout, vendor-reported
  citations: [OpenAI2026JalapenoFirstResults, Smith2026JalapenoIEEE]
  checked: "OpenAI post: 'enabling the team to move from initial design to tapeout in nine months'. Spectrum: 'Only nine months separated the first RTL ... from tape-out'. Outside comment in Spectrum: Chin 'the schedule they gave us is quite credible' and believes Broadcom's help was essential; Ravi Krishna 'a relatively impressive result'; Kahng 'likely best in class today'. No source gives the schedule a matched baseline. Hashes as in CLM-01-017 and CLM-01-021."
- claim_id: CLM-01-023
  description: The 2024 revision of VerilogEval records measurable model gains, with GPT-4o at a 63 percent pass rate on specification-to-RTL tasks.
  verbatim_quote: its 2024 revision records measurable gains, with GPT-4o reaching a 63% pass rate on specification-to-RTL tasks
  label: measured
  origin: third-party-reported
  headline: false
  stated_value: 63
  unit: percent pass rate, specification-to-RTL
  citations: [PinckneyEtAl2024RevisitingVerilogEval]
  checked: "arXiv 2408.11053v2 abstract read 2026-11-02: 'We find measurable improvements in state-of-the-art models: GPT-4o achieves a 63% pass rate on specification-to-RTL tasks.' The same abstract says prompt engineering 'varies widely with model and task'. The value is dated and later models are not covered."
- claim_id: CLM-01-024
  description: Individual projects in the verification surveys ranged from 20 percent or less to over 80 percent of project time. Vendor-sponsored survey self-report.
  verbatim_quote: individual projects ranged from 20% or less to over 80%
  label: measured
  origin: chart-read
  headline: false
  stated_value: 80
  unit: percent of project time, top histogram bin
  citations: [Foster2021WilsonPart8]
  checked: Foster 2021 Fig. 8-1 image read 2026-11-02. Bins run from >0%-20% to >80%, and all four years 2014 to 2020 have projects in both end bins. Foster 2013 text also says some projects exceed 80 percent.
- claim_id: CLM-01-018
  description: These reports give no controlled comparison of total engineering cost against a matched conventional baseline and establish no closed physical-to-microarchitecture loop.
  verbatim_quote: They do not provide a controlled comparison of total engineering cost against a matched conventional baseline or establish a closed loop in which physical feedback revises microarchitectural interfaces and software together
  label: measured
  origin: third-party-reported
  headline: false
  citations: [OpenAI2026JalapenoFirstResults, Smith2026JalapenoIEEE]
  checked: 'Both cited sources read in full (receipts in CLM-01-017 and CLM-01-021). Author reading of two documents, not a measurement. Each reports component comparisons only: 10 percent area for one block against an optimized human baseline, and 1.5 to 1.8 times for selected software blocks against expert implementations. Neither gives total engineering cost against a matched baseline or a physical-to-interface loop. The Hot Chips talk itself was not read and is not cited.'
- claim_id: CLM-01-019
  description: In ILLIXR, components run at different rates with their own deadlines, and motion-to-photon latency has a separate target.
  verbatim_quote: Perception, pose estimation, and rendering can run at different rates, each against its own deadline, and the delay from a head movement to the updated image, the motion-to-photon latency, carries a separate target
  label: measured
  origin: third-party-reported
  headline: false
  citations: [HuzaifaEtAl2021ILLIXR]
  checked: arXiv 2004.04643 PDF read directly, not the IISWC text. Table 9 tunes 15 Hz camera with 66.7 ms deadline, 500 Hz IMU with 2 ms, and 120 Hz display with 8.33 ms; MTP targets are 20 ms for VR and 5 ms for AR.
- claim_id: CLM-01-020
  description: A fast estimate can rank candidates differently from the slower tool, shown by proxy cost against post-route results in macro placement.
  verbatim_quote: a fast estimate can rank candidates differently from the slower tool it stands in for
  label: measured
  origin: third-party-reported
  headline: false
  citations: [ChengEtAl2026UpdatedAssessment, GoldieEtAl2024ThatChipHasSailed]
  checked: "arXiv 2302.11014v3 Table IX: Kendall correlation of proxy cost with post-route metrics on Ariane-ASAP7 placements is 0.051 to 0.402 across Area, rWL, Power, WNS, and TNS (Proxy row 0.058, 0.402, 0.320, 0.051, 0.090, reread 2026-11-02), called weak. Goldie et al. Section 3.3 dispute the study's reading but say proxy costs are 'often only weakly correlated with the target objective'. The uncited 'take hours' was cut, and 'cost far more' is the author's comparison with no number."
- claim_id: CLM-01-025
  description: The 2020 Wilson study left the vendor's account-team customer list out of its sampling frame and reports n=1492 with a margin of error of plus or minus 3 percent at 95 percent confidence. Vendor-reported survey design.
  verbatim_quote: Its 2020 study left the company's own customer list out of the sampling frame to limit vendor bias, and it reports a margin of error of $\pm 3$% at 95% confidence across 1,492 participants [@Foster2020WilsonPrologue].
  label: measured
  origin: transcribed
  headline: false
  stated_value: 1492
  unit: survey participants
  citations: [Foster2020WilsonPrologue]
  source_files: []
  checked: Foster 2020 prologue page read 2026-11-02. It states that the account team's customer list was not in the sampling frame, n=1492 after data cleaning, and a margin of error of 3 percent at a 95 percent confidence interval.
- claim_id: CLM-01-026
  description: The AlphaGo Zero authors include human matches to ground the Elo scale because self-play bias otherwise inflates the ratings.
  verbatim_quote: The authors ground the scale with human matches, without which the ratings are "unrealistically high due to self-play bias."
  label: assumed
  origin: third-party-reported
  headline: false
  citations: [SilverEtAl2017AlphaGoZero]
  source_files: []
  assumptions: The authors' own statement about their rating scale, not a measurement. Whether the grounding removes the bias between AlphaGo versions is not reported.
  checked: UCL accepted manuscript of Silver et al. 2017 read 2026-11-02, Methods on Elo ratings. sha256 a23add75aa06054c5a008befff55fb23af5da70a88c99004e0ff863eadf60ca1 matches the source copy recorded in the CSV.
