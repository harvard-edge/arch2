- claim_id: CLM-01-001
  description: Early-1980s frontier microprocessors held about 10^4 to 10^5 transistors; 2021 frontier chips held tens of billions.
  verbatim_quote: Early-1980s frontier microprocessors held about $10^4$ to $10^5$ transistors, and by 2021 frontier chips held tens of billions
  label: measured
  origin: transcribed
  headline: false
  stated_value: 100000
  unit: transistors, early-1980s upper order of magnitude
  citations: [Rupp2022MicroprocessorTrendData]
  source_files:
  - path: book/contents/chapters/02-pressures/data/fig-microprocessor-trends/rupp-microprocessor-trend-f2121ab2/transistors.dat
    sha256: 7678b84278d7ac0e8a56af9844f1620bbda4c8e0903490f1f0119519de7fa652
  checked: 'transistors.dat is in thousands: 1979.57 = 29.2, 1982.31 = 135.8; 2020.1 to 2021.9 = 16 to 58.2 million thousands. The 1982 record slightly exceeds 10^5, consistent with "about".'
- claim_id: CLM-01-002
  description: A same-architecture network trained on human expert moves predicted those moves better, yet the self-play player defeated it within the first 24 hours of training.
  verbatim_quote: a network trained to predict human expert moves matched those moves more often than a network of the same architecture trained only by self-play against the rules of Go, yet the self-trained player defeated it within the first 24 hours of training
  label: measured
  origin: third-party-reported
  headline: true
  stated_value: 24
  unit: hours of training
  citations: [SilverEtAl2017AlphaGoZero]
  checked: Read in the UCL accepted manuscript, sha256 a23add75aa06054c5a008befff55fb23af5da70a88c99004e0ff863eadf60ca1, the hash recorded in chapter1-alphago-elo.csv.
- claim_id: CLM-01-003
  description: The fully trained AlphaGo Zero rated above every earlier version in the internal tournament, a comparison that cannot isolate human data.
  verbatim_quote: The fully trained AlphaGo Zero, which used no human data, also rated above every earlier version in the study's internal tournament, although that comparison cannot isolate human data
  label: measured
  origin: transcribed
  headline: true
  stated_value: 5185
  unit: Elo
