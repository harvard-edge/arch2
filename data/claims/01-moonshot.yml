- claim_id: CLM-01-004
  description: AlphaGo Master shared Zero's network architecture, learning algorithm, and search method but kept handcrafted features and rollouts.
  verbatim_quote: AlphaGo Master, the closest rival, shared AlphaGo Zero's network architecture, learning algorithm, and search method, yet it also kept the handcrafted input features and simulated playouts (rollouts) of AlphaGo Lee
  label: measured
  origin: third-party-reported
  headline: false
  citations: [SilverEtAl2017AlphaGoZero]
  checked: 'Read in the UCL accepted manuscript (sha256 a23add75aa06054c5a008befff55fb23af5da70a88c99004e0ff863eadf60ca1), Methods list of AlphaGo versions: Master uses the same network architecture, reinforcement learning algorithm, and MCTS as Zero, but the same handcrafted features and rollouts as Lee, with training initialized from human data.'
