- claim_id: CLM-01-008
  description: Alt-text Elo ratings for all five versions.
  verbatim_quote: AlphaGo Zero rates highest at 5,185, followed by AlphaGo Master at 4,858, AlphaGo Lee at 3,739, AlphaGo Fan at 3,144, and the AlphaGo Zero network without search at 3,055
