- claim_id: CLM-04-013
  description: SimPoint builds length-weighted, normalized basic block vectors per interval.
  verbatim_quote: SimPoint, for example, builds a basic block vector ($w_{\text{BBV}} \in \mathbb{R}^d$) for each fixed instruction
    interval (such as $10^8$ instructions) by counting how often each static basic block executes, weighting those counts
    by static block length, and normalizing across the interval [@SherwoodEtAl2002SimPoint].
  label: assumed
  origin: third-party-reported
  headline: false
  citations:
  - SherwoodEtAl2002SimPoint
  source_files: []
  assumptions: A method description, not a measurement.
  checked: 'ASPLOS 2002 author PDF reread on 2026-11-02. Block-length weighting and normalization are stated, and basic block
    vectors are collected in intervals of 100 million instructions. The 10 million interval was cut: it is absent from this
    paper. SimPoint 3.0 (JILP 2005, not in references.bib) uses it.'
