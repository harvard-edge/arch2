- claim_id: CLM-04-032
  description: Graph edges carry connectivity; DeepGate2 learns embeddings supervised by truth-table differences.
  verbatim_quote: A graph input carries fan-in, fan-out, and connectivity in its edges, so a learned model starts from them
    rather than recovering them from text. DeepGate2, for example, learns node embeddings over AIGs, supervised by pairwise
    truth-table differences, so that embedding distance reflects logic function as well as structure [@ShiEtAl2023DeepGate2].
  label: assumed
  origin: third-party-reported
  headline: false
  citations:
  - ShiEtAl2023DeepGate2
  source_files: []
  assumptions: The first sentence describes what a graph input carries and is the book's statement, not a result of the paper.
    The second is a method description.
  checked: 'arXiv 2305.16373 reread on 2026-11-02: pairwise truth-table difference is the supervision, embedding distance
    is trained to be proportional to Hamming distance of truth tables, and the model takes structural and functional information.
    It shows no fan-out or logic-locality preservation result, so that claim was removed.'
