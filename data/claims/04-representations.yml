  verbatim_quote: Protein and molecular benchmarks treat a similar risk directly. TAPE reports a test set of fully held-out
    protein families beside a random split [@RaoEtAl2019TAPE], and MoleculeNet recommends splits that separate molecules by
    core structure for several of its datasets because a random split is not always the best test [@WuEtAl2018MoleculeNet].
  label: assumed
  origin: third-party-reported
  headline: false
  citations:
  - RaoEtAl2019TAPE
  - WuEtAl2018MoleculeNet
  source_files: []
  checked: 'NeurIPS 2019 TAPE PDF read on 2026-11-02: "preventing undesired information leakage between data splits", a test
    set of fully heldout families, and a random 95/5 split. arXiv 1703.00564v3 read the same day: "random splitting of molecular
    data isn''t always best"; scaffold splitting recommended for HIV and BBBP among others in its Table 1 column. The claim
    that the fields moved from one to the other was removed.'
  assumptions: A description of two benchmark designs, not a measurement. "Similar risk" is the book's analogy.
