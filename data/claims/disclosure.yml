- claim_id: CLM-D-015
  description: The book's content and code samples remain open.
  verbatim_quote: the book's content and code samples remain open
  label: assumed
  origin: author-model
  headline: true
  citations: []
  source_files: []
  assumptions: Reads as open in a licensing sense. The only sense supported is publicly readable.
  contrary_evidence:
  - path: LICENSE.md
    sha256: 56da2ebd7fda361b17a29df8234a38e1a5b33ff4b4c0fd4779ff571cf9932f52
  - path: README.md
