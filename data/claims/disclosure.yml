  description: The author discarded that draft and rebuilt the section.
  verbatim_quote: I discarded the draft and rebuilt the section from the underlying trade-offs
  label: assumed
  origin: author-model
  headline: false
  citations: []
  source_files: []
  assumptions: Author report of a process or fact about the author; no tracked artifact records it.
  history_test: No commit identifies the discard. Only the author can confirm.
- claim_id: CLM-D-013
  description: The author sets the rules and holds commit authority, with some passes unreviewed line
    by line.
  verbatim_quote: I set the rules they work under and hold commit authority over what enters the book,
    although some mechanical and rule-driven passes run without my reviewing every line
  label: measured
  origin: own-run
  headline: true
  citations: []
  source_files:
  - path: .pre-commit-config.yaml
    sha256: 81fd9607bed250853b22a4d624e5d702fa822c80746f75293a9023432ca49e34
  stated_value: 22.2
  unit: commits per calendar day
  formula: commits / days
  raw_inputs:
    commits: 2687
    days: 121
  tolerance: 0.05
  history_test: 'Rules are private and untracked, so only the commit half is testable. Authority at the
    merge level is consistent with history. Unreviewed work is likely larger than "some": 22.2 commits
    per day and 302 on one day; 70 book/contents file changes under Claude. History cannot separate reviewed
    from unreviewed commits. Rewording is uncommitted; the committed text said judgment governs every
    line.'
