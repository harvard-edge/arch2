scope: disclosure
claims:
- claim_id: CLM-D-002
  description: Drafts are released in the open.
  verbatim_quote: Releasing early drafts in the open creates a real form of personal accountability
  label: measured
  origin: own-run
  headline: false
  citations: []
  source_files:
  - path: .github/workflows/publish-site.yml
    sha256: ad537cb975abbfad62bc854dff44343cb72427fbac02178213d1de569af1dce6
  history_test: gh api reports harvard-edge/arch2 as public on 2026-11-02, and a publish workflow is tracked. The
    accountability clause is author judgment and was not tested.
- claim_id: CLM-D-006
  description: Coordinated agents draft text, write analysis and figure code, collect data, and audit results.
  verbatim_quote: in which coordinated agents draft text, write analysis and figure code, collect data, and audit
    results
  label: measured
  origin: own-run
  headline: true
  citations: []
  source_files:
  - path: data/validate_evidence_audit.py
    sha256: 18a9e3442f1c40278570a778953ae37b151c28f29e3012eb82fcefde21c3ac72
  - path: data/audits/fig-microprocessor-trends.yml
    sha256: ec5c178923fb660e1a8b553bff9246dccd4698e201ba5495d2c4fea50f3d7d86
  - path: data/audits/fig-ch04-ast-complexity-cliff.yml
    sha256: 53fa8024679ca51e6fb89e6879224fec82503ae9fb4b6c4abf7749eddd84762b
  - path: .pre-commit-config.yaml
    sha256: 1b24b1c1abc71c8bb21fbc46895ac3b5f052c978eb1fabaa12c6ab8cd014feb1
  history_test: 'Supported in kind. 40 commits are authored by Claude, including prose passes on every chapter and
    on this disclosure (440d7c46b), and 38 bodies carry a Claude co-author line. data/audits holds 32 figure records
    (32 PASS on 2026-11-06) naming a producer session and a separate auditor. Scope cannot be measured: 2,640 commits
    carry only the author name, so history cannot say how much text agents drafted. Sentence added to the working
    tree, not yet committed; the committed wording said models help with individual tasks.'
- claim_id: CLM-D-008
  description: Accepted work passes through a harness that compiles the manuscript and verifies formatting.
  verbatim_quote: accepted work then passes through an automated validation harness that compiles the manuscript
    and verifies formatting
  label: measured
  origin: own-run
  headline: true
  citations: []
  source_files:
  - path: .pre-commit-config.yaml
    sha256: 1b24b1c1abc71c8bb21fbc46895ac3b5f052c978eb1fabaa12c6ab8cd014feb1
  - path: .github/workflows/validate.yml
    sha256: 0883f40207338c46c2a1b47de0c99955c6cb478fc228b694c6ca611dd6dc30ce
  - path: .github/workflows/publish-site.yml
    sha256: ad537cb975abbfad62bc854dff44343cb72427fbac02178213d1de569af1dce6
  history_test: Partly supported. The pre-commit gate runs check_precommit, whose docstring says no-render, so it
    does not compile. Compilation happens in the render job of validate.yml on pushes and pull requests to main
    and dev, and in publish-site.yml. A commit on a task branch can land locally before any compile. Whether a given
    commit passed cannot be read from history.
  note: '2026-11-07: the harness that compiles the manuscript is CI; .github/workflows/validate.yml builds the full
    book (HTML, PDF, EPUB) on every push. The local pre-commit step checks but does not compile.'
- claim_id: CLM-D-010
  description: The author at the hub holds commit authority over what reaches the validation harness.
  verbatim_quote: The author at the central hub holds commit authority over what reaches the deterministic validation
    harness
  label: measured
  origin: own-run
  headline: false
  citations: []
  source_files:
  - path: .github/CODEOWNERS
    sha256: 24c9fcb7b0f857f306315fb75cc6ca6f7edfa27aa5d7680f76834875e96c4584
  check: Reworded 2026-11-07 from "decides, in order, what reaches", which claimed a per-item decision the body
    text contradicts (some passes run unreviewed). The new wording matches CLM-D-013. .github/CODEOWNERS names the
    author as owner of /book/; compilation runs in CI on pushes and pull requests to dev and main (CLM-D-008).
- claim_id: CLM-D-013
  description: The author sets the rules and holds commit authority, with some passes unreviewed line by line.
  verbatim_quote: I set the rules they work under and hold commit authority over what enters the book, although
    some mechanical and rule-driven passes run without my reviewing every line
  label: measured
  origin: own-run
  headline: true
  citations: []
  source_files:
  - path: .pre-commit-config.yaml
    sha256: 1b24b1c1abc71c8bb21fbc46895ac3b5f052c978eb1fabaa12c6ab8cd014feb1
  - path: .github/CODEOWNERS
    sha256: 24c9fcb7b0f857f306315fb75cc6ca6f7edfa27aa5d7680f76834875e96c4584
  stated_value: 22.2
  unit: commits per calendar day
  formula: commits / days
  raw_inputs:
    commits: 2687
    days: 121
  tolerance: 0.05
  history_test: 'Rules are private and untracked, so only the commit half is testable. Authority at the merge level
    is consistent with history. Unreviewed work is likely larger than "some": 22.2 commits per day and 302 on one
    day; 70 book/contents file changes under Claude. History cannot separate reviewed from unreviewed commits. Rewording
    is uncommitted; the committed text said judgment governs every line.'
- claim_id: CLM-D-014
  description: The manuscript is developed alongside runnable reference implementations.
  verbatim_quote: the manuscript is developed alongside runnable reference implementations
  label: measured
  origin: own-run
  headline: false
  citations: []
  source_files:
  - path: data/studies/ai_systolic_array_study/replay.py
    sha256: 2c4952bfc350c4d1002b3202354d7468e683be2d7d3a59b23d54b777f009089a
  - path: labs/README.md
    sha256: 9dc0605b44bef83999390d1b432313b63f49432686d27f1e7d7a9019c8be179d
  history_test: replay.py verify ran on 2026-11-02 and passed. labs/README.md points to nanochip/; nanochip was
    not run here. Commit cd5093855 (2026-09-14) retired the experimental lab course, so the set has shrunk.
- claim_id: CLM-D-015
  description: The book's content and code samples are freely readable online.
  verbatim_quote: the book's content and code samples are freely readable online
  label: measured
  origin: own-run
  headline: true
  citations: []
  source_files:
  - path: .github/workflows/publish-site.yml
    sha256: ad537cb975abbfad62bc854dff44343cb72427fbac02178213d1de569af1dce6
  - path: README.md
    sha256: 5562a6b80df6d27ea4e4bbf9e196756afe48e58015b4f0c10b93f61df4976ded
  contrary_evidence:
  - path: LICENSE.md
    sha256: 56da2ebd7fda361b17a29df8234a38e1a5b33ff4b4c0fd4779ff571cf9932f52
  check: Reworded 2026-11-07 from "remain open", which LICENSE.md (all rights reserved) contradicts as to reuse.
    The new wording asserts no license or open-access status (a Bucket A decision). publish-site.yml deploys the
    rendered book to GitHub Pages at arch2.mlsysbook.ai; README.md links the public site and book. The repository
    was reported public by gh api on 2026-11-02 (CLM-D-002). LICENSE.md stays recorded as the limit on reuse.
- claim_id: CLM-D-016
  description: Governance, harnesses, and review panels are structured to catch fabrication.
  verbatim_quote: its governance, deterministic test harnesses, and multi-agent review panels are structured to
    catch fabrication
  label: measured
  origin: own-run
  headline: true
  citations: []
  source_files:
  - path: data/validate_evidence_audit.py
    sha256: 18a9e3442f1c40278570a778953ae37b151c28f29e3012eb82fcefde21c3ac72
  - path: data/README.md
    sha256: aafa8e6dba47a003de3bf16e8d4064532ed3abbc6cc90195bb1404b7880efe8a
  history_test: Commits 94d8d9d0 (2026-09-09, removes two fabricated data series) and 542ea2c7 (2026-09-29, deletes
    unverifiable figures) show fabrication being caught, and also show it entering the book first. The hash-bound
    figure audit gate is present in the working tree. "Structured to catch" holds; a catch rate is unmeasured.
- claim_id: CLM-D-017
  description: The harness checks form, and panels can share blind spots.
  verbatim_quote: The validation harness checks form rather than truth, and the review panels are models that can
    share the blind spots of the models they review.
  label: measured
  origin: own-run
  headline: false
  citations: []
  source_files:
  - path: data/README.md
    sha256: aafa8e6dba47a003de3bf16e8d4064532ed3abbc6cc90195bb1404b7880efe8a
  check: data/README.md says the validators do not establish source accuracy or whether a citation supports a claim.
    Limit statement, consistent with the record.
not_claims:
- quote: I am writing this synthesis during an academic sabbatical at Harvard University while spending dedicated
    time at ETH Zürich
  reason: Author's account of their own circumstances (formerly CLM-D-001). A biographical fact only the author
    can attest; no tracked file records it.
- quote: working with generative AI systems every day exposes both their practical utility and their failure modes
  reason: Author's account of their own working circumstances and what they take from them (formerly CLM-D-003).
    Commit volume (2,687 commits over 121 days) is a weak proxy and was not offered as evidence.
- quote: I developed an AI-assisted authoring engine
  reason: 'Author''s first-person account of how they built their own authoring workflow (formerly CLM-D-004). The
    workflow lives in private, untracked configuration, and linc.seas.harvard.edu returned 403. The sentence makes
    no claim about LInc beyond the source of the principles. Narrowed 2026-11-07 after review: the rest of the sentence,
    that the principles were adapted from LInc, is the author''s attribution of their own influence, not a claim
    about what LInc teaches; LInc''s page was not checked.'
- quote: Although I have found generative models adept at retrieving broad interdisciplinary literature and surfacing
    cross-domain connections
  reason: Author's first-person account of their own experience with the tools (formerly CLM-D-005). Reworded 2026-11-07
    from "generative models excel at", a general capability claim with no measurement.
- quote: I structured the authoring workflow around specialized, simulated review roles
  reason: Author's first-person account of how they structured their own workflow (formerly CLM-D-007, which quoted
    the role list that follows). Role definitions are private and untracked; commit messages a480276bb, e4cad246,
    8ef13350, and 57b4114b show such passes occurred but not their coverage.
- quote: Generation roles propose drafts, and the diagram draws the orchestration that routes those drafts between
    roles as an inter-agent system bus, an on-chip analogy rather than a literal component.
  reason: Describes the book's own figure and names its system-on-chip analogy (formerly CLM-D-009). Reworded 2026-11-07
    so the bus no longer reads as a real component; none exists in the repository. That agents draft text is tested
    under CLM-D-006.
- quote: In one early draft, a set of generation agents produced many pages of fluent prose on hardware–software
    co-design within minutes
  reason: Author's recollection of an event in their own writing process (formerly CLM-D-011). No draft is retained;
    an earlier wording with numbers was removed in a1b630b3d.
- quote: I discarded the draft and rebuilt the section from the underlying trade-offs
  reason: Author's recollection of their own action (formerly CLM-D-012).
- quote: A citation auditor, for example, is tasked with flagging a reference whose source does not say what the
    sentence claims
  reason: Author's statement of what a role in their workflow is meant to do, their design intent (formerly CLM-D-018).
    Reworded 2026-11-07 from "flags", which read as a demonstrated behavior with no per-finding record.
