- claim_id: CLM-D-016
  description: Governance, harnesses, and review panels are structured to catch fabrication.
  verbatim_quote: its governance, deterministic test harnesses, and multi-agent review panels are structured
    to catch fabrication
  label: measured
  origin: own-run
  headline: true
  citations: []
  source_files:
  - path: data/validate_evidence_audit.py
    sha256: 18a9e3442f1c40278570a778953ae37b151c28f29e3012eb82fcefde21c3ac72
  - path: data/README.md
    sha256: aafa8e6dba47a003de3bf16e8d4064532ed3abbc6cc90195bb1404b7880efe8a
  history_test: Commits 94d8d9d0 (2026-09-09, removes two fabricated data series) and 542ea2c7 (2026-09-29,
    deletes unverifiable figures) show fabrication being caught, and also show it entering the book first.
    The hash-bound figure audit gate is present in the working tree. "Structured to catch" holds; a catch
    rate is unmeasured.
