scope: disclosure
claims:
- claim_id: CLM-D-001
  description: The author writes during a sabbatical at Harvard with time at ETH Zurich.
  verbatim_quote: I am writing this synthesis during an academic sabbatical at Harvard University while
    spending dedicated time at ETH Zürich
  label: assumed
  origin: author-model
  headline: false
  citations: []
  source_files: []
  assumptions: Author report of a process or fact about the author; no tracked artifact records it.
  history_test: Sentence present in disclosure.qmd since at least 907f1fe39 (2026-08-08). Nothing else
    tracked corroborates it. Only the author can confirm.
- claim_id: CLM-D-002
  description: Drafts are released in the open.
  verbatim_quote: Releasing early drafts in the open creates a real form of personal accountability
  label: measured
  origin: own-run
  headline: false
  citations: []
  source_files:
  - path: .github/workflows/publish-site.yml
    sha256: ad537cb975abbfad62bc854dff44343cb72427fbac02178213d1de569af1dce6
  history_test: gh api reports harvard-edge/arch2 as public on 2026-11-02, and a publish workflow is tracked.
    The accountability clause is author judgment and was not tested.
- claim_id: CLM-D-003
  description: The author works with generative AI systems every day.
  verbatim_quote: working with generative AI systems every day exposes both their practical utility and
    their failure modes
  label: assumed
  origin: author-model
  headline: false
  citations: []
  source_files: []
  assumptions: Author report of a process or fact about the author; no tracked artifact records it.
  stated_value: 22.2
  unit: commits per calendar day
  formula: commits / days
  raw_inputs:
    commits: 2687
    days: 121
  tolerance: 0.05
  history_test: 'History spans 2026-07-05 to 2026-11-02: commits on 90 of 121 calendar days. Commit volume
    is a weak proxy, and it says nothing about use of AI on any day.'
- claim_id: CLM-D-004
  description: The author developed an authoring engine on backward-design principles adapted from Harvard
    LInc.
  verbatim_quote: I developed an AI-assisted authoring engine grounded in backward-design principles adapted
    from [Harvard's Learning Incubator (LInc)](https://linc.seas.harvard.edu/)
  label: assumed
  origin: author-model
  headline: false
  citations: []
  source_files: []
  assumptions: Author report of a process or fact about the author; no tracked artifact records it.
  unopened: true
  history_test: linc.seas.harvard.edu returned 403, so the source was not opened. Tracked history holds
    only the figure and this sentence for backward design. The workflow lives in private configuration
    that is not tracked.
- claim_id: CLM-D-005
  description: Generative models excel at retrieving interdisciplinary literature.
  verbatim_quote: generative models excel at retrieving broad interdisciplinary literature and surfacing
    cross-domain connections
  label: assumed
  origin: author-model
  headline: false
  citations: []
  source_files: []
  assumptions: Author judgment. No measurement is cited, and the same book requires citation audits because
    retrieval is unreliable.
- claim_id: CLM-D-006
  description: Coordinated agents draft text, write analysis and figure code, collect data, and audit
    results.
  verbatim_quote: in which coordinated agents draft text, write analysis and figure code, collect data,
    and audit results
  label: measured
  origin: own-run
  headline: true
  citations: []
  source_files:
  - path: data/audits/fig-microprocessor-trends.yml
    sha256: b86215797fa2d7d16a51e27554f0596ec1d799b6c5db0eb88e77f468b4c98389
  - path: data/audits/fig-ch04-ast-complexity-cliff.yml
    sha256: 53fa8024679ca51e6fb89e6879224fec82503ae9fb4b6c4abf7749eddd84762b
  history_test: 'Supported in kind. 40 commits are authored by Claude, including prose passes on every
    chapter and on this disclosure (440d7c46b), and 38 bodies carry a Claude co-author line. data/audits
    holds 18 records (16 PASS, 2 FAIL) naming a producer session and a separate auditor. Scope cannot
    be measured: 2,640 commits carry only the author name, so history cannot say how much text agents
    drafted. Sentence added to the working tree, not yet committed; the committed wording said models
    help with individual tasks.'
- claim_id: CLM-D-007
  description: Simulated learner, senior architect, and systems panels and citation auditors review the
    work.
  verbatim_quote: learner panels evaluate pedagogical clarity, senior architect panels test technical
    bounds, systems panels inspect tool interfaces, and citation auditors check citations against their
    sources
  label: assumed
  origin: author-model
  headline: true
  citations: []
  source_files: []
  assumptions: Process report. Commit messages show such passes occurred; they do not show coverage or
    what each pass checked.
  history_test: a480276bb (2026-10-31) describes a per-chapter citation audit of chapters 1-12, preface,
    and appendices A and B, and lists corrected citations. It does not list the disclosure. e4cad246 cites
    panel feedback; 8ef13350 and 57b4114b cite a simulated-reader pass. No tracked file records per-citation
    source checks, and role definitions are private and untracked. Opening this chapter set found Chip-Chat
    dated after a post it precedes, so that pass did not catch everything.
- claim_id: CLM-D-008
  description: Accepted work passes through a harness that compiles the manuscript and verifies formatting.
  verbatim_quote: accepted work then passes through an automated validation harness that compiles the
    manuscript and verifies formatting
  label: measured
  origin: own-run
  headline: true
  citations: []
  source_files:
  - path: .pre-commit-config.yaml
    sha256: 81fd9607bed250853b22a4d624e5d702fa822c80746f75293a9023432ca49e34
  - path: .github/workflows/validate.yml
    sha256: 0883f40207338c46c2a1b47de0c99955c6cb478fc228b694c6ca611dd6dc30ce
  - path: .github/workflows/publish-site.yml
    sha256: ad537cb975abbfad62bc854dff44343cb72427fbac02178213d1de569af1dce6
  history_test: Partly supported. The pre-commit gate runs check_precommit, whose docstring says no-render,
    so it does not compile. Compilation happens in the render job of validate.yml on pushes and pull requests
    to main and dev, and in publish-site.yml. A commit on a task branch can land locally before any compile.
    Whether a given commit passed cannot be read from history.
- claim_id: CLM-D-009
  description: Generation roles communicate across a shared inter-agent bus.
  verbatim_quote: Generation roles communicate across a shared inter-agent bus to propose drafts
  label: assumed
  origin: author-model
  headline: false
  citations: []
  source_files: []
  assumptions: Workflow as drawn by the author. The caption reads as a description of a real system, so
    the constructed label does not apply.
  check: 'Searched tracked files and the private agents, rules, workflows, and scripts: the bus appears
    only in this caption and fig-author-ai-workflow.svg. No implementation or log was found. A figure
    drawn as an architecture is not evidence of one.'
- claim_id: CLM-D-010
  description: The author decides, in order, what reaches the validation harness.
  verbatim_quote: The author in the central hub decides, in order, what reaches the deterministic validation
    harness
  label: assumed
  origin: author-model
  headline: false
  citations: []
  source_files: []
  assumptions: Author description of workflow. The figure generalizes a commit-level decision to every
    item.
  history_test: Not supported as written for each item. The body text concedes some passes run unreviewed,
    and the 40 Claude commits were committed by Claude and entered dev as a batch through author merge
    ab8f9ba67 (2026-08-11). History shows 302 commits on 2026-09-11 alone. The caption sentence states
    no such exception.
- claim_id: CLM-D-011
  description: A generated co-design draft of many pages appeared within minutes and blurred simulation
    with signoff.
  verbatim_quote: a set of generation agents produced many pages of fluent prose on hardware–software
    co-design within minutes
  label: assumed
  origin: author-model
  headline: false
  citations: []
  source_files: []
  assumptions: Author report of a process or fact about the author; no tracked artifact records it.
  history_test: No draft, log, or commit retained. git history shows the sentence read "thirty pages ...
    in under two minutes" until a1b630b3d (2026-09-29), which removed the numbers. Neither wording has
    a receipt. History starts 2026-07-05, after the book began, so absence from it is not proof the event
    did not happen.
