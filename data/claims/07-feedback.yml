- claim_id: CLM-07-001
  description: Mean share of project time in verification exceeded half in each survey from 2014 to 2020 (57, 54, 53, 56 percent).
  verbatim_quote: Mean verification time exceeded half of project time in each Wilson Research Group survey from 2014 to 2020
    [@Foster2021WilsonPart8]
  label: measured
  origin: transcribed
  headline: false
  citations:
  - Foster2021WilsonPart8
  source_files:
  - path: data/datasets/chapter7-wilson-verification-scissors-gap.csv
    sha256: 96545b30723ec6b04819efcd784aba910048d295ca13d54fde244e7c331cb0c2
  inline_values: []
  note: Averages printed on Fig. 8-1 of the cited post, image viewed 2026-11-02. The post's Part 5 (2012 study) text gives
    56 percent for 2010 and 2012, non-FPGA designs, but the chapter no longer claims those years. The chapter claims nothing
    after 2020.
- claim_id: CLM-07-002
  description: First-silicon success was 14 percent of surveyed projects in the 2024 study, and the survey's 2022 edition lists
    logic or functional flaws as the leading respin cause alongside analog, safety, yield, and reliability flaws.
  verbatim_quote: first-silicon success fell to `{python} wv_fs_last`% of surveyed projects in the `{python} wv_fs_year` Siemens-sponsored
    Wilson Research Group study [@Foster2025WilsonVerification2024], a figure that reaches beyond functional escapes, since
    the same survey's 2022 edition lists logic or functional flaws as the leading cause of respins alongside analog tuning,
    safety, yield, and reliability flaws [@Foster2023WilsonPart12].
  label: measured
  origin: transcribed
  headline: true
  stated_value: 14
  unit: percent of projects
  citations:
  - Foster2025WilsonVerification2024
  - Foster2023WilsonPart12
  source_files:
  - path: data/datasets/chapter7-wilson-verification-scissors-gap.csv
    sha256: 96545b30723ec6b04819efcd784aba910048d295ca13d54fde244e7c331cb0c2
  inline_values:
  - wv_fs_last
  - wv_fs_year
  note: 'The report landing page, reread 2026-11-02, states 14 percent. The white paper sits behind a registration form and
    remains unopened; no identifier was submitted. The Part 12 post for 2022, read 2026-11-02, describes logic or functional
    flaws as the leading cause of respins and names analog tuning, safety and security features, yield, and reliability. The
    2024 definition itself was not read, so the sentence attributes the breadth to the 2022 edition. The prior value of 24
    percent (2022) is in the dataset.'
  unopened: true
