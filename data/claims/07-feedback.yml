- claim_id: CLM-07-055
  description: Writes equal the sum of ceil(K/R) x M x N, 204,800 at 32 rows and 409,600 at 16 rows, against 32,768 distinct output
    words; modeled DRAM writes run about 6.3 and 12.5 times that count.
  verbatim_quote: Each layer of the workload has dimensions $M$, $N$, and $K$, and $K$ folds across an array of $R$ rows, so a layer
    takes $\lceil K/R \rceil$ folds, each of which writes all $M \cdot N$ of the layer's output words as partial sums. Summed over
    the three layers, $\lceil K/R \rceil \cdot M \cdot N$ gives `{python} sa_folds_base` SRAM writes at 32 rows and `{python} sa_folds_wide`
    at 16 rows, against `{python} sa_outputs` distinct output words. The doubled count therefore records repeated partial sums rather
    than twice the result data, and modeled DRAM writes run about `{python} sa_dram_x_base` and `{python} sa_dram_x_wide` times
    the distinct output words.
