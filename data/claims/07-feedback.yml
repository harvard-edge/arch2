- claim_id: CLM-07-017
  description: Intel estimated that about one in 9 billion randomly fed divide or remainder instructions gave an inaccurate
    result.
  verbatim_quote: Intel estimated that about one in 9 billion randomly fed divide or remainder instructions produced an inaccurate
    result [@SharangpaniBarton1994FDIV]. At that rate random stimulus rarely exposes the flaw, and @Edelman1997PentiumDivision
    calls it a difficult mistake to catch.
  label: modeled
  origin: third-party-reported
  headline: true
  stated_value: 9000000000.0
  unit: divisions per error
  citations:
  - SharangpaniBarton1994FDIV
  - Edelman1997PentiumDivision
  source_files: []
  inline_values: []
  assumptions:
  - Intel's vendor estimate from Markov analysis plus random sampling, for random operands only.
  note: 'Intel white paper read 2026-11-02 from the mirror https://ardent-tool.com/CPU/Intel/fdiv/white11.pdf (sha256 580d53c3cedf74505b46c7748a6c361237d695c866736919027470e178726951),
    not retained. Section 3: 1 in 9 billion randomly fed divide or remainder instructions, by Markov analysis and over 1 trillion
    random samples. The rate is for random operands only. Edelman has no such number; he writes that the bug was a difficult
    one to catch. That random stimulus rarely exposes it is our inference from the rate.'
