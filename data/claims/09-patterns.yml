- claim_id: CLM-09-025
  description: Under RVWMO the writes and the reads may each reorder, so both sides need fences.
  verbatim_quote: Under RISC-V Weak Memory Ordering, the hardware may reorder either pair, so the producer needs a `fence
    w, w` between its payload and flag writes and the consumer a `fence r, r` between its flag and payload reads [@RISCV2026UnprivilegedISA].
  label: assumed
  origin: third-party-reported
  headline: false
  citations:
  - RISCV2026UnprivilegedISA
  source_files: []
  inline_values: []
  note: Version 20260120 opened 2026-11-02. Section 18.1.3 preserved program order has no rule for two stores or two loads
    to different addresses without a fence, dependency, or annotation. Rule 9 orders dependent loads. The bib note says chapter
    14, but RVWMO is chapter 18 here.
  assumptions:
  - Source statement carried as the cited source gives it. Nothing here was measured or reproduced. The four-label schema
    has no source-statement label, so `assumed` marks it as not measured.
- claim_id: CLM-09-026
