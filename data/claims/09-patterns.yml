- claim_id: CLM-09-021
  description: Author's reasoning on shared blind spots, then Sculley et al. on CACE and on tests that do not suffice.
  verbatim_quote: We reason that checks sharing a model or specification carry the same blind spot to the target, so they
    are not interchangeable votes that the transferred system works, and component checks have to be combined with integration
    tests wherever the claim depends on interactions. Machine-learned systems show a related limit, since changing one input
    can change the rest of the system, and unit and end-to-end tests alone do not show that it still works as intended once
    the world changes [@SculleyEtAl2015Hidden].
  label: assumed
  origin: third-party-reported
  headline: false
  citations:
  - SculleyEtAl2015Hidden
  source_files: []
  inline_values: []
  note: 'Paper reopened 2026-11-02 (papers.nips.cc 2015 PDF). CACE: "Changing Anything Changes Everything". Monitoring and
    Testing: unit and end-to-end tests "are valuable, but in the face of a changing world such tests are not sufficient to
    provide evidence that a system is working as intended." The first sentence is labeled as the book''s reasoning and carries
    no citation.'
  assumptions:
  - Source statement carried as the cited source gives it. Nothing here was measured or reproduced. The four-label schema
    has no source-statement label, so `assumed` marks it as not measured.
- claim_id: CLM-09-022
  description: MoE routing can load experts unequally unless training balances it; decoding grows a per-request KV cache.
  verbatim_quote: A dense matrix workload supplies regular tiles and steady data reuse, whereas mixture-of-experts routing
    can send very different numbers of examples to different experts unless training balances the load [@ShazeerEtAl2017MoE],
    and autoregressive decoding grows a per-request key-value cache as it generates each token [@KwonEtAl2023PagedAttention].
  label: assumed
  origin: third-party-reported
  headline: false
  citations:
  - ShazeerEtAl2017MoE
  - KwonEtAl2023PagedAttention
  source_files: []
  inline_values: []
  note: 'arXiv 1701.06538 reopened 2026-11-02. Section 4: "experts may still receive very different numbers of examples",
    which "can cause memory and performance problems on distributed hardware", and a load loss addresses it. Kwon states the
    per-request KV cache grows. The dense-matrix clause is the chapter''s framing.'
  assumptions:
  - Source statement carried as the cited source gives it. Nothing here was measured or reproduced. The four-label schema
    has no source-statement label, so `assumed` marks it as not measured.
