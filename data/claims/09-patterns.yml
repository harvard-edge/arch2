- claim_id: CLM-09-001
  description: Dataset shift as a change in the population behind the evidence, with the book chapter cited for it.
  verbatim_quote: One such change is a distribution shift, introduced in @sec-propagating-feedback-optimizer, which alters
    the population of workloads, designs, or operating conditions represented in the evidence [@QuinoneroCandelaEtAl2009DatasetShift].
  label: assumed
  origin: third-party-reported
  headline: false
  citations:
  - QuinoneroCandelaEtAl2009DatasetShift
  source_files: []
  inline_values: []
  note: 'Author-hosted copy of Storkey''s Chapter 1 of this book opened 2026-11-02 (homepages.inf.ed.ac.uk/amos/publications/Storkey2009TrainingTestDifferent.pdf,
    sha256 b0c0ad8e..., dated March 8, 2013): it treats dataset shift as change between training and test situations. The
    MIT Press book itself returned 403, so only that chapter was read, and its copy may differ from print. Population of workloads,
    designs, or operating conditions is the chapter''s architecture gloss. Not retained.'
  assumptions:
  - Source statement carried as the cited source gives it. Nothing here was measured or reproduced. The four-label schema
    has no source-statement label, so `assumed` marks it as not measured.
- claim_id: CLM-09-002
  description: Negative transfer means the source-informed method does worse than a comparable target-only method.
  verbatim_quote: It exhibits *negative transfer* when carrying its learned relationships or search priors forward produces
    a worse target result than a comparable target-only method [@WangEtAl2019NegativeTransfer].
  label: assumed
  origin: third-party-reported
  headline: false
  citations:
  - WangEtAl2019NegativeTransfer
  source_files: []
  inline_values: []
  note: arXiv 1811.09751 opened 2026-11-02. Eq. 4 defines the gap as target risk with the source minus target risk without
    it, and negative transfer as a positive gap. The paper states this for classifiers; search priors are the chapter's extension.
  assumptions:
  - Source statement carried as the cited source gives it. Nothing here was measured or reproduced. The four-label schema
    has no source-statement label, so `assumed` marks it as not measured.
