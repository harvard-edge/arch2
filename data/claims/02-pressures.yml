scope: 02-pressures
claims:
- claim_id: CLM-02-001
  description: Classical Dennard scaling held for about thirty years.
  verbatim_quote: For roughly thirty years, processor performance advanced under classical Dennard scaling, in which each process generation delivered smaller, faster transistors at constant power density
  label: measured
  origin: third-party-reported
  headline: false
  citations:
  - Moore1965Cramming
  - DennardEtAl1974Scaling
  - HennessyPatterson2019GoldenAge
  source_files: []
  opened: 'Dennard 1974 full text; Moore 1965 full text; Hennessy and Patterson 2019 CACM article opened 2026-11-02, PDF sha256 a65ddd6bcd9c44a1: ''Dennard scaling began to slow significantly in 2007 and
    faded to almost nothing by 2012''. The 7th edition (2026), read earlier and not in the bibliography, says ''ended 30 years later'' and ''around 2004''.'
- claim_id: CLM-02-002
  description: Constant-field scaling reduces area by the square of the linear factor and keeps dynamic power density constant.
  verbatim_quote: Shrinking linear dimensions by a factor $\kappa > 1$ reduced area by $1/\kappa^2$
  label: modeled
  origin: third-party-reported
  headline: false
  citations:
  - DennardEtAl1974Scaling
  source_files: []
  assumptions: Ideal constant-field scaling; leakage and wire effects excluded.
  opened: 'Dennard 1974 full text, Table I: dimensions, voltage, and capacitance 1/kappa; power density 1.'
- claim_id: CLM-02-003
  description: Ideal swing is ln(10) kT/q, computed as 59.5 mV at 300 K and printed as 60. Dennard states the subthreshold exponential and that it does not scale; the 60 mV value is this calculation, not
    a printed value. The link to voltage scaling is labeled as the author's reading.
  verbatim_quote: Lowering the threshold by 60\ mV can therefore raise off-state leakage by up to about ten times
  label: modeled
  origin: author-model
  headline: false
  stated_value: 60
  unit: mV per decade
  citations:
  - DennardEtAl1974Scaling
  source_files: []
  assumptions: Ideal subthreshold slope at room temperature; the footnote states 'at best'.
  formula: k * T * ln10 * 1000
  raw_inputs:
    k: 8.617333e-05
    T: 300
    ln10: 2.302585
  tolerance: 1
  opened: 'Dennard 1974 full text: ''the subthreshold behavior does not scale as desired''.'
- claim_id: CLM-02-004
  description: Dennard scaling ended in the mid-2000s when voltage stopped scaling.
  verbatim_quote: The classical balance broke down in the mid-2000s because supply voltage could no longer fall alongside feature size.
  label: measured
  origin: third-party-reported
  headline: false
  citations:
  - EsmaeilzadehEtAl2011DarkSilicon
  - HennessyPatterson2019GoldenAge
  source_files: []
  opened: 'Esmaeilzadeh et al. 2011 ISCA PDF opened 2026-11-02: ''Since 2005'', ''failure of Dennard scaling'' and slowed supply voltage scaling. Hennessy and Patterson 2019 CACM article opened 2026-11-02,
    PDF sha256 a65ddd6bcd9c44a1, which dates the slowing later, from 2007. The 7th edition, read earlier, says ''around 2004''. ''Mid-2000s'' spans these dates.'
- claim_id: CLM-02-005
  description: With V, f, and activity fixed and C and area idealized, dynamic power density rises by kappa. Formula checked at kappa = 2.
  verbatim_quote: '| **Dynamic Power Density ($P_{\mathrm{dyn}} / A$)** | $1$ *(constant)* | $\kappa$ *(under stated assumptions)*'
  label: modeled
  origin: author-model
  headline: false
  stated_value: 2
  unit: density ratio at kappa=2
  citations:
  - DennardEtAl1974Scaling
  source_files: []
  assumptions: 'Author''s simplified post-Dennard case: activity, voltage, and frequency fixed; C scales 1/kappa; area scales 1/kappa^2; leakage and interconnect excluded.'
  formula: (1 / k) / (1 / k ** 2)
  raw_inputs:
    k: 2
  tolerance: 0.0001
  opened: Dennard 1974 full text, Table I.
