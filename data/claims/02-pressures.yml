not_claims:
- quote: AI assistance helps most when it targets the specific engineering work delaying the next supported decision.
  reason: Author thesis, a comparative judgment with no measurement behind it. It matches the quantity pattern only through the figure's width="100%" attribute.
- quote: '| **Transistor Area ($W \times L$)** | $1/\kappa^2$ | $1/\kappa^2$ |'
  reason: Symbolic scaling input to the model in CLM-02-005, not a result.
- quote: '| **Supply Voltage ($V_{dd}$)** | $1/\kappa$ | $1$ *(held fixed)* |'
  reason: Symbolic scaling input to the model in CLM-02-005, not a result.
- quote: '| **Gate Capacitance ($C_{\text{gate}}$)** | $1/\kappa$ | $1/\kappa$ *(idealized)* |'
  reason: Symbolic scaling input to the model in CLM-02-005, not a result.
- quote: '| **Operating Frequency ($f$)** | $\kappa$ | $1$ *(held fixed)* |'
  reason: Symbolic scaling input to the model in CLM-02-005, not a result.
- quote: The text cites six dated design reports and all but two accelerators
  reason: A count of the figure's citations, matched only through its width attribute. The milestones file has 6 rows.
- quote: Hardware specifications exclude structured sparsity
  reason: The sentence matches the quantity pattern only through the figure's width="100%" attribute. Scope note; values are in CLM-02-017.
- quote: First panel shows dense FP16 peak throughput growing 106 times relative to P100
  reason: Alt text repeating CLM-02-017, CLM-02-018, and CLM-02-019.
- quote: (b) The specialization-coupled view reveals how domain specialization binds
  reason: The sentence matches the quantity pattern only through the figure's width="100%" attribute. Conceptual diagram.
- quote: We use the stated `{python} he_stated_asic` because the tables give no total
  reason: Editorial choice between two source values, both claimed in CLM-02-023 and CLM-02-024.
- quote: '**Reaching the ASIC took removing overhead and customizing the arithmetic.**'
  reason: The sentence matches the quantity pattern only through the figure's width="100%" attribute. Caption describes panels; values are in CLM-02-026.
- quote: (b) Base-processor energy by component across the encoder
  reason: The sentence matches the quantity pattern only through the figure's width="100%" attribute. Caption; values are in CLM-02-027.
- quote: Crossovers describe this one session and machine.
  reason: The sentence matches the quantity pattern only through the figure's width="100%" attribute. Scope caveat, not a result.
- quote: A broader study may reuse component models
  reason: The sentence matches the quantity pattern only through the figure's width="100%" attribute. Conceptual diagram.
- quote: Lowered machine code and runtimes then pass through verification checks
  reason: The sentence matches the quantity pattern only through the figure's width="100%" attribute. Conceptual diagram.
- quote: Directory reorganizations limit comparisons of subcategories
  reason: The sentence matches the quantity pattern only through the figure's width="100%" attribute. Caveat on CLM-02-044.
- quote: Panel (b) plots Interactive throughput as a percentage of Standard throughput across 20
  reason: Alt text repeating CLM-02-055.
- quote: A design with $n$ state bits can encode up to $2^n$ configurations.
  reason: Arithmetic identity.
- quote: The diagram specifies no measured rates or trend with architectural scope.
  reason: The sentence matches the quantity pattern only through the figure's width="100%" attribute. The caption states the diagram is unscaled.
- quote: That date is our framing rather than a measured inflection
  reason: Author framing, stated as such; no result rests on it.
- quote: a shift the Project Brainwave team characterized as rapid architectural diversification
  reason: Attributed characterization, not a measurement. The source's words are 'Cambrian explosion of specialized hardware'.
- quote: 'First panel plots each series against its own V100 value: dense Tensor Core FP16 reaches 17.6 times on B200 while HBM bandwidth reaches 8.6 times and TDP 3.3 times, and non-Tensor FP16 stops at
    H100.'
  reason: Figure alt text. It restates in words the V100-relative growth factors that CLM-02-017 (17.6), CLM-02-018 (8.6), and CLM-02-019 (3.3) claim, and adds no value of its own.
