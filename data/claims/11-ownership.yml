- claim_id: CLM-11-058
  description: 'Over 2,000 random class orders the largest class by rule runs 16.3 to 41.2% (median 28.0) in the grouping
    as drawn, with three classes taking the top place, and 23.9 to 50.6% (median 36.9) under the written merge rule. 783 of
    1,659 title-matched entries match more than one class. These describe the classifier. Replaces CLM-11-055 and 057, which
    stated 19 to 35%, at least six classes, and none near half of the corpus, withdrawn after the third audit.'
  verbatim_quote: "The ranking also depends on how a rule-based classifier orders its classes. The rules try the classes in a fixed order and keep the first match, and `{python} order_multi` of the `{python} order_title` entries matched on their titles match more than one class. Our test of that dependence reorders only those title matches. It shuffles the class order at random for them and holds the other `{python} order_held` entries as first assigned, even though the entries matched on description text also depend on class order. Across `{python} order_n` such title-only orders, the largest class by rule runs from about `{python} order_drawn_low`% to about `{python} order_drawn_high`% of the corpus in the grouping as drawn, and the class that comes out largest changes with the order. Under the written merge rule it runs from about `{python} order_written_low`% to about `{python} order_written_high`%. Because the description matches never move, neither span bounds the complete classifier, and both describe the classifier rather than the processors. Only the recorded order has a relabeled sample, so we report neither a largest share nor a ranking as a finding about silicon errata."
