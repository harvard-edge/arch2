scope: 11-ownership
claims:
- claim_id: CLM-11-001
  description: A leading-edge mask set is estimated in the tens of millions of dollars.
  verbatim_quote: A leading-edge mask set alone is estimated in the tens of millions of dollars [@Patel2022MaskSetCosts]
  label: modeled
  origin: third-party-reported
  headline: false
  citations:
  - Patel2022MaskSetCosts
  source_files: []
  assumptions: Analyst estimate; the article states the node figures with no source table or method.
  note: Opened 2026-11-02. The article says mask sets exceed $10M at 7 nm and will begin to push into the $40M range as processes
    cross 3 nm. Not retained; rights unclear.
- claim_id: CLM-11-002
  description: UCIe bump pitch is 100 to 130 um for standard packages and 25 to 55 um for advanced 2.5D packages.
  verbatim_quote: $100\text{--}130\ \mu\text{m}$ for standard packages and $25\text{--}55\ \mu\text{m}$ for advanced 2.5D
    packaging such as silicon interposers or bridges
  label: assumed
  origin: transcribed
  headline: false
  citations:
  - DasSharma2024UCIe20Introduction
  source_files: []
  note: Specification values from the Key Metrics table (UCIe-S 2D, UCIe-A 2.5D), opened 2026-11-02; not a measurement. The
    packaging slide names Silicon Bridge (e.g. EMIB) and Interposer (e.g. CoWoS) as advanced options and says Standard Package,
    not organic. Not retained; rights unclear.
  assumptions: Specification values taken as published. Nobody measured a package here, and the four-label scheme has no specification label, so assumed is the nearest.
- claim_id: CLM-11-003
  description: The hypothetical candidate must meet frame deadlines inside a 3 W envelope; the budget is a design target,
    not a result.
  verbatim_quote: In our hypothetical CPU-NPU-UCIe candidate, the team does not yet know whether NPU DMA burst sizing, LPDDR5
    bus contention, host CPU interrupt latency, and package thermal gradients allow the XR workload to meet its frame deadlines
    inside a 3\ W thermal envelope.
  label: constructed
  origin: author-example
  headline: false
  stated_value: 3
  unit: W
  citations: []
  source_files: []
  assumptions: Constructed Lighthouse example. The 3 W budget is declared in the Chapter 1 request, not derived. No frame
    rate is declared anywhere in the book, so the former 120 FPS target was cut.
- claim_id: CLM-11-004
  description: In a hypothetical revision, burst traffic pushes estimated subsystem power past 3 W; no such run exists.
  verbatim_quote: The burst memory traffic introduced by the new NPU tiling pushes estimated subsystem power across SRAM arrays,
    UCIe links, and LPDDR5 channels past the 3\ W thermal envelope, and a critical tail-latency path has no software fallback.
  label: constructed
  origin: author-example
  headline: false
  stated_value: 3
  unit: W
  citations: []
  source_files: []
  assumptions: Constructed revision of the Lighthouse SoC; no such run exists. The 3 W budget is declared in the Chapter 1
    request, and the overrun is an author example, not a result.
- claim_id: CLM-11-005
  description: A post-freeze mask change costs at least some new masks, generally critical layers, and a few months.
  verbatim_quote: After freeze, a change to the reticles pays for at least some new masks, generally on the critical layers,
    and takes a few months [@Patel2022MaskSetCosts].
  label: modeled
  origin: third-party-reported
  headline: false
  citations:
  - Patel2022MaskSetCosts
  source_files: []
  note: Analyst statement, opened 2026-11-02. No respin dollar figure was found in a primary source, so the millions-of-dollars
    inference was cut.
  assumptions: Analyst statement; the article gives no source table or method.
- claim_id: CLM-11-006
  description: Larrabee paper described a many-core x86 visual-computing architecture with a software rendering pipeline.
  verbatim_quote: Larrabee described a many-core x86 architecture for visual computing, with wide vector units, coherent caches,
    and a software rendering pipeline that replaced fixed-function steps such as rasterization [@SeilerEtAl2008Larrabee].
  label: measured
  origin: third-party-reported
  headline: false
  citations:
  - SeilerEtAl2008Larrabee
  source_files: []
  note: Read 2026-11-02 in the copy on a CMU course page (15869-f11 readings); the ACM page returned 403. The paper performs
    rasterization and post-shader blending in software and keeps fixed function logic for texture filtering, so "most fixed-function
    hardware" was narrowed. Not retained; rights unclear.
