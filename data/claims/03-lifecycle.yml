- claim_id: CLM-03-024
  description: A 2001 projection from 180 nm to 35 nm found local wires track gate delay while global wires fall behind even with repeaters; wide crossbars may need repeaters or pipelining.
  verbatim_quote: A 2001 projection across feature sizes from 180\ nm to 35\ nm found that local wires, which shorten with scaling, keep pace with gate delay or slow only gradually, whereas global wires fall behind gates even with repeaters [@HoMaiHorowitz2001FutureOfWires].
  label: modeled
  origin: third-party-reported
  headline: false
  citations:
  - HoMaiHorowitz2001FutureOfWires
  source_files: []
  assumptions: Scaling projection from a 2001 paper that stops at 0.035 um. The source does not reach current nodes, so the sentence is bounded to its range. The crossbar sentence after it is the author's reasoning.
  unopened: true
  checked: 'Abstract only, read through index pages on 2026-11-02. IEEE full text is paywalled, OpenAlex lists it as closed, and the Stanford URLs tried returned 404. The former wording (resistance and capacitance, advanced nodes) was stronger than the abstract and was narrowed to it.'
- claim_id: CLM-03-025
  description: Credit assignment is a classic problem, attributed to Minsky.
  verbatim_quote: attributing a downstream physical failure (such as negative slack, routing congestion, or localized $IR$ drop) to an upstream design decision is, by analogy, a classic credit assignment challenge [@Minsky1961StepsAI]
  label: assumed
  origin: third-party-reported
  headline: false
  citations:
  - Minsky1961StepsAI
  source_files: []
  assumptions: Analogy from reinforcement learning to multi-stage design. The hardware mapping is the author's.
  checked: 'Minsky 1961 read on 2026-11-02 from the MIT CSAIL PDF. Section D is headed "The Basic Credit-Assignment Problem for Complex Reinforcement Learning Systems" and supports the lineage.'
