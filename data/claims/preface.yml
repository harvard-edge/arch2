not_claims:
- quote: I wrote it to bring these emerging pieces together into a single engineering discipline
  reason: Statement of the author's purpose in writing the book. It reports no result and no fact about third parties. Who drafted the text is tested under disclosure CLM-D-006 and CLM-D-013, not here.
- quote: The study frames the 3\ W design question in @sec-moonshot
  reason: Roadmap sentence. It restates the constructed budget of CLM-P-003 and reports no result.
- quote: Computer architecture defines the workload questions and system trade-offs
  reason: Conceptual Venn diagram. The validator matched width="100%", a layout attribute.
- quote: a modest, well-calibrated surrogate that removes a weeks-long simulation bottleneck can change
    a tapeout schedule
  reason: Conditional illustration of the argument. It names no case and reports no result.
