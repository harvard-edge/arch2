scope: preface
claims:
- claim_id: CLM-P-001
  description: Only 14 percent of projects in the 2024 Wilson Research Group study reached first-silicon
    success.
  verbatim_quote: in the 2024 Wilson Research Group study, only 14 percent of surveyed integrated-circuit
    projects achieved first-silicon success
  label: measured
  origin: transcribed
  headline: true
  citations:
  - Foster2025WilsonVerification2024
  source_files:
  - path: data/datasets/chapter2-wilson-first-silicon-success.csv
    sha256: c0a467457934259da948355162de3f98759ea0a99981c01b6afd3f77e4c6c2b1
  stated_value: 14
  unit: percent of surveyed projects
  check: Opened the cited Verification Academy page on 2026-11-02; its summary states only 14 percent.
    The report PDF behind Download Paper was not opened. The dataset caveat says 2024 recruitment changed,
    limiting comparison with 2007-2022; the preface does not compare years, but "remain common" leans
    on the series.
- claim_id: CLM-P-002
  description: Artificial intelligence is reshaping nearly every technical field.
  verbatim_quote: Artificial intelligence is reshaping nearly every technical field, from software engineering
    and mathematics to materials discovery.
  label: assumed
  origin: author-model
  headline: false
  citations: []
  source_files: []
  assumptions: Author framing. The sentence cites nothing and no retained evidence was found.
- claim_id: CLM-P-003
  description: The Lighthouse study is a prospective, unexecuted case with a 3 W budget chosen by the
    author.
  verbatim_quote: a real-time mobile extended-reality (XR) compute subsystem designed for a strict 3\
    W thermal design power budget and tight die-area limits
  label: constructed
  origin: author-example
  headline: true
  citations: []
  source_files: []
  stated_value: 3
  unit: W
  assumptions: The 3 W budget is an author-chosen design target for a prospective case. Nothing was built
    or measured.
  check: The next sentence reads "The Lighthouse study is prospective", so the chapter reads as constructed.
    "Designed for" alone could read as a built design. No evidence exists because none ran.
- claim_id: CLM-P-004
  description: Three years separate the 2023 SIGARCH post and first workshop from the book.
  verbatim_quote: Three years ago, when Amir Yazdanbakhsh and I wrote an ACM SIGARCH blog post calling
    for an "Architecture 2.0" AI gymnasium
  label: measured
  origin: transcribed
  headline: false
  citations:
  - ReddiYazdanbakhsh2023Gymnasium
  - Architecture20SIGARCHWorkshopOutcomes
  source_files: []
  stated_value: 3
  unit: years
  formula: book_year - post_year
  raw_inputs:
    book_year: 2026
    post_year: 2023
  tolerance: 0
  check: Opened both posts. The gymnasium post is dated June 14, 2023 and does call for one. The workshop
    post is dated December 20, 2023, calls the workshop inaugural, and lists the author as a coauthor,
    not a workstream lead, so it does not itself show that he convened it. The count ages with each edition.
- claim_id: CLM-P-005
  description: A prompt carried to a verified chip sounded outlandish to many in 2023.
  verbatim_quote: the idea of prompting a design system to carry a high-level workload request through
    to a verified chip sounded to many like an outlandish moonshot, almost a ridiculous prompt
  label: assumed
  origin: author-model
  headline: false
  citations: []
  source_files: []
  assumptions: Author recollection of how others reacted. The sentence places the idea at the 2023 post,
    which gives "generate me an ALU" as its example prompt and treats verification as a challenge; it
    does not describe workload-to-chip prompting.
- claim_id: CLM-P-006
  description: The proposal met candid skepticism across the architecture community.
  verbatim_quote: the proposal met with candid skepticism across the computer architecture community
  label: assumed
  origin: author-model
  headline: false
  citations: []
  source_files: []
  assumptions: Author recollection. No survey, review, or published response is cited.
- claim_id: CLM-P-007
  description: Synopsys had reported commercial tape-outs using a reinforcement-learning optimizer.
  verbatim_quote: Synopsys had already reported commercial tape-outs using its reinforcement-learning
    optimizer
  label: measured
  origin: third-party-reported
  headline: false
  citations:
  - Synopsys2023DSOai
  source_files: []
  check: Opened the press release of February 7, 2023. It reports the first 100 commercial tape-outs and
    says DSO.ai uses reinforcement learning. Vendor self-report.
- claim_id: CLM-P-008
  description: Learned macro placement had been reported and contested.
  verbatim_quote: learned macro placement had already been reported and contested
  label: measured
  origin: third-party-reported
  headline: false
  citations:
  - MirhoseiniEtAl2021GraphPlacement
  - ChengEtAl2023MacroPlacement
  source_files: []
  unopened: true
  check: 'Cheng et al. arXiv version opened; it reassesses the Google approach and calls some questions
    unconfirmed. Mirhoseini et al. was not opened: nature.com redirected to a login.'
- claim_id: CLM-P-009
  description: Since the 2023 post, teams reported model-assisted RTL drafting, automated kernel generation,
    and early multi-agent RTL generation.
  verbatim_quote: since then research and industry teams have reported model-assisted RTL drafting
  label: measured
  origin: third-party-reported
  headline: false
  citations:
  - BlockloveEtAl2023ChipChat
  - OuyangEtAl2025KernelBench
  - OpenAI2026JalapenoFirstResults
  - ZhaoEtAl2025MAGE
  source_files: []
  check: 'All four opened. Chronology defect: arXiv 2305.13243 predates the June 14, 2023 post, so Chip-Chat
    is not "since then" unless dated by its MLCAD venue. KernelBench and MAGE fit. The OpenAI post, read
    through a reader proxy, reports AI-generated implementations of selected blocks and says new model
    families still need new kernels, which is narrower than automated kernel generation.'
