    onto it, and through the sum $2R + C$ for $R$ rows and $C$ columns.
  label: modeled
  origin: author-model
  headline: false
  assumptions: Cycles = folds x (2R + C + M - 2) - 1, with folds = ceil(K/R) x ceil(N/C). This form is not in the study record.
