- claim_id: CLM-B-013
  description: Amdahl bound as s grows.
  verbatim_quote: 'The unaffected fraction, $1-f$, limits the overall gain: as $s$ grows without bound,
    $S$ approaches $1/(1-f)$ for $f < 1$.'
  label: modeled
  origin: author-model
  headline: false
  citations:
  - Amdahl1967ValiditySingleProcessor
  source_files: []
  assumptions: Fixed work, one accelerated fraction, no coordination overhead, as the entry states.
  unopened: true
  check: Algebra holds. The 1967 paper was not opened; it is commonly reported to argue in prose without
    this formula.
