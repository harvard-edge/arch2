scope: apdx-b-laws-and-paradoxes
claims:
- claim_id: CLM-B-001
  description: Selecting the top noisy estimate gives an upwardly biased estimate of its value.
  verbatim_quote: Smith and Winkler showed that selecting the alternative with the highest estimated value
    from a set of noisy estimates can yield an upwardly biased estimate of the selected alternative's
    true value
  label: measured
  origin: third-party-reported
  headline: false
  citations:
  - SmithWinkler2006OptimizersCurse
  source_files: []
  check: Full text opened. A 2007 correction changed the values of their Figure 3 only, which this book
    does not use.
- claim_id: CLM-B-002
  description: Gaussian model of conditional disappointment and its growth with pool size.
  verbatim_quote: For an observed maximum $\hat{y} > \mu$ and nonzero estimation variance, this conditional
    expectation falls below $\hat{y}$
  label: modeled
  origin: author-model
  headline: false
  citations:
  - SmithWinkler2006OptimizersCurse
  source_files: []
  assumptions: Independent Gaussian true values and errors across candidates, as the entry states.
  check: 'Checked in a scratch simulation (sigma_v 1, sigma_e 0.7, not retained): disappointment 0.618
    versus formula 0.616 at N=10, and 1.306 versus 1.300 at N=1000. Algebra holds. The sqrt(2 ln N) form
    is leading order and ran high by about 0.6 at N=1000 (4.54 versus 3.95), which the "for large N" wording
    permits.'
- claim_id: CLM-B-003
  description: The expected winning estimate is at least the winner's expected true value.
  verbatim_quote: Selecting $I = \arg\max_i \hat{v}_i$ gives
  label: modeled
  origin: author-model
  headline: false
  citations:
  - SmithWinkler2006OptimizersCurse
  source_files: []
  assumptions: Fixed finite candidate set; unbiased estimates; expectation over repeated evaluations.
  check: 'The stated argument is valid: Jensen on the maximum gives E[max estimate] at least the largest
    true value.'
