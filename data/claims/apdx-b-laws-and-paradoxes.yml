  verbatim_quote: Execution harnesses enforce a feed-forward stability bound on the generator
  label: constructed
  origin: author-model
  headline: false
  citations:
  - Kleinrock1975QueueingSystems
  source_files: []
  assumptions: Feed-forward chain, one job per survivor, no retries or external arrivals.
  unopened: true
  check: Bound follows from g times upstream pass fractions below each service rate. "Enforce" reads as
    present fact; no harness in this book is shown doing so.
