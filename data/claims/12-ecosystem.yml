  stated_value: 82
  unit: projects
  citations:
  - Conway1981MPCAdventures
  source_files: []
- claim_id: CLM-12-002
  description: Xerox PARC merged MPC79 layouts into shared mask sets. Conway reports 12 die types over two mask sets.
  verbatim_quote: Xerox PARC then merged their layouts into shared mask sets
  label: assumed
  origin: third-party-reported
  headline: false
  citations:
  - Conway1981MPCAdventures
  source_files: []
  assumptions: The organizer's own historical account, not a measurement.
- claim_id: CLM-12-003
  description: Merging projects onto a multiproject chip shared mask and fabrication overhead, and MOSIS developed from that
    idea as a silicon broker for a larger community. Conway supplies the sharing clause and Cohen and Lewicki the MOSIS clause
    ("developed from an idea demonstrated in recent years by Caltech and by the MPC project"). Read in the 1981 Caltech proceedings
    PDF, CaltechAUTHORS record svt7c-01869, md5 b8160bb2c682e3c77c13d26468e979f3, on 2026-11-02. Not retained because the
    rights are unclear.
  verbatim_quote: Merging projects onto one multiproject chip shared the overhead of mask making and wafer fabrication across
    all the designs, and the later MOSIS service developed from that idea to give a larger community of chip designers access
    to fabrication
  label: assumed
  origin: third-party-reported
  headline: false
  citations:
  - Conway1981MPCAdventures
  - MOSIS1981VLSI
  source_files: []
  assumptions: Historical account from the organizer and from the MOSIS authors, not a measurement.
- claim_id: CLM-12-004
  description: SystemC is a standardized common modeling language. The systemc.org overview was read on 2026-11-02 and states
    the standardization and the multi-company community. It describes IEEE 1666-2023. The IEEE standard text returned HTTP
    403 and stays unread.
  verbatim_quote: The Institute of Electrical and Electronics Engineers (IEEE) 1666 SystemC standard shows that organizations
    can agree on a [common modeling language](https://systemc.org/overview/systemc/)
  label: assumed
  origin: third-party-reported
  headline: false
  citations:
  - IEEE2011SystemC1666
  source_files: []
  unopened: true
  assumptions: A statement about standardization from the standards community, not a measurement.
- claim_id: CLM-12-005
  description: Three open PDKs, their processes and nodes, expose device models and design rules.
  verbatim_quote: SkyWater SKY130 (130 nm CMOS), IHP SG13G2 (130 nm BiCMOS), and GlobalFoundries GF180MCU (180 nm) expose
    device models and design rules for research on manufacturable processes
  label: assumed
  origin: third-party-reported
  headline: false
  citations:
  - SkyWater2020SKY130PDK
  - IHPOpenPDK
  - GlobalFoundriesGF180MCUOpenPDK
  source_files: []
  assumptions: Description of kit contents from each kit's own documentation, not a measurement.
- claim_id: CLM-12-006
  description: The SkyWater documentation and the GF180MCU README say the open PDK is not intended for production settings
    at this current time, and the IHP README says it is a preview not intended for production at this moment. All three read
    on 2026-11-02. These are current statements and may change.
  verbatim_quote: as of November 2026 the documentation for all three kits says the open release is not intended for production
  label: assumed
  origin: third-party-reported
  headline: false
  citations:
  - SkyWater2020SKY130PDK
  - IHPOpenPDK
  - GlobalFoundriesGF180MCUOpenPDK
  source_files: []
  assumptions: Documentation status as stated by each kit's maintainers on the access date, not a measurement.
- claim_id: CLM-12-007
  description: ASAP7 is predictive and not tied to a manufacturing line. The paper's full text returned HTTP 403, so the abstract
    on the ASU research portal ("not tied to any specific foundry") is the evidence for the paper. The ASU project page, read
    2026-11-02, adds that resulting designs are not manufacturable.
  verbatim_quote: A predictive kit such as ASAP7 models projected scaling trends without targeting a manufacturing line
  label: assumed
  origin: third-party-reported
  headline: false
  citations:
  - ClarkEtAl2016ASAP7
  source_files: []
  assumptions: Description of a predictive kit from its authors, not a measurement.
