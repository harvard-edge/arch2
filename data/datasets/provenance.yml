# Provenance records for the receipts that feed book figures.
# Schema: arch2-provenance/v1, same keys as data/studies/*/provenance.yml.
# source-receipts is a flat directory, so records are a list keyed by file.
# Audited 2026-09-09 by a blind-derive / diff / adversarial-refute pass.

# Revalidated 2026-09-29: entries carry revalidation_2026_09_29 notes; status
# "deleted" means the file no longer exists in the repository.

