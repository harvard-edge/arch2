# Provenance records for the receipts that feed book figures.
# Schema: arch2-provenance/v1, same keys as data/studies/*/provenance.yml.
# source-receipts is a flat directory, so records are a list keyed by file.
# Audited 2026-09-09 by a blind-derive / diff / adversarial-refute pass.

receipts:
  - file: ch1_data.csv
    path: data/datasets/ch1_data.csv
    rows: 10
    feeds_figures: [fig-agentic-sweet-spot, fig-api-driven-tapeouts, fig-ch11-vuln-shift, fig-ecosystem-network-graph, fig-interconnect-scaling, fig-llm-judge-mfu-collapse, fig-moores-law-breakdown, fig-mutation-roi, fig-rl-convergence, fig-silicon-scaling-plateau, fig-topological-explosion, fig-verification-wall]
    status: defective
    defects:
      - severity: blocker
        verdict: upheld
        where: "data/source-receipts/plot_all_wishlist.py:24 (sole read site); figure sites across book/contents/chapters/01-12"
        claimed: "12 figures supplied by ch1_data.csv"
        data_says: "ch1_data.csv is read exactly once in the entire repo (plot_all_wishlist.py:24) and feeds only the plot_ch1.png block (lines 24-47). Only ONE of the 12 credited figures uses plot_ch1.png: fig-silicon-scaling-plateau (01-moonshot.qmd:286). The other 11 use images/plot_ch2.png .. plot_ch12.png, each generated from its own ch2_data.csv .. ch12_data.csv with disjoint schemas (Process_Node/CapEx; pr_com"
      - severity: blocker
        verdict: upheld
        where: "book/contents/chapters/01-moonshot/01-moonshot.qmd:286 (caption, fig-silicon-scaling-plateau)"
        claimed: "exponential scaling with model size; ~90% Pass@1"
        data_says: "The 88.4 endpoint is real (max software Pass_at_1 = 88.4, GPT-4), so \"nearly 90%\" is supported. \"Exponentially\" and \"with model size\" are not. The software series in file order is 29.3, 48.1, 33.6, 34.8, 88.4 - non-monotone, with a 14.5 pp DROP from GPT-3.5 (48.1) to StarCoder-15B (33.6). I confirmed this dip is visible in the rendered plot_ch1.png. There is also no model-size column: the plotted"
      - severity: blocker
        verdict: upheld
        where: "book/contents/chapters/01-moonshot/01-moonshot.qmd:286 (caption, fig-silicon-scaling-plateau)"
        claimed: "plateau at ~27%"
        data_says: "27.0 is the LAST and LARGEST silicon value (GPT-4, 10000B), not an asymptote the series settles onto. The series is 17.1, 26.7, 18.1, 18.2, 27.0 - non-monotone, and it is RISING at the right edge (18.2 -> 27.0, +8.8 pp, the largest single step in the series). The tight cluster the eye reads as a plateau is 17.1/18.1/18.2, near 18%, not 27%. If anything plateaus near 27% it is the two GPT rows (26."
      - severity: blocker
        verdict: upheld
        where: "book/contents/chapters/01-moonshot/01-moonshot.qmd:286 (caption, fig-silicon-scaling-plateau)"
        claimed: "aggregated pass rates from named open-source benchmarks"
        data_says: "The receipt records no benchmark name, version, evaluation date, k, temperature, URL, citation, commit, or accession - and it has no '#' header block, so there is zero in-file source metadata. Nothing in the file supports the word \"aggregated\" (each Model/Domain pair is a single scalar, not a pooled statistic over runs). Three artifacts also disagree on which benchmarks these are: the caption says"
      - severity: blocker
        verdict: upheld
        where: "data/source-receipts/PROVENANCE.md:7"
        claimed: "derivation from four named benchmarks"
        data_says: "Unverifiable from the file: there is no benchmark column, so no row can be attributed to SWE-Bench, HumanEval, VerilogEval, or RTLLM, and the file cannot say whether a Pass_at_1 is one benchmark or a blend of two. The plotting script disagrees with this line, labelling the series HumanEval and VerilogEval only. \"Public foundation models\" is also loose: GPT-3.5 and GPT-4 are publicly available but"
      - severity: blocker
        verdict: upheld
        where: "data/source-receipts/PROVENANCE.md:22-23"
        claimed: "named generator script guarantees provenance"
        data_says: "generate_all_wishlist.py does not exist anywhere in the repo (verified with find over the whole tree). The receipt therefore cannot be regenerated or traced to any mining step, and the word \"generation\" is itself the wrong assurance for a directory whose README states \"Every quantitative assertion in the book is backed by an inspectable CSV receipt.\" This is the same shape as the three cases alrea"
      - severity: material
        verdict: upheld
        where: "book/contents/chapters/01-moonshot/01-moonshot.qmd:286 (caption, fig-silicon-scaling-plateau)"
        claimed: "causal attribution of the silicon ceiling to HDL data scarcity"
        data_says: "ch1_data.csv has four columns: Model, Tokens_B, Domain, Pass_at_1. There is no corpus-size, data-volume, data-quality, or license column of any kind, and Tokens_B is total training tokens per model (identical on both Domain rows), not hardware-corpus volume. Nothing in this receipt can distinguish a data-scarcity cause from a task-difficulty, benchmark-difficulty, or evaluation-harness cause. No c"
      - severity: material
        verdict: upheld
        where: "book/contents/chapters/01-moonshot/01-moonshot.qmd:286 (fig-alt attribute)"
        claimed: "rapid plateau for hardware generation"
        data_says: "Same defect as the caption, restated in the accessibility text a screen-reader user receives instead of the image. The silicon series ends on its maximum (27.0) after its largest positive step (+8.8 pp); it does not plateau. This matters independently because alt text ships to Springer as a separate deliverable and a reader who cannot see the figure gets the claim with no chance to check it agains"
      - severity: material
        verdict: upheld
        where: "book/contents/chapters/01-moonshot/01-moonshot.qmd:288 (analytical landing prose)"
        claimed: "diminishing returns in parameters, hardware vs software"
        data_says: "No parameter column exists in the receipt; the plotted axis is training tokens. On the receipt's own ordering the silicon return is largest at the top of the range, not diminishing (18.2 -> 27.0 across the last step, +8.8 pp, vs +1.0, -8.6, +0.1 for the earlier steps), and the software side is also steepest at the top (+53.6 pp from 34.8 to 88.4), which is the opposite of diminishing returns on bo"

