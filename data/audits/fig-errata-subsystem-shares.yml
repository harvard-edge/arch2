negative_control:
  command: >-
    /usr/local/bin/python3 -I (inline perturbation script) on a scratch copy at
    /private/tmp/claude-501/-Users-VJ-GitHub/8937d0c1-72e1-444d-a270-8311baa83444/scratchpad/audit-fig-errata-subsystem-shares/s2/nc/study,
    then audit_metrics.py
  result: >-
    Changing the audit label of five Power-stratum rows to Debug moved the adjusted Power share from 0.0901 to 0.0717
    and Debug from 0.1629 to 0.1812, left every rule count and the other adjusted shares unchanged, and lowered
    weighted agreement from 0.7629 to 0.7445. Changing one rule label in errata_classified.csv made audit_metrics.py
    stop with "class size for I/O and peripheral interfaces changed since the sample was drawn; redraw". The
    pipeline responds to its inputs and refuses a changed population.
  interpretation: Constructed perturbations in a scratch copy, not new measurements.
limits:
  - No human relabeling exists. This audit checks arithmetic on one model's labels and a handful of plausibility reads, not label correctness. The relabeling worksheet was not retained.
  - classify_errata.py was not rerun end to end. errata.csv is not a bound input and the body-text cache (.cache/errata_text.jsonl) is absent. Classification was instead checked by my own matcher over titles (1659 of 1659) and by locating body text in the PDFs for 73 of the 109 description-matched or Unclassified rows (73 of 73 agree). The remaining 36 rows (2.0 percent of the corpus) were not located and are unchecked, and for the 94 description rows the first-class-wins order was not tested beyond the 73.
  - Five documents are held only at later revisions, so for Alder, Raptor, Meteor, Lunar and Arrow Lake the title and ID presence was checked against the later revision, not the pinned one.
  - Title matching is substring presence after normalization, not a field-by-field check of problem, implication or workaround text. Status was checked by parser for 1387 rows (1149 Intel, 238 AMD); the 364 Skylake-SP, Cascade Lake and Ice Lake-SP rows and 17 other Intel rows whose summary-table lines my parser could not read are unchecked.
  - The chapter's 87 percent no-fix share and the Intel 1530 count inherit the unchecked status rows; they are quoted but not plotted.
  - The arithmetic count of 4 rests on one model's flag. Two of the four rows (CLX66, SKX103) share a title, and SKX49 is a latency, not an incorrect result, so the rarity claim is a lower-confidence description.
  - The class-order spans cover title matches only; description-matched rows were held fixed, as the prose says. A reorder of full bodies could exceed 25 percent for the memory-system sum; I did not test it.
  - Bootstrap intervals use my own seed and agree to the rounding the prose uses, not to every digit.
  - Launch-year range, the 18-errata-by-year summary, the mask-cost footnote and the citations are outside this figure audit. No book build was run.
  - Earlier auditor conclusions were not carried forward as evidence. I rechecked and reached my own result on the exclusion rationale, title-only scope, merge claims, memory-system sum, class-order spans, and the declared-input question (the earlier F1 no longer applies because excluded_rows.csv is now declared). The earlier note on the misleading RaptorLake.pdf folder placement holds and is noted above.
verdict: PASS
