limits: >-
  Accelerator values are vendor ratings (TDP, board power, TGP mixed), not measured workload power. Rupp's files carry no chip
  names, so exclusion identities are inferred from values. Retained copies pin the bytes served on 2026-11-06, which do not prove
  they are the bytes the book's authors read; the Groq and Gaudi 3 copies are from a Wayback snapshot and a reseller mirror. The H100
  whitepaper v1.03, P100 datasheet and Blackwell Architecture Technical Brief named in the CSV were not retained or read. The
  AI design milestones were checked only for date and the quoted claim wording, not for the underlying results. The CPU series
  ends in 2021 and cannot show a later power ceiling. The gate does not cover the prose around the figure. This auditor shares
  a model family with the producer.
verdict: PASS
findings: >-
  No defect changes a plotted value or a stated number. (1) 02-pressures.qmd:91 cites NVIDIA2022H100Whitepaper and :98 cites
  NVIDIA2016P100Datasheet, neither of which provenance.yml lists or retains; provenance lists the newsroom page and the Pascal
  whitepaper instead. (2) provenance.yml pins for the P100 whitepaper, Jouppi 2021 and Jouppi 2023 do not equal the retained
  bytes. (3) The 2024 power point uses 1000 W; NVIDIA's Blackwell Ultra table gives 1,200 W for the Blackwell column and the CSV
  row does not state the choice. (4) chapter1-micro-trend.csv notes say buckets "1971-2022" while the last record is 2021.8 and
  the prose says 1971-2021. Rechecked and confirmed from the old record: derivation exactness, PNG byte identity, 25/22/18/16
