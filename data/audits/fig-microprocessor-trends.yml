attempts:
- attack: >-
    Running-maximum artifact. The frontier only rises by construction. Compared with the all-row values: each step is a real
    published part (K20X, P100, V100, A100, MI250X, H100, MI300X, B200, Rubin for transistors; K20X, P100, TPU v3, MI250X, H100,
    MI300X, B200, B300 for power), and the CPU maxima also rise without a running maximum. The caption calls these running maxima and
    ratings.
  outcome: survived
- attack: >-
    Flattering exclusion of GPU and Xeon Phi records. Recomputed the four excluded records' effect: they are the bucket maxima in
    their buckets, so the exclusion lowers the CPU curves (for example threads 272 in 2016 and 240 in 2013 are left out). The
    exclusion therefore does not inflate the CPU line against the accelerators, and the prose names the exclusion and its effect on
    thread counts. The kept 57 B point is an Apple M1 Max SoC including a 32-core GPU, which the prose discloses.
  outcome: survived
- attack: >-
    Mixed power metric. The power frontier mixes TDP, board power, maximum power and TGP, and the endpoint 1,400 W is a TGP while
    P100 300 W is a TDP. Rows labeled TDP alone rise from 300 to 450 to 560 to 700 to 1000 W, so the rising trend does not depend on
    the TGP point. The caption states the mix and no sentence compares CPU and accelerator power.
  outcome: survived
- attack: >-
    Source conflict on the 2024 power point. The Blackwell Ultra blog table gives the Blackwell column up to 1,200 W and the
    provenance gap notes Gaudi 3 at 1,200 W liquid in a Hot Chips deck, against the plotted 1000 W (HGX B200 PCF summary, a cited
    retained source). Choosing 1,200 W would move the 2024 point and leave 2012-2023 and the 2025 endpoint unchanged. The plotted
    value is a documented rating, not an error; the choice is not stated in the CSV row.
  outcome: survived
- attack: >-
    Caption and prose stronger than data. Checked the 3 to 5 GHz stall (post-2005 bucket maxima 3.2 to 4.66 GHz), thread counts
    (96 at 2016.67, 128 at 2019.8, 272 Xeon Phi in the raw 2016.5 record), 336 B, 4 T and 1,400 W endpoints, the H&P rates, "all
    but two accelerators" (22 valued rows minus uncited MI100 and Gaudi 1 equals 20 cited), the hatched band labeled Hypothesis
    in figure and alt text, and the milestone claims against the retained pages. The caption's "emerging AI-native design
    frontier" is firmer than the figure label but is qualified in the same sentence as not a measured trend.
  outcome: survived
- attack: >-
    Retained-source identity and citation-to-receipt match. Hashed every private copy against provenance. Three recorded pins
    (P100 whitepaper, Jouppi 2021, Jouppi 2023) differ from the retained bytes; values are present in the retained bytes. The
    prose cites NVIDIA2022H100Whitepaper (02-pressures.qmd:91) and NVIDIA2016P100Datasheet (02-pressures.qmd:98), neither of
    which has a provenance source or retained copy; the values they attest (H100 80 B and 700 W, P100 300 W) are confirmed in
    other retained NVIDIA documents. Plotted values are unaffected.
  outcome: survived
- attack: >-
    Unreadable rows (the earlier audit's FAIL reason). Reread Groq 26.8 B, Gaudi 1 300 W and Gaudi 3 900 W in the now retained
    Abts, Medina and Gaudi 3 white paper copies, each matches its CSV row. Two of these copies are non-primary hosts (Wayback
    copy of the Groq PDF, a reseller mirror of the Intel white paper, March 2025 revision), recorded in provenance.
  outcome: survived
