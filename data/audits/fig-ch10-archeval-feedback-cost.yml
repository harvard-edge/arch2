attempts:
- attack: Transcription slip or agent-column swap, since Table 27 orders agents differently from the figure and Table 10 differs from Table 23.
  outcome: survived
  detail: All 72 settings cells and 80 per-challenge cells match the source with agents mapped by header, 0 differences.
- attack: Win-count definition. The source's printed win rates only reproduce if a printed 1.00 counts as a win. Under a strict above-1.0 reading GPT-5.5 has 12, Flash 5, Gemma 7, Flash-Lite 5 of 20.
  outcome: survived
  detail: The three under-half agents stay under half, GPT stays above half at 12 of 20, and the chapter text (line 290) already discloses the tie reading and the one-win drops for GPT and Flash-Lite.
- attack: The 72-versus-56 valid-count conflict. If the 56 artifacts of Secs. 5 and 6 are the valid set, printed wins could fall. Table 19 L3 constraint-following rates (90, 63, 85, 47) have one integer decomposition I could find (GPT 18/20, Flash 17/20, Gemma 12/19, Flash-Lite 9/19) summing to 56, which uses denominators the source does not print.
  outcome: survived
  detail: Under that decomposition GPT-5.5 loses at most 2 wins (at least 11 of 20, still above half) and the three below-half agents cannot rise. The attack depends on my inferred denominators and cannot be resolved without the private per-run records. See the compound-case finding.
- attack: Metric flatters through exclusion of invalid runs. Recomputing each agent's geomean with its hf cells set to that agent's lowest printed value, and leaving out the ASTRA-sim family.
  outcome: survived
  detail: I recomputed the ex-ASTRA direction myself. Flash-Lite stays below 1 at 0.887, Flash and Gemma rise to 1.28 and 1.27 as the prose states, and wins stay under half of 15. I did not redo the hf-at-minimum variant, so the exclusion attack was tested only through the ex-ASTRA subset and the win counts, which do not depend on the invalid runs.
- attack: Selective sensitivity. The prose gives ex-ASTRA means for two agents; check the omitted ones and the median sentence.
  outcome: survived
  detail: Flash-Lite ex-ASTRA is 0.887, below baseline, so the omission does not undercut the sentence; Gemma's printed median 0.99 and its four ASTRA-sim lows are as stated.
- attack: Caption or prose stronger than the source on settings (lines 288 and 292), including the retries claim and the claim that no conventional arm exists.
  outcome: survived
  detail: Appendix A caps give L2 above 1 on 12 of 20 challenges and L3 equal to 1 on all 20; the source states that failed build, validation, and timeout attempts can be retried up to the cap. The source describes no conventional arm.
- attack: Baseline strength behind line 205 ("most often a hand-written reference design").
  outcome: survived
  detail: CSV baseline column has 18 reference, 1 LRU, 1 Gibbon, matching the Appendix A sentence, and the phrase is accurate. See the finding on baseline strength.
- attack: Silent shortcuts. Read the generator and the chapter cell for hardcoded values, fallbacks, and try/except. Win counts shown on panel (b) are derived from the Table 10 win rate and asserted equal to a count of the plotted cells.
  outcome: survived
  detail: All plotted values are read from the CSVs; the hardcoded items are axis ticks, limits, label offsets, and the jitter. hf rows are filtered and the caption says so. No clipped points (panel (a) axes 0.3 to 3.2 and 0.1 to 7 contain every point; panel (b) 0.01 to 20 contains 0.02 to 5.52). The jitter offsets are a sine of the index, deterministic and unrelated to the data.
