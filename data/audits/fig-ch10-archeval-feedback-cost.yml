limits:
- Evidence class is transcribed. This audit checks the printed tables, not ArchEval's runs. The per-run records are not public, so the 72-versus-56 conflict is unresolved, and the plotted L3 geomeans may include runs Sec. 3.4 would exclude. The Table 19 decomposition is my inference.
- Every value is one single-seed run, and rounded cells limit precision at the low end.
- Table 23 does not define its token count, so cross-agent token comparisons across Codex and MiniSWE are not shown to be comparable. The book's token statements are within-agent.
- No study run log exists for the source because no study was run here. The only log is runs.jsonl for the figure generator, which records a 10.2 s run (within the expected 1 to 180 s) with the dirty flag set.
- Tables were read from the HTML only. I did not compare each table row against the PDF text, and I did not reread the full paper.
- This auditor shares a model family with the earlier producer-side sessions. No second model family was used.
- The book's author is a coauthor of ArchEval. The figure rests on that work alone.
verdict: PASS
findings:
- "Low. Compound case on line 205 (10-evaluation.qmd). The sentence says the fourth agent 'stays above half'. That holds under the printed values (13 of 20), under the strict reading (12), and under the 56-artifact reading (at least 11), but if both alternative readings apply to GPT-5.5 at once (the astrasim_alltoall 1.00 is not a win and its two invalid runs were wins) it has 10 of 20, exactly half. Line 290 states each uncertainty separately and checks only the three agents under half. Author decision."
- "Low, downgraded. Line 205 describes the four agents as appearing effective with the simulator in the loop. Flash-Lite at L1 has geomean 1.00, median 1.02, and win rate 60%, so effective is the weakest word there. The sentence also gives no count for the three agents; Flash-Lite is 6 of 20 and the others 13, 5, 7."
- "Low. The figure alt text says the highest result is up to about 184 times the lowest. The ratio comes from cells printed as 5.52 and 0.03; rounding permits roughly 158 to 221. Recomputed 184.0 from the printed values."
- "Low. Two Flash L3 points (branch_predictor 0.68, compose_replacement_prefetcher 0.92) are byte-identical copies of the starter files (Table 21 of the source, which I reread). Neither caption nor prose says so; without them the Flash geomean would be 0.592 against 0.612 and wins stay 5."
- "Low. The reference designs at line 205 (LRU, a simulator default) sit at the weak end of the baselines the source describes; the source says most baselines are hand-written reference designs and that baselines vary in strength. Accurate but may flatter the contrast. Author decision."
- "Process. The CSV headers say the HTML was parsed, but no parser is retained in the repository; my own parse reproduced every cell. The prose values 56 and 31 are typed literals that match the source and no assertion binds them. No claim ledger entry was checked in this audit."
- "Rechecked from the earlier auditor's record: transcription match, win-rate tie reading, 56-versus-72 bound, ex-ASTRA numbers, attempt caps, baseline types, Table 21 starter copies, and the 184 rounding range. Not rechecked and not carried forward: the leave-one-challenge-out values, the hf-at-minimum geomeans (0.452, 0.479, 0.277), the scan_shortcuts.py hit list, and the claim that data/claims is absent."
