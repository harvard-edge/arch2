source_check: >-
  The figure has no private_copy; the retained raw/ files are the receipts. I refetched with curl from the pinned commit
  0bc17ab3 the full summary_results.json (28 MB) and eight logs chosen by me: both conditions of the minimum-share pair
  (Dell XE9680 H100 SXM), the maximum-share pair (Fujitsu H100 NVL), the pair with the highest interactive p99 share
  (HPE Cray XD670 H100 SXM) and the pair with the lowest standard TTFT p99 (Cisco C885A H200 SXM). All nine sha256
  match both the source_manifest.json entry and the retained local file. I refetched loadgen/mlperf.conf at tag v5.0
  (Server target_latency_percentile = 99; llama2-70b Server ttft/tpot 2000/200 ms) and inference_rules.adoc at
  inference_policies 61ca74a (Llama2-70b row: Conversational 2000/200 ms, Interactive 450/40 ms; Server metric is the
  maximum Poisson throughput supported; early-stopping estimate judges runs), which supports the prose naming and the
  early-stopping sentences. I read all 40 retained logs with my own parser (scratchpad mine.py, written from the README
  selection spec, not reusing reproduce.py or collect.py). The previous record's conclusions were not carried forward;
  I rechecked its selection counts, headline numbers and the 31-of-40 user.conf count myself, and did not reuse its
  finding on the old caption, which no longer exists.
rerun:
  command: >-
    /usr/local/bin/python3 reproduce.py in a scratch copy (scratchpad/audit-fig-ch09-mlperf-latency-contract/w/) of the
    study directory plus data/studies/evidence_bundle.py, book/_python and book/_styles; raw/summary_results.json
    present so the select_pairs and filter_counts recheck applied.
  result: >-
    Exit 0 in 10.9 s. paired_throughput.csv (2bfde635), summary.json (a8047253) and figure.png (f49b94fc) are
    byte-identical to the repository study files, and figure.png equals the book image PNG. I viewed the PNG: panel (b)
    shows the five families with n=3,1,1,12,3 and the nine H200 SXM points overlapping near 59 percent; no text clipping.
    Nothing was written in the repository.
attempts:
- attack: Independent reimplementation of selection and every number the caption and prose quote.
  outcome: survived
  detail: >-
    From summary_results.json my filters give 71 Server Llama 2 70B rows, drops 4 (open), 1 (nodes), 9 (accelerators),
    17 unpaired, 20 pairs, 40 logs; each log's tokens/s agrees with Performance_Result within 0.1. Min 0.419997, median
    0.587922, max 0.655336 (42.0, 58.8, 65.5 percent). Largest relative deviation of the share from the target-rate
    ratio is 0.005077 (0.51 percent; the absolute gap is 0.29 points), correlation 0.99976. Bound share standard 0.7083
    to 0.9694, interactive 0.8831 to 0.9946, none at or over 1. Lowest standard p99 are 500.9 ms and 141.7 ms and no
    standard log meets both interactive bounds. Nine H200 SXM pairs share 114.24/67.2 qps (58.65 to 59.11 percent);
    11 pairs share interactive 67.2; median target ratio 0.588235 equals 67.2/114.24. All 40 logs are VALID with both
    early-stopping lines 'Run successful'; bounds are 2000/200 and 450/40 ms in every pair. One power-measured pair
    (Fujitsu H100 NVL, which also has 99.9 rows not used).
- attack: Excluded failures or selective pairing, so that unfavorable interactive results are hidden.
  outcome: survived
  detail: >-
    The 17 unpaired rows and 14 filter-dropped rows are all in the llama2-70b Server pool I rebuilt from the full
    summary; the filters are stated in the prose and the count arithmetic reconciles (71 - 4 - 1 - 9 - 17 = 40). No
    interactive row exists outside the 20 pairs after the closed, one-node and eight-accelerator filters.
- attack: Caption stronger than data, "the share records the rate each submitter chose to target".
  outcome: survived
  detail: >-
    In all 40 logs completed samples per second is 0.985 to 0.9925 of target_qps, so tracking is a property of any
    passing Server run, and the closest interactive p99 sits at 99.46 percent of its bound with the early-stopping
    estimate unprinted. The revised caption no longer says a bound-forced limit does not exist; it says no p99 reaches
    its bound and that the logs cannot show whether a higher rate would pass. Both statements are true on my numbers
    and agree with the study provenance.yml defects and the prose at 02-pressures.qmd:764. The headline 'follows the
    target rates' is true but near-tautological, see limits.
- attack: Mislabeled evidence class and the user.conf disagreement.
  outcome: survived
  detail: >-
    Class transcribed is correct (values copied from published logs, no run by us). From the 40 retained user.conf
    files I find 9 equal to the log target, 29 lower and 2 higher (ratios 0.92 x27, 0.73, 0.96; 1.02, 1.03), so
    '31 of 40 differ, most of them lower' holds. The plot uses logs, not user.conf, and the prose adopts no explanation.
- attack: Transcription slip, stale figure, and run-log or silent-shortcut audit.
  outcome: survived
  detail: >-
    Throughput matches the published summary for all 40; book PNG equals the rerun PNG. The selection recheck ran
    because raw/summary_results.json exists (the gitignored-file fallback in provenance.yml did not apply). No plotted
    value is typed into reproduce.py; the plotted CSV is written by the script from the logs. Rerun time 10.9 s is
    consistent with the receipt's logged builds.
negative_control: >-
  In a second scratch copy I changed 'Completed tokens per second' in the Dell XE9680 H100 SXM interactive log from
  12979.44 to 15979.44. reproduce.py stopped with an AssertionError on that log's source sha256 (it refuses a
  tampered receipt). My own parser, with its summary cross-check disabled, moved the minimum share from 0.4200 to
  0.4592, the largest target-ratio deviation from 0.0029 to 0.0964 and the correlation from 0.99976 to 0.941, so the
  quoted values depend on the log contents.
limits: >-
  Submitted results only; no GPU run, accuracy or compliance test, or early-stopping estimate was recomputed (detail
  logs not in the retained set). Hardware identity as reported. 32 of the 40 logs were checked by hash against
  retained copies, not refetched. Because Server completed rate is 0.985 to 0.9925 of target in every log, 'follows the
  target' cannot separate a chosen conservative target from a limit-bound one; the caption omits the prose's warning
  that the closest runs may have little margin (interactive p99 up to 99.5 percent of bound), and its '0.51 percent'
  is a relative deviation without saying so. Neither overstates the data. Same model family as the producer.
verdict: PASS
findings:
- >-
  Low, 02-pressures.qmd:768 (caption): states '0.51 percent' without saying it is relative to the target ratio, and
  omits the margin caveat the body prose carries. Not a defect against the data; no change required for PASS.
