limits: >-
  One selected run on one GitHub-hosted runner, so no typical cost, variance, or ranking across designs. The 288 s job boundary
  excludes 1,589 s of queue time, the other 119 jobs of the 3,755 s workflow, and the Nix build whose output this job restored.
  API boundaries have one-second resolution. LibreLane waits on a 0.1 s process-statistics loop, so step values under about 3 s
  are quantized near 0.1 s multiples and process-backed step intervals total 2.953 s more than their subprocess walls (25.759
  against 25.644 s for routing); plotted values are step intervals as recorded. Wall time hides parallelism: routing used 58.37
  s of CPU. No flow was rerun, so correctness of the tools' own timers rests on the log comparison above. The ZIP expires
  upstream on 2027-01-06 and after that subset bytes rest on the CRC-32 index. Not checked: agent transcript archiving, a clean
  book build or rendered caption (forbidden by the brief), and the book-wide claim ledger, since data/claims does not exist in
  this tree. Reading the sources correctly is this auditor's judgment, and this auditor may share blind spots with the producer.
