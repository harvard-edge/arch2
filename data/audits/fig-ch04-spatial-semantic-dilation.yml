limits:
- Run history before logging began cannot be recovered, so its attempt count, failures, and selection cannot be
  established. This is disclosed rather than treated as complete history. The later code_hashes and file_hashes_after
  entries were checked and match current scripts and outputs. Earlier dirty runs do not by themselves identify an
  exact source snapshot.
- The original corpus selection rule is partly undocumented; files and templates are related. Bootstrap intervals
  describe resampling within this convenience corpus and do not establish population-level transfer.
- Only bound same-file signal references are measured, and tree paths use the recoverable subset. Semantic errors,
  parameter overrides, unbound references, and missing tree paths are disclosed. No cause for the unbound references
  was independently established.
- The same parser and extraction implementation are used for source binding in the reruns. Aggregate headline metrics
  and tree-path arithmetic were reimplemented independently, but an independent SystemVerilog compiler was not used.
- Historical author actions, full producer-session transcripts, and threshold-setting times cannot be independently
  reconstructed from these artifacts. The thresholds are explicitly post hoc, not a preregistered prediction.
- The local environment uses Matplotlib 3.11.1 rather than requirements.txt version 3.11.2. Regenerated PNG geometry
  is slightly different and its bytes are not identical; the rendered data, annotations, and legibility agree. The
  measurement summary changes only Python-version metadata. No full book/PDF build comparison was performed, as
  instructed.
- Scratch receipts are under /tmp/ch04-spatial-audit.Ff6nnF. No file other than the specified audit YAML was edited
  in the repository.
