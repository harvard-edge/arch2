- Source values are transcribed from vendor documents, so they are measured by someone else; this audit cannot test vendor accuracy.
- The H100 bandwidth is a vendor row marked not finalized; the 2 x 2619 MHz x 5120 bit derivation supports it but is not a second source.
- The ledger entries in data/claims/02-pressures.yml were spot-read (CLM-02-017, CLM-02-018 pin CSV 6a89d8df with 2200 and 125, 7700 and 900), not audited in full.
- Same model family as the producer; no cross-family audit.
