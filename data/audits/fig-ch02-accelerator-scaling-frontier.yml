attempts:
- attack: Transcription slip in a plotted or alternative cell, including extremes (P100 21.2 and 732, V100 31.4, B200 2200 and 7700, H100 3352) and every value the prose types
  outcome: survived
  detail: All match text I extracted myself. The P100 732 (datasheet) versus 720 (A100 table) difference is disclosed in the CSV header; 720 gives 29.4 FLOP/byte and 4.66x, which print as 29 and 4.7 rather than 4.6.
- attack: Cross-row comparison that flatters the headline (non-Tensor P100 joined to Tensor H100)
  outcome: survived
  detail: Panel (a) normalizes each series to its own V100 value, panel (b) uses separate bars per row, and caption and prose state within-row ratios only. The cell asserts P100 Tensor and B200 non-Tensor are NA. Headline holds within each row through H100 (6.3x vs 4.6x non-Tensor, 7.9x vs 3.7x Tensor) and for Tensor through HGX B200 (17.6x vs 8.6x).
- attack: Flattering or mis-tied B200 configuration
  outcome: survived
  detail: HGX B200 values come from the Table 3 per-GPU rows in the B200 column, not the B300 column (1000 W not 1100 W). The plotted 2200 gives 286, the lowest of three candidates (292 half-sparse, 312 GB200), and caption and prose disclose the 292 to 312 range, so the plot does not flatter a plateau.
- attack: Headline rests on the unfinalized H100 bandwidth row
  outcome: survived
  detail: Source flags 3352 Not Finalized and the prose says so; data rate and bus width give 3352.32. Replacing it with 3000 gives Tensor balance 329.8, still above V100's 139, so the direction of the headline does not depend on it.
- attack: Caption or alt text stronger than the data
  outcome: survived
  detail: Title claims outpacing "through H100", true cumulatively in both rows. Caption states the non-Tensor 29, 50, 40 path and the B200 range; alt text gives 17.6, 8.6, 3.3, 139, 295, 286 and notes non-Tensor stops at H100, all reproduced. Prose says the plateau claim is not supported ("They do not show that it stopped").
- attack: Rounding of the upper range endpoint
  outcome: survived
  detail: GB200 balance is exactly 312.5; the caption and prose print 312 because Python rounds half to even, where half-up would print 313. Recorded as a trivial finding; the 292 to 312 range is the value the cell prints, and the difference does not change any claim.
- attack: Silent shortcuts in the generator (typed values, fallbacks, hidden exceptions, dropped rows)
  outcome: survived
  detail: Plotted values come from the CSV; only layout constants, tick lists and axis limits are typed. NA cells are skipped explicitly and match real absences in the sources. No try/except. Panel b y-limit 350 clears the tallest bar (295).
