attempts:
- attack: 'Baseline comparability: does the headline still cross the 2007 Far West / Wilson survey break that failed the earlier version?'
  outcome: survived
  detail: >-
    The caption, plot lines, and growth labels now start at 2010, the first Wilson wave. The cell asserts that 2007 is
    a different survey and that every wave from 2010 onward shares one survey. The step from 2007 to 2010 (58% versus
    4%) is shown only in prose, which attributes it to the change of survey. Foster's 2010 Part 4 and the 2010
    prologue confirm the attribution and the North America-only scope.
- attack: 'Favorable start year: is 2010 a choice that flatters verification growth?'
  outcome: survived
  detail: >-
    2010 is the first worldwide wave, so it is the natural base. Auditor code on other bases: 2012-2022 gives 40.5
    versus 37.6, 2014-2022 gives 7.3 versus 15.8, and 2016-2022 gives 1.7 versus 11.4. Starting later shrinks or
    reverses the gap. The prose says so ("opens early and then narrows", 7.3 versus 15.8 after 2014, gap 0.9 to 0.1
    engineers). The caption limits itself to 2010-2022 and says "somewhat faster".
- attack: 'Circular or slipped 2022 endpoint: the headline rests on unlabeled 2022 bars set from the callouts.'
  outcome: survived
  detail: >-
    The callouts alone give 11.70/11.81. The auditor's own pixel read gives 11.69-11.71/11.75-11.77, and its controls
    are accurate to within 0.05 of the printed labels. Over that range the caption numbers round to the same 55/44 and
    3.7/3.1. The caption and prose state that the 2022 values are chart-read and constrained.
- attack: 'Transcription slip in printed labels, or rows dropped by the reader.'
  outcome: survived
  detail: >-
    All seven printed waves (14 numbers) match Fig. 8-2. The isdigit filter drops only the CAGR and context rows, which
    are text. The asserts check that there is one Far West row and that the remaining rows are Wilson.
- attack: 'Statistic mismatch: the 2010 report labels 7.8/4.8 and 8.1/7.6 median, later reports label them mean, and the caption says mean.'
  outcome: survived
  detail: >-
    Confirmed in the 2010 Part 4 Fig. 8 and the 2010 prologue. The same four numbers appear under both labels, so this
    is a source labeling inconsistency, not two statistics. The values are not integers or half-integers, which
    favors means. The prose discloses the inconsistency. The caption follows the current label. This is recorded under
    limits because the source cannot settle it.
- attack: 'Evidence class visible to the reader: is the chart-read 2022 point marked as such in the plot?'
  outcome: survived
  detail: >-
    The hollow verification circle at 2022 (11.8) is drawn under the hollow design square (11.7). Both are drawn at
    zorder 3, and the square is drawn second, so only a green cap of the circle shows (see work/zoom2022.png). The
    caption text says that both 2022 positions are approximate, so the evidence class is still disclosed. The
    occlusion is recorded as a minor finding.
