source_check: >-
  All checks below were done again by this auditor. None of the earlier record's conclusions were carried forward
  without being rechecked. Private copies under ~/Documents/Arch2-Private-Sources/figure-sources/fig-verification-demand-scissors/
  match their recorded sha256 values: Foster2021WilsonPart8 a989179c, Foster2022WilsonVerificationStudy 13f848ef,
  Foster2013WilsonPart5 79371bea, and Foster2022WilsonPrologue a549e6ad. The chart images named in those pages were
  fetched again on 2026-11-06 into the scratch directory: 2020-B08-Fig-02.png (sha256 6540d3a418cb...), 2022-08-02.png
  (925c2428cf26...), and Fig-5-3.gif (21ace456b7b3...). Each matches the hash prefix recorded earlier. On viewing,
  the 2020 Fig. 8-2 prints these design/verification labels: 7.8/4.8 (2007), 8.1/7.6 (2010), 8.5/8.4 (2012), 10.1/11.0
  (2014), 10.5/11.6 (2016), 10.5/11.0 (2018), and 10.3/11.4 (2020). Auditor code checked every CSV row from 2007 to
  2020 against these labels and all of them match. The 2012 Part 5 Fig. 3 prints 7.8/4.8, 8.1/7.6, and 8.5/8.4. The
  2022 slide has no value labels on its 2022 bars and carries callouts of 50% and 146%. Both callout boxes read
  "increase in verification engineers". The auditor wrote a pixel read calibrated on the 0 and 12 gridlines (rows 551
  and 160). It gives 2022 design 11.69-11.71 and verification 11.75-11.77. The controls read 7.80/4.79 for 2007
  against labels 7.8/4.8 and 10.04/10.96 for 2014 against 10.1/11.0. The callouts give design 7.8*1.5 = 11.70 and
  verification 4.8*2.46 = 11.81. The 2022 Part 8 text states CAGRs of 2.7% and 6.2% for 2007-2022 and a ratio near
  1:1 that reaches 5:1 in processors. The 2020 Part 8 text states about 3% and 6.8% for 2007-2020. The 2022 prologue
  states n=980, says Siemens architected the study and commissioned Wilson Research Group, and gives a margin of
  +/-3.7% at 95%. The two sources that earlier records did not open were fetched and opened for this audit. (1) The
  2010 prologue (https://blogs.sw.siemens.com/verificationhorizons/2011/03/30/prologue-the-2010-wilson-research-group-functional-verification-study/,
  sha256 b7b8c876...) says the Far West Research study was commissioned in fall 2007 and covered North America only.
  It says Wilson 2010 is worldwide and "twice as large as the Far West Research study". It also says Foster used the
  median for trend analysis. (2) The 2010 Part 4 (https://blogs.sw.siemens.com/verificationhorizons/2011/04/03/part-4-the-2010-wilson-research-group-functional-verification-study/,
  sha256 e89a3ae9...) says its Figs. 3 and 7 compare "the 2007 Far West Research study" with the 2010 Wilson study for
  peak verification and design engineers. Its Fig. 8 (slide81.png, sha256 5115c0f3...) is titled "Median peak number
  of designers vs. verification engineers" and prints 7.8/4.8 and 8.1/7.6. The 2007 staffing point is therefore
  attributed to Far West by Foster himself, not by inference. The Far West report itself was not opened.
