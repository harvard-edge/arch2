limits:
- The figure is transcribed, so no run log, attempt log, or timing check applies.
- The Far West 2007 report was not opened. The 2007 values rest on Foster's printed labels.
- The sources do not settle whether the 2010 values are means or medians. The 2010 report and later reports label the same numbers differently.
- The survey means carry no per-wave interval. Wilson 2022 states an overall margin of +/-3.7% at 95%, and Wilson 2010 states +/-4.1%. Differences of a few tenths of an engineer are within plausible noise.
- The 2022 endpoints are chart-read. Any statement that depends on 11.7 versus 11.8, such as near parity in 2022, depends on a pixel read.
