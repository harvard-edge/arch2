  note: The same stretch is steadiest in every setting with at least two shifts; a 7-report window moves its start
    one report and gives SD 0.43.
- attack: 'Step attribution as an artifact of the 14-report window or of counting runs rather than percent: repeated
    with windows 5 to 56 and with the group removed from numerator and denominator.'
  outcome: survived
  note: riscv_pmp_full_random_test (600 of about 1,530 nightly runs) carries 86 to 114 percent of the first net
    change and 68 to 81 percent of the second. Without it the first step shrinks from 3.08 to 0.06 points and the
    second from 1.94 to 0.68 at 14 reports.
- attack: Denominator change as a trivial explanation of the first step, since total runs rise and groups enter
    at 2024-07-04 and 2024-07-05.
  outcome: survived
  note: Total runs rise by 53.2 per night on average, but the step follows the fall in nonpassing runs, not the
    larger denominator. The prose does not claim a cause.
- attack: Excluded or failed reports hiding bad nights.
  outcome: survived
  note: No fetch or parse failure; no zero-run group; gaps 34 totaling 123 days as provenance states, drawn as unfilled
