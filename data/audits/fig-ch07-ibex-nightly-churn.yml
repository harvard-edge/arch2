    /Library/Frameworks/Python.framework/Versions/3.14/bin/python3 plot.py
  result: 'nightly.csv, group_night.csv, plateaus.csv, step_attribution.csv byte-identical to the repository; summary.json
    identical apart from its timestamp; figure PNG sha256 ca93868e5a388655... identical to the chapter image and
    study figure.png. Caption and prose values recomputed in separate code: 1,213 reports; steadiest stretch 2024-07-04
    to 2025-07-01, SD 0.402, median 10 failing groups, 37 distinct, 6.59 groups changed between reports (6.55 over
    calendar-adjacent reports only). Alt-text levels 93.26, 98.37, 96.80, 95.42 percent.'
