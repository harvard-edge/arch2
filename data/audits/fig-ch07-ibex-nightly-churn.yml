source_check: 'Listed the public bucket on 2026-11-02 (2,443 keys) and refetched every dated JSON into a scratch
  directory. All 1,214 manifest objects match manifest sha256: 1,213 canonical keys, plus the leading-slash key
  for 2024-07-03 fetched by its %2F URL. One newer report (2026-11-02) postdates the snapshot and is excluded; one
  opentitan-test report (15-01-2024) sits under another prefix and is not part of this series. A separately written
  parser read raw JSON for every night, including the first, last, minimum (2023-05-24, 89.7101), maximum (2024-09-10,
  99.1503) and both sides of each step; pass_pct matches nightly.csv with zero difference. Seven sibling HTML reports
  were fetched; five were parsed and show failing logs with wall-clock timeouts, UVM_FATAL lines, and xmsim *E messages
  on 2024-07-03 and 2024-07-04, and record an RTL commit each.'
