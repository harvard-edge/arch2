limits: >-
  Values are the paper's published results after its automated quality filtering (783 of 1,313 problems kept; the
  paper's Table 7 shows unfiltered pass rates differ by a few points, per category), and the caption does not say
  the benchmark was filtered. No confidence intervals exist, and small gaps are not separable from the table alone.
  The source model outputs were not rerun; the figure shows what the paper reports. Only the arXiv v1 HTML and PDF
  copies were read (the PDF was hash-checked, Table 2 was parsed from the HTML only). arXiv versions were checked
  by one HEAD request for v2, not by the listing API, which returned nothing.
