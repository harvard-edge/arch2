<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" role="img">
  <title>Software shifts have always pulled architecture; foundation models change the loop</title>
  <desc>A four-wave progression. Each shift in software abstractions pulls an architecture response. High-level languages pulled optimizing compilers and ISA design; operating-system abstractions pulled processor features; machine-learning workloads pulled specialized accelerators. Each changed what architects build. Foundation models (Software 3.0) pull Architecture 2.0, which changes how architects build by making the design loop the object.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F5F7A"/>
    </marker>
    <style>
      .font { font-family: sans-serif; }
      .row-label { font-size: 12px; font-weight: 700; fill: #66717A; }
      .label { font-size: 13px; font-weight: 700; fill: #222222; }
      .body { font-size: 10.6px; fill: #444444; }
      .micro { font-size: 10px; fill: #556; font-weight: 700; }
      .note { font-size: 12.5px; font-weight: 700; fill: #1F5F7A; }
      .panel { fill: #F8FAFC; stroke: #9AA8B5; stroke-width: 1.1; }
      .soft { fill: #F8FAFC; stroke: #9AA8B5; stroke-width: 1.3; }
      .artifact { fill: #FFF7EA; stroke: #D88A30; stroke-width: 1.35; }
      .loop { fill: #EAF4F8; stroke: #1F5F7A; stroke-width: 1.8; }
      .arrow { stroke: #333333; stroke-width: 1.7; fill: none; stroke-linecap: square; }
      .pull { stroke: #9AA8B5; stroke-width: 1.7; fill: none; stroke-linecap: square; }
      .pull-teal { stroke: #1F5F7A; stroke-width: 2; fill: none; stroke-linecap: square; }
      .takeaway { fill: #F8FAFC; stroke: #9AA8B5; stroke-width: 1.3; }
    </style>
  </defs>

  <rect width="900" height="356" fill="#FFFFFF"/>
  <g class="font">
    <!-- SOFTWARE BAND -->
    <rect class="panel" x="36" y="30" width="828" height="76" rx="4"/>
    <text class="row-label" x="52" y="50">A SHIFT IN SOFTWARE ABSTRACTION</text>

    <rect class="soft" x="65"  y="58" width="170" height="40" rx="4"/>
    <text class="label" x="150" y="76" text-anchor="middle">High-level languages</text>
    <text class="body"  x="150" y="91" text-anchor="middle">Fortran, C</text>

    <rect class="soft" x="265" y="58" width="170" height="40" rx="4"/>
    <text class="label" x="350" y="76" text-anchor="middle">OS abstractions</text>
    <text class="body"  x="350" y="91" text-anchor="middle">processes, virtual memory</text>

    <rect class="soft" x="465" y="58" width="170" height="40" rx="4"/>
    <text class="label" x="550" y="76" text-anchor="middle">ML workloads</text>
    <text class="body"  x="550" y="91" text-anchor="middle">deep learning</text>

    <rect class="soft" x="665" y="58" width="170" height="40" rx="4"/>
    <text class="label" x="750" y="76" text-anchor="middle">Foundation models</text>
    <text class="body"  x="750" y="91" text-anchor="middle">Software 3.0: prompt a model</text>

    <!-- PULL ARROWS -->
    <line class="pull"      x1="150" y1="106" x2="150" y2="176" marker-end="url(#arrow)"/>
    <line class="pull"      x1="350" y1="106" x2="350" y2="176" marker-end="url(#arrow)"/>
    <line class="pull"      x1="550" y1="106" x2="550" y2="176" marker-end="url(#arrow)"/>
    <line class="pull-teal" x1="750" y1="106" x2="750" y2="176" marker-end="url(#arrow-teal)"/>
    <text class="body" x="470" y="128" text-anchor="middle" fill="#66717A" font-style="italic">each shift pulls an architecture response</text>

    <!-- ARCHITECTURE BAND -->
    <rect class="panel" x="36" y="176" width="828" height="96" rx="4"/>
    <text class="row-label" x="52" y="196">THE ARCHITECTURE RESPONSE</text>

    <rect class="artifact" x="65"  y="206" width="170" height="50" rx="4"/>
    <text class="label" x="150" y="226" text-anchor="middle">RISC instruction sets</text>
    <text class="body"  x="150" y="242" text-anchor="middle">with optimizing compilers</text>

    <rect class="artifact" x="265" y="206" width="170" height="50" rx="4"/>
    <text class="label" x="350" y="226" text-anchor="middle">Processor features</text>
    <text class="body"  x="350" y="242" text-anchor="middle">protection, privilege levels</text>

    <rect class="artifact" x="465" y="206" width="170" height="50" rx="4"/>
    <text class="label" x="550" y="226" text-anchor="middle">Specialized accelerators</text>
    <text class="body"  x="550" y="242" text-anchor="middle">TPUs, NPUs</text>

    <rect class="loop" x="665" y="206" width="170" height="50" rx="4"/>
    <text class="label" x="750" y="226" text-anchor="middle" fill="#1F5F7A">Architecture 2.0</text>
    <text class="body"  x="750" y="242" text-anchor="middle">the design loop itself</text>

    <!-- WHAT vs HOW brackets -->
    <path d="M 65 266 L 65 272 L 635 272 L 635 266" fill="none" stroke="#D88A30" stroke-width="1.1"/>
    <path d="M 665 266 L 665 272 L 835 272 L 835 266" fill="none" stroke="#1F5F7A" stroke-width="1.1"/>
    <text class="micro" x="350" y="290" text-anchor="middle" fill="#8A5A18">changes WHAT architects build</text>
    <text class="micro" x="750" y="290" text-anchor="middle" fill="#1F5F7A">changes HOW architects build</text>

    <!-- TAKEAWAY -->
    <rect class="takeaway" x="120" y="304" width="660" height="26" rx="2"/>
    <text class="note" x="450" y="322" text-anchor="middle">Prior waves changed the artifact; foundation models change the design loop.</text>
  </g>
</svg>
