<svg xmlns="http://www.w3.org/2000/svg" width="10.5in" height="7.56in" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
  <title id="title">Nanochip connects learning to an architecture experiment</title>
  <desc id="desc">Flow diagram of a cumulative laboratory. Attributed data trains a design helper, whose checkpoint proposes changes inside an experiment harness. A compiled workload and candidate RTL undergo functional checks; selected candidates also enter physical tools. Retained observations inform the next action. Only curated development records return to training. Held-out evaluation uses frozen checkpoints and matched budgets, then supports a separate architect decision without returning its results to training.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#3E474B"/></marker>
    <marker id="feedback" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#157A38"/></marker>
    <style>
      text {font-family: Arial, 'Liberation Sans', sans-serif; fill:#20252B}
      .heading {font-size:24px; font-weight:700}
      .body {font-size:20px}
      .label {font-size:19px; fill:#3E474B}
      .edge {fill:none; stroke:#3E474B; stroke-width:2; marker-end:url(#arrow)}
      .learn {fill:none; stroke:#157A38; stroke-width:2; stroke-dasharray:8 5; marker-end:url(#feedback)}
      .box {stroke-width:2; rx:4}
    </style>
  </defs>
  <rect width="1500" height="1080" fill="#FFFFFF"/>
  <path class="learn" d="M60 730 H18 V45 H730 V110"/>
  <text x="360" y="30" class="label" style="fill:#157A38">Curated development records update the model</text>
  <rect x="60" y="110" width="340" height="120" class="box" fill="#E4F1F6" stroke="#1683A6"/>
  <text x="80" y="145" class="heading">Data and workload · Lab 1</text>
  <text x="80" y="177" class="body">Sources, distributions, splits</text>
  <text x="80" y="207" class="body">Numerics, objectives, budgets</text>
  <rect x="560" y="110" width="340" height="120" class="box" fill="#FBF0DE" stroke="#E68A17"/>
  <text x="580" y="145" class="heading">Train and adapt · Lab 4</text>
  <text x="580" y="177" class="body">Small design language model</text>
  <text x="580" y="207" class="body">Parameter updates and lineage</text>
  <rect x="1060" y="110" width="340" height="120" class="box" fill="#F0ECFA" stroke="#6A4FC7"/>
  <text x="1080" y="145" class="heading">Checkpoint · Lab 5</text>
  <text x="1080" y="177" class="body">Weights and input contract</text>
  <text x="1080" y="207" class="body">Reloadable inference</text>
  <path class="edge" d="M400 170 H560"/>
  <path class="edge" d="M900 170 H1060"/>
  <path class="edge" d="M230 230 V400"/>
  <text x="245" y="303" class="label">task and data</text>
  <path class="edge" d="M1230 230 V290 H730 V400"/>
  <text x="850" y="277" class="label">checkpoint inference</text>
  <rect x="40" y="340" width="1420" height="485" fill="none" stroke="#D5DEE3" stroke-width="2" stroke-dasharray="6 4" rx="4"/>
  <text x="310" y="375" class="heading">Experiment harness · Lab 3</text>
  <text x="850" y="375" class="label">Candidate identity, execution limits, raw results</text>
  <rect x="60" y="400" width="340" height="120" class="box" fill="#F0ECFA" stroke="#6A4FC7"/>
  <text x="80" y="435" class="heading">Represent · Labs 2, 5</text>
  <text x="80" y="467" class="body">Packed values and observations</text>
  <text x="80" y="497" class="body">Bounded, attributed retrieval</text>
  <rect x="560" y="400" width="340" height="120" class="box" fill="#FBF0DE" stroke="#E68A17"/>
  <text x="580" y="435" class="heading">Choose · Labs 5, 6</text>
  <text x="580" y="467" class="body">Propose, predict, and search</text>
  <text x="580" y="497" class="body">Learned or conventional methods</text>
  <rect x="1060" y="400" width="340" height="120" class="box" fill="#F0ECFA" stroke="#6A4FC7"/>
  <text x="1080" y="435" class="heading">Materialize · Lab 7</text>
  <text x="1080" y="467" class="body">Workload program and RTL</text>
  <text x="1080" y="497" class="body">Exact candidate artifacts</text>
  <path class="edge" d="M400 460 H560"/>
  <path class="edge" d="M900 460 H1060"/>
  <path class="edge" d="M1230 520 V670"/>
  <text x="1245" y="605" class="label">execute</text>
  <rect x="1060" y="670" width="340" height="120" class="box" fill="#E7F5EC" stroke="#1E9E48"/>
  <text x="1080" y="705" class="heading">Functional tools</text>
  <text x="1080" y="737" class="body">Workload and memory protocol</text>
  <text x="1080" y="767" class="body">Cycles, traffic, numerical checks</text>
  <rect x="560" y="670" width="340" height="120" class="box" fill="#E7F5EC" stroke="#1E9E48"/>
  <text x="580" y="705" class="heading">Physical tools · Lab 8</text>
  <text x="580" y="737" class="body">Layout, timing, DRC, and LVS</text>
  <text x="580" y="767" class="body">GDSII and correspondence</text>
  <rect x="60" y="670" width="340" height="120" class="box" fill="#E7F5EC" stroke="#1E9E48"/>
  <text x="80" y="705" class="heading">Tool records</text>
  <text x="80" y="737" class="body">Checks, measurements, costs</text>
  <text x="80" y="767" class="body">Candidate and split identities</text>
  <path class="edge" d="M1060 695 H980 V570 H450 V695 H400"/>
  <text x="620" y="557" class="label">functional receipts</text>
  <path class="edge" d="M1060 730 H900"/>
  <text x="933" y="762" class="label">selected</text>
  <path class="edge" d="M560 730 H400"/>
  <path class="edge" d="M230 670 V520"/>
  <text x="245" y="605" class="label">tool observations</text>
  <path class="edge" d="M230 790 V900"/>
  <text x="245" y="863" class="label">held-out receipts</text>
  <rect x="60" y="900" width="600" height="120" class="box" fill="#E7F5EC" stroke="#1E9E48"/>
  <text x="80" y="935" class="heading">Evaluate · Lab 9</text>
  <text x="80" y="967" class="body">Held-out results, baselines, and total cost</text>
  <text x="80" y="997" class="body">Frozen checkpoints and matched budgets</text>
  <path class="edge" d="M660 960 H900"/>
  <text x="750" y="945" class="label">review</text>
  <rect x="900" y="900" width="500" height="120" class="box" fill="#FBEDF4" stroke="#D24D96"/>
  <text x="920" y="935" class="heading">Architect decision</text>
  <text x="920" y="967" class="body">Evidence, tradeoffs, and limits</text>
  <text x="920" y="997" class="body">Accept, revise, reject, or defer</text>
</svg>
