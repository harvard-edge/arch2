<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-labelledby="title desc">
  <title id="title">Nanochip as one cumulative laboratory</title>
  <desc id="desc">A workload contract feeds learning and a design harness. Trained models propose actions that materialize software and RTL. Functional and physical tools evaluate the same candidate. Measurements guide the next action, development records support adaptation, and independent evaluation supports an architect's decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3E474B"/></marker>
    <style>
      text { font-family: Arial, 'Liberation Sans', sans-serif; fill: #20252B; }
      .heading { font-size: 21px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .detail { font-size: 17px; }
      .note { font-size: 16px; fill: #3E474B; }
      .frame { fill: #FFFFFF; stroke: #D5DEE3; stroke-width: 1.5; }
      .box { stroke-width: 2; }
      .edge { fill: none; stroke: #3E474B; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="1010" fill="#FFFFFF"/>

  <rect class="frame" x="40" y="165" width="320" height="465"/>
  <rect class="frame" x="430" y="165" width="380" height="610"/>
  <rect class="frame" x="880" y="305" width="340" height="470"/>
  <text class="heading" x="60" y="196">Learn the models</text>
  <text class="heading" x="450" y="196">Operate the design harness</text>
  <text class="heading" x="900" y="338">Implement physically</text>

  <path class="edge" d="M 450 80 H 200 V 165"/>
  <path class="edge" d="M 620 130 V 165"/>
  <path class="edge" d="M 200 310 V 360"/>
  <path class="edge" d="M 200 450 V 500"/>
  <path class="edge" d="M 340 545 H 380 V 265 H 450"/>
  <path class="edge" d="M 620 310 V 360"/>
  <path class="edge" d="M 620 450 V 500"/>
  <path class="edge" d="M 620 590 V 650"/>
  <path class="edge" d="M 790 545 H 850 V 405 H 900"/>
  <path class="edge" d="M 1050 450 V 500"/>
  <path class="edge" d="M 1050 590 V 650"/>
  <path class="edge" d="M 900 695 H 790"/>
  <path class="edge" d="M 450 695 H 405 V 290 H 450"/>
  <path class="edge" d="M 570 740 V 800 H 20 V 265 H 60"/>
  <path class="edge" d="M 620 740 V 870"/>

  <rect class="box" x="450" y="30" width="340" height="100" rx="4" fill="#E4F1F6" stroke="#1683A6"/>
  <text class="label" x="620" y="61" text-anchor="middle">Workload and contract</text>
  <text class="detail" x="620" y="89" text-anchor="middle">Kimi-derived computation</text>
  <text class="note" x="620" y="113" text-anchor="middle">Objectives · constraints · Lab 1</text>

  <rect class="box" x="60" y="220" width="280" height="90" rx="4" fill="#F0ECFA" stroke="#6A4FC7"/>
  <text class="label" x="200" y="250" text-anchor="middle">Data and representations</text>
  <text class="detail" x="200" y="276" text-anchor="middle">Coverage · splits · encodings</text>
  <text class="note" x="200" y="299" text-anchor="middle">Labs 1–2</text>

  <rect class="box" x="60" y="360" width="280" height="90" rx="4" fill="#FBF0DE" stroke="#E68A17"/>
  <text class="label" x="200" y="391" text-anchor="middle">Train and adapt</text>
  <text class="detail" x="200" y="417" text-anchor="middle">Small language model</text>
  <text class="note" x="200" y="440" text-anchor="middle">Labs 4–5</text>

  <rect class="box" x="60" y="500" width="280" height="90" rx="4" fill="#F0ECFA" stroke="#6A4FC7"/>
  <text class="label" x="200" y="531" text-anchor="middle">Versioned checkpoint</text>
  <text class="detail" x="200" y="557" text-anchor="middle">Tokenizer · weights · record</text>
  <text class="note" x="200" y="580" text-anchor="middle">Loaded by the proposer</text>

  <rect class="box" x="450" y="220" width="340" height="90" rx="4" fill="#FBF0DE" stroke="#E68A17"/>
  <text class="label" x="620" y="250" text-anchor="middle">Choose the next action</text>
  <text class="detail" x="620" y="276" text-anchor="middle">Predict · generate · optimize</text>
  <text class="note" x="620" y="299" text-anchor="middle">Models and conventional methods · Labs 5–6</text>

  <rect class="box" x="450" y="360" width="340" height="90" rx="4" fill="#F0ECFA" stroke="#6A4FC7"/>
  <text class="label" x="620" y="391" text-anchor="middle">Materialize the candidate</text>
  <text class="detail" x="620" y="417" text-anchor="middle">Software · numerics · RTL</text>
  <text class="note" x="620" y="440" text-anchor="middle">One identified design · Labs 3, 7</text>

  <rect class="box" x="450" y="500" width="340" height="90" rx="4" fill="#E7F5EC" stroke="#1E9E48"/>
  <text class="label" x="620" y="531" text-anchor="middle">Run checks and simulation</text>
  <text class="detail" x="620" y="557" text-anchor="middle">Correctness · traffic · cycles</text>
  <text class="note" x="620" y="580" text-anchor="middle">Tool adapters and failure handling · Labs 2–3</text>

  <rect class="box" x="900" y="360" width="300" height="90" rx="4" fill="#FBF0DE" stroke="#E68A17"/>
  <text class="label" x="1050" y="391" text-anchor="middle">Synthesize</text>
  <text class="detail" x="1050" y="417" text-anchor="middle">Logic and realized memories</text>
  <text class="note" x="1050" y="440" text-anchor="middle">Selected checked candidates · Lab 8</text>

  <rect class="box" x="900" y="500" width="300" height="90" rx="4" fill="#FBF0DE" stroke="#E68A17"/>
  <text class="label" x="1050" y="531" text-anchor="middle">Place and route</text>
  <text class="detail" x="1050" y="557" text-anchor="middle">Floorplan · clock · wiring</text>
  <text class="note" x="1050" y="580" text-anchor="middle">Complete teaching accelerator</text>

  <rect class="box" x="900" y="650" width="300" height="90" rx="4" fill="#E7F5EC" stroke="#1E9E48"/>
  <text class="label" x="1050" y="681" text-anchor="middle">GDSII and physical checks</text>
  <text class="detail" x="1050" y="707" text-anchor="middle">Geometry · timing · connectivity</text>
  <text class="note" x="1050" y="730" text-anchor="middle">Named platform and check coverage</text>

  <rect class="box" x="450" y="650" width="340" height="90" rx="4" fill="#E7F5EC" stroke="#1E9E48"/>
  <text class="label" x="620" y="681" text-anchor="middle">Interpret and record evidence</text>
  <text class="detail" x="620" y="707" text-anchor="middle">Artifacts · measurements · failures</text>
  <text class="note" x="620" y="730" text-anchor="middle">Feedback guides the next action</text>

  <text class="note" x="70" y="789">Curate development trajectories for later adaptation</text>
  <text class="note" x="638" y="821">Independent evaluation</text>
  <text class="note" x="638" y="844">Untouched cases · matched baselines</text>

  <rect class="box" x="410" y="870" width="420" height="100" rx="4" fill="#FBEDF4" stroke="#D24D96"/>
  <text class="label" x="620" y="902" text-anchor="middle">Architect evaluates and decides</text>
  <text class="detail" x="620" y="930" text-anchor="middle">Accept · revise · reject</text>
  <text class="note" x="620" y="955" text-anchor="middle">Architecture result and total process cost · Lab 9</text>
</svg>
