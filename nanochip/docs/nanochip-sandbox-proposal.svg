<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1475" viewBox="0 0 1320 1475" role="img" aria-labelledby="title desc">
  <title id="title">Nanochip: an AI-native architecture sandbox</title>
  <desc id="desc">Proposed system, not an implementation status report. A student workspace defines one Nanochip workload and experiment contract. Data and representations feed training or fine-tuning and a versioned checkpoint. The checkpoint and optional retrieved context inform prediction, proposals, and search. An experiment harness materializes a candidate and invokes functional and physical tools. Results become observations and guide the next action within a campaign. Only curated development records return to learning between campaigns. Separate held-out evaluation uses the same harness and supports an architect's acceptance, revision, or rejection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3E474B"/></marker>
    <style>
      text { font-family: Arial, 'Liberation Sans', sans-serif; fill: #20252B; }
      .title { font-size: 32px; font-weight: 700; }
      .heading { font-size: 23px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #3E474B; }
      .frame { fill: #FFFFFF; stroke: #D5DEE3; stroke-width: 1.5; }
      .box { stroke-width: 2; }
      .edge { fill: none; stroke: #3E474B; stroke-width: 2; marker-end: url(#arrow); }
      .status-edge { fill: none; stroke: #3E474B; stroke-width: 1.5; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1320" height="1475" fill="#FFFFFF"/>
  <text class="title" x="60" y="45">Nanochip</text>
  <text class="body" x="236" y="44">An AI-native architecture sandbox</text>
  <text class="small" x="1260" y="44" text-anchor="end">PROPOSED SYSTEM</text>

  <rect class="frame" x="60" y="85" width="1200" height="90" rx="4"/>
  <text class="heading" x="660" y="119" text-anchor="middle">Install and open one student workspace</text>
  <text class="body" x="660" y="149" text-anchor="middle">Target: pip install nanochip · notebooks / CLI · inspect data · edit components · compare runs</text>
  <path class="edge" d="M680 175 V210"/>

  <rect class="box" x="420" y="210" width="520" height="100" rx="4" fill="#E4F1F6" stroke="#1683A6"/>
  <text class="heading" x="680" y="242" text-anchor="middle">Workload and experiment contract</text>
  <text class="body" x="680" y="269" text-anchor="middle">Kimi-derived workload · objectives · required checks</text>
  <text class="body" x="680" y="294" text-anchor="middle">Permitted changes · constraints · experiment budget</text>

  <rect class="frame" x="60" y="355" width="330" height="600"/>
  <rect class="frame" x="460" y="355" width="390" height="710"/>
  <rect class="frame" x="920" y="355" width="340" height="710"/>
  <text class="heading" x="80" y="386">Learning components</text>
  <text class="heading" x="480" y="386">Design experiment</text>
  <text class="heading" x="940" y="386">One Nanochip target</text>

  <!-- The contract fixes the learning task and experiment boundaries. -->
  <path class="edge" d="M420 260 H225 V355"/>
  <path class="edge" d="M680 310 V355"/>
  <path class="edge" d="M940 260 H1090 V355"/>

  <!-- Learning and optional context supply the same decision interface. -->
  <path class="edge" d="M225 520 V565"/>
  <path class="edge" d="M225 665 V710"/>
  <path class="edge" d="M370 755 H420 V465 H480"/>
  <path class="edge" d="M370 890 H440 V500 H480"/>

  <!-- One action is executed on one materialized candidate. -->
  <path class="edge" d="M655 555 V610"/>
  <text class="small" x="669" y="587">action</text>
  <path class="edge" d="M830 650 H890 V465 H940"/>
  <path class="status-edge" d="M805 735 V760 H835 V900 H805 V920"/>
  <text class="small" x="669" y="808">execution status</text>
  <text class="small" x="669" y="831">and resource use</text>
  <path class="edge" d="M1090 515 V565"/>
  <path class="edge" d="M1090 665 V715"/>
  <text class="small" x="1104" y="693">selected candidates</text>
  <path class="edge" d="M1090 815 V865"/>

  <!-- Raw functional and physical outputs return through adapters. -->
  <path class="edge" d="M940 615 H910 V975 H830"/>
  <path class="edge" d="M940 920 H900 V1000 H830"/>
  <text class="small" x="940" y="1024">Pinned simulator and physical tools</text>
  <text class="small" x="940" y="1047">Candidate identity retained throughout</text>

  <!-- Feedback changes actions within a campaign, with a frozen checkpoint. -->
  <path class="edge" d="M480 975 H455 V535 H480"/>
  <text class="small" x="480" y="875">Feedback selects the next action</text>
  <text class="small" x="480" y="898">Checkpoint fixed within each campaign</text>

  <!-- Only development records can return to model training. -->
  <path class="edge" d="M560 1030 V1115 H30 V465 H80"/>
  <text class="body" x="70" y="1101">Curate development records for later training or adaptation</text>
  <text class="small" x="70" y="1145">Model parameters change between campaigns.</text>

  <rect class="box" x="80" y="415" width="290" height="105" rx="4" fill="#F0ECFA" stroke="#6A4FC7"/>
  <text class="label" x="225" y="448" text-anchor="middle">Data and representations</text>
  <text class="body" x="225" y="476" text-anchor="middle">Inspect · cover · group · split</text>
  <text class="body" x="225" y="501" text-anchor="middle">States, actions, and tool results</text>

  <rect class="box" x="80" y="565" width="290" height="100" rx="4" fill="#FBF0DE" stroke="#E68A17"/>
  <text class="label" x="225" y="596" text-anchor="middle">Train or fine-tune</text>
  <text class="body" x="225" y="624" text-anchor="middle">Small local model</text>
  <text class="body" x="225" y="649" text-anchor="middle">Actual parameter updates</text>

  <rect class="box" x="80" y="710" width="290" height="90" rx="4" fill="#F0ECFA" stroke="#6A4FC7"/>
  <text class="label" x="225" y="744" text-anchor="middle">Versioned checkpoint</text>
  <text class="body" x="225" y="775" text-anchor="middle">Weights · tokenizer · lineage</text>

  <rect class="box" x="80" y="845" width="290" height="90" rx="4" fill="#F0ECFA" stroke="#6A4FC7"/>
  <text class="label" x="225" y="878" text-anchor="middle">Context / retrieval</text>
  <text class="body" x="225" y="907" text-anchor="middle">Specifications · allowed evidence</text>

  <rect class="box" x="480" y="415" width="350" height="140" rx="4" fill="#FBF0DE" stroke="#E68A17"/>
  <text class="label" x="655" y="447" text-anchor="middle">Decision methods</text>
  <text class="body" x="655" y="476" text-anchor="middle">Predict · propose · search</text>
  <text class="body" x="655" y="503" text-anchor="middle">Local or optional external model</text>
  <text class="body" x="655" y="530" text-anchor="middle">Conventional alternatives</text>

  <rect class="box" x="480" y="610" width="350" height="125" rx="4" fill="#FBF0DE" stroke="#E68A17"/>
  <text class="label" x="655" y="642" text-anchor="middle">Experiment harness</text>
  <text class="body" x="655" y="670" text-anchor="middle">Build candidate · invoke tools</text>
  <text class="body" x="655" y="696" text-anchor="middle">Enforce checks and budgets</text>
  <text class="body" x="655" y="720" text-anchor="middle">Preserve identities and retries</text>

  <rect class="box" x="480" y="920" width="350" height="110" rx="4" fill="#E7F5EC" stroke="#1E9E48"/>
  <text class="label" x="655" y="953" text-anchor="middle">Observations and records</text>
  <text class="body" x="655" y="982" text-anchor="middle">Metrics · failures · artifacts · cost</text>
  <text class="body" x="655" y="1009" text-anchor="middle">Raw logs + qualified observations</text>

  <rect class="box" x="940" y="415" width="300" height="100" rx="4" fill="#F0ECFA" stroke="#6A4FC7"/>
  <text class="label" x="1090" y="447" text-anchor="middle">Nanochip candidate</text>
  <text class="body" x="1090" y="476" text-anchor="middle">Software · schedule · RTL</text>
  <text class="body" x="1090" y="501" text-anchor="middle">One versioned design</text>

  <rect class="box" x="940" y="565" width="300" height="100" rx="4" fill="#E7F5EC" stroke="#1E9E48"/>
  <text class="label" x="1090" y="597" text-anchor="middle">Functional evaluation</text>
  <text class="body" x="1090" y="625" text-anchor="middle">Numerical and protocol checks</text>
  <text class="body" x="1090" y="650" text-anchor="middle">Simulation · cycles · traffic</text>

  <rect class="box" x="940" y="715" width="300" height="100" rx="4" fill="#FBF0DE" stroke="#E68A17"/>
  <text class="label" x="1090" y="747" text-anchor="middle">Physical implementation</text>
  <text class="body" x="1090" y="775" text-anchor="middle">Synthesis · place and route</text>
  <text class="body" x="1090" y="800" text-anchor="middle">Logic + realized memories</text>

  <rect class="box" x="940" y="865" width="300" height="110" rx="4" fill="#E7F5EC" stroke="#1E9E48"/>
  <text class="label" x="1090" y="897" text-anchor="middle">Layout and qualification</text>
  <text class="body" x="1090" y="925" text-anchor="middle">GDSII · timing · DRC / LVS</text>
  <text class="small" x="1090" y="953" text-anchor="middle">Equivalence · electrical · antenna</text>

  <path class="edge" d="M655 1030 V1190"/>
  <text class="small" x="675" y="1128">Campaign evidence</text>
  <rect class="box" x="940" y="1190" width="300" height="100" rx="4" fill="#E4F1F6" stroke="#1683A6"/>
  <text class="label" x="1090" y="1223" text-anchor="middle">Held-out cases</text>
  <text class="body" x="1090" y="1250" text-anchor="middle">Unseen during development</text>
  <text class="body" x="1090" y="1275" text-anchor="middle">Fixed evaluation protocol</text>
  <path class="edge" d="M940 1240 H830"/>
  <rect class="box" x="480" y="1190" width="350" height="110" rx="4" fill="#E7F5EC" stroke="#1E9E48"/>
  <text class="label" x="655" y="1223" text-anchor="middle">Independent evaluation</text>
  <text class="body" x="655" y="1252" text-anchor="middle">Fresh runs through the same harness</text>
  <text class="body" x="655" y="1279" text-anchor="middle">Baseline · transfer · total cost</text>
  <path class="edge" d="M655 1300 V1350"/>
  <rect class="box" x="420" y="1350" width="470" height="100" rx="4" fill="#FBEDF4" stroke="#D24D96"/>
  <text class="heading" x="655" y="1383" text-anchor="middle">Architect evaluates and decides</text>
  <text class="body" x="655" y="1412" text-anchor="middle">Accept · revise · reject · retain baseline</text>
  <text class="small" x="655" y="1436" text-anchor="middle">Architecture outcome and the cost of reaching it</text>
</svg>
