[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanochip"
version = "0.1.0a0"
description = "Local alpha of the Nanochip educational RTL laboratory"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
learning = ["torch>=2.6,<3", "numpy>=1.26,<3"]

[project.scripts]
nanochip = "nanochip.laboratory.__main__:main"

# This directory is itself the nanochip package, rather than a src/ tree.
# Explicit selection prevents plans, rendered documents, outputs and private
# configuration from becoming package contents through namespace discovery.
[tool.setuptools]
package-dir = {nanochip = "."}
packages = [
  "nanochip",
  "nanochip.engine",
  "nanochip.laboratory",
  "nanochip.laboratory.datasets",
  "nanochip.laboratory.course",
  "nanochip.laboratory.course.reference",
  "nanochip.laboratory.course.starters",
  "nanochip.laboratory.exercises",
  "nanochip.laboratory.models",
  "nanochip.laboratory.physical",
  "nanochip.laboratory.teaching_target",
  "nanochip.laboratory.teaching_core",
]
include-package-data = false

[tool.setuptools.package-data]
nanochip = [
  "kpu/LICENSE",
  "kpu/.gitignore",
  "kpu/Makefile",
  "kpu/README*.md",
  "kpu/docs/*.md",
  "kpu/harness/*.py",
  "kpu/harness/*.json",
  "kpu/harness/*.ys",
  "kpu/harness/macros/*.v",
  "kpu/harness/tb/*.cpp",
  "kpu/reference/*.py",
  "kpu/reference/*.json",
  "kpu/rtl/*.v",
  "kpu/rtl/*.f",
  "kpu/rtl/roms/*.hex",
  "kpu/rtl/roms/README.md",
  "kpu/rtl/selfmodel/*.py",
  "kpu/third_party/licenses/*",
  "kpu/weights/README.md",
  "trajectories/variants/*.v",
]
"nanochip.laboratory" = ["assets/*.cpp"]
"nanochip.laboratory.course" = ["README.md"]
"nanochip.laboratory.physical" = ["config.json", "*.tcl"]
"nanochip.laboratory.teaching_target" = ["target.json", "memory_tb.sv"]
"nanochip.laboratory.teaching_core" = ["core.v", "core_tb.cpp"]
