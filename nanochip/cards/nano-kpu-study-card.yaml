        scope: Frozen manifest integrity (35 files), resource budgets, and FP32/FP16/INT4 roofline bounds for nano.
        uncertainty: Deterministic analytical byte accounting and cryptographic SHA-256 verification (zero variance).
        limitations:
          - Roofline lower bounds assume 100% DRAM bus utilization and zero internal compute or control serialization overhead.
        integrity:
          sha256: sha256:1a88948e41f7638a002dadbef55d939b6c85d6867da7ec36b42d9ef482e17dd7
