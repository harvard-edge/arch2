  failed_or_rejected:
    - record_id: reject-turn1-shift-and-audit-defect
      kind: failed_gate
      candidate_id: candidate-turn1-unaligned-rtl
      stage: "Stage 5 Interpret -> Return Arrow to Stage 3 Implement"
      reason: >
        Candidate with 1-bit fixed-point shift mismatch (<< 13 vs << 14 in msh_deq) or missing
        zero-point fold in msh_gemv diverges on row 0 against fxmodel.py; simulation-only
        $fread/$readmemh escapes fail static audit.py.
      gate_ref: gate-bit-exact-selfmodel
      evidence_refs:
        - evidence-implementation-sandwich
        - evidence-evaluation-signoff
    - record_id: reject-turn2-non-elastic-stall-and-demux
      kind: rejected_alternative
      candidate_id: candidate-turn2-parallel-demux-inelastic-fifo
      stage: "Stage 5 Interpret -> Return Arrow to Stage 2 Explore"
      reason: >
        A 16-way parallel variable-index byte demux in msh_deq adds ~96,000 gates of mux
        bloat, while an under-buffered fetch queue without 256-deep credit tracking degrades
        severely when DRAM latency doubles from 24 to 48 cycles. Replaced by byte-serial
        beat emitter (18,331 um^2), 256-deep credit FIFO (1.0457x elasticity), and dual-parity
        qacc SRAM banking.
      gate_ref: gate-chaos-randreset-and-elasticity
      evidence_refs:
        - evidence-evaluation-signoff
    - record_id: reject-turn3-fp16-bandwidth-wall
      kind: invalid_candidate
      candidate_id: candidate-turn3-fp16-uncompressed-stream
      stage: "Stage 5 Interpret -> Return Arrow to Stage 1 Formulate"
      reason: >
        Streaming uncompressed FP16 weights (304,448 B/token) across the 16 B/cycle DRAM port
        requires a minimum floor of 19,028 cycles/token (max 5,255.4 tok/s at 100 MHz with
        zero compute latency), making the 20,000 tok/s target physically impossible without
        co-designing INT4 group-128 fused dequantization (76,109 B/token -> 4,757 cycles/token floor).
      gate_ref: gate-functional-cosine-and-argmax
      evidence_refs:
        - evidence-formulation-roofline
    - record_id: reject-unbuffered-wireload-signoff
      kind: failed_gate
      candidate_id: candidate-unbuffered-abc-netlist
      stage: "Stage 4 Evaluate -> Two-Pass ABC Synthesis Discipline"
      reason: >
        Running ABC static timing without fanout buffering (buffer;upsize;dnsize) under the
        5K_hvratio_1_1 wireload model yields a 266,514.91 ps (266.5 ns) delay on msh_deq alone
        (and 5,084 ns full-chip) due to unbuffered high-fanout control/reset broadcast nets.
      gate_ref: gate-nangate45-timing-closure
      evidence_refs:
        - evidence-evaluation-signoff
  gates:
    - gate_id: gate-frozen-manifest-integrity
      category: legality
      criterion: All 35 frozen files in harness/manifest.json must match their recorded SHA-256 digests without modification.
      result: passed
      authority_id: nano-kpu-frozen-harness
      waiver_rule:
        allowed: false
      evidence_refs:
        - evidence-formulation-roofline
      disposition: continue
    - gate_id: gate-static-rtl-audit-and-lint
      category: legality
      criterion: Zero hard violations in harness/audit.py (no PLI/DPI/$fread/illegal $readmemh/macro redefinition) and Verilator lint errors == 0 with warnings <= 40.
      result: passed
      authority_id: nano-kpu-frozen-harness
      waiver_rule:
        allowed: false
      evidence_refs:
        - evidence-evaluation-signoff
      disposition: continue
    - gate_id: gate-functional-cosine-and-argmax
      category: functionality
      criterion: Every simulated nano run must complete with magic status 0x600D_D00D, read >= 62,250 dense floor bytes, min-row cosine >= 0.98, and pooled argmax agreement >= 0.99.
      result: passed
      authority_id: nano-kpu-frozen-harness
      waiver_rule:
        allowed: false
      evidence_refs:
        - evidence-implementation-sandwich
        - evidence-evaluation-signoff
      disposition: continue
    - gate_id: gate-bit-exact-selfmodel
      category: evidence
      criterion: Emitted int32 logits from msh_chip_top RTL must match rtl/selfmodel/fxmodel.py bit-for-bit (0 ULP across all rows and columns).
      result: passed
      authority_id: nano-kpu-frozen-harness
      waiver_rule:
        allowed: false
      evidence_refs:
        - evidence-implementation-sandwich
      disposition: continue
    - gate_id: gate-chaos-randreset-and-elasticity
      category: reliability
      criterion: Output dump under randomized flip-flop initialization (+verilator+rand+reset+2) must be byte-identical to normal RTL run, and 2x DRAM latency (48 cyc) run must complete cleanly.
      result: passed
      authority_id: nano-kpu-frozen-harness
      waiver_rule:
        allowed: false
      evidence_refs:
        - evidence-evaluation-signoff
      disposition: continue
    - gate_id: gate-nangate45-timing-closure
      category: timing
      criterion: Two-pass Yosys/ABC mapped critical-path delay in Nangate45 typical corner must not exceed target clock period of 10.0 ns (100.0 MHz).
      result: passed
      authority_id: nano-kpu-frozen-harness
      waiver_rule:
        allowed: false
      evidence_refs:
        - evidence-evaluation-signoff
      disposition: continue
      notes: Measured 6.166 ns full-chip (162.2 MHz estimated fmax) and 1.479 ns on msh_deq submodule.
    - gate_id: gate-nangate45-area-and-sram-budget
      category: area
      criterion: Combined Nangate45 standard-cell logic area plus priced macro area (1.0 Mbit/mm^2) must be <= 4.0 mm^2, macro SRAM <= 4.0 MiB, and inferred latch cells == 0.
