          version: "2026.07"
        inputs:
          - artifact_id: replay-env-binding
            uri: replay-environment.json
            integrity:
              sha256: sha256:596e3fe1091dccee4c165109ced6425a2d9cfa2ee99db59da364fea0c28b0361
          - artifact_id: replay-verifier-script
            uri: replay.py
