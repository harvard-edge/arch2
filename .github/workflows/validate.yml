name: Validate site

# Mandatory preflight for integration work. This workflow runs the same
# pre-commit gate developers run locally, then validates community registries and
# renders the public website surfaces that should stay fast.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Pre-commit gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-card.txt
            requirements-cff.txt
            constraints/cff-py311-linux.txt
            constraints/py311-linux.txt

      - name: Install dependencies
        run: |
          bash .github/scripts/bootstrap_pip.sh
          python -m pip install -r requirements.txt -c constraints/py311-linux.txt
          python -m pip check

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run repository-integrity tests
        run: |
          python -m unittest discover -s .github/tests -p 'test_*.py' -v
          python -m pytest -q tests

      - name: Smoke-test minimal card environment
        run: |
          python -m venv "$RUNNER_TEMP/card-venv"
          bash .github/scripts/bootstrap_pip.sh \
            "$RUNNER_TEMP/card-venv/bin/python"
          "$RUNNER_TEMP/card-venv/bin/python" -m pip install \
            -r requirements-card.txt -c constraints/py311-linux.txt
          "$RUNNER_TEMP/card-venv/bin/python" cli/arch2.py validate card \
            examples/design-loop-cards/array-study-v2.yaml

      - name: Validate citation metadata
        run: |
          python -m venv "$RUNNER_TEMP/cff-venv"
          bash .github/scripts/bootstrap_pip.sh \
            "$RUNNER_TEMP/cff-venv/bin/python"
          "$RUNNER_TEMP/cff-venv/bin/python" -m pip install \
            -r requirements-cff.txt -c constraints/cff-py311-linux.txt
          "$RUNNER_TEMP/cff-venv/bin/cffconvert" --validate

      - name: Check repository metadata
        run: |
          python .github/scripts/check_action_pins.py
          python .github/scripts/check_release_consistency.py
          python .github/scripts/check_labels.py

  catalog:
    name: Validate registries
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: preflight
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: constraints/py311-linux.txt

      - name: Install dependencies
        run: |
          bash .github/scripts/bootstrap_pip.sh
          python -m pip install PyYAML jsonschema -c constraints/py311-linux.txt
          python -m pip check

      - name: Validate tool registry
        env:
          PYTHONPATH: .github/scripts
        run: python .github/scripts/validate_catalog.py

      - name: Validate workshop registry
        env:
          PYTHONPATH: .github/scripts
        run: python .github/scripts/validate_workshops.py

      - name: Validate reading list
        env:
          PYTHONPATH: .github/scripts
        run: python .github/scripts/validate_readings.py

      - name: Validate canonical registry contracts
        run: python tools/validate_registries.py

      - name: Rebuild generated registry indexes
        env:
          PYTHONPATH: .github/scripts
        run: |
          python .github/scripts/build_catalog_index.py
          python .github/scripts/build_workshops_index.py
          python .github/scripts/build_readings_index.py
          git diff --exit-code tools/tools.yml www/workshops.yml www/readings.yml

  render:
    name: Render landing + registries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: catalog
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.9.36

      - name: Validate public artifact sources
        run: |
          test -f schemas/design-loop-card.v1.schema.json
          test -f schemas/design-loop-card.v1.1.schema.json
          test -f schemas/design-loop-card.v2.schema.json
          test -f schemas/design-loop-card.md
          test -f design-loop-card/template.yaml
          test -f design-loop-card/template.md
          test -f examples/design-loop-cards/level-0-context.yaml
          test -f examples/design-loop-cards/level-1-auditable.yaml
          test -f examples/design-loop-cards/level-2-replayable.yaml
          test -f examples/design-loop-cards/level-3-independent.yaml
          test -f examples/design-loop-cards/array-study-v2.yaml
          test -f examples/design-loop-cards/redacted-context-v2.yaml
          test -f examples/design-loop-cards/replay-environment.json
          test -f examples/design-loop-cards/replay.py
          test -f examples/design-loop-cards/workloads/illustrative-conv-layer-set-v1.json
          test -f examples/design-loop-cards/evidence/illustrative-array-summary-16x16.json
          test -f examples/design-loop-cards/evidence/illustrative-array-summary-32x8.json
          test -f tools/snapshots/registry-2026-07-14.yml

      - name: Render landing page
        run: quarto render www

      - name: Render tool registry
        run: quarto render tools

      - name: Validate rendered output
        run: |
          test -f www/_site/index.html
          test -f www/_site/about.html
          test -f tools/_site/index.html
          test -f www/_site/workshops.html
          test -f www/_site/readings.html
          test -f www/_site/submit.html
          test -f www/_site/submit-resource.html
          test -f www/_site/submit-workshop.html
          test -f www/_site/start.html
          test ! -e www/_site/discord.html
          test ! -e www/_site/huggingface.html
          python .github/scripts/check_site_accessibility.py \
            www/_site/*.html tools/_site/*.html
          echo "Landing + registries rendered." >> "$GITHUB_STEP_SUMMARY"

  book:
    name: Build full book
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: preflight
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            tex-gyre \
            lmodern \
            librsvg2-bin \
            poppler-utils \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            openjdk-21-jre-headless \
            texlive-pictures \
            texlive-plain-generic \
            texlive-science

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.9.36

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints/py311-linux.txt

      - name: Install Python dependencies
        run: |
          bash .github/scripts/bootstrap_pip.sh
          python -m pip install -r requirements.txt -c constraints/py311-linux.txt
          python -m pip check

      - name: Install EPUBCheck
        run: .github/scripts/install_epubcheck.sh

      - name: Resolve development release identity
        run: python .github/scripts/release_metadata.py --bump skip

      - name: Build HTML, PDF, and EPUB
        # --refresh re-executes every code chunk from scratch so a stale local
        # execution cache can never mask a chunk crash or corrupted figure.
        run: ./arch2 build --all --refresh

      - name: Verify full-book artifacts and release identity
        run: |
          test -f book/_build/index.html
          test -f book/_build/Architecture-2.0.pdf
          test -f book/_build/Architecture-2.0.epub
          python .github/scripts/check_release_consistency.py \
            --expected-version "$ARCH2_VERSION" \
            --rendered-html book/_build/index.html \
            --rendered-pdf book/_build/Architecture-2.0.pdf \
            --rendered-epub book/_build/Architecture-2.0.epub

      - name: Upload render logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch2-validation-render-logs
          path: book/_build/logs
          if-no-files-found: ignore

  labs:
    name: Labs (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10.20"
            constraints: constraints/py310-linux.txt
          - python-version: "3.11.15"
            constraints: constraints/py311-linux.txt
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            labs/pyproject.toml
            labs/${{ matrix.constraints }}

      - name: Install source and test dependencies
        working-directory: labs
        run: |
          bash ../.github/scripts/bootstrap_pip.sh
          python -m pip install -c "${{ matrix.constraints }}" "hatchling==1.31.0"
          python -m pip install --no-build-isolation \
            -c "${{ matrix.constraints }}" \
            ".[dev,notebook]"
          python -m pip check

      - name: Run lab tests and notebook checks
        working-directory: labs
        run: |
          python -m pytest -q
          marimo check --strict \
            examples/scale_proxy_mirage/lab.py \
            notebooks/lab_*.py
          export_dir="$(mktemp -d)"
          for notebook in examples/scale_proxy_mirage/lab.py notebooks/lab_*.py; do
            marimo export html "$notebook" \
              --no-include-code \
              --output "$export_dir/$(basename "${notebook%.py}").html"
          done

      - name: Build distribution artifacts
        working-directory: labs
        run: python -m build --no-isolation

      - name: Smoke-test installed wheel outside the checkout
        run: |
          wheel="$(find "$PWD/labs/dist" -name '*.whl' -print -quit)"
          test -n "$wheel"
          constraints="$PWD/labs/${{ matrix.constraints }}"
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          bash .github/scripts/bootstrap_pip.sh "$smoke_dir/venv/bin/python"
          "$smoke_dir/venv/bin/python" -m pip install -c "$constraints" "$wheel"
          "$smoke_dir/venv/bin/python" -m pip check
          cd "$smoke_dir"
          decision_file="$("$smoke_dir/venv/bin/python" - <<'PY'
          from arch2_labs.scale_env import example_dir
          print(example_dir("scale_proxy_mirage") / "human_decision.example.yaml")
          PY
          )"
          test -f "$decision_file"
          "$smoke_dir/venv/bin/python" -m arch2_labs.scale_env \
            --example scale_proxy_mirage \
            --out "$smoke_dir/receipt" \
            --decision-file "$decision_file"
          "$smoke_dir/venv/bin/python" -m arch2_labs.validators \
            "$smoke_dir/receipt"
