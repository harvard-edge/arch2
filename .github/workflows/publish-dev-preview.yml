name: 🚧 Publish dev preview

# Builds the full site from the dev branch and publishes it to a SEPARATE
# GitHub Pages project site (e.g. https://<owner>.github.io/<repo>/), so the
# releasable state of dev can be previewed without touching the production
# custom-domain site (arch2.mlsysbook.ai) served from the main branch.
#
# Everything below is driven by repository variables + one secret, so nothing
# about the preview target is hardcoded:
#
#   Variables (Settings -> Secrets and variables -> Actions -> Variables)
#     ARCH2_DEV_PAGES_REPO    required  owner/repo of the preview site repository
#                                       e.g. harvard-edge/arch2-dev
#     ARCH2_DEV_BASE_PATH     optional  URL base path for the subpath deploy,
#                                       e.g. /arch2-dev. Defaults to /<repo-name>
#                                       derived from ARCH2_DEV_PAGES_REPO.
#     ARCH2_DEV_PAGES_BRANCH  optional  branch to publish to (default: gh-pages)
#
#   Secret (Settings -> Secrets and variables -> Actions -> Secrets)
#     ARCH2_DEV_PAGES_TOKEN   required  fine-grained PAT (or classic token) with
#                                       Contents: write on the preview repository
#
# Until the required variable and secret are set, this workflow is a no-op that
# prints setup instructions to the run summary instead of failing.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-dev-preview
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # Stable site the preview banner links back to; overridable, never hardcoded.
  ARCH2_SITE_DOMAIN: ${{ vars.ARCH2_SITE_DOMAIN || 'arch2.mlsysbook.ai' }}

jobs:
  configure:
    name: Resolve preview configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      repo: ${{ steps.resolve.outputs.repo }}
      owner: ${{ steps.resolve.outputs.owner }}
      base_path: ${{ steps.resolve.outputs.base_path }}
      branch: ${{ steps.resolve.outputs.branch }}
      preview_url: ${{ steps.resolve.outputs.preview_url }}

    steps:
      - name: Resolve preview configuration
        id: resolve
        env:
          PAGES_REPO: ${{ vars.ARCH2_DEV_PAGES_REPO }}
          RAW_BASE_PATH: ${{ vars.ARCH2_DEV_BASE_PATH }}
          RAW_BRANCH: ${{ vars.ARCH2_DEV_PAGES_BRANCH }}
          PAGES_TOKEN: ${{ secrets.ARCH2_DEV_PAGES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          proceed=true
          missing=()
          if [ -z "${PAGES_REPO}" ]; then
            missing+=("repository variable ARCH2_DEV_PAGES_REPO (owner/repo of the preview site)")
            proceed=false
          elif [[ "${PAGES_REPO}" != */* ]]; then
            echo "ARCH2_DEV_PAGES_REPO must be in owner/repo form, got: ${PAGES_REPO}" >&2
            exit 1
          fi
          if [ -z "${PAGES_TOKEN}" ]; then
            missing+=("repository secret ARCH2_DEV_PAGES_TOKEN (Contents: write on the preview repo)")
            proceed=false
          fi

          branch="${RAW_BRANCH:-gh-pages}"

          # Base path defaults to /<repo-name>; normalize to a leading slash and
          # no trailing slash so the subpath rebase and preview URL are exact.
          base="${RAW_BASE_PATH}"
          if [ -z "${base}" ] && [ -n "${PAGES_REPO}" ]; then
            base="/${PAGES_REPO##*/}"
          fi
          base="${base%/}"
          if [ -n "${base}" ] && [ "${base:0:1}" != "/" ]; then
            base="/${base}"
          fi

          owner="${PAGES_REPO%%/*}"
          preview_url=""
          if [ "${proceed}" = "true" ]; then
            preview_url="https://${owner}.github.io${base}/"
          fi

          {
            echo "proceed=${proceed}"
            echo "repo=${PAGES_REPO}"
            echo "owner=${owner}"
            echo "base_path=${base}"
            echo "branch=${branch}"
            echo "preview_url=${preview_url}"
          } >> "${GITHUB_OUTPUT}"

          if [ "${proceed}" = "true" ]; then
            {
              echo "### Dev preview configured"
              echo ""
              echo "- Preview URL: ${preview_url}"
              echo "- Preview repo: ${PAGES_REPO} (branch \`${branch}\`)"
              echo "- Base path: \`${base}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "### Dev preview not configured yet"
              echo ""
              echo "This build was skipped. To enable the preview, set:"
              echo ""
              for item in "${missing[@]}"; do
                echo "- ${item}"
              done
              echo ""
              echo "Then create the preview repository, enable GitHub Pages on it"
              echo "(deploy from branch \`${branch}\`, folder \`/ (root)\`), and re-run."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "Dev preview is not configured; skipping build. See the run summary."
          fi

  build_and_deploy:
    name: Build and publish preview
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    needs: configure
    if: needs.configure.outputs.proceed == 'true'
    permissions:
      contents: read
    env:
      ARCH2_DEV_PAGES_REPO: ${{ needs.configure.outputs.repo }}
      ARCH2_DEV_PAGES_OWNER: ${{ needs.configure.outputs.owner }}
      ARCH2_DEV_BASE_PATH: ${{ needs.configure.outputs.base_path }}
      ARCH2_DEV_PAGES_BRANCH: ${{ needs.configure.outputs.branch }}
      ARCH2_DEV_PREVIEW_URL: ${{ needs.configure.outputs.preview_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints/py311-linux.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            tex-gyre \
            lmodern \
            librsvg2-bin \
            poppler-utils \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            openjdk-21-jre-headless \
            texlive-pictures \
            texlive-plain-generic \
            texlive-science

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.9.36

      - name: Install Python dependencies
        run: |
          bash .github/scripts/bootstrap_pip.sh
          python -m pip install -r requirements.txt -c constraints/py311-linux.txt
          python -m pip check

      - name: Install EPUBCheck
        run: .github/scripts/install_epubcheck.sh

      - name: Resolve release metadata
        run: python .github/scripts/release_metadata.py --bump skip

      - name: Build the full site
        run: |
          chmod +x .github/scripts/build_site.sh
          .github/scripts/build_site.sh

      - name: Inject development-preview banner
        env:
          ARCH2_PREVIEW_REF: ${{ github.ref_name }}
          ARCH2_PREVIEW_SHORT_SHA: ${{ github.sha }}
          ARCH2_PREVIEW_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          ARCH2_PREVIEW_STABLE_URL: https://${{ env.ARCH2_SITE_DOMAIN }}/
        run: |
          set -euo pipefail
          ARCH2_PREVIEW_SHORT_SHA="$(git rev-parse --short=8 "${ARCH2_PREVIEW_SHORT_SHA}")"
          ARCH2_PREVIEW_BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          export ARCH2_PREVIEW_SHORT_SHA ARCH2_PREVIEW_BUILD_TIME
          python3 .github/scripts/inject_preview_banner.py _site

      - name: Rebase site to preview base path
        run: |
          python .github/scripts/rebase_site_paths.py _site "${ARCH2_DEV_BASE_PATH}"

      - name: Verify subpath links
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          dest="${stage}${ARCH2_DEV_BASE_PATH}"
          mkdir -p "${dest}"
          cp -a _site/. "${dest}/"
          python3 .github/scripts/check_site_links.py "${stage}"

      - name: Deploy to preview repository
        env:
          PAGES_TOKEN: ${{ secrets.ARCH2_DEV_PAGES_TOKEN }}
        run: |
          set -euo pipefail

          test -f _site/index.html
          test -f _site/book/index.html

          # GitHub project pages must not serve Jekyll and must not claim the
          # production custom domain.
          touch _site/.nojekyll
          rm -f _site/CNAME

          work="$(mktemp -d)"
          cp -a _site/. "${work}/"
          cd "${work}"

          git init -q
          git checkout -q -b "${ARCH2_DEV_PAGES_BRANCH}"
          git config user.name "arch2-preview-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q \
            -m "Preview build from ${GITHUB_REF_NAME}@${GITHUB_SHA}" \
            -m "Source: ${GITHUB_REPOSITORY} (${GITHUB_SHA})"

          # Single orphan commit, force-pushed: the preview repo stays small and
          # always reflects the latest dev build. Token is only ever in the
          # remote URL (masked by Actions), never committed.
          remote="https://x-access-token:${PAGES_TOKEN}@github.com/${ARCH2_DEV_PAGES_REPO}.git"
          for attempt in 1 2 3 4; do
            if git push -f -q "${remote}" "${ARCH2_DEV_PAGES_BRANCH}"; then
              break
            fi
            if [ "${attempt}" -eq 4 ]; then
              echo "Preview push failed after 4 attempts." >&2
              exit 1
            fi
            sleep "$((2 ** attempt))"
          done

          {
            echo "### Dev preview published"
            echo ""
            echo "- URL: ${ARCH2_DEV_PREVIEW_URL}"
            echo "- Repo: ${ARCH2_DEV_PAGES_REPO} (branch \`${ARCH2_DEV_PAGES_BRANCH}\`)"
            echo "- Source: ${GITHUB_REF_NAME}@${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload render logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch2-dev-preview-logs
          path: book/_build/logs
          if-no-files-found: ignore
