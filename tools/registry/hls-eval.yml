title: HLS-Eval
url: https://github.com/sharc-lab/hls-eval
artifact_type: Tool
categories:
- Benchmarks and Datasets
description: HLS-Eval is a project that provides benchmarking infrastructure and benchmark
  tasks for high-level synthesis (HLS) design.
fit_note: HLS-Eval provides LLM and agent benchmarking infrastructure for high-level
  synthesis design, a popular workflow for designing hardware accelerators for FPGAs
  and ASICs.
artifact_availability: unverified
tags:
- High-Level Synthesis
- LLMs
- Benchmark
- Agents
authors: Stefan Abi-Karam, Callie Hao
institution: Georgia Institute of Technology
submitted_by: Stefan Abi-Karam
inputs: HLS Designs, Benchmark Task Definitions / Implementations, Benchmark Configurations
outputs: Benchmark results, depending on the task, include pass rates and result-quality
  measurements such as latency and resource usage.
evidence: Pass rates from the C++ compiler, HLS testbenches, and HLS compiler; QoR
  results from the HLS compiler, including latency and resource usage.
limitations: Working on scaling evaluation to more complex HLS designs and adding
  a new range of HLS design tasks, including auto-parameterization, design translation,
  HLS-to-RTL decompilation, LLM-based analytical performance prediction, and agentic
  evaluation.
