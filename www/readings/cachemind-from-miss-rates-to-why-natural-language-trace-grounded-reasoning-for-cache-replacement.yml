title: 'CacheMind: From Miss Rates to Why -- Natural-Language, Trace-Grounded Reasoning
  for Cache Replacement'
url: https://arxiv.org/abs/2602.12422
kind: Paper
categories:
- Architecture 2.0
description: CacheMind uses retrieval-augmented generation over CPU cache traces to
  answer natural-language questions about cache behavior and replacement policies,
  linking architectural analysis to trace evidence. The paper introduces CacheMindBench
  for evaluating trace-grounded and policy-specific reasoning; the authors provide
  [public code and benchmark questions](https://github.com/kaushal1803/cachemind).
venue: ASPLOS 2026
when: '2026'
authors: Kaushal Mhapsekar; Azam Ghanbari; Bita Aslrousta; Samira Mirbagher-Ajorpaz
doi: 10.1145/3779212.3790136
