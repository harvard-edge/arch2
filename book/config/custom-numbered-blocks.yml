filter-metadata:
  arch2-ext/custom-numbered-blocks:
    icon-path: "images/icons/callouts"
    # SVG is the icon master. HTML/EPUB consume the SVG; the LaTeX/PDF build
    # consumes the PDF (pdflatex cannot embed SVG). Both are regenerated from
    # the SVG icons. colors = [background, accent];
    # the HTML tint is auto-derived from the accent, so the accent (colors[1])
    # is the meaningful value. Palette: failure keeps true red, war-story uses
    # muted rose, lighthouse uses cool cobalt, and field-note stays neutral gray.
    # The other used roles are spread across a muted hue wheel so adjacent
    # callout purposes do not collide visually.
    icon-format: "pdf"
    icon-format-html: "svg"
    groups:
      crux:
        colors: ["FBF1E8", "B96419"]
        collapse: false
        numbered: false
      learning-objectives:
        colors: ["EBF4EF", "2F7A53"]
        collapse: false
        numbered: false
      lighthouse:
        colors: ["EEF3FC", "3B6FC0"]
        collapse: false
        numbered: false
      failure-mode:
        colors: ["FBECEC", "C83F4C"]
        collapse: false
        numbered: false
      design-principle:
        colors: ["F7F2E3", "A17410"]
        collapse: false
        numbered: false
      war-story:
        colors: ["F8EEF2", "A14F68"]
        collapse: false
        numbered: false
      historical-perspective:
        colors: ["EFF4F8", "2C6B8E"]
        collapse: false
        numbered: false
      part:
        colors: ["F0F4F9", "1E3A8A"]
        collapse: false
        numbered: false
      takeaways:
        colors: ["F6F2FA", "6B3E99"]
        collapse: false
        numbered: false
    classes:
      callout-part:
        label: "Part overview"
        group: part
      callout-crux:
        label: "North-Star question"
        group: crux
      callout-learning-objectives:
        label: "Learning objectives"
        group: learning-objectives
      callout-lighthouse:
        label: "Lighthouse prompt"
        group: lighthouse
      callout-failure-mode:
        label: "Failure mode"
        group: failure-mode
      callout-design-principle:
        label: "Design principle"
        group: design-principle
        prefix: pri
      callout-war-story:
        label: "War story"
        group: war-story
        prefix: war
      callout-historical-perspective:
        label: "Historical perspective"
        group: historical-perspective
        prefix: hist
      callout-takeaways:
        label: "Key Takeaways"
        group: takeaways
