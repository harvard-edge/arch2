<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="100%" height="100%" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .bg { fill: #ffffff; }

      /* Section Headers */
      .card-header { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 6; }
      .head-stage { font-size: 15px; font-weight: 800; fill: #0f172a; letter-spacing: 0.5px; }
      .sub-stage { font-size: 12px; fill: #475569; font-weight: 400; }

      /* 4 Latent Space Cards */
      .card-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 6; }
      .card-purple { fill: #faf5ff; stroke: #7c3aed; stroke-width: 1.5; rx: 6; }
      .card-emerald { fill: #f0fdf4; stroke: #059669; stroke-width: 1.5; rx: 6; }
      .card-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; rx: 6; }

      .card-head-blue { font-size: 13px; font-weight: 800; fill: #1d4ed8; }
      .card-head-purple { font-size: 13px; font-weight: 800; fill: #6d28d9; }
      .card-head-emerald { font-size: 13px; font-weight: 800; fill: #047857; }
      .card-head-amber { font-size: 13px; font-weight: 800; fill: #b45309; }

      /* Typography */
      .text-bold { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .text-main { font-size: 10.5px; fill: #1e293b; }
      .text-sub { font-size: 10px; fill: #475569; }
      .text-failure { font-size: 10.5px; font-weight: 700; fill: #dc2626; }

      /* Barrier Section */
      .card-barrier { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; rx: 8; }
      .head-barrier { font-size: 13.5px; font-weight: 800; fill: #9f1239; letter-spacing: 0.5px; }
      .sub-barrier { font-size: 11.5px; font-weight: 600; fill: #be123c; }
      .engine-box { fill: #ffffff; stroke: #f43f5e; stroke-width: 1.2; rx: 4; }

      /* Signoff Section */
      .card-signoff { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .head-signoff { font-size: 14px; font-weight: 800; fill: #15803d; letter-spacing: 0.5px; }
      .badge-box { fill: #ffffff; stroke: #16a34a; stroke-width: 1.2; rx: 5; }
      .text-badge { font-size: 10.5px; font-weight: 700; fill: #15803d; }

      /* Commitment Authority Box (Harvard Crimson / ETH Zurich styling) */
      .hub-author { fill: #fcfcfd; stroke: #a51c30; stroke-width: 2; rx: 8; }
      .head-commit { font-size: 13.5px; font-weight: 800; fill: #a51c30; }
      .sub-commit { font-size: 11px; font-weight: 600; fill: #1f407a; }

      /* Connectors */
      .path-red { stroke: #e11d48; stroke-width: 1.8; fill: none; marker-end: url(#arrow-red); }
      .path-green { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
    </style>

    <marker id="arrow-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#e11d48" />
    </marker>
    <marker id="arrow-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- HEADER BANNER -->
  <g transform="translate(15, 15)">
    <rect width="1020" height="65" class="card-header" />
    <text x="15" y="24" class="head-stage">THE LATENT ARCHITECTURAL SPACE MAP &amp; PHYSICAL GROUNDING FUNNEL</text>
    <text x="15" y="44" class="sub-stage">Decoupling Autonomous Candidate Generation in Latent Space from Independent Physical Signoff Engines</text>
  </g>

  <!-- 4 LATENT SPACE PARADIGMS -->
  <g transform="translate(15, 95)">
    <!-- Column 1: Token & Code Embeddings -->
    <rect x="0" y="0" width="240" height="210" class="card-blue" />
    <rect x="0" y="0" width="240" height="30" fill="#dbeafe" rx="6" />
    <rect x="0" y="24" width="240" height="6" fill="#dbeafe" />
    <text x="12" y="20" class="card-head-blue">1. Token &amp; Code Embeddings</text>

    <text x="12" y="48" class="text-bold">Represented Artifacts:</text>
    <text x="12" y="64" class="text-main">• Verilog / SystemC Source</text>
    <text x="12" y="78" class="text-main">• Triton / MLIR Code Tokens</text>

    <text x="12" y="104" class="text-bold">Search &amp; Inference:</text>
    <text x="12" y="120" class="text-main">• Autoregressive Sampling</text>
    <text x="12" y="134" class="text-main">• Temperature / Beam Search</text>

    <line x1="12" y1="148" x2="228" y2="148" stroke="#93c5fd" stroke-width="1" />

    <text x="12" y="166" class="text-bold" fill="#dc2626">Primary Latent Failure:</text>
    <text x="12" y="184" class="text-failure">Vacuous / Hallucinated Syntax</text>

    <!-- Column 2: Graph & Topological Embeddings -->
    <rect x="260" y="0" width="240" height="210" class="card-purple" />
    <rect x="260" y="0" width="240" height="30" fill="#f3e8ff" rx="6" />
    <rect x="260" y="24" width="240" height="6" fill="#f3e8ff" />
    <text x="272" y="20" class="card-head-purple">2. Graph &amp; Topo Embeddings</text>

    <text x="272" y="48" class="text-bold">Represented Artifacts:</text>
    <text x="272" y="64" class="text-main">• CDFG &amp; AIG Netlists</text>
    <text x="272" y="78" class="text-main">• Spatial Floorplan Graphs</text>

    <text x="272" y="104" class="text-bold">Search &amp; Inference:</text>
    <text x="272" y="120" class="text-main">• GNN Node/Edge Vectors</text>
    <text x="272" y="134" class="text-main">• Spatial Macro Clustering</text>

    <line x1="272" y1="148" x2="488" y2="148" stroke="#ddd6fe" stroke-width="1" />

    <text x="272" y="166" class="text-bold" fill="#dc2626">Primary Latent Failure:</text>
    <text x="272" y="184" class="text-failure">Non-Routable Congestion</text>

    <!-- Column 3: Continuous Surrogates -->
    <rect x="520" y="0" width="240" height="210" class="card-emerald" />
    <rect x="520" y="0" width="240" height="30" fill="#d1fae5" rx="6" />
    <rect x="520" y="24" width="240" height="6" fill="#d1fae5" />
    <text x="532" y="20" class="card-head-emerald">3. Continuous Surrogates</text>

    <text x="532" y="48" class="text-bold">Represented Artifacts:</text>
    <text x="532" y="64" class="text-main">• Discrete Microarch Tuples</text>
    <text x="532" y="78" class="text-main">• Cache / Pipeline Parameters</text>

    <text x="532" y="104" class="text-bold">Search &amp; Inference:</text>
    <text x="532" y="120" class="text-main">• Bayesian Optimization (GP)</text>
    <text x="532" y="134" class="text-main">• Acquisition (EI / UCB)</text>

    <line x1="532" y1="148" x2="748" y2="148" stroke="#a7f3d0" stroke-width="1" />

    <text x="532" y="166" class="text-bold" fill="#dc2626">Primary Latent Failure:</text>
    <text x="532" y="184" class="text-failure">Optimizer's Curse (OOD)</text>

    <!-- Column 4: Policy & MDP States -->
    <rect x="780" y="0" width="240" height="210" class="card-amber" />
    <rect x="780" y="0" width="240" height="30" fill="#fef3c7" rx="6" />
    <rect x="780" y="24" width="240" height="6" fill="#fef3c7" />
    <text x="792" y="20" class="card-head-amber">4. Policy &amp; MDP States</text>

    <text x="792" y="48" class="text-bold">Represented Artifacts:</text>
    <text x="792" y="64" class="text-main">• Placement Action Steps</text>
    <text x="792" y="78" class="text-main">• Tile &amp; Loop Schedules</text>

    <text x="792" y="104" class="text-bold">Search &amp; Inference:</text>
    <text x="792" y="120" class="text-main">• Deep Q-Networks (DQN)</text>
    <text x="792" y="134" class="text-main">• MCTS &amp; PPO Updates</text>

    <line x1="792" y1="148" x2="1008" y2="148" stroke="#fde68a" stroke-width="1" />

    <text x="792" y="166" class="text-bold" fill="#dc2626">Primary Latent Failure:</text>
    <text x="792" y="184" class="text-failure">Reward Hacking &amp; Proxy Exploits</text>
  </g>

  <!-- Connectors down to Barrier -->
  <path d="M 135 305 V 325" class="path-red" />
  <path d="M 395 305 V 325" class="path-red" />
  <path d="M 655 305 V 325" class="path-red" />
  <path d="M 915 305 V 325" class="path-red" />

  <!-- PHYSICAL DECOUPLING BARRIER SECTION -->
  <g transform="translate(15, 330)">
    <rect width="1020" height="95" class="card-barrier" />
    <text x="510" y="24" text-anchor="middle" class="head-barrier">INDEPENDENT EVALUATOR-OWNED PHYSICAL SIGNOFF BARRIER</text>
    <text x="510" y="42" text-anchor="middle" class="sub-barrier">No Latent Vector Prediction Authorized to Commit to Silicon Without Independent Tool Execution</text>

    <!-- 4 Tool Sub-boxes -->
    <g transform="translate(20, 52)">
      <rect width="225" height="32" class="engine-box" />
      <text x="112" y="20" text-anchor="middle" class="text-bold" fill="#be123c">Verilator / Yosys Linting</text>
    </g>
    <g transform="translate(265, 52)">
      <rect width="225" height="32" class="engine-box" />
      <text x="112" y="20" text-anchor="middle" class="text-bold" fill="#be123c">OpenROAD / OpenSTA P&amp;R</text>
    </g>
    <g transform="translate(510, 52)">
      <rect width="225" height="32" class="engine-box" />
      <text x="112" y="20" text-anchor="middle" class="text-bold" fill="#be123c">SCALE-Sim / gem5 Sim</text>
    </g>
    <g transform="translate(755, 52)">
      <rect width="225" height="32" class="engine-box" />
      <text x="112" y="20" text-anchor="middle" class="text-bold" fill="#be123c">JasperGold / RedHawk-SC</text>
    </g>
  </g>

  <!-- Connector down to Signoff Section -->
  <path d="M 525 425 V 445" class="path-green" />

  <!-- PHYSICAL SILICON SIGNOFF & COMMITMENT SECTION -->
  <g transform="translate(15, 450)">
    <rect width="1020" height="135" class="card-signoff" />
    <text x="510" y="24" text-anchor="middle" class="head-signoff">VERIFIED PHYSICAL SILICON SIGNOFF &amp; COMMITMENT</text>

    <!-- 5 Green Check Badges -->
    <g transform="translate(20, 38)">
      <rect width="180" height="34" class="badge-box" />
      <text x="90" y="21" text-anchor="middle" class="text-badge">✓ DRC / LVS Clean</text>
    </g>
    <g transform="translate(220, 38)">
      <rect width="180" height="34" class="badge-box" />
      <text x="90" y="21" text-anchor="middle" class="text-badge">✓ Multi-Corner STA</text>
    </g>
    <g transform="translate(420, 38)">
      <rect width="180" height="34" class="badge-box" />
      <text x="90" y="21" text-anchor="middle" class="text-badge">✓ Dynamic IR-Drop</text>
    </g>
    <g transform="translate(620, 38)">
      <rect width="180" height="34" class="badge-box" />
      <text x="90" y="21" text-anchor="middle" class="text-badge">✓ Formal LEC Proof</text>
    </g>
    <g transform="translate(820, 38)">
      <rect width="180" height="34" class="badge-box" />
      <text x="90" y="21" text-anchor="middle" class="text-badge">✓ ATPG Fault Coverage</text>
    </g>

    <!-- Bottom Commitment Box -->
    <g transform="translate(260, 84)">
      <rect width="500" height="42" class="hub-author" />
      <text x="250" y="18" text-anchor="middle" class="head-commit">Human Architect &amp; Named Commitment Authority</text>
      <text x="250" y="33" text-anchor="middle" class="sub-commit">In-Order Retirement Control • Retains 100% Silicon Freeze &amp; Tapeout Accountability</text>
    </g>
  </g>
</svg>
