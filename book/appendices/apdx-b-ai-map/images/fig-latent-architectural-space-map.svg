<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img">
  <title>The Latent Architectural Space Map and Physical Decoupling Funnel</title>
  <desc>A structural diagram illustrating four latent space representation paradigms converging into a trapezoidal physical signoff filter, which verifies candidate designs before human commitment authority freeze.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1683A6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E9E48"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DE3D3C"/>
    </marker>

    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }

      /* Rectangular & Polygon Shapes (House Palette) */
      .box-neutral { fill: #FFFFFF; stroke: #9AA8B5; stroke-width: 1.1; }
      .box-blue { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.3; }
      .box-purple { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.3; }
      .box-emerald { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.3; }
      .box-amber { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.3; }
      .box-red { fill: #FDECEC; stroke: #DE3D3C; stroke-width: 1.4; }
      .box-grey { fill: #F5F8FA; stroke: #9AA8B5; stroke-width: 1.1; }

      /* Funnel Polygon Style */
      .funnel-filter { fill: #FDECEC; stroke: #DE3D3C; stroke-width: 1.6; stroke-linejoin: round; }
      .funnel-grid { stroke: #F87171; stroke-width: 0.8; stroke-dasharray: 4 3; opacity: 0.5; }

      /* Headers & Typography */
      .head-blue { font-size: 12.5px; font-weight: 700; fill: #1683A6; }
      .head-purple { font-size: 12.5px; font-weight: 700; fill: #6A4FC7; }
      .head-emerald { font-size: 12.5px; font-weight: 700; fill: #1E9E48; }
      .head-amber { font-size: 12.5px; font-weight: 700; fill: #8A5310; }
      .head-red { font-size: 13px; font-weight: 700; fill: #DE3D3C; }

      .text-bold { font-size: 11px; font-weight: 700; fill: #20252B; }
      .text-body { font-size: 10.5px; fill: #3E474B; }
      .text-sub { font-size: 10px; fill: #59636D; }
      .text-failure { font-size: 10.5px; font-weight: 700; fill: #DE3D3C; }
      .text-badge { font-size: 10.5px; font-weight: 700; fill: #1E9E48; }

      /* Connectors */
      .edge-red { stroke: #DE3D3C; stroke-width: 1.8; fill: none; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-red); }
      .edge-green { stroke: #1E9E48; stroke-width: 2.2; fill: none; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="960" height="530" fill="#FFFFFF"/>

  <g class="font">
    <!-- 4 PARADIGM RECTANGLES (TOP TIER) -->
    <!-- Paradigm 1: Token & Code Embeddings -->
    <g transform="translate(30, 20)">
      <rect class="box-grey" x="0" y="0" width="205" height="195" />
      <rect class="box-blue" x="0" y="0" width="205" height="28" />
      <text class="head-blue" x="10" y="19">1. Token &amp; Code Embeddings</text>

      <text class="text-bold" x="10" y="46">Represented Artifacts:</text>
      <text class="text-body" x="10" y="62">• Verilog / SystemC Source</text>
      <text class="text-body" x="10" y="76">• Triton / MLIR Code Tokens</text>

      <text class="text-bold" x="10" y="100">Search &amp; Inference:</text>
      <text class="text-body" x="10" y="116">• Autoregressive Sampling</text>
      <text class="text-body" x="10" y="130">• Temperature / Beam Search</text>

      <line x1="10" y1="142" x2="195" y2="142" stroke="#9AA8B5" stroke-width="0.9" />

      <text class="text-bold" x="10" y="159" fill="#DE3D3C">Primary Latent Failure:</text>
      <text class="text-failure" x="10" y="176">Vacuous / Hallucinated Syntax</text>
    </g>

    <!-- Paradigm 2: Graph & Topological Embeddings -->
    <g transform="translate(260, 20)">
      <rect class="box-grey" x="0" y="0" width="205" height="195" />
      <rect class="box-purple" x="0" y="0" width="205" height="28" />
      <text class="head-purple" x="10" y="19">2. Graph &amp; Topo Embeddings</text>

      <text class="text-bold" x="10" y="46">Represented Artifacts:</text>
      <text class="text-body" x="10" y="62">• CDFG &amp; AIG Netlists</text>
      <text class="text-body" x="10" y="76">• Spatial Floorplan Graphs</text>

      <text class="text-bold" x="10" y="100">Search &amp; Inference:</text>
      <text class="text-body" x="10" y="116">• GNN Node/Edge Vectors</text>
      <text class="text-body" x="10" y="130">• Spatial Macro Clustering</text>

      <line x1="10" y1="142" x2="195" y2="142" stroke="#9AA8B5" stroke-width="0.9" />

      <text class="text-bold" x="10" y="159" fill="#DE3D3C">Primary Latent Failure:</text>
      <text class="text-failure" x="10" y="176">Non-Routable Congestion</text>
    </g>

    <!-- Paradigm 3: Continuous Surrogates -->
    <g transform="translate(490, 20)">
      <rect class="box-grey" x="0" y="0" width="205" height="195" />
      <rect class="box-emerald" x="0" y="0" width="205" height="28" />
      <text class="head-emerald" x="10" y="19">3. Continuous Surrogates</text>

      <text class="text-bold" x="10" y="46">Represented Artifacts:</text>
      <text class="text-body" x="10" y="62">• Discrete Microarch Tuples</text>
      <text class="text-body" x="10" y="76">• Cache / Pipeline Parameters</text>

      <text class="text-bold" x="10" y="100">Search &amp; Inference:</text>
      <text class="text-body" x="10" y="116">• Bayesian Optimization (GP)</text>
      <text class="text-body" x="10" y="130">• Acquisition (EI / UCB)</text>

      <line x1="10" y1="142" x2="195" y2="142" stroke="#9AA8B5" stroke-width="0.9" />

      <text class="text-bold" x="10" y="159" fill="#DE3D3C">Primary Latent Failure:</text>
      <text class="text-failure" x="10" y="176">Optimizer's Curse (OOD)</text>
    </g>

    <!-- Paradigm 4: Policy & MDP States -->
    <g transform="translate(725, 20)">
      <rect class="box-grey" x="0" y="0" width="205" height="195" />
      <rect class="box-amber" x="0" y="0" width="205" height="28" />
      <text class="head-amber" x="10" y="19">4. Policy &amp; MDP States</text>

      <text class="text-bold" x="10" y="46">Represented Artifacts:</text>
      <text class="text-body" x="10" y="62">• Placement Action Steps</text>
      <text class="text-body" x="10" y="76">• Tile &amp; Loop Schedules</text>

      <text class="text-bold" x="10" y="100">Search &amp; Inference:</text>
      <text class="text-body" x="10" y="116">• Deep Q-Networks (DQN)</text>
      <text class="text-body" x="10" y="130">• MCTS &amp; PPO Updates</text>

      <line x1="10" y1="142" x2="195" y2="142" stroke="#9AA8B5" stroke-width="0.9" />

      <text class="text-bold" x="10" y="159" fill="#DE3D3C">Primary Latent Failure:</text>
      <text class="text-failure" x="10" y="176">Reward Hacking / Exploits</text>
    </g>

    <!-- CONNECTORS DOWN INTO THE FUNNEL -->
    <path class="edge-red" d="M 132 215 V 242" />
    <path class="edge-red" d="M 362 215 V 242" />
    <path class="edge-red" d="M 592 215 V 242" />
    <path class="edge-red" d="M 827 215 V 242" />

    <!-- MIDDLE TIER: THE TRAPEZOIDAL PHYSICAL SIGNOFF FUNNEL / FILTER -->
    <g transform="translate(0, 245)">
      <!-- Funnel Polygon: Wide top (30 to 930), narrow bottom (160 to 800), height 120 -->
      <polygon points="30,0 930,0 800,120 160,120" class="funnel-filter" />

      <!-- Internal Filter Mesh / Mesh Lines -->
      <line x1="160" y1="120" x2="30" y2="0" class="funnel-grid" />
      <line x1="800" y1="120" x2="930" y2="0" class="funnel-grid" />
      <line x1="100" y1="0" x2="860" y2="0" stroke="#DE3D3C" stroke-width="1.5" stroke-dasharray="6 4" />
      <line x1="200" y1="120" x2="760" y2="120" stroke="#DE3D3C" stroke-width="1.5" stroke-dasharray="6 4" />

      <!-- Funnel Labels -->
      <text class="head-red" x="480" y="24" text-anchor="middle">INDEPENDENT EVALUATOR-OWNED PHYSICAL SIGNOFF FILTER</text>
      <text class="text-sub" x="480" y="40" text-anchor="middle" font-weight="700">Candidates filtered through physical signoff engines before silicon commitment</text>

      <!-- 4 Tool Engine Sub-boxes inside the Funnel -->
      <g transform="translate(60, 56)">
        <rect class="box-neutral" x="0" y="0" width="190" height="30" />
        <text class="text-bold" x="95" y="19" text-anchor="middle" fill="#DE3D3C">Verilator / Yosys Linting</text>
      </g>
      <g transform="translate(270, 56)">
        <rect class="box-neutral" x="0" y="0" width="190" height="30" />
        <text class="text-bold" x="95" y="19" text-anchor="middle" fill="#DE3D3C">OpenROAD / OpenSTA P&amp;R</text>
      </g>
      <g transform="translate(480, 56)">
        <rect class="box-neutral" x="0" y="0" width="190" height="30" />
        <text class="text-bold" x="95" y="19" text-anchor="middle" fill="#DE3D3C">SCALE-Sim / gem5 Sim</text>
      </g>
      <g transform="translate(690, 56)">
        <rect class="box-neutral" x="0" y="0" width="190" height="30" />
        <text class="text-bold" x="95" y="19" text-anchor="middle" fill="#DE3D3C">JasperGold / RedHawk-SC</text>
      </g>
    </g>

    <!-- CONNECTOR OUT OF FUNNEL DOWN TO VERIFIED SILICON SIGNOFF -->
    <path class="edge-green" d="M 480 365 V 385" />

    <!-- BOTTOM TIER: VERIFIED PHYSICAL SILICON SIGNOFF & COMMITMENT -->
    <g transform="translate(30, 390)">
      <rect class="box-emerald" x="0" y="0" width="900" height="125" />
      <text class="head-emerald" x="450" y="22" text-anchor="middle">VERIFIED PHYSICAL SILICON SIGNOFF &amp; COMMITMENT</text>

      <!-- 5 Signoff Badges -->
      <g transform="translate(15, 34)">
        <rect class="box-neutral" x="0" y="0" width="160" height="32" />
        <text class="text-badge" x="80" y="20" text-anchor="middle">✓ DRC / LVS Clean</text>
      </g>
      <g transform="translate(190, 34)">
        <rect class="box-neutral" x="0" y="0" width="160" height="32" />
        <text class="text-badge" x="80" y="20" text-anchor="middle">✓ Multi-Corner STA</text>
      </g>
      <g transform="translate(365, 34)">
        <rect class="box-neutral" x="0" y="0" width="160" height="32" />
        <text class="text-badge" x="80" y="20" text-anchor="middle">✓ Dynamic IR-Drop</text>
      </g>
      <g transform="translate(540, 34)">
        <rect class="box-neutral" x="0" y="0" width="160" height="32" />
        <text class="text-badge" x="80" y="20" text-anchor="middle">✓ Formal LEC Proof</text>
      </g>
      <g transform="translate(715, 34)">
        <rect class="box-neutral" x="0" y="0" width="160" height="32" />
        <text class="text-badge" x="80" y="20" text-anchor="middle">✓ ATPG Fault Coverage</text>
      </g>

      <!-- Bottom Human Commitment Box -->
      <g transform="translate(200, 76)">
        <rect class="box-red" x="0" y="0" width="500" height="38" />
        <text class="head-red" x="250" y="16" text-anchor="middle">Human Architect &amp; Named Commitment Authority</text>
        <text class="text-sub" x="250" y="30" text-anchor="middle" font-weight="700">In-Order Retirement Control • Retains 100% Silicon Freeze &amp; Tapeout Accountability</text>
      </g>
    </g>
  </g>
</svg>
