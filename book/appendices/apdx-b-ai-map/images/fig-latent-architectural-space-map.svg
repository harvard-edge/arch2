<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.5px; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
      .card-header { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 400; fill: #cbd5e1; }
      .card-failure { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #fca5a5; }
      .barrier-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #fecdd3; letter-spacing: 0.5px; }
      .barrier-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #ffe4e6; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #6ee7b7; }
      .commit-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .commit-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 400; fill: #bae6fd; }
    </style>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="barrierGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="commitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" class="bg" rx="12"/>

  <!-- Title Banner -->
  <g transform="translate(30, 35)">
    <text class="title">THE LATENT ARCHITECTURAL SPACE MAP &amp; PHYSICAL GROUNDING FUNNEL</text>
    <text y="22" class="subtitle">Decoupling Autonomous AI Candidate Generation in Latent Space from Independent Physical Signoff Engines</text>
  </g>

  <!-- 4 Latent Space Cards -->
  <!-- Card 1: Token & Code Embeddings -->
  <g transform="translate(30, 80)">
    <rect width="210" height="200" rx="8" fill="url(#blueGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="210" height="32" rx="8" fill="#1d4ed8"/>
    <rect y="24" width="210" height="8" fill="#1d4ed8"/>
    <text x="12" y="21" class="card-header" fill="#ffffff">1. Token &amp; Code Embeddings</text>

    <text x="12" y="52" class="card-title">Represented Artifacts:</text>
    <text x="12" y="68" class="card-text">• Verilog / SystemC Source</text>
    <text x="12" y="82" class="card-text">• Triton / MLIR Code Tokens</text>

    <text x="12" y="106" class="card-title">Search &amp; Inference:</text>
    <text x="12" y="122" class="card-text">• Autoregressive Sampling</text>
    <text x="12" y="136" class="card-text">• Temperature / Beam Search</text>

    <line x1="12" y1="148" x2="198" y2="148" stroke="#334155" stroke-width="1"/>

    <text x="12" y="165" class="card-title" fill="#f87171">Primary Latent Failure:</text>
    <text x="12" y="182" class="card-failure">Vacuous / Hallucinated Syntax</text>
  </g>

  <!-- Card 2: Graph & Topological Embeddings -->
  <g transform="translate(255, 80)">
    <rect width="210" height="200" rx="8" fill="url(#purpleGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="210" height="32" rx="8" fill="#6d28d9"/>
    <rect y="24" width="210" height="8" fill="#6d28d9"/>
    <text x="12" y="21" class="card-header" fill="#ffffff">2. Graph &amp; Topo Embeddings</text>

    <text x="12" y="52" class="card-title">Represented Artifacts:</text>
    <text x="12" y="68" class="card-text">• CDFG &amp; AIG Netlists</text>
    <text x="12" y="82" class="card-text">• Spatial Floorplan Graphs</text>

    <text x="12" y="106" class="card-title">Search &amp; Inference:</text>
    <text x="12" y="122" class="card-text">• GNN Node/Edge Vectors</text>
    <text x="12" y="136" class="card-text">• Spatial Macro Clustering</text>

    <line x1="12" y1="148" x2="198" y2="148" stroke="#334155" stroke-width="1"/>

    <text x="12" y="165" class="card-title" fill="#f87171">Primary Latent Failure:</text>
    <text x="12" y="182" class="card-failure">Non-Routable Congestion</text>
  </g>

  <!-- Card 3: Continuous Surrogate Manifolds -->
  <g transform="translate(480, 80)">
    <rect width="210" height="200" rx="8" fill="url(#emeraldGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="210" height="32" rx="8" fill="#047857"/>
    <rect y="24" width="210" height="8" fill="#047857"/>
    <text x="12" y="21" class="card-header" fill="#ffffff">3. Continuous Surrogates</text>

    <text x="12" y="52" class="card-title">Represented Artifacts:</text>
    <text x="12" y="68" class="card-text">• Discrete Microarch Tuples</text>
    <text x="12" y="82" class="card-text">• Cache / Pipeline Parameters</text>

    <text x="12" y="106" class="card-title">Search &amp; Inference:</text>
    <text x="12" y="122" class="card-text">• Bayesian Optimization (GP)</text>
    <text x="12" y="136" class="card-text">• Acquisition Functions (EI/UCB)</text>

    <line x1="12" y1="148" x2="198" y2="148" stroke="#334155" stroke-width="1"/>

    <text x="12" y="165" class="card-title" fill="#f87171">Primary Latent Failure:</text>
    <text x="12" y="182" class="card-failure">Optimizer's Curse (OOD)</text>
  </g>

  <!-- Card 4: Policy & MDP State Spaces -->
  <g transform="translate(705, 80)">
    <rect width="210" height="200" rx="8" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="210" height="32" rx="8" fill="#b45309"/>
    <rect y="24" width="210" height="8" fill="#b45309"/>
    <text x="12" y="21" class="card-header" fill="#ffffff">4. Policy &amp; MDP States</text>

    <text x="12" y="52" class="card-title">Represented Artifacts:</text>
    <text x="12" y="68" class="card-text">• Placement Action Steps</text>
    <text x="12" y="82" class="card-text">• Tile &amp; Loop Schedules</text>

    <text x="12" y="106" class="card-title">Search &amp; Inference:</text>
    <text x="12" y="122" class="card-text">• Deep Q-Networks (DQN)</text>
    <text x="12" y="136" class="card-text">• MCTS &amp; PPO Updates</text>

    <line x1="12" y1="148" x2="198" y2="148" stroke="#334155" stroke-width="1"/>

    <text x="12" y="165" class="card-title" fill="#f87171">Primary Latent Failure:</text>
    <text x="12" y="182" class="card-failure">Reward Hacking &amp; Proxy Exploits</text>
  </g>

  <!-- Arrows from Cards down to Decoupling Barrier -->
  <line x1="135" y1="280" x2="135" y2="310" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="360" y1="280" x2="360" y2="310" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="585" y1="280" x2="585" y2="310" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="810" y1="280" x2="810" y2="310" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Physical Decoupling Barrier Section -->
  <g transform="translate(30, 315)">
    <rect width="900" height="95" rx="8" fill="url(#barrierGrad)" stroke="#f43f5e" stroke-width="2"/>
    <text x="450" y="24" text-anchor="middle" class="barrier-title">INDEPENDENT EVALUATOR-OWNED PHYSICAL SIGNOFF BARRIER</text>
    <text x="450" y="42" text-anchor="middle" class="barrier-text">No Latent Vector Prediction Authorized to Commit to Silicon Without Independent Tool Execution</text>

    <!-- 4 Grounding Engines Sub-boxes -->
    <g transform="translate(20, 52)">
      <rect width="195" height="32" rx="4" fill="#4c0519" stroke="#fb7185" stroke-width="1"/>
      <text x="97" y="20" text-anchor="middle" class="card-text" font-weight="600">Verilator / Yosys Linting</text>
    </g>
    <g transform="translate(240, 52)">
      <rect width="195" height="32" rx="4" fill="#4c0519" stroke="#fb7185" stroke-width="1"/>
      <text x="97" y="20" text-anchor="middle" class="card-text" font-weight="600">OpenROAD / OpenSTA P&amp;R</text>
    </g>
    <g transform="translate(460, 52)">
      <rect width="195" height="32" rx="4" fill="#4c0519" stroke="#fb7185" stroke-width="1"/>
      <text x="97" y="20" text-anchor="middle" class="card-text" font-weight="600">SCALE-Sim / gem5 Sim</text>
    </g>
    <g transform="translate(680, 52)">
      <rect width="195" height="32" rx="4" fill="#4c0519" stroke="#fb7185" stroke-width="1"/>
      <text x="97" y="20" text-anchor="middle" class="card-text" font-weight="600">JasperGold / RedHawk-SC</text>
    </g>
  </g>

  <!-- Arrows from Barrier to Physical Silicon Signoff -->
  <line x1="480" y1="410" x2="480" y2="440" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Physical Silicon Signoff & Commitment Section -->
  <g transform="translate(30, 445)">
    <rect width="900" height="145" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" fill-opacity="0.4"/>
    <text x="450" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#34d399">VERIFIED PHYSICAL SILICON SIGNOFF &amp; COMMITMENT</text>

    <!-- 5 Green Check Badges -->
    <g transform="translate(25, 40)">
      <rect width="155" height="34" rx="6" fill="#022c22" stroke="#059669" stroke-width="1"/>
      <text x="77" y="21" text-anchor="middle" class="badge-text">✓ DRC / LVS Clean</text>
    </g>
    <g transform="translate(195, 40)">
      <rect width="155" height="34" rx="6" fill="#022c22" stroke="#059669" stroke-width="1"/>
      <text x="77" y="21" text-anchor="middle" class="badge-text">✓ Multi-Corner STA</text>
    </g>
    <g transform="translate(365, 40)">
      <rect width="155" height="34" rx="6" fill="#022c22" stroke="#059669" stroke-width="1"/>
      <text x="77" y="21" text-anchor="middle" class="badge-text">✓ Dynamic IR-Drop</text>
    </g>
    <g transform="translate(535, 40)">
      <rect width="155" height="34" rx="6" fill="#022c22" stroke="#059669" stroke-width="1"/>
      <text x="77" y="21" text-anchor="middle" class="badge-text">✓ Formal LEC Proof</text>
    </g>
    <g transform="translate(705, 40)">
      <rect width="155" height="34" rx="6" fill="#022c22" stroke="#059669" stroke-width="1"/>
      <text x="77" y="21" text-anchor="middle" class="badge-text">✓ ATPG Fault Coverage</text>
    </g>

    <!-- Bottom Commitment Box -->
    <g transform="translate(200, 88)">
      <rect width="500" height="42" rx="6" fill="url(#commitGrad)" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="250" y="18" text-anchor="middle" class="commit-title">Human Architect &amp; Named Commitment Authority</text>
      <text x="250" y="33" text-anchor="middle" class="commit-sub">In-Order Retirement Authority • Retains 100% Silicon Freeze &amp; Tapeout Accountability</text>
    </g>
  </g>
</svg>
