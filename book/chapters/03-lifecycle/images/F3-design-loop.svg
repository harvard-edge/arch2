<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">A design loop as a recurrent path through life-cycle responsibilities</title>
  <desc id="loop-desc">Within one scoped architecture study, a recurrent path connects the outputs of Formulate, Explore, Implement, Evaluate, Interpret and Explain, and Review and Decide. Review either yields a scoped outcome or records a named repair that returns to the responsible stage. A separate footer distinguishes measurement fidelity from decision rights and the next authorized action.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1683A6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C62A2A"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .group-label { font-size: 14px; font-weight: 700; fill: #59636D; }
      .loop-label { font-size: 14px; font-weight: 700; fill: #8A5310; }
      .node-stage { font-size: 11.5px; font-weight: 700; fill: #59636D; }
      .node-title { font-size: 15px; font-weight: 700; fill: #20252B; }
      .node-body { font-size: 14px; fill: #444444; }
      .axis-note { font-size: 14px; font-weight: 700; fill: #136680; }
      .axis-stage { font-size: 14px; fill: #444444; }
      .governance-title { font-size: 14px; font-weight: 700; fill: #A82E70; }
      .governance-body { font-size: 14px; fill: #444444; }
      .formulate { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.7; }
      .explore { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.7; }
      .implement { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.7; }
      .evaluate { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.7; }
      .explain { fill: #FFFFFF; stroke: #1E9E48; stroke-width: 1.7; }
      .review { fill: #FBEDF4; stroke: #D24D96; stroke-width: 1.7; }
      .outcome { fill: #FBEDF4; stroke: #D24D96; stroke-width: 1.7; }
      .revise { fill: #FDECEC; stroke: #DE3D3C; stroke-width: 1.7; }
      .return-target { fill: #FFFFFF; stroke: #C62A2A; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .return-title { font-size: 12.5px; font-weight: 700; fill: #C62A2A; }
      .return-body { font-size: 12.5px; fill: #444444; }
      .edge { fill: none; stroke: #333333; stroke-width: 2.3; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-dark); }
      .edge-red { fill: none; stroke: #C62A2A; stroke-width: 2.2; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-red); }
      .edge-revise { fill: none; stroke: #C62A2A; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; stroke-dasharray: 5 4; marker-end: url(#arrow-red); }
      .study-boundary { fill: none; stroke: #9AA8B5; stroke-width: 1.7; }
      .loop-boundary { fill: #FFFFFF; stroke: #E68A17; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1080" height="520" fill="#FFFFFF"/>
  <g class="font">
    <rect class="study-boundary" x="34" y="34" width="1012" height="379"/>
    <text class="group-label" x="58" y="59">RECURRENT PATH THROUGH SIX LIFE-CYCLE RESPONSIBILITIES</text>

    <rect class="loop-boundary" x="62" y="76" width="956" height="198"/>
    <text class="loop-label" x="82" y="100">DESIGN LOOP WHEN WORK ITERATES</text>

    <rect class="formulate" x="72" y="125" width="130" height="96"/>
    <text class="node-stage" x="137" y="150" text-anchor="middle">1 FORMULATE</text>
    <text class="node-title" x="137" y="177" text-anchor="middle">Scoped plan</text>
    <text class="node-body" x="137" y="202" text-anchor="middle">scope and checks</text>

    <rect class="explore" x="214" y="125" width="130" height="96"/>
    <text class="node-stage" x="279" y="150" text-anchor="middle">2 EXPLORE</text>
    <text class="node-title" x="279" y="177" text-anchor="middle">Legal candidate</text>
    <text class="node-body" x="279" y="202" text-anchor="middle">selection history</text>

    <rect class="implement" x="356" y="125" width="140" height="96"/>
    <text class="node-stage" x="426" y="150" text-anchor="middle">3 IMPLEMENT</text>
    <text class="node-title" x="426" y="177" text-anchor="middle">Execution record</text>
    <text class="node-body" x="426" y="202" text-anchor="middle">or tool failure</text>

    <rect class="evaluate" x="508" y="125" width="130" height="96"/>
    <text class="node-stage" x="573" y="150" text-anchor="middle">4 EVALUATE</text>
    <text class="node-title" x="573" y="177" text-anchor="middle">Checked result</text>
    <text class="node-body" x="573" y="202" text-anchor="middle">pass, fail, or open</text>

    <rect class="explain" x="650" y="125" width="170" height="96"/>
    <text class="node-stage" x="735" y="150" text-anchor="middle">5 INTERPRET AND EXPLAIN</text>
    <text class="node-title" x="735" y="177" text-anchor="middle">Supported account</text>
    <text class="node-body" x="735" y="202" text-anchor="middle">mechanism status</text>

    <rect class="review" x="832" y="125" width="176" height="96"/>
    <text class="node-stage" x="920" y="150" text-anchor="middle">6 REVIEW AND DECIDE</text>
    <text class="node-title" x="920" y="177" text-anchor="middle">Next action</text>
    <text class="node-body" x="920" y="202" text-anchor="middle">continue, return, or stop</text>

    <rect class="return-target" x="298" y="226" width="484" height="44"/>
    <text class="return-title" x="540" y="243" text-anchor="middle">RESPONSIBLE LIFE-CYCLE STAGE</text>
    <text class="return-body" x="540" y="260" text-anchor="middle">select one of the six responsibilities above</text>

    <rect class="revise" x="240" y="282" width="350" height="82"/>
    <text class="node-title" x="415" y="311" text-anchor="middle">Named repair</text>
    <text class="node-body" x="415" y="336" text-anchor="middle">record the reason and select</text>
    <text class="node-body" x="415" y="355" text-anchor="middle">the responsible stage</text>

    <rect class="outcome" x="800" y="282" width="200" height="82"/>
    <text class="node-title" x="900" y="311" text-anchor="middle">Scoped outcome</text>
    <text class="node-body" x="900" y="336" text-anchor="middle">finding, decision,</text>
    <text class="node-body" x="900" y="355" text-anchor="middle">escalation, or stop</text>

    <path class="edge" d="M 202 173 H 214"/>
    <path class="edge" d="M 344 173 H 356"/>
    <path class="edge" d="M 496 173 H 508"/>
    <path class="edge" d="M 638 173 H 650"/>
    <path class="edge" d="M 820 173 H 832"/>
    <path class="edge" d="M 920 221 V 282"/>
    <path class="edge-red" d="M 868 221 V 276 H 760 V 323 H 590"/>
    <path class="edge-revise" d="M 415 282 V 270"/>

    <text class="axis-note" x="330" y="444" text-anchor="middle">some checks may raise fidelity and cost</text>
    <line x1="112" y1="465" x2="548" y2="465" stroke="#1683A6" stroke-width="2" marker-end="url(#arrow-teal)"/>
    <circle cx="166" cy="465" r="4" fill="#1683A6"/>
    <circle cx="324" cy="465" r="4" fill="#1683A6"/>
    <circle cx="482" cy="465" r="4" fill="#1683A6"/>
    <text class="axis-stage" x="166" y="492" text-anchor="middle">proxy</text>
    <text class="axis-stage" x="324" y="492" text-anchor="middle">simulation</text>
    <text class="axis-stage" x="482" y="492" text-anchor="middle">higher-fidelity check</text>

    <line x1="595" y1="427" x2="595" y2="500" stroke="#D5DEE3" stroke-width="1.5"/>
    <rect class="outcome" x="632" y="430" width="346" height="62"/>
    <text class="governance-title" x="805" y="455" text-anchor="middle">separately governed</text>
    <text class="governance-body" x="805" y="480" text-anchor="middle">decision rights and next authorized action</text>
  </g>
</svg>
