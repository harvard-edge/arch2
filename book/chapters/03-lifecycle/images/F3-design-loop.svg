<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">A design loop through six life-cycle responsibilities</title>
  <desc id="loop-desc">A two-row snake connects Formulate, Explore, Implement, Evaluate, Interpret and Explain, and Review and Decide. Review branches to either a scoped outcome or a named repair. The repair records its reason and owning responsibility, then returns to the responsible life-cycle stage through a neutral selected-responsibility marker.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#20252B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C62A2A"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .stage-label { font-size: 14px; font-weight: 700; fill: #59636D; }
      .output-label { font-size: 20px; font-weight: 700; fill: #20252B; }
      .branch-title { font-size: 18px; font-weight: 700; fill: #20252B; }
      .branch-body { font-size: 14px; fill: #3E474B; }
      .formulate { fill: #E4F1F6; stroke: #1683A6; stroke-width: 2; }
      .explore { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 2; }
      .implement { fill: #FBF0DE; stroke: #E68A17; stroke-width: 2; }
      .evaluate { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 2; }
      .explain { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 2; }
      .review { fill: #FBEDF4; stroke: #D24D96; stroke-width: 2; }
      .outcome { fill: #FBEDF4; stroke: #D24D96; stroke-width: 2; }
      .repair { fill: #FDECEC; stroke: #DE3D3C; stroke-width: 2; }
      .owner-strip { fill: #F6F8F9; stroke: #9AA8B5; stroke-width: 2; stroke-dasharray: 7 5; }
      .entry { fill: #FFFFFF; stroke: #9AA8B5; stroke-width: 1.7; }
      .entry-label { font-size: 12.5px; font-weight: 700; fill: #59636D; }
      .boundary { fill: none; stroke: #9AA8B5; stroke-width: 1.7; }
      .branch { fill: none; stroke: #20252B; stroke-width: 2.5; stroke-linecap: square; stroke-linejoin: miter; }
      .edge { fill: none; stroke: #20252B; stroke-width: 2.5; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-dark); }
      .edge-red { fill: none; stroke: #C62A2A; stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-red); }
      .edge-return { fill: none; stroke: #59636D; stroke-width: 2.2; stroke-linecap: square; stroke-linejoin: miter; stroke-dasharray: 7 5; marker-end: url(#arrow-dark); }
    </style>
  </defs>

  <rect width="1080" height="580" fill="#FFFFFF"/>
  <g class="font">
    <rect class="boundary" x="36" y="30" width="1008" height="378"/>

    <rect class="formulate" x="70" y="65" width="250" height="100"/>
    <text class="stage-label" x="195" y="98" text-anchor="middle">1 FORMULATE</text>
    <text class="output-label" x="195" y="135" text-anchor="middle">Scoped plan</text>

    <rect class="explore" x="415" y="65" width="250" height="100"/>
    <text class="stage-label" x="540" y="98" text-anchor="middle">2 EXPLORE</text>
    <text class="output-label" x="540" y="135" text-anchor="middle">Legal candidate</text>

    <rect class="implement" x="760" y="65" width="250" height="100"/>
    <text class="stage-label" x="885" y="98" text-anchor="middle">3 IMPLEMENT</text>
    <text class="output-label" x="885" y="135" text-anchor="middle">Execution record</text>

    <rect class="evaluate" x="760" y="250" width="250" height="100"/>
    <text class="stage-label" x="885" y="283" text-anchor="middle">4 EVALUATE</text>
    <text class="output-label" x="885" y="320" text-anchor="middle">Checked result</text>

    <rect class="explain" x="415" y="250" width="250" height="100"/>
    <text class="stage-label" x="540" y="283" text-anchor="middle">5 INTERPRET AND EXPLAIN</text>
    <text class="output-label" x="540" y="320" text-anchor="middle">Supported account</text>

    <rect class="review" x="70" y="250" width="250" height="100"/>
    <text class="stage-label" x="195" y="283" text-anchor="middle">6 REVIEW AND DECIDE</text>
    <text class="output-label" x="195" y="320" text-anchor="middle">Next action</text>

    <path class="edge" d="M 320 115 H 415"/>
    <path class="edge" d="M 665 115 H 760"/>
    <path class="edge" d="M 885 165 V 250"/>
    <path class="edge" d="M 760 300 H 665"/>
    <path class="edge" d="M 415 300 H 320"/>

    <rect class="outcome" x="55" y="450" width="280" height="92"/>
    <text class="branch-title" x="195" y="480" text-anchor="middle">Scoped outcome</text>
    <text class="branch-body" x="195" y="507" text-anchor="middle">finding, decision, escalation,</text>
    <text class="branch-body" x="195" y="528" text-anchor="middle">or stop</text>

    <rect class="repair" x="385" y="450" width="280" height="92"/>
    <text class="branch-title" x="525" y="480" text-anchor="middle">Named repair</text>
    <text class="branch-body" x="525" y="508" text-anchor="middle">reason + owning responsibility</text>

    <rect class="owner-strip" x="750" y="450" width="290" height="92"/>
    <text class="branch-title" x="895" y="480" text-anchor="middle">Selected responsibility</text>
    <text class="branch-body" x="895" y="508" text-anchor="middle">entry for the named return</text>

    <rect class="entry" x="395" y="12" width="290" height="36"/>
    <text class="entry-label" x="540" y="35" text-anchor="middle">RETURN TO RESPONSIBLE LIFE-CYCLE STAGE</text>

    <path class="branch" d="M 195 350 V 420 H 525"/>
    <path class="edge" d="M 195 420 V 450"/>
    <path class="edge-red" d="M 525 420 V 450"/>
    <path class="edge-red" d="M 665 496 H 750"/>
    <path class="edge-return" d="M 1040 496 H 1060 V 30 H 685"/>
  </g>
</svg>
