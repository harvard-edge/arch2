<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 455" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">One architecture study produces four separate judgments</title>
  <desc id="wf-desc">A left-to-right flow freezes the plan, selects candidates, validates the request, executes and records simulator runs, and interprets the record. A rejected schema returns to request repair and revalidation without changing the frozen study. Interpretation feeds four separate judgments: architecture outcome, study-local AI contribution, mechanism status, and stopping.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .stage-title { font-size: 12.5px; font-weight: 700; fill: #20252B; }
      .stage-sub { font-size: 10.6px; fill: #59636D; }
      .outcome-label { font-size: 12.4px; font-weight: 700; fill: #20252B; }
      .outcome-sub { font-size: 10.7px; fill: #59636D; }
      .repair-label { font-size: 12px; font-weight: 700; fill: #20252B; }
      .repair-sub { font-size: 10.5px; fill: #59636D; }
      .s-pre  { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.45; }
      .s-gen  { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.45; }
      .s-eval { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.45; }
      .s-read { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.45; }
      .repair { fill: #FCEBEC; stroke: #D94A4A; stroke-width: 1.45; }
      .outcome { fill: #FBEDF4; stroke: #D24D96; stroke-width: 1.45; }
      .edge { fill: none; stroke: #333333; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="455" fill="#FFFFFF"/>
  <g class="font">
    <rect class="s-pre" x="20" y="44" width="160" height="70"/>
    <text class="stage-title" x="100" y="72" text-anchor="middle">Freeze the plan</text>
    <text class="stage-sub" x="100" y="93" text-anchor="middle">question, score, budget, checks</text>

    <rect class="s-gen" x="210" y="44" width="160" height="70"/>
    <text class="stage-title" x="290" y="72" text-anchor="middle">Select candidates</text>
    <text class="stage-sub" x="290" y="93" text-anchor="middle">model and fixed heuristic</text>

    <rect class="s-eval" x="400" y="44" width="160" height="70"/>
    <text class="stage-title" x="480" y="72" text-anchor="middle">Validate request</text>
    <text class="stage-sub" x="480" y="93" text-anchor="middle">schema and legal candidates</text>

    <rect class="s-eval" x="590" y="44" width="160" height="70"/>
    <text class="stage-title" x="670" y="72" text-anchor="middle">Execute and record</text>
    <text class="stage-sub" x="670" y="93" text-anchor="middle">simulate and preserve returns</text>

    <rect class="s-read" x="780" y="44" width="160" height="70"/>
    <text class="stage-title" x="860" y="72" text-anchor="middle">Interpret the record</text>
    <text class="stage-sub" x="860" y="93" text-anchor="middle">comparison, limits, nonclaims</text>

    <path class="edge" d="M 180 79 L 210 79"/>
    <path class="edge" d="M 370 79 L 400 79"/>
    <path class="edge" d="M 560 79 L 590 79"/>
    <path class="edge" d="M 750 79 L 780 79"/>

    <rect class="repair" x="400" y="158" width="160" height="64"/>
    <text class="repair-label" x="480" y="184" text-anchor="middle">Repair + revalidate schema</text>
    <text class="repair-sub" x="480" y="204" text-anchor="middle">same frozen study and candidates</text>
    <path class="edge" d="M 480 114 L 480 158"/>
    <path class="edge" d="M 560 190 L 670 190 L 670 114"/>

    <path class="edge" d="M 860 114 L 860 270 L 125 270 L 125 340"/>
    <path class="edge" d="M 860 114 L 860 286 L 355 286 L 355 340"/>
    <path class="edge" d="M 860 114 L 860 302 L 585 302 L 585 340"/>
    <path class="edge" d="M 860 114 L 860 318 L 815 318 L 815 340"/>

    <rect class="outcome" x="20" y="340" width="210" height="92"/>
    <text class="outcome-label" x="125" y="372" text-anchor="middle">Architecture outcome</text>
    <text class="outcome-sub" x="125" y="395" text-anchor="middle">no evaluated shape clears</text>
    <text class="outcome-sub" x="125" y="413" text-anchor="middle">the declared margin</text>

    <rect class="outcome" x="250" y="340" width="210" height="92"/>
    <text class="outcome-label" x="355" y="372" text-anchor="middle">AI contribution</text>
    <text class="outcome-sub" x="355" y="395" text-anchor="middle">no local advantage shown</text>
    <text class="outcome-sub" x="355" y="413" text-anchor="middle">against the fixed heuristic</text>

    <rect class="outcome" x="480" y="340" width="210" height="92"/>
    <text class="outcome-label" x="585" y="372" text-anchor="middle">Mechanism status</text>
    <text class="outcome-sub" x="585" y="395" text-anchor="middle">directional prediction fails;</text>
    <text class="outcome-sub" x="585" y="413" text-anchor="middle">replacement is unresolved</text>

    <rect class="outcome" x="710" y="340" width="210" height="92"/>
    <text class="outcome-label" x="815" y="372" text-anchor="middle">Stopping</text>
    <text class="outcome-sub" x="815" y="395" text-anchor="middle">technical search stops;</text>
    <text class="outcome-sub" x="815" y="413" text-anchor="middle">architecture action is pending</text>
  </g>
</svg>
