<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">One architecture study produces four separate judgments</title>
  <desc id="wf-desc">A left-to-right flow freezes the plan, selects candidates, executes and records simulator runs, and interprets the record. The interpretation feeds four separate judgments: architecture outcome, study-local AI contribution, mechanism status, and stopping.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .stage-title { font-size: 13px; font-weight: 700; fill: #20252B; }
      .stage-sub { font-size: 11.4px; fill: #59636D; }
      .outcome-label { font-size: 12.6px; font-weight: 700; fill: #20252B; }
      .outcome-sub { font-size: 10.8px; fill: #59636D; }
      .s-pre  { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.45; }
      .s-gen  { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.45; }
      .s-eval { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.45; }
      .s-read { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.45; }
      .outcome { fill: #FBEDF4; stroke: #D24D96; stroke-width: 1.45; }
      .edge { fill: none; stroke: #333333; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="440" fill="#FFFFFF"/>
  <g class="font">
    <rect class="s-pre" x="30" y="44" width="190" height="70"/>
    <text class="stage-title" x="125" y="73" text-anchor="middle">Freeze the plan</text>
    <text class="stage-sub" x="125" y="94" text-anchor="middle">question, score, budget, checks</text>

    <rect class="s-gen" x="267" y="44" width="190" height="70"/>
    <text class="stage-title" x="362" y="73" text-anchor="middle">Select candidates</text>
    <text class="stage-sub" x="362" y="94" text-anchor="middle">model and fixed heuristic</text>

    <rect class="s-eval" x="504" y="44" width="190" height="70"/>
    <text class="stage-title" x="599" y="73" text-anchor="middle">Execute and record</text>
    <text class="stage-sub" x="599" y="94" text-anchor="middle">validate, simulate, preserve</text>

    <rect class="s-read" x="741" y="44" width="190" height="70"/>
    <text class="stage-title" x="836" y="73" text-anchor="middle">Interpret the record</text>
    <text class="stage-sub" x="836" y="94" text-anchor="middle">comparison, limits, nonclaims</text>

    <path class="edge" d="M 220 79 L 267 79"/>
    <path class="edge" d="M 457 79 L 504 79"/>
    <path class="edge" d="M 694 79 L 741 79"/>

    <path class="edge" d="M 836 114 L 836 186 L 125 186 L 125 270"/>
    <path class="edge" d="M 836 114 L 836 206 L 362 206 L 362 270"/>
    <path class="edge" d="M 836 114 L 836 226 L 599 226 L 599 270"/>
    <path class="edge" d="M 836 114 L 836 270"/>

    <rect class="outcome" x="30" y="270" width="190" height="92"/>
    <text class="outcome-label" x="125" y="302" text-anchor="middle">Architecture outcome</text>
    <text class="outcome-sub" x="125" y="325" text-anchor="middle">no evaluated shape clears</text>
    <text class="outcome-sub" x="125" y="343" text-anchor="middle">the declared margin</text>

    <rect class="outcome" x="267" y="270" width="190" height="92"/>
    <text class="outcome-label" x="362" y="302" text-anchor="middle">AI contribution</text>
    <text class="outcome-sub" x="362" y="325" text-anchor="middle">no local advantage shown</text>
    <text class="outcome-sub" x="362" y="343" text-anchor="middle">against the fixed heuristic</text>

    <rect class="outcome" x="504" y="270" width="190" height="92"/>
    <text class="outcome-label" x="599" y="302" text-anchor="middle">Mechanism status</text>
    <text class="outcome-sub" x="599" y="325" text-anchor="middle">directional prediction fails;</text>
    <text class="outcome-sub" x="599" y="343" text-anchor="middle">replacement is unresolved</text>

    <rect class="outcome" x="741" y="270" width="190" height="92"/>
    <text class="outcome-label" x="836" y="302" text-anchor="middle">Stopping</text>
    <text class="outcome-sub" x="836" y="325" text-anchor="middle">stop the study;</text>
    <text class="outcome-sub" x="836" y="343" text-anchor="middle">architecture action is pending</text>
  </g>
</svg>
