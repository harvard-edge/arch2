<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" role="img" aria-labelledby="am-title am-desc">
  <title id="am-title">Mapping GEMM dimensions onto a systolic array</title>
  <desc id="am-desc">A GEMM workload with dimensions M, N, and K under a weight-stationary dataflow maps onto a systolic array through the resident weight tile, which is K by N. Array height carries the reduction dimension K and array width carries N, while M streams through the array without occupying an array dimension. Two orientations are shown, a wide 16 by 64 array and a tall 64 by 16 array. A dashed connector marks the transposition of M and N, which leaves K unchanged, so the mirrored pair moves the height and width fold counts at the same time.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .box-title { font-size: 13px; font-weight: 700; fill: #20252B; }
      .box-sub { font-size: 11.4px; fill: #444444; }
      .bind-violet { font-size: 11.4px; font-weight: 700; fill: #59429E; }
      .bind-amber { font-size: 11.4px; font-weight: 700; fill: #8A5310; }
      .tile-text { font-size: 12px; font-weight: 700; fill: #20252B; }
      .transpose-label { font-size: 12px; font-weight: 700; fill: #333333; }
      .transpose-note { font-size: 11.4px; fill: #444444; }
      .gemm { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.45; }
      .tile { fill: #F4F6F8; stroke: #8A94A6; stroke-width: 1.45; }
      .arr-wide { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.45; }
      .arr-tall { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.45; }
      .edge { fill: none; stroke: #333333; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #333333; stroke-width: 1.8; stroke-linecap: square; stroke-dasharray: 5 4; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="760" height="435" fill="#FFFFFF"/>
  <g class="font">
    <rect class="gemm" x="250" y="20" width="260" height="54"/>
    <text class="box-title" x="380" y="43" text-anchor="middle">GEMM workload</text>
    <text class="box-sub" x="380" y="62" text-anchor="middle">M &#215; N &#215; K (weight-stationary)</text>

    <path class="edge" d="M 380 74 L 380 92"/>

    <rect class="tile" x="232" y="92" width="296" height="34"/>
    <text class="tile-text" x="380" y="114" text-anchor="middle">resident weight tile is K &#215; N; M streams through</text>

    <path class="edge" d="M 380 126 L 380 165 L 175 165 L 175 238"/>
    <path class="edge" d="M 380 126 L 380 165 L 586 165 L 586 200"/>

    <rect class="arr-wide" x="60" y="238" width="230" height="80"/>
    <text class="box-title" x="175" y="262" text-anchor="middle">16 &#215; 64 array</text>
    <text class="box-sub" x="175" y="280" text-anchor="middle">height 16, width 64</text>
    <text class="bind-violet" x="175" y="300" text-anchor="middle">K over height, N over width</text>

    <rect class="arr-tall" x="556" y="200" width="60" height="150"/>
    <text class="box-title" x="630" y="250">64 &#215; 16 array</text>
    <text class="box-sub" x="630" y="268">height 64, width 16</text>
    <text class="bind-amber" x="630" y="288">K over height,</text>
    <text class="bind-amber" x="630" y="304">N over width</text>

    <path class="dashed" d="M 175 318 L 175 392 L 586 392 L 586 350"/>
    <text class="transpose-label" x="380" y="384" text-anchor="middle">transpose M, N</text>
    <text class="transpose-note" x="380" y="414" text-anchor="middle">K is unchanged, so the mirrored pair moves both fold counts</text>
  </g>
</svg>
