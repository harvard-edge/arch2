<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img">
  <title>A reusable learned component inside an AI-assisted architecture design system</title>
  <desc>Reusable architecture data can train or adapt an optional foundation model for several architecture tasks. Live project state remains separate and authoritative. Conventional methods, design tools, and checks interact with the learned component inside an AI-assisted design system. An architect supplies intent and constraints and owns the resulting decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; fill: #20252B; }
      .title { font-size: 21px; font-weight: 700; }
      .head { font-size: 16px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 700; }
      .small { font-size: 12.5px; fill: #59636D; }
      .panel { fill: #F8FAFC; stroke: #9AA8B5; stroke-width: 1.4; }
      .data { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .model { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.5; }
      .method { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.5; }
      .evidence { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
      .decision { fill: #FBEDF4; stroke: #D24D96; stroke-width: 1.5; }
      .line { fill: none; stroke: #333333; stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .return { fill: none; stroke: #1E9E48; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="700" fill="#FFFFFF"/>
  <text class="font title" x="48" y="43">Reusable learning supports a larger architecture design system</text>

  <text class="font head" x="48" y="84">Reusable architecture knowledge</text>
  <rect class="data" x="48" y="101" width="232" height="128"/>
  <text class="font label" x="68" y="128">Prior projects and literature</text>
  <text class="font small" x="68" y="154">design artifacts + documents</text>
  <text class="font small" x="68" y="177">tool traces + measurements</text>
  <text class="font small" x="68" y="200">failures + reviewed results</text>

  <text class="font head" x="48" y="286">Current project record</text>
  <rect class="data" x="48" y="303" width="232" height="147"/>
  <text class="font label" x="68" y="330">Version-controlled study state</text>
  <text class="font small" x="68" y="356">workload + software versions</text>
  <text class="font small" x="68" y="379">constraints + candidate identity</text>
  <text class="font small" x="68" y="402">tool, library + process versions</text>
  <text class="font small" x="68" y="425">current measurements + failures</text>

  <rect class="panel" x="326" y="76" width="626" height="464"/>
  <text class="font head" x="348" y="105">AI-assisted architecture design system</text>

  <rect class="model" x="365" y="135" width="225" height="96"/>
  <text class="font label" x="478" y="164" text-anchor="middle">Architecture foundation model</text>
  <text class="font small" x="478" y="189" text-anchor="middle">optional reusable learned component</text>
  <text class="font small" x="478" y="211" text-anchor="middle">adapted to the current task</text>

  <text class="font label" x="646" y="135">Architecture tasks</text>
  <rect class="model" x="646" y="150" width="267" height="35"/>
  <text class="font small" x="779" y="172" text-anchor="middle">workload + requirements analysis</text>
  <rect class="model" x="646" y="194" width="267" height="35"/>
  <text class="font small" x="779" y="216" text-anchor="middle">prediction + design-space screening</text>
  <rect class="model" x="646" y="238" width="267" height="35"/>
  <text class="font small" x="779" y="260" text-anchor="middle">candidate, software + RTL generation</text>
  <rect class="model" x="646" y="282" width="267" height="35"/>
  <text class="font small" x="779" y="304" text-anchor="middle">diagnosis + verification assistance</text>

  <rect class="method" x="365" y="284" width="225" height="79"/>
  <text class="font label" x="478" y="313" text-anchor="middle">Conventional methods</text>
  <text class="font small" x="478" y="338" text-anchor="middle">models, algorithms, solvers</text>

  <rect class="method" x="365" y="393" width="225" height="96"/>
  <text class="font label" x="478" y="421" text-anchor="middle">Design tools</text>
  <text class="font small" x="478" y="446" text-anchor="middle">compilers + simulators</text>
  <text class="font small" x="478" y="469" text-anchor="middle">RTL, EDA + formal tools</text>

  <rect class="evidence" x="646" y="360" width="267" height="129"/>
  <text class="font label" x="779" y="389" text-anchor="middle">Measurements and checks</text>
  <text class="font small" x="779" y="416" text-anchor="middle">qualified tool returns + failures</text>
  <text class="font small" x="779" y="439" text-anchor="middle">assumptions + validity limits</text>
  <text class="font small" x="779" y="462" text-anchor="middle">independent rejection conditions</text>

  <path class="line" d="M 280 165 H 365"/>
  <path class="line" d="M 590 183 H 646"/>
  <path class="line" d="M 280 376 H 327 V 336 H 365"/>
  <path class="line" d="M 280 376 H 316 V 255 H 626 V 211 H 646"/>
  <path class="line" d="M 590 323 H 617 V 258 H 646"/>
  <path class="line" d="M 779 317 V 375 H 620 V 441 H 590"/>
  <path class="line" d="M 590 441 H 646"/>
  <path class="return" d="M 646 475 H 620 V 520 H 315 V 403 H 280"/>

  <rect class="decision" x="508" y="570" width="444" height="88"/>
  <text class="font label" x="730" y="600" text-anchor="middle">Supported architecture result</text>
  <text class="font small" x="730" y="625" text-anchor="middle">comparison + measurements + assumptions + checks + limits</text>
  <path class="line" d="M 779 489 V 570"/>

  <rect class="panel" x="48" y="570" width="232" height="88"/>
  <text class="font label" x="164" y="594" text-anchor="middle">Architecture role</text>
  <text class="font small" x="164" y="615" text-anchor="middle">supplies intent + constraints</text>
  <text class="font small" x="164" y="635" text-anchor="middle">reviews result + recommends</text>
  <text class="font small" x="164" y="652" text-anchor="middle">architecture commitment</text>
  <path class="line" d="M 508 614 H 280"/>
  <path class="line" d="M 164 570 V 450"/>

  <text class="font small" x="500" y="686" text-anchor="middle">The moonshot is complete-system capability, not autonomous prompt-to-chip generation.</text>
</svg>
