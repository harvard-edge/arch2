<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 775" role="img">
  <title>A reusable learned component inside an AI-assisted architecture design system</title>
  <desc>Reusable architecture data can train or adapt an optional foundation model for several architecture tasks. Live project state remains separate and authoritative. Conventional methods, design tools, and checks interact with the learned component inside an AI-assisted design system. The architecture role supplies intent and constraints, reviews the supported result, and forms a supported technical recommendation. A separate commitment authority decides whether the project advances, holds, or rejects the recommendation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; fill: #20252B; }
      .head { font-size: 16px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 700; }
      .small { font-size: 12.5px; fill: #59636D; }
      .panel { fill: #F8FAFC; stroke: #9AA8B5; stroke-width: 1.4; }
      .data { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .model { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.5; }
      .method { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.5; }
      .evidence { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
      .decision { fill: #FBEDF4; stroke: #D24D96; stroke-width: 1.5; }
      .line { fill: none; stroke: #333333; stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .return { fill: none; stroke: #1E9E48; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="775" fill="#FFFFFF"/>

  <text class="font head" x="48" y="48">Reusable architecture knowledge</text>
  <rect class="data" x="48" y="65" width="232" height="128"/>
  <text class="font label" x="68" y="92">Prior projects and literature</text>
  <text class="font small" x="68" y="118">design artifacts + documents</text>
  <text class="font small" x="68" y="141">tool traces + measurements</text>
  <text class="font small" x="68" y="164">failures + reviewed results</text>

  <text class="font head" x="48" y="250">Current project record</text>
  <rect class="data" x="48" y="267" width="232" height="147"/>
  <text class="font label" x="68" y="294">Versioned study state</text>
  <text class="font small" x="68" y="320">workload + software versions</text>
  <text class="font small" x="68" y="343">constraints + candidate identity</text>
  <text class="font small" x="68" y="366">tool, library + process versions</text>
  <text class="font small" x="68" y="389">current measurements + failures</text>

  <rect class="panel" x="326" y="40" width="626" height="464"/>
  <text class="font head" x="348" y="69">AI-assisted architecture design system</text>

  <rect class="model" x="365" y="99" width="225" height="96"/>
  <text class="font label" x="478" y="128" text-anchor="middle">Architecture foundation model</text>
  <text class="font small" x="478" y="153" text-anchor="middle">optional learned component</text>
  <text class="font small" x="478" y="175" text-anchor="middle">adapted to the current task</text>

  <text class="font label" x="646" y="99">Architecture tasks</text>
  <rect class="model" x="646" y="114" width="267" height="35"/>
  <text class="font small" x="779" y="136" text-anchor="middle">workload + requirements analysis</text>
  <rect class="model" x="646" y="158" width="267" height="35"/>
  <text class="font small" x="779" y="180" text-anchor="middle">prediction + design-space screening</text>
  <rect class="model" x="646" y="202" width="267" height="35"/>
  <text class="font small" x="779" y="224" text-anchor="middle">candidate, software + RTL generation</text>
  <rect class="model" x="646" y="246" width="267" height="35"/>
  <text class="font small" x="779" y="268" text-anchor="middle">diagnosis + verification assistance</text>

  <rect class="method" x="365" y="248" width="225" height="79"/>
  <text class="font label" x="478" y="277" text-anchor="middle">Conventional methods</text>
  <text class="font small" x="478" y="302" text-anchor="middle">models, algorithms, solvers</text>

  <rect class="method" x="365" y="357" width="225" height="96"/>
  <text class="font label" x="478" y="385" text-anchor="middle">Design tools</text>
  <text class="font small" x="478" y="410" text-anchor="middle">compilers + simulators</text>
  <text class="font small" x="478" y="433" text-anchor="middle">RTL, EDA + formal tools</text>

  <rect class="evidence" x="646" y="324" width="267" height="129"/>
  <text class="font label" x="779" y="353" text-anchor="middle">Measurements and checks</text>
  <text class="font small" x="779" y="380" text-anchor="middle">qualified tool returns + failures</text>
  <text class="font small" x="779" y="403" text-anchor="middle">assumptions + validity limits</text>
  <text class="font small" x="779" y="426" text-anchor="middle">independent rejection conditions</text>

  <path class="line" d="M 280 129 H 365"/>
  <path class="line" d="M 590 147 H 646"/>
  <path class="line" d="M 280 340 H 327 V 300 H 365"/>
  <path class="line" d="M 280 340 H 316 V 219 H 626 V 175 H 646"/>
  <path class="line" d="M 590 287 H 617 V 222 H 646"/>
  <path class="line" d="M 779 281 V 300 H 620 V 405 H 590"/>
  <path class="line" d="M 590 405 H 646"/>
  <path class="return" d="M 646 439 H 620 V 484 H 315 V 367 H 280"/>

  <rect class="decision" x="508" y="534" width="444" height="88"/>
  <text class="font label" x="730" y="564" text-anchor="middle">Supported architecture result</text>
  <text class="font small" x="730" y="589" text-anchor="middle">comparison + measurements + assumptions + checks + limits</text>
  <path class="line" d="M 779 453 V 534"/>

  <rect class="panel" x="48" y="534" width="232" height="100"/>
  <text class="font label" x="164" y="558" text-anchor="middle">Architecture role</text>
  <text class="font small" x="164" y="580" text-anchor="middle">supplies intent + constraints</text>
  <text class="font small" x="164" y="602" text-anchor="middle">reviews result and forms a</text>
  <text class="font small" x="164" y="620" text-anchor="middle">supported technical recommendation</text>
  <path class="line" d="M 508 578 H 280"/>
  <path class="line" d="M 164 534 V 414"/>

  <rect class="decision" x="48" y="666" width="232" height="66"/>
  <text class="font label" x="164" y="691" text-anchor="middle">Commitment authority</text>
  <text class="font small" x="164" y="716" text-anchor="middle">decides advance, hold, or reject</text>
  <path class="line" d="M 164 634 V 666"/>

  <text class="font small" x="500" y="758" text-anchor="middle">The moonshot is complete-system capability, not autonomous prompt-to-chip generation.</text>
</svg>
