<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="pyr-title pyr-desc">
  <title id="pyr-title">Simulation fidelity pyramid</title>
  <desc id="pyr-desc">A six-tier pyramid ordered from a broad, cheap, abundant base to a narrow, costly apex. From bottom to top the tiers are analytical models (spreadsheets, CACTI, McPAT, roofline estimates), trace-driven simulation (workload traces replayed through timing models), cycle-accurate simulation (gem5-class detailed models), RTL and gate-level simulation (Verilator-class logic simulation and netlist timing), FPGA emulation (FireSim-class prototypes), and physical silicon (taped-out measurements, the ground truth). A vertical axis on the left points upward to show increasing fidelity and cost.</desc>
  <defs>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636D"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .axis-label { font-size: 11.5px; font-weight: 700; fill: #59636D; letter-spacing: 0.4px; }
      .tier-title { font-size: 13.5px; font-weight: 700; fill: #20252B; }
      .tier-sub { font-size: 11px; fill: #333333; }
      .t1 { fill: #F8FAFC; stroke: #9AA8B5; stroke-width: 1.5; }
      .t2 { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .t3 { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.5; }
      .t4 { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.5; }
      .t5 { fill: #FBEDF4; stroke: #D24D96; stroke-width: 1.5; }
      .t6 { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="900" height="470" fill="#FFFFFF"/>
  <g class="font">
    <polygon class="t1" points="175,432 855,432 822.5,372 207.5,372"/>
    <text class="tier-title" x="515" y="396" text-anchor="middle">Analytical models (broadest, cheapest)</text>
    <text class="tier-sub" x="515" y="417" text-anchor="middle">spreadsheets, CACTI, McPAT, roofline estimates</text>

    <polygon class="t2" points="207.5,372 822.5,372 790,312 240,312"/>
    <text class="tier-title" x="515" y="336" text-anchor="middle">Trace-driven simulation</text>
    <text class="tier-sub" x="515" y="357" text-anchor="middle">workload traces replayed through timing models</text>

    <polygon class="t3" points="240,312 790,312 757.5,252 272.5,252"/>
    <text class="tier-title" x="515" y="276" text-anchor="middle">Cycle-accurate simulation</text>
    <text class="tier-sub" x="515" y="297" text-anchor="middle">gem5-class detailed microarchitectural models</text>

    <polygon class="t4" points="272.5,252 757.5,252 725,192 305,192"/>
    <text class="tier-title" x="515" y="216" text-anchor="middle">RTL &amp; gate-level simulation</text>
    <text class="tier-sub" x="515" y="237" text-anchor="middle">Verilator-class logic simulation, netlist timing</text>

    <polygon class="t5" points="305,192 725,192 692.5,132 337.5,132"/>
    <text class="tier-title" x="515" y="156" text-anchor="middle">FPGA emulation</text>
    <text class="tier-sub" x="515" y="177" text-anchor="middle">FireSim-class prototypes at MHz rates</text>

    <polygon class="t6" points="337.5,132 692.5,132 660,72 370,72"/>
    <text class="tier-title" x="515" y="96" text-anchor="middle">Physical silicon</text>
    <text class="tier-sub" x="515" y="117" text-anchor="middle">taped-out measurements, the ground truth</text>

    <line x1="150" y1="432" x2="150" y2="72" stroke="#59636D" stroke-width="2" marker-end="url(#arrow-up)"/>
    <text class="axis-label" x="95" y="252" text-anchor="middle" transform="rotate(-90 95 252)">Increasing fidelity &amp; cost</text>
  </g>
</svg>
