<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="levers-title levers-desc">
  <title id="levers-title">Architecture levers interact in a joint comparison</title>
  <desc id="levers-desc">A nonsequential hub-and-spoke diagram connects scaling, microarchitecture, optimization, specialization, and composition to one joint architecture comparison. The comparison must carry constraints, interfaces, tool feedback, rejected alternatives, and evidence.</desc>
  <defs>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .box { fill: #FFFFFF; stroke-width: 1.4; }
      .blue { stroke: #1683A6; fill: #E4F1F6; }
      .green { stroke: #1E9E48; fill: #E7F5EC; }
      .orange { stroke: #E68A17; fill: #FBF0DE; }
      .red { stroke: #DE3D3C; fill: #FDECEC; }
      .purple { stroke: #6A4FC7; fill: #F0ECFA; }
      .neutral { stroke: #9AA8B5; fill: #F5F8FA; }
      .label { font-size: 13.5px; font-weight: 700; fill: #222222; }
      .small { font-size: 11.5px; fill: #333333; }
      .note { font-size: 12.5px; font-weight: 700; fill: #1683A6; }
      .connector { stroke: #3E474B; stroke-width: 1.8; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
      .glyph { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .glyph-blue { color: #1683A6; }
      .glyph-green { color: #1E9E48; }
      .glyph-orange { color: #E68A17; }
      .glyph-red { color: #DE3D3C; }
      .glyph-purple { color: #6A4FC7; }
    </style>
  </defs>

  <rect width="960" height="320" fill="#FFFFFF"/>
  <g class="font">
    <path class="connector" d="M 215 59 H 325 V 145 H 350"/>
    <path class="connector" d="M 480 98 V 122"/>
    <path class="connector" d="M 745 59 H 635 V 145 H 610"/>
    <path class="connector" d="M 305 222 V 210 H 430 V 198"/>
    <path class="connector" d="M 655 222 V 210 H 530 V 198"/>

    <rect class="box blue" x="45" y="20" width="170" height="78"/>
    <g class="glyph glyph-blue" transform="translate(119 29) scale(0.64)">
      <path d="M 10 22 L 10 4"/>
      <path d="M 4 10 L 10 4 L 16 10"/>
      <path d="M 3 22 L 17 22"/>
    </g>
    <text class="label" x="130" y="65" text-anchor="middle">Scaling</text>
    <text class="small" x="130" y="83" text-anchor="middle">device, voltage, frequency</text>

    <rect class="box green" x="395" y="20" width="170" height="78"/>
    <g class="glyph glyph-green" transform="translate(469 29) scale(0.64)">
      <rect x="3" y="5" width="18" height="14"/>
      <path d="M 7 1 L 7 5"/>
      <path d="M 13 1 L 13 5"/>
      <path d="M 19 1 L 19 5"/>
      <path d="M 7 19 L 7 23"/>
      <path d="M 13 19 L 13 23"/>
      <path d="M 19 19 L 19 23"/>
    </g>
    <text class="label" x="480" y="65" text-anchor="middle">Microarchitecture</text>
    <text class="small" x="480" y="83" text-anchor="middle">ILP, caches, parallelism</text>

    <rect class="box red" x="745" y="20" width="170" height="78"/>
    <g class="glyph glyph-red" transform="translate(819 29) scale(0.64)">
      <path d="M 12 1 L 14.5 8.5 L 22 11 L 14.5 13.5 L 12 21 L 9.5 13.5 L 2 11 L 9.5 8.5 Z"/>
    </g>
    <text class="label" x="830" y="65" text-anchor="middle">Specialization</text>
    <text class="small" x="830" y="83" text-anchor="middle">vectors, DSAs, accelerators</text>

    <rect class="box neutral" x="350" y="122" width="260" height="76"/>
    <text class="note" x="480" y="148" text-anchor="middle">Joint architecture comparison</text>
    <text class="small" x="480" y="169" text-anchor="middle">constraints, interfaces, tool feedback</text>
    <text class="small" x="480" y="185" text-anchor="middle">rejected alternatives, evidence</text>

    <rect class="box orange" x="220" y="222" width="170" height="78"/>
    <g class="glyph glyph-orange" transform="translate(294 231) scale(0.64)">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="12" cy="12" r="4"/>
      <path d="M 19 5 L 24 0"/>
    </g>
    <text class="label" x="305" y="267" text-anchor="middle">Optimization</text>
    <text class="small" x="305" y="285" text-anchor="middle">mapping, scheduling, tuning</text>

    <rect class="box purple" x="570" y="222" width="170" height="78"/>
    <g class="glyph glyph-purple" transform="translate(644 231) scale(0.64)">
      <rect x="0" y="4" width="9" height="9"/>
      <rect x="14" y="4" width="9" height="9"/>
      <rect x="7" y="17" width="9" height="9"/>
    </g>
    <text class="label" x="655" y="267" text-anchor="middle">Composition</text>
    <text class="small" x="655" y="285" text-anchor="middle">chiplets, systems, deployment</text>
  </g>
</svg>
