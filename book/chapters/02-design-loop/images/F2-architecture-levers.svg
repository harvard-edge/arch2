<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="scale-title scale-desc">
  <title id="scale-title">Architecture comparison obligations accumulate across system scales</title>
  <desc id="scale-desc">Five architecture scales run from a core through an accelerator, system-on-chip or chiplet, wafer-scale system, and warehouse-scale system. Each scale adds obligations to a common comparison path. The path carries constraints, interfaces, workload and software assumptions, tool feedback, failures, and rejected alternatives into one cross-scale architecture comparison.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3E474B"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .scale { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.5; }
      .added { fill: #F5F8FA; stroke: #9AA8B5; stroke-width: 1.35; }
      .comparison { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.55; }
      .flow { fill: none; stroke: #3E474B; stroke-width: 1.7; stroke-linecap: square; stroke-linejoin: miter; }
      .guide { font-size: 11.5px; font-weight: 700; fill: #596772; letter-spacing: 0.35px; }
      .label { font-size: 13.5px; font-weight: 700; fill: #222222; }
      .small { font-size: 11.3px; fill: #333333; }
      .note { font-size: 11.5px; font-weight: 700; fill: #1B7837; }
    </style>
  </defs>

  <rect width="960" height="420" fill="#FFFFFF"/>
  <g class="font">
    <text class="guide" x="480" y="17" text-anchor="middle">SYSTEM BOUNDARY EXPANDS</text>
    <path class="flow" d="M 120 27 H 840" marker-end="url(#arrow)"/>

    <rect class="scale" x="20" y="47" width="168" height="63"/>
    <text class="label" x="104" y="76" text-anchor="middle">Core</text>
    <text class="small" x="104" y="96" text-anchor="middle">one microarchitecture</text>

    <rect class="scale" x="208" y="47" width="168" height="63"/>
    <text class="label" x="292" y="76" text-anchor="middle">Accelerator</text>
    <text class="small" x="292" y="96" text-anchor="middle">one specialized function</text>

    <rect class="scale" x="396" y="47" width="168" height="63"/>
    <text class="label" x="480" y="76" text-anchor="middle">SoC or chiplet</text>
    <text class="small" x="480" y="96" text-anchor="middle">one composed package</text>

    <rect class="scale" x="584" y="47" width="168" height="63"/>
    <text class="label" x="668" y="76" text-anchor="middle">Wafer-scale</text>
    <text class="small" x="668" y="96" text-anchor="middle">one physical fabric</text>

    <rect class="scale" x="772" y="47" width="168" height="63"/>
    <text class="label" x="856" y="76" text-anchor="middle">Warehouse-scale</text>
    <text class="small" x="856" y="96" text-anchor="middle">one deployed service</text>

    <path class="flow" d="M 104 110 V 136" marker-end="url(#arrow)"/>
    <path class="flow" d="M 292 110 V 136" marker-end="url(#arrow)"/>
    <path class="flow" d="M 480 110 V 136" marker-end="url(#arrow)"/>
    <path class="flow" d="M 668 110 V 136" marker-end="url(#arrow)"/>
    <path class="flow" d="M 856 110 V 136" marker-end="url(#arrow)"/>

    <rect class="added" x="20" y="142" width="168" height="98"/>
    <text class="guide" x="104" y="165" text-anchor="middle">ADDS</text>
    <text class="small" x="104" y="187" text-anchor="middle">pipeline and cache policies</text>
    <text class="small" x="104" y="205" text-anchor="middle">coherence and corner cases</text>
    <text class="small" x="104" y="223" text-anchor="middle">timing and physical checks</text>

    <rect class="added" x="208" y="142" width="168" height="98"/>
    <text class="guide" x="292" y="165" text-anchor="middle">ADDS</text>
    <text class="small" x="292" y="187" text-anchor="middle">workload mapping</text>
    <text class="small" x="292" y="205" text-anchor="middle">programming interface</text>
    <text class="small" x="292" y="223" text-anchor="middle">data movement</text>

    <rect class="added" x="396" y="142" width="168" height="98"/>
    <text class="guide" x="480" y="165" text-anchor="middle">ADDS</text>
    <text class="small" x="480" y="187" text-anchor="middle">integration and package</text>
    <text class="small" x="480" y="205" text-anchor="middle">interconnect and opaque IP</text>
    <text class="small" x="480" y="223" text-anchor="middle">test and signoff</text>

    <rect class="added" x="584" y="142" width="168" height="98"/>
    <text class="guide" x="668" y="165" text-anchor="middle">ADDS</text>
    <text class="small" x="668" y="187" text-anchor="middle">yield and repair</text>
    <text class="small" x="668" y="205" text-anchor="middle">power delivery and reach</text>
    <text class="small" x="668" y="223" text-anchor="middle">placement and scheduling</text>

    <rect class="added" x="772" y="142" width="168" height="98"/>
    <text class="guide" x="856" y="165" text-anchor="middle">ADDS</text>
    <text class="small" x="856" y="187" text-anchor="middle">network and facility limits</text>
    <text class="small" x="856" y="205" text-anchor="middle">failure and tail behavior</text>
    <text class="small" x="856" y="223" text-anchor="middle">deployment policy</text>

    <path class="flow" d="M 104 240 V 288 H 856"/>
    <path class="flow" d="M 292 240 V 288"/>
    <path class="flow" d="M 480 240 V 258"/>
    <path class="flow" d="M 480 281 V 288"/>
    <path class="flow" d="M 668 240 V 288"/>
    <path class="flow" d="M 856 240 V 288"/>
    <text class="guide" x="480" y="274" text-anchor="middle">COMPARISON OBLIGATIONS ACCUMULATE</text>
    <path class="flow" d="M 480 288 V 314" marker-end="url(#arrow)"/>

    <rect class="comparison" x="130" y="320" width="700" height="76"/>
    <text class="note" x="480" y="347" text-anchor="middle">Cross-scale architecture comparison</text>
    <text class="small" x="480" y="368" text-anchor="middle">constraints • interfaces • workload and software path • tool feedback</text>
    <text class="small" x="480" y="385" text-anchor="middle">failures • rejected alternatives • conditions that can reverse the decision</text>
  </g>
</svg>
