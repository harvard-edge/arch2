<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" font-family="Arial, Helvetica, sans-serif">
  <title>Technical synthesis and architecture commitment</title>
  <desc>Domain specialists provide qualified results and checks to an architect or architecture team, which forms a supported technical recommendation for a separate commitment authority. Monitoring and changed conditions can reopen the technical work. The accountable organization surrounds and resources all three roles.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3F4954"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="650" fill="#FFFFFF"/>

  <!-- Accountable organization surrounds the technical and commitment roles. -->
  <rect x="20" y="18" width="1060" height="612" fill="#F7F9FB" stroke="#8392A2" stroke-width="2"/>
  <rect x="20" y="18" width="1060" height="70" fill="#EEF2F5" stroke="#8392A2" stroke-width="2"/>
  <text x="50" y="47" font-size="14" font-weight="bold" fill="#20252B">Accountable organization</text>
  <text x="50" y="68" font-size="10.5" fill="#59636D">assigns and resources the roles &#183; maintains escalation and reopening &#183; remains answerable for product consequences</text>

  <!-- Domain specialists. -->
  <rect x="55" y="124" width="240" height="270" fill="#E7F5EC" stroke="#1E9E48" stroke-width="2"/>
  <text x="175" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#20252B">Domain specialists</text>
  <line x1="75" y1="171" x2="275" y2="171" stroke="#A8CDB3" stroke-width="1.2"/>
  <text x="82" y="201" font-size="11" fill="#20252B">Qualify scoped results and checks</text>
  <text x="82" y="230" font-size="11" fill="#20252B">State assumptions and limits</text>
  <text x="82" y="259" font-size="11" fill="#20252B">Own domain signoff or waiver</text>
  <text x="82" y="288" font-size="11" fill="#20252B">Return artifacts and failures</text>
  <rect x="76" y="318" width="198" height="52" fill="#FFFFFF" stroke="#A8CDB3" stroke-width="1"/>
  <text x="175" y="340" text-anchor="middle" font-size="9.5" fill="#59636D">workload &#183; software &#183; RTL</text>
  <text x="175" y="358" text-anchor="middle" font-size="9.5" fill="#59636D">verification &#183; physical design</text>

  <!-- Architect's positive technical work. -->
  <rect x="390" y="108" width="370" height="326" fill="#E4F1F6" stroke="#1683A6" stroke-width="2.4"/>
  <text x="575" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#20252B">Architect or architecture team</text>
  <text x="575" y="159" text-anchor="middle" font-size="10.5" fill="#59636D">frames and integrates the system</text>
  <line x1="414" y1="175" x2="736" y2="175" stroke="#A4CAD7" stroke-width="1.2"/>
  <text x="423" y="204" font-size="11" fill="#20252B">Frame the problem and product obligation</text>
  <text x="423" y="234" font-size="11" fill="#20252B">Choose the abstraction and system boundary</text>
  <text x="423" y="264" font-size="11" fill="#20252B">Connect workload, software, hardware, and physical layers</text>
  <text x="423" y="294" font-size="11" fill="#20252B">Interpret disagreement and missing evidence</text>
  <text x="423" y="324" font-size="11" fill="#20252B">State residual risk and recommendation limits</text>
  <rect x="414" y="352" width="322" height="58" fill="#FFFFFF" stroke="#A4CAD7" stroke-width="1"/>
  <text x="575" y="375" text-anchor="middle" font-size="9.7" font-weight="bold" fill="#136680">Direct technical access</text>
  <text x="575" y="394" text-anchor="middle" font-size="9.5" fill="#59636D">decisive artifacts &#183; failed checks &#183; tool returns</text>

  <!-- Commitment authority is distinct from technical recommendation. -->
  <rect x="860" y="124" width="190" height="270" fill="#F9EAF3" stroke="#D94C95" stroke-width="2"/>
  <text x="955" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#20252B">Commitment authority</text>
  <text x="955" y="181" text-anchor="middle" font-size="10.5" fill="#59636D">acts on the supported</text>
  <text x="955" y="197" text-anchor="middle" font-size="10.5" fill="#59636D">technical recommendation</text>
  <line x1="880" y1="216" x2="1030" y2="216" stroke="#E6A9C8" stroke-width="1.2"/>
  <text x="955" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#20252B">Advance</text>
  <text x="955" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#20252B">Hold</text>
  <text x="955" y="323" text-anchor="middle" font-size="12" font-weight="bold" fill="#20252B">Reject</text>
  <text x="955" y="351" text-anchor="middle" font-size="9.5" fill="#59636D">with required</text>
  <text x="955" y="367" text-anchor="middle" font-size="9.5" fill="#59636D">product concurrence</text>

  <!-- Information and recommendation paths. -->
  <path d="M 295 205 H 381" fill="none" stroke="#3F4954" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="338" y="177" text-anchor="middle" font-size="9.2" fill="#59636D">qualified results</text>
  <text x="338" y="189" text-anchor="middle" font-size="9.2" fill="#59636D">and checks</text>

  <path d="M 390 354 H 304" fill="none" stroke="#3F4954" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="347" y="329" text-anchor="middle" font-size="9.2" fill="#59636D">reframed question</text>
  <text x="347" y="341" text-anchor="middle" font-size="9.2" fill="#59636D">or stronger check</text>

  <path d="M 760 205 H 851" fill="none" stroke="#3F4954" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="805" y="177" text-anchor="middle" font-size="9.2" fill="#59636D">supported technical</text>
  <text x="805" y="189" text-anchor="middle" font-size="9.2" fill="#59636D">recommendation</text>

  <!-- Monitoring and reopening. -->
  <rect x="55" y="505" width="990" height="92" fill="#FFFFFF" stroke="#8392A2" stroke-width="1.8"/>
  <text x="80" y="535" font-size="12" font-weight="bold" fill="#20252B">Monitoring and changed conditions</text>
  <text x="80" y="558" font-size="10.5" fill="#59636D">workload &#183; software &#183; tools &#183; process &#183; implementation &#183; field behavior</text>
  <text x="80" y="580" font-size="10.5" fill="#59636D">A material change reopens the technical recommendation; it does not rewrite the earlier result.</text>

  <path d="M 955 394 V 496" fill="none" stroke="#3F4954" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="966" y="451" font-size="9.2" fill="#59636D">after an advance</text>

  <path d="M 575 505 V 443" fill="none" stroke="#3F4954" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="588" y="478" font-size="9.2" fill="#59636D">reopen technical work</text>
</svg>
