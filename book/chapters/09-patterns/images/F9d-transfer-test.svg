<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 548" role="img">
  <title>Transfer test from source record to target decision</title>
  <desc>A six-stage flow separates reusable source components from the source conclusion, traces changed dependencies to affected claims, assigns carry, update, replace, or retire actions, requires target and integration checks, and reaches a new target decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .source { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .unit { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.5; }
      .change { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.5; }
      .action { fill: #F5F8FA; stroke: #9AA8B5; stroke-width: 1.5; }
      .check { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
      .decision { fill: #FDECEC; stroke: #DE3D3C; stroke-width: 1.5; }
      .band { fill: #F5F8FA; stroke: #9AA8B5; stroke-width: 1.1; }
      .warning { fill: #FFF7F7; stroke: #DE3D3C; stroke-width: 1.2; }
      .label { font-size: 13px; font-weight: 700; fill: #222222; }
      .body { font-size: 11.5px; fill: #333333; }
      .small { font-size: 10.8px; fill: #59636D; }
      .note { font-size: 11.8px; font-weight: 700; fill: #1683A6; }
      .red-note { font-size: 11.4px; font-weight: 700; fill: #B62E2D; }
      .arrow { stroke: #333333; stroke-width: 1.8; fill: none; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1080" height="548" fill="#FFFFFF"/>
  <g class="font">
    <text class="note" x="540" y="31" text-anchor="middle">TRANSFER PRIOR WORK WITHOUT TRANSFERRING ITS CONCLUSION BY ASSUMPTION</text>

    <rect class="source" x="24" y="70" width="150" height="148"/>
    <text class="label" x="99" y="98" text-anchor="middle">source record</text>
    <text class="body" x="99" y="124" text-anchor="middle">artifacts + data</text>
    <text class="body" x="99" y="144" text-anchor="middle">methods + tools</text>
    <text class="body" x="99" y="164" text-anchor="middle">checks + limits</text>
    <text class="body" x="99" y="184" text-anchor="middle">supported conclusion</text>

    <rect class="unit" x="198" y="70" width="150" height="148"/>
    <text class="label" x="273" y="98" text-anchor="middle">transfer units</text>
    <text class="body" x="273" y="124" text-anchor="middle">data + state</text>
    <text class="body" x="273" y="144" text-anchor="middle">methods + interfaces</text>
    <text class="body" x="273" y="164" text-anchor="middle">checks + artifacts</text>
    <text class="body" x="273" y="184" text-anchor="middle">dependencies</text>

    <rect class="change" x="372" y="70" width="162" height="148"/>
    <text class="label" x="453" y="98" text-anchor="middle">changed dependencies</text>
    <text class="body" x="453" y="126" text-anchor="middle">trace each material change</text>
    <text class="body" x="453" y="148" text-anchor="middle">to the claims and interfaces</text>
    <text class="body" x="453" y="170" text-anchor="middle">that depend on it</text>

    <rect class="action" x="558" y="70" width="150" height="148"/>
    <text class="label" x="633" y="98" text-anchor="middle">target action</text>
    <text class="body" x="633" y="126" text-anchor="middle">carry</text>
    <text class="body" x="633" y="146" text-anchor="middle">update</text>
    <text class="body" x="633" y="166" text-anchor="middle">replace</text>
    <text class="body" x="633" y="186" text-anchor="middle">retire</text>

    <rect class="check" x="732" y="70" width="150" height="148"/>
    <text class="label" x="807" y="98" text-anchor="middle">target checks</text>
    <text class="body" x="807" y="126" text-anchor="middle">check affected units</text>
    <text class="body" x="807" y="148" text-anchor="middle">and every interface with</text>
    <text class="body" x="807" y="170" text-anchor="middle">a changed neighbor</text>

    <rect class="decision" x="906" y="70" width="150" height="148"/>
    <text class="label" x="981" y="98" text-anchor="middle">target decision</text>
    <text class="body" x="981" y="126" text-anchor="middle">new comparison</text>
    <text class="body" x="981" y="148" text-anchor="middle">target measurements</text>
    <text class="body" x="981" y="170" text-anchor="middle">supported conclusion</text>

    <line class="arrow" x1="174" y1="144" x2="198" y2="144"/>
    <line class="arrow" x1="348" y1="144" x2="372" y2="144"/>
    <line class="arrow" x1="534" y1="144" x2="558" y2="144"/>
    <line class="arrow" x1="708" y1="144" x2="732" y2="144"/>
    <line class="arrow" x1="882" y1="144" x2="906" y2="144"/>

    <rect class="warning" x="24" y="250" width="324" height="58"/>
    <text class="red-note" x="186" y="275" text-anchor="middle">components may move; the source conclusion does not</text>
    <text class="small" x="186" y="296" text-anchor="middle">keep it attached to the source conditions and limits</text>

    <rect class="band" x="372" y="250" width="336" height="58"/>
    <text class="label" x="540" y="275" text-anchor="middle">selective reopening</text>
    <text class="body" x="540" y="296" text-anchor="middle">reopen only claims affected by material changes</text>

    <rect class="band" x="732" y="250" width="324" height="58"/>
    <text class="label" x="894" y="275" text-anchor="middle">integration obligation</text>
    <text class="body" x="894" y="296" text-anchor="middle">changed interfaces require checks with their neighbors</text>

    <path class="arrow" d="M 99 218 L 99 250"/>
    <path class="arrow" d="M 453 218 L 453 250"/>
    <path class="arrow" d="M 807 218 L 807 250"/>

    <rect class="source" x="82" y="360" width="220" height="74"/>
    <text class="label" x="192" y="388" text-anchor="middle">source component</text>
    <text class="body" x="192" y="413" text-anchor="middle">meaning comes from dependencies</text>

    <rect class="change" x="430" y="360" width="220" height="74"/>
    <text class="label" x="540" y="388" text-anchor="middle">target context</text>
    <text class="body" x="540" y="413" text-anchor="middle">changed neighbors reopen affected claims</text>

    <rect class="check" x="778" y="360" width="220" height="74"/>
    <text class="label" x="888" y="388" text-anchor="middle">qualified target use</text>
    <text class="body" x="888" y="413" text-anchor="middle">new checks support a new decision</text>

    <line class="arrow" x1="302" y1="397" x2="430" y2="397"/>
    <line class="arrow" x1="650" y1="397" x2="778" y2="397"/>

    <rect class="band" x="205" y="478" width="670" height="38"/>
    <text class="note" x="540" y="502" text-anchor="middle">reuse saves work only when target checks preserve the meaning of what moved</text>
  </g>
</svg>
