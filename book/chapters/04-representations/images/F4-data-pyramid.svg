<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="obs-title obs-desc">
  <title id="obs-title">Choosing architecture observation sources</title>
  <desc id="obs-desc">A study starts with the architecture property it must observe, then compares six observation sources shown without a universal ranking: analytical models, trace-driven models, cycle-level simulation, RTL or gate-level analysis, FPGA or emulation, and fabricated silicon. For each obtained observation, the record preserves the source and version, property coverage, acquisition cost, conditions, and blind spots.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636D"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .eyebrow { font-size: 11px; font-weight: 700; fill: #59636D; letter-spacing: 0.8px; }
      .question { font-size: 17px; font-weight: 700; fill: #20252B; }
      .question-sub { font-size: 11.5px; fill: #4A5560; }
      .selector { font-size: 13px; font-weight: 700; fill: #2B596A; }
      .card-title { font-size: 13px; font-weight: 700; fill: #20252B; }
      .card-sub { font-size: 10.5px; fill: #4A5560; }
      .record-title { font-size: 12px; font-weight: 700; fill: #20252B; }
      .record-sub { font-size: 10.5px; fill: #4A5560; }
      .question-box { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.6; }
      .selector-box { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .source-group { fill: #FBFCFD; stroke: #9AA8B5; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .source-card { fill: #F8FAFC; stroke: #6F8794; stroke-width: 1.4; }
      .record-box { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.6; }
      .connector { fill: none; stroke: #59636D; stroke-width: 1.6; }
      .divider { stroke: #A8B8B0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="900" height="520" fill="#FFFFFF"/>
  <g class="font">
    <rect class="question-box" x="250" y="24" width="400" height="70" rx="8"/>
    <text class="eyebrow" x="450" y="47" text-anchor="middle">PROPERTY TO EXAMINE</text>
    <text class="question" x="450" y="69" text-anchor="middle">Property the study must observe</text>
    <text class="question-sub" x="450" y="86" text-anchor="middle">function · performance · timing · power · field behavior</text>

    <line class="connector" x1="450" y1="94" x2="450" y2="112" marker-end="url(#arrow)"/>
    <rect class="selector-box" x="245" y="118" width="410" height="38" rx="7"/>
    <text class="selector" x="450" y="142" text-anchor="middle">Compare coverage, cost, conditions, and blind spots</text>

    <line class="connector" x1="450" y1="156" x2="450" y2="170" marker-end="url(#arrow)"/>
    <rect class="source-group" x="35" y="176" width="830" height="194" rx="10"/>
    <text class="eyebrow" x="450" y="191" text-anchor="middle">OBSERVATION SOURCES SHOWN WITHOUT A UNIVERSAL RANKING</text>

    <rect class="source-card" x="55" y="196" width="250" height="72" rx="7"/>
    <text class="card-title" x="180" y="224" text-anchor="middle">Analytical models</text>
    <text class="card-sub" x="180" y="246" text-anchor="middle">equations and calibrated estimators</text>

    <rect class="source-card" x="325" y="196" width="250" height="72" rx="7"/>
    <text class="card-title" x="450" y="224" text-anchor="middle">Trace-driven models</text>
    <text class="card-sub" x="450" y="246" text-anchor="middle">behavior in captured event streams</text>

    <rect class="source-card" x="595" y="196" width="250" height="72" rx="7"/>
    <text class="card-title" x="720" y="224" text-anchor="middle">Cycle-level simulation</text>
    <text class="card-sub" x="720" y="246" text-anchor="middle">modeled microarchitectural state</text>

    <rect class="source-card" x="55" y="286" width="250" height="72" rx="7"/>
    <text class="card-title" x="180" y="314" text-anchor="middle">RTL &amp; gate-level analysis</text>
    <text class="card-sub" x="180" y="336" text-anchor="middle">logic behavior and implementation checks</text>

    <rect class="source-card" x="325" y="286" width="250" height="72" rx="7"/>
    <text class="card-title" x="450" y="314" text-anchor="middle">FPGA or emulation</text>
    <text class="card-sub" x="450" y="336" text-anchor="middle">mapped execution and longer workloads</text>

    <rect class="source-card" x="595" y="286" width="250" height="72" rx="7"/>
    <text class="card-title" x="720" y="314" text-anchor="middle">Fabricated silicon</text>
    <text class="card-sub" x="720" y="336" text-anchor="middle">one implementation under measured conditions</text>

    <line class="connector" x1="450" y1="370" x2="450" y2="392" marker-end="url(#arrow)"/>
    <text class="eyebrow" x="450" y="410" text-anchor="middle">RECORD EACH OBSERVATION WITH ITS CONTEXT</text>

    <rect class="record-box" x="55" y="424" width="790" height="72" rx="8"/>
    <line class="divider" x1="252.5" y1="436" x2="252.5" y2="484"/>
    <line class="divider" x1="450" y1="436" x2="450" y2="484"/>
    <line class="divider" x1="647.5" y1="436" x2="647.5" y2="484"/>

    <text class="record-title" x="153.75" y="454" text-anchor="middle">Source and version</text>
    <text class="record-sub" x="153.75" y="476" text-anchor="middle">what produced the observation</text>

    <text class="record-title" x="351.25" y="454" text-anchor="middle">Property coverage</text>
    <text class="record-sub" x="351.25" y="476" text-anchor="middle">what the source can observe</text>

    <text class="record-title" x="548.75" y="454" text-anchor="middle">Acquisition cost</text>
    <text class="record-sub" x="548.75" y="476" text-anchor="middle">time, compute, licenses, and human work</text>

    <text class="record-title" x="746.25" y="454" text-anchor="middle">Conditions and blind spots</text>
    <text class="record-sub" x="746.25" y="476" text-anchor="middle">where it applies and what it misses</text>
  </g>
</svg>
