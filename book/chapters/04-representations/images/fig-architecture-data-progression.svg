<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="progression-title progression-desc">
  <title id="progression-title">Architecture sources become linked representations for method choice</title>
  <desc id="progression-desc">A left-to-right sequence begins with heterogeneous architecture sources, passes through a checked dataset, separates durable knowledge from current project state, and forms linked native, structured, and optional learned representations before method choice. A bar across the bottom states that source identity, versions, acquisition conditions, and links remain attached throughout. Native artifacts remain the source of record.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636D"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .eyebrow { font-size: 10.5px; font-weight: 700; fill: #59636D; letter-spacing: 0.7px; }
      .title { font-size: 13px; font-weight: 700; fill: #20252B; }
      .sub { font-size: 10.5px; fill: #4A5560; }
      .source { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .checked { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
      .state { fill: #F8FAFC; stroke: #6F8794; stroke-width: 1.4; }
      .representation { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.4; }
      .learned { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.4; }
      .handoff { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.6; }
      .group { fill: #FBFCFD; stroke: #9AA8B5; stroke-width: 1.1; stroke-dasharray: 5 4; }
      .linkbar { fill: #F5F8FA; stroke: #6F8794; stroke-width: 1.2; }
      .connector { fill: none; stroke: #59636D; stroke-width: 1.7; stroke-linecap: square; stroke-linejoin: miter; }
      .link { fill: none; stroke: #6F8794; stroke-width: 1.2; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect width="980" height="470" fill="#FFFFFF"/>
  <g class="font">
    <text class="eyebrow" x="100" y="66" text-anchor="middle">SOURCE ARTIFACTS</text>
    <rect class="source" x="20" y="82" width="160" height="152"/>
    <text class="title" x="100" y="110" text-anchor="middle">Heterogeneous sources</text>
    <text class="sub" x="100" y="138" text-anchor="middle">specifications · code · RTL</text>
    <text class="sub" x="100" y="158" text-anchor="middle">workloads · traces · reports</text>
    <text class="sub" x="100" y="178" text-anchor="middle">failures · reviews · silicon</text>
    <text class="sub" x="100" y="210" text-anchor="middle">different cost, coverage,</text>
    <text class="sub" x="100" y="226" text-anchor="middle">access, and authority</text>

    <path class="connector" d="M 180 158 L 210 158" marker-end="url(#arrow)"/>

    <text class="eyebrow" x="295" y="66" text-anchor="middle">CHECKED DATA</text>
    <rect class="checked" x="215" y="102" width="160" height="112"/>
    <text class="title" x="295" y="130" text-anchor="middle">Architecture dataset</text>
    <text class="sub" x="295" y="154" text-anchor="middle">aligned identities and units</text>
    <text class="sub" x="295" y="174" text-anchor="middle">conditions · acquisition cost</text>
    <text class="sub" x="295" y="194" text-anchor="middle">failed and missing records</text>

    <path class="connector" d="M 375 158 L 405 158" marker-end="url(#arrow)"/>

    <text class="eyebrow" x="500" y="66" text-anchor="middle">WHAT PERSISTS</text>
    <rect class="group" x="410" y="82" width="180" height="152"/>
    <rect class="state" x="425" y="102" width="150" height="48"/>
    <text class="title" x="500" y="123" text-anchor="middle">Durable knowledge</text>
    <text class="sub" x="500" y="140" text-anchor="middle">prior mechanisms · results</text>
    <rect class="source" x="425" y="166" width="150" height="60"/>
    <text class="title" x="500" y="184" text-anchor="middle">Current project state</text>
    <text class="sub" x="500" y="203" text-anchor="middle">hardware and software</text>
    <text class="sub" x="500" y="217" text-anchor="middle">workload and constraints</text>

    <path class="connector" d="M 590 158 L 620 158" marker-end="url(#arrow)"/>

    <text class="eyebrow" x="720" y="66" text-anchor="middle">LINKED REPRESENTATIONS</text>
    <rect class="group" x="625" y="82" width="190" height="152"/>
    <rect class="source" x="640" y="98" width="160" height="34"/>
    <text class="title" x="720" y="120" text-anchor="middle">Native artifacts</text>
    <rect class="representation" x="640" y="141" width="160" height="34"/>
    <text class="title" x="720" y="163" text-anchor="middle">Structured views</text>
    <rect class="learned" x="640" y="184" width="160" height="42"/>
    <text class="title" x="720" y="200" text-anchor="middle">Optional learned</text>
    <text class="title" x="720" y="216" text-anchor="middle">views</text>

    <path class="connector" d="M 815 158 L 845 158" marker-end="url(#arrow)"/>

    <text class="eyebrow" x="910" y="66" text-anchor="middle">NEXT DECISION</text>
    <rect class="handoff" x="850" y="102" width="120" height="112"/>
    <text class="title" x="910" y="132" text-anchor="middle">Method handoff</text>
    <text class="sub" x="910" y="156" text-anchor="middle">named capability</text>
    <text class="sub" x="910" y="176" text-anchor="middle">legal action space</text>
    <text class="sub" x="910" y="196" text-anchor="middle">checks and limits</text>

    <path class="link" d="M 100 234 L 100 306"/>
    <path class="link" d="M 295 214 L 295 306"/>
    <path class="link" d="M 500 234 L 500 306"/>
    <path class="link" d="M 720 234 L 720 306"/>
    <path class="link" d="M 910 214 L 910 306"/>

    <rect class="linkbar" x="20" y="306" width="950" height="104"/>
    <text class="title" x="500" y="338" text-anchor="middle">Source identity and conditions remain linked</text>
    <text class="sub" x="500" y="364" text-anchor="middle">versions · workload and software state · tool path · acquisition conditions · access and license limits</text>
    <text class="sub" x="500" y="390" text-anchor="middle">Native artifacts remain the source of record; derived views expose selected properties for a named task.</text>
  </g>
</svg>
