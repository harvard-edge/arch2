<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="roadmap-title roadmap-desc">
  <title id="roadmap-title">Ecosystem staging sequence for bootstrapping Architecture 2.0</title>
  <desc id="roadmap-desc">Four sequential phases show the execution roadmap: Phase 1 Open Foundations (Steps 1 and 2), Phase 2 Consortium Governance (Step 3), Phase 3 Acceleration and Audit (Steps 4 and 5), and Phase 4 Scale and Signoff (Step 6). A green feedback loop connects public negative design attempts back to foundational data schemas and surrogate calibration.</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636D"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E9E48"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .eyebrow { font-size: 10.5px; font-weight: 700; fill: #59636D; letter-spacing: 0.7px; }
      .head { font-size: 15px; font-weight: 700; fill: #20252B; }
      .title { font-size: 13px; font-weight: 700; fill: #20252B; }
      .sub { font-size: 10.5px; fill: #4A5560; }
      .tag { font-size: 10px; font-weight: 700; fill: #59636D; }
      .source { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .learned { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.5; }
      .representation { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.5; }
      .checked { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
      .decision { fill: #FBEDF4; stroke: #D24D96; stroke-width: 1.5; }
      .panel { fill: #F8FAFC; stroke: #9AA8B5; stroke-width: 1.4; }
      .linkbar { fill: #F5F8FA; stroke: #6F8794; stroke-width: 1.2; }
      .connector { fill: none; stroke: #59636D; stroke-width: 1.7; stroke-linecap: square; stroke-linejoin: miter; }
      .return { fill: none; stroke: #1E9E48; stroke-width: 1.8; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1000" height="520" fill="#FFFFFF"/>

  <g class="font">
    <!-- Header -->
    <text class="head" x="40" y="38">Bootstrapping the Architecture 2.0 Ecosystem</text>

    <!-- PHASE 1 -->
    <text class="eyebrow" x="135" y="68" text-anchor="middle">PHASE 1: OPEN FOUNDATIONS</text>
    <rect class="source" x="30" y="84" width="210" height="152"/>
    <text class="tag" x="45" y="104">STEP 1</text>
    <text class="title" x="45" y="124">Open data schemas</text>
    <text class="title" x="45" y="140">&amp; tool contracts</text>
    <text class="sub" x="45" y="164">• Open Agentic Interface (OAI)</text>
    <text class="sub" x="45" y="180">• SLSA attempt lineage headers</text>
    <text class="sub" x="45" y="196">• Protobuf / JSON-LD schemas</text>
    <text class="sub" x="45" y="212">• Tool AI-readiness certs</text>

    <rect class="source" x="30" y="254" width="210" height="152"/>
    <text class="tag" x="45" y="274">STEP 2</text>
    <text class="title" x="45" y="294">Open PDKs &amp; cloud</text>
    <text class="title" x="45" y="310">silicon shuttles</text>
    <text class="sub" x="45" y="334">• Sky130 &amp; ASAP7 open PDKs</text>
    <text class="sub" x="45" y="350">• Cloud MPW shuttle passes</text>
    <text class="sub" x="45" y="366">• OpenROAD / OpenSTA flow</text>
    <text class="sub" x="45" y="382">• AI shuttle telemetry grants</text>

    <path class="connector" d="M 240 248 L 270 248" marker-end="url(#arrow-gray)"/>

    <!-- PHASE 2 -->
    <text class="eyebrow" x="375" y="68" text-anchor="middle">PHASE 2: GOVERNANCE</text>
    <rect class="learned" x="270" y="84" width="210" height="322"/>
    <text class="tag" x="285" y="104">STEP 3</text>
    <text class="title" x="285" y="124">Consortium governance</text>
    <text class="title" x="285" y="140">&amp; matched benchmarks</text>
    <text class="sub" x="285" y="168">• MLCommons / SPEC working group</text>
    <text class="sub" x="285" y="190">• Reference problem suites:</text>
    <text class="sub" x="300" y="208">3 W XR, RISC-V RV64GCV,</text>
    <text class="sub" x="300" y="224">CXL &amp; UCIe chiplet targets</text>
    <text class="sub" x="285" y="248">• Closed division rules:</text>
    <text class="sub" x="300" y="266">locked wrappers + compute</text>
    <text class="sub" x="285" y="290">• Open division rules:</text>
    <text class="sub" x="300" y="308">unconstrained surrogates</text>
    <text class="sub" x="285" y="332">• Total workflow cost accounting:</text>
    <text class="sub" x="300" y="350">GPU hours + license minutes</text>
    <text class="sub" x="300" y="366">plus human triage time</text>

    <path class="connector" d="M 480 248 L 510 248" marker-end="url(#arrow-gray)"/>

    <!-- PHASE 3 -->
    <text class="eyebrow" x="615" y="68" text-anchor="middle">PHASE 3: ACCELERATION</text>
    <rect class="representation" x="510" y="84" width="210" height="152"/>
    <text class="tag" x="525" y="104">STEP 4</text>
    <text class="title" x="525" y="124">Grand challenges &amp;</text>
    <text class="title" x="525" y="140">architecture contests</text>
    <text class="sub" x="525" y="164">• ISCA / MICRO / DAC tracks</text>
    <text class="sub" x="525" y="180">• Constrained PPA generation</text>
    <text class="sub" x="525" y="196">• Sample-efficient DSE</text>
    <text class="sub" x="525" y="212">• Red-teaming &amp; SVA security</text>

    <rect class="representation" x="510" y="254" width="210" height="152"/>
    <text class="tag" x="525" y="274">STEP 5</text>
    <text class="title" x="525" y="294">Public repositories of</text>
    <text class="title" x="525" y="310">failed design attempts</text>
    <text class="sub" x="525" y="334">• Unroutable floorplan logs</text>
    <text class="sub" x="525" y="350">• Negative-slack STA reports</text>
    <text class="sub" x="525" y="366">• UPF power domain conflicts</text>
    <text class="sub" x="525" y="382">• Negative controls for physics</text>

    <path class="connector" d="M 720 248 L 750 248" marker-end="url(#arrow-gray)"/>

    <!-- PHASE 4 -->
    <text class="eyebrow" x="855" y="68" text-anchor="middle">PHASE 4: SCALE &amp; SIGN-OFF</text>
    <rect class="checked" x="750" y="84" width="220" height="322"/>
    <text class="tag" x="765" y="104">STEP 6</text>
    <text class="title" x="765" y="124">Workforce curricula &amp;</text>
    <text class="title" x="765" y="140">silicon sign-off</text>
    <text class="sub" x="765" y="168">• University curriculum pivot:</text>
    <text class="sub" x="780" y="186">formulation + verification</text>
    <text class="sub" x="765" y="210">• Diagnostic fault-injection labs</text>
    <text class="sub" x="765" y="234">• Autonomous Workflow Certified</text>
    <text class="sub" x="780" y="252">(AWC) conference badges</text>
    <text class="sub" x="765" y="276">• Supported architecture claims</text>
    <text class="sub" x="780" y="294">for tapeout commitment</text>
    <text class="sub" x="765" y="360">• Democratized ASIC economics</text>

    <!-- Return Feedback Arc (Step 5 -> Step 1) -->
    <path class="return" d="M 615 406 V 440 H 14 V 160 H 30" marker-end="url(#arrow-green)"/>
    <rect class="linkbar" x="160" y="426" width="310" height="26"/>
    <text class="sub" x="315" y="443" text-anchor="middle" font-weight="700" fill="#157A38">Negative controls calibrate surrogate physical feasibility</text>

    <!-- Footer Note -->
    <text class="sub" x="500" y="492" text-anchor="middle">Foundational data schemas and physical signoff harnesses must precede unconstrained generation or search.</text>
  </g>
</svg>
