<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img">
  <title>Conditional method selection for architecture work</title>
  <desc>A flow starts with the architecture decision and asks whether direct or conventional work is sufficient. If not, it diagnoses missing artifacts, expensive outcomes, too many alternatives, sequential state, or saturated checking and review. These conditions point toward generation, prediction, optimization, transition-aware methods, or improving the checking path. Every route ends at an evaluator, fallback, and stopping rule.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; fill: #20252B; }
      .head { font-size: 16px; font-weight: 700; }
      .label { font-size: 13.5px; font-weight: 700; }
      .small { font-size: 12px; fill: #59636D; }
      .neutral { fill: #F8FAFC; stroke: #9AA8B5; stroke-width: 1.5; }
      .work { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .method { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.5; }
      .direct { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.5; }
      .check { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
      .risk { fill: #FDECEC; stroke: #DE3D3C; stroke-width: 1.5; }
      .line { fill: none; stroke: #333333; stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .join { fill: none; stroke: #333333; stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: miter; }
    </style>
  </defs>
  <rect width="1000" height="600" fill="#FFFFFF"/>

  <rect class="work" x="335" y="35" width="330" height="64"/>
  <text class="font label" x="500" y="61" text-anchor="middle">State the architecture decision and output</text>
  <text class="font small" x="500" y="84" text-anchor="middle">comparator + constraints + legal actions + budget</text>

  <rect class="neutral" x="335" y="133" width="330" height="68"/>
  <text class="font label" x="500" y="160" text-anchor="middle">Can direct or conventional work settle it</text>
  <text class="font label" x="500" y="181" text-anchor="middle">within the required cost and time?</text>
  <path class="line" d="M 500 99 V 133"/>

  <rect class="direct" x="720" y="135" width="225" height="64"/>
  <text class="font label" x="833" y="161" text-anchor="middle">Use direct or conventional work</text>
  <text class="font small" x="833" y="182" text-anchor="middle">add no component that removes no work</text>
  <path class="line" d="M 665 167 H 720"/>
  <text class="font small" x="689" y="157">yes</text>

  <rect class="neutral" x="335" y="239" width="330" height="58"/>
  <text class="font label" x="500" y="264" text-anchor="middle">Which work limits the next decision?</text>
  <text class="font small" x="500" y="284" text-anchor="middle">one or more shortages may apply</text>
  <path class="line" d="M 500 201 V 239"/>
  <text class="font small" x="510" y="222">no</text>

  <rect class="method" x="48" y="347" width="166" height="72"/>
  <text class="font label" x="131" y="375" text-anchor="middle">Missing artifact</text>
  <text class="font small" x="131" y="399" text-anchor="middle">consider generation</text>

  <rect class="method" x="232" y="347" width="166" height="72"/>
  <text class="font label" x="315" y="375" text-anchor="middle">Costly outcome</text>
  <text class="font small" x="315" y="399" text-anchor="middle">consider prediction</text>

  <rect class="method" x="416" y="347" width="166" height="72"/>
  <text class="font label" x="499" y="375" text-anchor="middle">Too many choices</text>
  <text class="font small" x="499" y="399" text-anchor="middle">consider optimization</text>

  <rect class="method" x="600" y="347" width="166" height="72"/>
  <text class="font label" x="683" y="375" text-anchor="middle">Sequential state</text>
  <text class="font small" x="683" y="396" text-anchor="middle">transition model or</text>
  <text class="font small" x="683" y="412" text-anchor="middle">sequential optimization</text>

  <rect class="risk" x="784" y="347" width="166" height="72"/>
  <text class="font label" x="867" y="372" text-anchor="middle">Checking saturated</text>
  <text class="font small" x="867" y="394" text-anchor="middle">improve checks or</text>
  <text class="font small" x="867" y="411" text-anchor="middle">reduce arriving work</text>

  <path class="line" d="M 500 297 V 319 H 131 V 347"/>
  <path class="line" d="M 500 297 V 319 H 315 V 347"/>
  <path class="line" d="M 500 297 V 347"/>
  <path class="line" d="M 500 297 V 319 H 683 V 347"/>
  <path class="line" d="M 500 297 V 319 H 867 V 347"/>

  <rect class="check" x="190" y="485" width="620" height="82"/>
  <text class="font head" x="500" y="514" text-anchor="middle">End every route at the evaluator, fallback, and stop</text>
  <text class="font small" x="500" y="538" text-anchor="middle">declare support + total cost + named check + recovery path + stopping condition</text>
  <text class="font small" x="500" y="557" text-anchor="middle">reject the method when any of these cannot support the consequence</text>

  <path class="join" d="M 131 419 V 450 H 500"/>
  <path class="join" d="M 315 419 V 450 H 500"/>
  <path class="join" d="M 499 419 V 450"/>
  <path class="join" d="M 683 419 V 450 H 500"/>
  <path class="join" d="M 867 419 V 450 H 500"/>
  <path class="line" d="M 500 450 V 485"/>
  <path class="line" d="M 945 167 H 970 V 465 H 780 V 485"/>
</svg>
