<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img">
  <title>Conditional method selection for architecture work</title>
  <desc>A flow starts with the architecture decision and asks whether direct or conventional work is sufficient. If not, it diagnoses missing artifacts, expensive outcomes, too many alternatives, sequential state, or saturated checking and review. These conditions point toward generation, prediction, optimization, transition-aware methods, or improving the checking path. Every route ends at an evaluator, fallback, and stopping rule.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; fill: #20252B; }
      .title { font-size: 21px; font-weight: 700; }
      .head { font-size: 16px; font-weight: 700; }
      .label { font-size: 13.5px; font-weight: 700; }
      .small { font-size: 12px; fill: #59636D; }
      .neutral { fill: #F8FAFC; stroke: #9AA8B5; stroke-width: 1.5; }
      .work { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .method { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.5; }
      .direct { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.5; }
      .check { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
      .risk { fill: #FDECEC; stroke: #DE3D3C; stroke-width: 1.5; }
      .line { fill: none; stroke: #333333; stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .join { fill: none; stroke: #333333; stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: miter; }
    </style>
  </defs>
  <rect width="1000" height="650" fill="#FFFFFF"/>
  <text class="font title" x="50" y="42">Choose the smallest approach that relieves the limiting work</text>

  <rect class="work" x="335" y="70" width="330" height="64"/>
  <text class="font label" x="500" y="96" text-anchor="middle">State the architecture decision and output</text>
  <text class="font small" x="500" y="119" text-anchor="middle">comparator + constraints + legal actions + budget</text>

  <rect class="neutral" x="335" y="168" width="330" height="68"/>
  <text class="font label" x="500" y="195" text-anchor="middle">Can direct or conventional work settle it</text>
  <text class="font label" x="500" y="216" text-anchor="middle">within the required cost and time?</text>
  <path class="line" d="M 500 134 V 168"/>

  <rect class="direct" x="720" y="170" width="225" height="64"/>
  <text class="font label" x="833" y="196" text-anchor="middle">Use direct or conventional work</text>
  <text class="font small" x="833" y="217" text-anchor="middle">add no component that removes no work</text>
  <path class="line" d="M 665 202 H 720"/>
  <text class="font small" x="689" y="192">yes</text>

  <rect class="neutral" x="335" y="274" width="330" height="58"/>
  <text class="font label" x="500" y="299" text-anchor="middle">Which work limits the next decision?</text>
  <text class="font small" x="500" y="319" text-anchor="middle">one or more shortages may apply</text>
  <path class="line" d="M 500 236 V 274"/>
  <text class="font small" x="510" y="257">no</text>

  <rect class="method" x="48" y="382" width="166" height="72"/>
  <text class="font label" x="131" y="410" text-anchor="middle">Missing artifact</text>
  <text class="font small" x="131" y="434" text-anchor="middle">consider generation</text>

  <rect class="method" x="232" y="382" width="166" height="72"/>
  <text class="font label" x="315" y="410" text-anchor="middle">Costly outcome</text>
  <text class="font small" x="315" y="434" text-anchor="middle">consider prediction</text>

  <rect class="method" x="416" y="382" width="166" height="72"/>
  <text class="font label" x="499" y="410" text-anchor="middle">Too many choices</text>
  <text class="font small" x="499" y="434" text-anchor="middle">consider optimization</text>

  <rect class="method" x="600" y="382" width="166" height="72"/>
  <text class="font label" x="683" y="410" text-anchor="middle">Sequential state</text>
  <text class="font small" x="683" y="431" text-anchor="middle">transition model or</text>
  <text class="font small" x="683" y="447" text-anchor="middle">sequential optimization</text>

  <rect class="risk" x="784" y="382" width="166" height="72"/>
  <text class="font label" x="867" y="407" text-anchor="middle">Checking saturated</text>
  <text class="font small" x="867" y="429" text-anchor="middle">improve checks or</text>
  <text class="font small" x="867" y="446" text-anchor="middle">reduce arriving work</text>

  <path class="line" d="M 500 332 V 354 H 131 V 382"/>
  <path class="line" d="M 500 332 V 354 H 315 V 382"/>
  <path class="line" d="M 500 332 V 382"/>
  <path class="line" d="M 500 332 V 354 H 683 V 382"/>
  <path class="line" d="M 500 332 V 354 H 867 V 382"/>

  <rect class="check" x="190" y="520" width="620" height="82"/>
  <text class="font head" x="500" y="549" text-anchor="middle">End every route at the evaluator, fallback, and stop</text>
  <text class="font small" x="500" y="573" text-anchor="middle">declare support + total cost + named check + recovery path + stopping condition</text>
  <text class="font small" x="500" y="592" text-anchor="middle">reject the method when any of these cannot support the consequence</text>

  <path class="join" d="M 131 454 V 485 H 500"/>
  <path class="join" d="M 315 454 V 485 H 500"/>
  <path class="join" d="M 499 454 V 485"/>
  <path class="join" d="M 683 454 V 485 H 500"/>
  <path class="join" d="M 867 454 V 485 H 500"/>
  <path class="line" d="M 500 485 V 520"/>
  <path class="line" d="M 833 234 H 970 V 500 H 780 V 520"/>
</svg>
