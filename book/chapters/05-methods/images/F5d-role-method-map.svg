<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 567" role="img" aria-labelledby="title desc">
  <title id="title">Engineering roles and method families form a many-to-many map</title>
  <desc id="desc">Eight engineering roles, propose, screen, search, critique, repair, check, explain, and coordinate, feed a separate choice among prediction, generation, optimization, and another method family. A visible bypass carries a role directly to the inspectable-output handoff when direct tool use needs no added method. When a method is added, representative concrete mechanisms are grouped as conventional, learned, or hybrid. Every path returns an inspectable output followed by a named next check. The map does not assign one method family to each role or impose an order on prediction, generation, and optimization.</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636D"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1683A6"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .eyebrow { font-size: 11.5px; font-weight: 700; fill: #59636D; letter-spacing: 0.65px; }
      .panel-title { font-size: 17px; font-weight: 700; fill: #20252B; }
      .role { font-size: 14px; font-weight: 700; fill: #20252B; }
      .choice { font-size: 15px; font-weight: 700; fill: #20252B; }
      .small { font-size: 12.5px; fill: #3F4A53; }
      .arrow-label { font-size: 11.5px; font-weight: 700; fill: #59636D; }
      .direct-label { font-size: 11.5px; font-weight: 700; fill: #136680; }
      .category { font-size: 10.5px; font-weight: 700; fill: #59429E; letter-spacing: 0.45px; }
      .mechanism { font-size: 11.5px; font-weight: 600; fill: #20252B; }
      .note { font-size: 13.5px; font-weight: 700; fill: #2B596A; }
      .panel { fill: #FBFCFD; stroke: #9AA8B5; stroke-width: 1.3; }
      .role-box { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.25; }
      .prediction { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.35; }
      .generation { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.35; }
      .optimization { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.35; }
      .other { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.35; }
      .technique { fill: #FFFFFF; stroke: #6A4FC7; stroke-width: 1.3; }
      .output { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.4; }
      .check { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.4; }
      .flow { fill: none; stroke: #59636D; stroke-width: 1.7; }
      .flow-blue { fill: none; stroke: #1683A6; stroke-width: 1.8; }
      .direct-flow { fill: none; stroke: #1683A6; stroke-width: 1.8; }
      .selection-band { fill: #F5F8FA; stroke: #9AA8B5; stroke-width: 1.1; }
    </style>
  </defs>

  <rect width="1260" height="567" fill="#FFFFFF"/>
  <g class="font">
    <rect class="panel" x="30" y="35" width="245" height="418"/>
    <text class="panel-title" x="152.5" y="65" text-anchor="middle">Engineering Role</text>
    <text class="small" x="152.5" y="85" text-anchor="middle">name the work first</text>

    <rect class="role-box" x="50" y="109" width="92" height="58"/>
    <text class="role" x="96" y="143" text-anchor="middle">Propose</text>
    <rect class="role-box" x="163" y="109" width="92" height="58"/>
    <text class="role" x="209" y="143" text-anchor="middle">Screen</text>
    <rect class="role-box" x="50" y="185" width="92" height="58"/>
    <text class="role" x="96" y="219" text-anchor="middle">Search</text>
    <rect class="role-box" x="163" y="185" width="92" height="58"/>
    <text class="role" x="209" y="219" text-anchor="middle">Critique</text>
    <rect class="role-box" x="50" y="261" width="92" height="58"/>
    <text class="role" x="96" y="295" text-anchor="middle">Repair</text>
    <rect class="role-box" x="163" y="261" width="92" height="58"/>
    <text class="role" x="209" y="295" text-anchor="middle">Check</text>
    <rect class="role-box" x="50" y="337" width="92" height="58"/>
    <text class="role" x="96" y="371" text-anchor="middle">Explain</text>
    <rect class="role-box" x="163" y="337" width="92" height="58"/>
    <text class="role" x="209" y="371" text-anchor="middle">Coordinate</text>
    <text class="eyebrow" x="152.5" y="427" text-anchor="middle">EQUAL PEERS IN THE MAP</text>

    <text class="arrow-label" x="300" y="226" text-anchor="middle">many-to-</text>
    <text class="arrow-label" x="300" y="240" text-anchor="middle">many</text>
    <line class="flow" x1="275" y1="254" x2="325" y2="254" marker-end="url(#arrow-gray)"/>

    <rect class="panel" x="325" y="35" width="405" height="418"/>
    <text class="panel-title" x="527.5" y="65" text-anchor="middle">Choose One or More Method Families</text>
    <text class="small" x="527.5" y="85" text-anchor="middle">the role does not determine the family</text>

    <rect class="prediction" x="350" y="113" width="165" height="92"/>
    <text class="choice" x="432.5" y="150" text-anchor="middle">Prediction</text>
    <text class="small" x="432.5" y="173" text-anchor="middle">estimate a property</text>

    <rect class="generation" x="540" y="113" width="165" height="92"/>
    <text class="choice" x="622.5" y="150" text-anchor="middle">Generation</text>
    <text class="small" x="622.5" y="173" text-anchor="middle">construct a candidate</text>

    <rect class="optimization" x="350" y="229" width="165" height="92"/>
    <text class="choice" x="432.5" y="266" text-anchor="middle">Optimization</text>
    <text class="small" x="432.5" y="289" text-anchor="middle">select among alternatives</text>

    <rect class="other" x="540" y="229" width="165" height="92"/>
    <text class="choice" x="622.5" y="266" text-anchor="middle">Another Family</text>
    <text class="small" x="622.5" y="291" text-anchor="middle">fit the required output</text>

    <rect class="selection-band" x="350" y="355" width="355" height="62"/>
    <text class="note" x="527.5" y="380" text-anchor="middle">Direct tool use may be sufficient</text>
    <text class="small" x="527.5" y="402" text-anchor="middle">otherwise families may stand alone or combine</text>

    <line class="flow" x1="730" y1="254" x2="780" y2="254" marker-end="url(#arrow-gray)"/>

    <rect class="panel" x="780" y="35" width="205" height="418"/>
    <text class="panel-title" x="882.5" y="65" text-anchor="middle">Technique</text>
    <text class="small" x="882.5" y="85" text-anchor="middle">choose the concrete form</text>

    <rect class="technique" x="805" y="108" width="155" height="84"/>
    <text class="category" x="882.5" y="130" text-anchor="middle">CONVENTIONAL</text>
    <text class="mechanism" x="882.5" y="154" text-anchor="middle">enumerator · solver</text>
    <text class="mechanism" x="882.5" y="175" text-anchor="middle">compiler pass · heuristic</text>

    <rect class="technique" x="805" y="211" width="155" height="84"/>
    <text class="category" x="882.5" y="233" text-anchor="middle">LEARNED</text>
    <text class="mechanism" x="882.5" y="257" text-anchor="middle">regression · GP</text>
    <text class="mechanism" x="882.5" y="278" text-anchor="middle">GNN · LLM</text>

    <rect class="technique" x="805" y="314" width="155" height="84"/>
    <text class="category" x="882.5" y="336" text-anchor="middle">HYBRID</text>
    <text class="mechanism" x="882.5" y="360" text-anchor="middle">analytical model +</text>
    <text class="mechanism" x="882.5" y="381" text-anchor="middle">learned correction</text>

    <line class="flow-blue" x1="985" y1="254" x2="1034" y2="254" marker-end="url(#arrow-blue)"/>

    <rect class="panel" x="1034" y="35" width="196" height="418"/>
    <text class="panel-title" x="1132" y="65" text-anchor="middle">Handoff</text>
    <text class="small" x="1132" y="85" text-anchor="middle">make the next step explicit</text>

    <rect class="output" x="1055" y="129" width="154" height="96"/>
    <text class="choice" x="1132" y="164" text-anchor="middle">Inspectable Output</text>
    <text class="small" x="1132" y="188" text-anchor="middle">artifact, estimate,</text>
    <text class="small" x="1132" y="206" text-anchor="middle">request, or result</text>

    <line class="flow-blue" x1="1132" y1="225" x2="1132" y2="277" marker-end="url(#arrow-blue)"/>

    <rect class="check" x="1055" y="277" width="154" height="96"/>
    <text class="choice" x="1132" y="313" text-anchor="middle">Named Next Check</text>
    <text class="small" x="1132" y="338" text-anchor="middle">declared before</text>
    <text class="small" x="1132" y="356" text-anchor="middle">the handoff</text>

    <path class="direct-flow" d="M 152.5 453 V 475 H 1220 V 177 H 1209" marker-end="url(#arrow-blue)"/>
    <text class="direct-label" x="630" y="469" text-anchor="middle">Direct tool use · no added method</text>

    <rect class="selection-band" x="165" y="485" width="930" height="48"/>
    <text class="note" x="630" y="515" text-anchor="middle">The engineering role, method family, and concrete technique remain distinct decisions.</text>
  </g>
</svg>
