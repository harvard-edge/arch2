<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 620" role="img" aria-labelledby="title desc">
  <title id="title">Engineering roles and method choices form a many-to-many map</title>
  <desc id="desc">Eight engineering roles, propose, screen, search, critique, repair, check, explain, and coordinate, feed a separate choice among prediction, generation, optimization, and another operation. Direct tool use may need no added method. When a method is added, it can use a conventional, learned, or hybrid technique and must return an inspectable output followed by a named next check. Shared transitions between layers make the many-to-many relationship explicit without assigning one method family to each role or imposing an order on prediction, generation, and optimization.</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636D"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1683A6"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .figure-title { font-size: 21px; font-weight: 700; fill: #20252B; }
      .eyebrow { font-size: 11.5px; font-weight: 700; fill: #59636D; letter-spacing: 0.65px; }
      .panel-title { font-size: 17px; font-weight: 700; fill: #20252B; }
      .role { font-size: 14px; font-weight: 700; fill: #20252B; }
      .choice { font-size: 15px; font-weight: 700; fill: #20252B; }
      .small { font-size: 12.5px; fill: #3F4A53; }
      .arrow-label { font-size: 11.5px; font-weight: 700; fill: #59636D; }
      .note { font-size: 13.5px; font-weight: 700; fill: #2B596A; }
      .panel { fill: #FBFCFD; stroke: #9AA8B5; stroke-width: 1.3; }
      .role-box { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.25; }
      .prediction { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.35; }
      .generation { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.35; }
      .optimization { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.35; }
      .other { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.35; }
      .technique { fill: #FFFFFF; stroke: #6A4FC7; stroke-width: 1.3; }
      .output { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.4; }
      .check { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.4; }
      .flow { fill: none; stroke: #59636D; stroke-width: 1.7; }
      .flow-blue { fill: none; stroke: #1683A6; stroke-width: 1.8; }
      .selection-band { fill: #F5F8FA; stroke: #9AA8B5; stroke-width: 1.1; }
    </style>
  </defs>

  <rect width="1260" height="620" fill="#FFFFFF"/>
  <g class="font">
    <text class="figure-title" x="630" y="35" text-anchor="middle">Role, operation, and technique are separate choices</text>
    <text class="eyebrow" x="630" y="61" text-anchor="middle">A MANY-TO-MANY MAP, NOT A FIXED PREDICTION–GENERATION–OPTIMIZATION SEQUENCE</text>

    <rect class="panel" x="30" y="88" width="245" height="418"/>
    <text class="panel-title" x="152.5" y="118" text-anchor="middle">Engineering Role</text>
    <text class="small" x="152.5" y="138" text-anchor="middle">name the work first</text>

    <rect class="role-box" x="50" y="162" width="92" height="58"/>
    <text class="role" x="96" y="196" text-anchor="middle">Propose</text>
    <rect class="role-box" x="163" y="162" width="92" height="58"/>
    <text class="role" x="209" y="196" text-anchor="middle">Screen</text>
    <rect class="role-box" x="50" y="238" width="92" height="58"/>
    <text class="role" x="96" y="272" text-anchor="middle">Search</text>
    <rect class="role-box" x="163" y="238" width="92" height="58"/>
    <text class="role" x="209" y="272" text-anchor="middle">Critique</text>
    <rect class="role-box" x="50" y="314" width="92" height="58"/>
    <text class="role" x="96" y="348" text-anchor="middle">Repair</text>
    <rect class="role-box" x="163" y="314" width="92" height="58"/>
    <text class="role" x="209" y="348" text-anchor="middle">Check</text>
    <rect class="role-box" x="50" y="390" width="92" height="58"/>
    <text class="role" x="96" y="424" text-anchor="middle">Explain</text>
    <rect class="role-box" x="163" y="390" width="92" height="58"/>
    <text class="role" x="209" y="424" text-anchor="middle">Coordinate</text>
    <text class="eyebrow" x="152.5" y="480" text-anchor="middle">EQUAL PEERS IN THE MAP</text>

    <line class="flow" x1="275" y1="307" x2="325" y2="307" marker-end="url(#arrow-gray)"/>

    <rect class="panel" x="325" y="88" width="405" height="418"/>
    <text class="panel-title" x="527.5" y="118" text-anchor="middle">Choose One or More Operations</text>
    <text class="small" x="527.5" y="138" text-anchor="middle">the role does not determine the operation</text>

    <rect class="prediction" x="350" y="166" width="165" height="92"/>
    <text class="choice" x="432.5" y="203" text-anchor="middle">Prediction</text>
    <text class="small" x="432.5" y="226" text-anchor="middle">estimate a property</text>

    <rect class="generation" x="540" y="166" width="165" height="92"/>
    <text class="choice" x="622.5" y="203" text-anchor="middle">Generation</text>
    <text class="small" x="622.5" y="226" text-anchor="middle">construct a candidate</text>

    <rect class="optimization" x="350" y="282" width="165" height="92"/>
    <text class="choice" x="432.5" y="319" text-anchor="middle">Optimization</text>
    <text class="small" x="432.5" y="342" text-anchor="middle">select among alternatives</text>

    <rect class="other" x="540" y="282" width="165" height="92"/>
    <text class="choice" x="622.5" y="319" text-anchor="middle">Another Operation</text>
    <text class="small" x="622.5" y="344" text-anchor="middle">fit the required output</text>

    <rect class="selection-band" x="350" y="408" width="355" height="62"/>
    <text class="note" x="527.5" y="433" text-anchor="middle">Direct tool use may be sufficient</text>
    <text class="small" x="527.5" y="455" text-anchor="middle">otherwise operations may stand alone or combine</text>

    <line class="flow" x1="730" y1="307" x2="780" y2="307" marker-end="url(#arrow-gray)"/>

    <rect class="panel" x="780" y="88" width="205" height="418"/>
    <text class="panel-title" x="882.5" y="118" text-anchor="middle">Technique</text>
    <text class="small" x="882.5" y="138" text-anchor="middle">choose the concrete form</text>

    <rect class="technique" x="805" y="176" width="155" height="66"/>
    <text class="choice" x="882.5" y="215" text-anchor="middle">Conventional</text>
    <rect class="technique" x="805" y="272" width="155" height="66"/>
    <text class="choice" x="882.5" y="311" text-anchor="middle">Learned</text>
    <rect class="technique" x="805" y="368" width="155" height="66"/>
    <text class="choice" x="882.5" y="407" text-anchor="middle">Hybrid</text>

    <line class="flow-blue" x1="985" y1="307" x2="1034" y2="307" marker-end="url(#arrow-blue)"/>

    <rect class="panel" x="1034" y="88" width="196" height="418"/>
    <text class="panel-title" x="1132" y="118" text-anchor="middle">Handoff</text>
    <text class="small" x="1132" y="138" text-anchor="middle">make the next step explicit</text>

    <rect class="output" x="1055" y="182" width="154" height="96"/>
    <text class="choice" x="1132" y="217" text-anchor="middle">Inspectable Output</text>
    <text class="small" x="1132" y="241" text-anchor="middle">artifact, estimate,</text>
    <text class="small" x="1132" y="259" text-anchor="middle">request, or result</text>

    <line class="flow-blue" x1="1132" y1="278" x2="1132" y2="330" marker-end="url(#arrow-blue)"/>

    <rect class="check" x="1055" y="330" width="154" height="96"/>
    <text class="choice" x="1132" y="366" text-anchor="middle">Named Next Check</text>
    <text class="small" x="1132" y="391" text-anchor="middle">declared before</text>
    <text class="small" x="1132" y="409" text-anchor="middle">the handoff</text>

    <rect class="selection-band" x="165" y="538" width="930" height="48"/>
    <text class="note" x="630" y="568" text-anchor="middle">The engineering role, operation, and concrete technique remain distinct decisions.</text>
  </g>
</svg>
