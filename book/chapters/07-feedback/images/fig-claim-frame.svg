<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" role="img" aria-labelledby="cf-title cf-desc">
  <title id="cf-title">The compact comparison frame</title>
  <desc id="cf-desc">A three-column comparison frame. Candidate and comparator in the left column feed a quantity and unit, then a difference and uncertainty in the middle column. The measured result is bounded by workload and design state, tool and operating conditions, and check scope and nonclaims in the right column.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .head-left { font-size: 13px; font-weight: 700; fill: #59429E; letter-spacing: 0.6px; }
      .head-mid { font-size: 13px; font-weight: 700; fill: #136680; letter-spacing: 0.6px; }
      .head-right { font-size: 13px; font-weight: 700; fill: #C62A2A; letter-spacing: 0.6px; }
      .label { font-size: 13px; font-weight: 700; fill: #20252B; }
      .sub { font-size: 11.5px; fill: #444444; }
      .design { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.45; }
      .measure { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.45; }
      .scope { fill: #FDECEC; stroke: #DE3D3C; stroke-width: 1.45; }
      .flow { stroke: #333333; stroke-width: 1.9; fill: none; stroke-linecap: square; stroke-linejoin: miter; }

      /* Vector Glyphs */
      .glyph-path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.4; }
      .glyph-purple { stroke: #6A4FC7; }
      .glyph-blue { stroke: #1683A6; }
      .glyph-red { stroke: #DE3D3C; }
    </style>
  </defs>

  <rect width="820" height="372" fill="#FFFFFF"/>
  <g class="font">
    <text class="head-left" x="145" y="32" text-anchor="middle">COMPARED DESIGNS</text>
    <text class="head-mid" x="410" y="32" text-anchor="middle">MEASURED RESULT</text>
    <text class="head-right" x="685" y="32" text-anchor="middle">SCOPE AND LIMITS</text>

    <!-- Candidate (Microchip Glyph) -->
    <rect class="design" x="50" y="86" width="190" height="62"/>
    <g transform="translate(60, 96)">
      <rect x="0" y="0" width="12" height="12" fill="none" stroke="#6A4FC7" stroke-width="1.3" />
      <path d="M 3 3 H 9 V 9 H 3 Z" fill="#6A4FC7" opacity="0.4" />
    </g>
    <text class="label" x="150" y="113" text-anchor="middle">Candidate</text>
    <text class="sub" x="145" y="132" text-anchor="middle">revision and configuration</text>

    <!-- Comparator (Microchip Glyph) -->
    <rect class="design" x="50" y="214" width="190" height="62"/>
    <g transform="translate(60, 224)">
      <rect x="0" y="0" width="12" height="12" fill="none" stroke="#6A4FC7" stroke-width="1.3" />
      <path d="M 3 3 H 9 V 9 H 3 Z" fill="none" stroke="#6A4FC7" stroke-width="1" />
    </g>
    <text class="label" x="150" y="241" text-anchor="middle">Comparator</text>
    <text class="sub" x="145" y="260" text-anchor="middle">baseline or alternative</text>

    <!-- Quantity + unit (Ruler Glyph) -->
    <rect class="measure" x="315" y="86" width="190" height="62"/>
    <g transform="translate(325, 96)">
      <rect x="0" y="0" width="12" height="12" fill="none" stroke="#1683A6" stroke-width="1.3" />
      <line x1="3" y1="0" x2="3" y2="4" class="glyph-path glyph-blue" />
      <line x1="6" y1="0" x2="6" y2="6" class="glyph-path glyph-blue" />
      <line x1="9" y1="0" x2="9" y2="4" class="glyph-path glyph-blue" />
    </g>
    <text class="label" x="415" y="113" text-anchor="middle">Quantity + unit</text>
    <text class="sub" x="410" y="132" text-anchor="middle">property and aggregation</text>

    <!-- Difference + uncertainty (Plus-Minus Glyph) -->
    <rect class="measure" x="315" y="214" width="190" height="62"/>
    <g transform="translate(325, 224)">
      <path d="M 2 4 H 10 M 6 0 V 8 M 2 12 H 10" class="glyph-path glyph-blue" />
    </g>
    <text class="label" x="415" y="241" text-anchor="middle">Difference + uncertainty</text>
    <text class="sub" x="410" y="260" text-anchor="middle">margin and error</text>

    <!-- Workload + design state (Target Scope Glyph) -->
    <rect class="scope" x="590" y="54" width="190" height="62"/>
    <g transform="translate(600, 64)">
      <circle cx="6" cy="6" r="5" fill="none" stroke="#DE3D3C" stroke-width="1.3" />
      <circle cx="6" cy="6" r="2" fill="#DE3D3C" />
    </g>
    <text class="label" x="690" y="81" text-anchor="middle">Workload + design state</text>
    <text class="sub" x="685" y="100" text-anchor="middle">matched comparison scope</text>

    <!-- Tool + conditions (Wrench Glyph) -->
    <rect class="scope" x="590" y="155" width="190" height="62"/>
    <g transform="translate(600, 165)">
      <path d="M 2 10 L 6 6 M 5 5 L 8 2 L 11 5 L 8 8 Z" class="glyph-path glyph-red" />
    </g>
    <text class="label" x="690" y="182" text-anchor="middle">Tool + conditions</text>
    <text class="sub" x="685" y="201" text-anchor="middle">model, version, corner, seed</text>

    <!-- Check scope + nonclaims (Shield Glyph) -->
    <rect class="scope" x="590" y="256" width="190" height="62"/>
    <g transform="translate(600, 266)">
      <path d="M 6 1 L 11 3.5 V 7 C 11 10, 6 11, 6 11 C 6 11, 1 10, 1 7 V 3.5 Z" class="glyph-path glyph-red" />
    </g>
    <text class="label" x="690" y="283" text-anchor="middle">Check scope + nonclaims</text>
    <text class="sub" x="685" y="302" text-anchor="middle">what remains unobserved</text>

    <path class="flow" d="M 240 117 H 274 V 108 H 315" marker-end="url(#arrow-dark)"/>
    <path class="flow" d="M 240 245 H 274 V 128 H 315" marker-end="url(#arrow-dark)"/>
    <path class="flow" d="M 410 148 V 214" marker-end="url(#arrow-dark)"/>

    <path class="flow" d="M 505 245 H 548"/>
    <path class="flow" d="M 548 85 V 287"/>
    <path class="flow" d="M 548 85 H 590" marker-end="url(#arrow-dark)"/>
    <path class="flow" d="M 548 186 H 590" marker-end="url(#arrow-dark)"/>
    <path class="flow" d="M 548 287 H 590" marker-end="url(#arrow-dark)"/>

    <text class="sub" x="410" y="350" text-anchor="middle">A different scope creates a different comparison.</text>
  </g>
</svg>
