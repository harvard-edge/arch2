<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">From tool return to scoped interpretation</title>
  <desc id="flow-desc">A five-step vertical flow. A tool return with status, artifacts, and lineage enters measurement qualification for candidate, quantity, unit, and conditions. An incomplete return can route directly back to execution. A matched comparison adds a comparator, difference, and uncertainty. An invalid comparison can route directly back to study formulation. A scoped interpretation separates outcome, mechanism, and nonclaims. The final record captures learning, no revision or a named revision owner, and a reopening trigger.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 14px; font-weight: 700; fill: #20252B; }
      .sub { font-size: 12px; fill: #444444; }
      .step { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; }
      .route-title { font-size: 12px; font-weight: 700; fill: #20252B; }
      .route-sub { font-size: 10.5px; fill: #444444; }
      .return { fill: #F5F8FA; stroke: #7E8B96; stroke-width: 1.5; }
      .measurement { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
      .comparison { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .interpretation { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.5; }
      .revision { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.5; }
      .flow { stroke: #333333; stroke-width: 2; fill: none; stroke-linecap: square; }
      .route { stroke: #59636D; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="760" height="620" fill="#FFFFFF"/>
  <g class="font">
    <rect class="return" x="220" y="34" width="320" height="76"/>
    <text class="step" x="240" y="56" fill="#59636D">01</text>
    <text class="title" x="380" y="67" text-anchor="middle">Tool return</text>
    <text class="sub" x="380" y="89" text-anchor="middle">status · artifacts · lineage</text>

    <rect class="measurement" x="220" y="146" width="320" height="76"/>
    <text class="step" x="240" y="168" fill="#157A38">02</text>
    <text class="title" x="380" y="179" text-anchor="middle">Measurement qualification</text>
    <text class="sub" x="380" y="201" text-anchor="middle">candidate · quantity · unit · conditions</text>
    <rect class="return" x="22" y="154" width="172" height="60"/>
    <text class="route-title" x="108" y="179" text-anchor="middle">Incomplete return</text>
    <text class="route-sub" x="108" y="198" text-anchor="middle">repair execution record</text>
    <path class="route" d="M 220 184 H 194" marker-end="url(#arrow-dark)"/>

    <rect class="comparison" x="220" y="258" width="320" height="76"/>
    <text class="step" x="240" y="280" fill="#136680">03</text>
    <text class="title" x="380" y="291" text-anchor="middle">Matched comparison</text>
    <text class="sub" x="380" y="313" text-anchor="middle">comparator · difference · uncertainty</text>
    <rect class="comparison" x="566" y="266" width="172" height="60"/>
    <text class="route-title" x="652" y="291" text-anchor="middle">Invalid comparison</text>
    <text class="route-sub" x="652" y="310" text-anchor="middle">repair study formulation</text>
    <path class="route" d="M 540 296 H 566" marker-end="url(#arrow-dark)"/>

    <rect class="interpretation" x="220" y="370" width="320" height="76"/>
    <text class="step" x="240" y="392" fill="#59429E">04</text>
    <text class="title" x="380" y="403" text-anchor="middle">Scoped interpretation</text>
    <text class="sub" x="380" y="425" text-anchor="middle">outcome · mechanism · nonclaims</text>

    <rect class="revision" x="220" y="482" width="320" height="76"/>
    <text class="step" x="240" y="504" fill="#A45F0C">05</text>
    <text class="title" x="380" y="515" text-anchor="middle">Learning and next step</text>
    <text class="sub" x="380" y="537" text-anchor="middle">no revision · named owner · reopen trigger</text>

    <line class="flow" x1="380" y1="110" x2="380" y2="146" marker-end="url(#arrow-dark)"/>
    <line class="flow" x1="380" y1="222" x2="380" y2="258" marker-end="url(#arrow-dark)"/>
    <line class="flow" x1="380" y1="334" x2="380" y2="370" marker-end="url(#arrow-dark)"/>
    <line class="flow" x1="380" y1="446" x2="380" y2="482" marker-end="url(#arrow-dark)"/>

    <text class="sub" x="380" y="594" text-anchor="middle">A defect routes back as soon as its source is known.</text>
  </g>
</svg>
