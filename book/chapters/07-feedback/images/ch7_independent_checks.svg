<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" role="img" aria-labelledby="ic-title ic-desc">
  <title id="ic-title">Shared assumptions versus a claim-specific check</title>
  <desc id="ic-desc">A two-column contrast. In the left column, a producer and critic use the same specification and model, so their agreement remains correlated. In the right column, the producer is challenged by a check that observes the disputed property through a different measurement path. The result is a bounded challenge rather than proof of independence, and a final note says remaining shared assumptions must be recorded.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C62A2A"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .left-head { font-size: 13px; font-weight: 700; fill: #C62A2A; letter-spacing: 0.6px; }
      .right-head { font-size: 13px; font-weight: 700; fill: #157A38; letter-spacing: 0.6px; }
      .title { font-size: 13px; font-weight: 700; fill: #20252B; }
      .sub { font-size: 11.5px; fill: #444444; }
      .fail-text { font-size: 13px; font-weight: 700; fill: #C62A2A; }
      .check-text { font-size: 13px; font-weight: 700; fill: #157A38; }
      .producer { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.45; }
      .shared { fill: #FDECEC; stroke: #DE3D3C; stroke-width: 1.45; }
      .different { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.45; }
      .fail { fill: #FDECEC; stroke: #DE3D3C; stroke-width: 2; }
      .bounded { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 2; }
      .flow { stroke: #333333; stroke-width: 2; fill: none; stroke-linecap: square; }
      .flow-fail { stroke: #C62A2A; stroke-width: 2; fill: none; stroke-linecap: square; }
      .divider { stroke: #9AA8B5; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .note { fill: #F5F8FA; stroke: #9AA8B5; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="760" height="386" fill="#FFFFFF"/>
  <g class="font">
    <line class="divider" x1="380" y1="28" x2="380" y2="324"/>

    <text class="left-head" x="190" y="42" text-anchor="middle">SHARED FAILURE PATH</text>
    <rect class="producer" x="76" y="64" width="228" height="58"/>
    <text class="title" x="190" y="89" text-anchor="middle">Candidate producer</text>
    <text class="sub" x="190" y="108" text-anchor="middle">artifact and explanation</text>
    <path class="flow-fail" d="M 190 122 V 154" marker-end="url(#arrow-red)"/>
    <rect class="shared" x="76" y="154" width="228" height="66"/>
    <text class="title" x="190" y="181" text-anchor="middle">Critic using the same basis</text>
    <text class="sub" x="190" y="200" text-anchor="middle">shared specification and model</text>
    <path class="flow-fail" d="M 190 220 V 252" marker-end="url(#arrow-red)"/>
    <rect class="fail" x="76" y="252" width="228" height="52"/>
    <text class="fail-text" x="190" y="283" text-anchor="middle">Correlated agreement</text>

    <text class="right-head" x="570" y="42" text-anchor="middle">DIFFERENT CHECKING PATH</text>
    <rect class="producer" x="456" y="64" width="228" height="58"/>
    <text class="title" x="570" y="89" text-anchor="middle">Candidate producer</text>
    <text class="sub" x="570" y="108" text-anchor="middle">artifact and explanation</text>
    <path class="flow" d="M 570 122 V 154" marker-end="url(#arrow-dark)"/>
    <rect class="different" x="456" y="154" width="228" height="66"/>
    <text class="title" x="570" y="181" text-anchor="middle">Claim-specific check</text>
    <text class="sub" x="570" y="200" text-anchor="middle">checks the disputed property</text>
    <path class="flow" d="M 570 220 V 252" marker-end="url(#arrow-dark)"/>
    <rect class="bounded" x="456" y="252" width="228" height="52"/>
    <text class="check-text" x="570" y="283" text-anchor="middle">Bounded challenge</text>

    <rect class="note" x="126" y="332" width="508" height="36"/>
    <text class="sub" x="380" y="354" text-anchor="middle">A different path may reduce correlation. Record what remains shared.</text>
  </g>
</svg>
