<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" role="img" aria-labelledby="cal-title cal-desc">
  <title id="cal-title">Conceptual proxy calibration schematic</title>
  <desc id="cal-desc">A conceptual plot with normalized objective value on the vertical axis and search progression on the horizontal axis. The left region contains observed calibration support and shows one possible case where a proxy score and a stronger reference measure track. After the end of observed support, the proxy continues upward while the reference may diverge. The figure states that support coverage and held-out agreement are separate tests and that the curves are not measured data.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .axis-label { font-size: 13px; font-weight: 700; fill: #222222; }
      .proxy-label { font-size: 13px; font-weight: 700; fill: #6A4FC7; }
      .reference-label { font-size: 13px; font-weight: 700; fill: #1E9E48; }
      .region-good { font-size: 12.5px; font-weight: 700; fill: #157A38; }
      .region-open { font-size: 12.5px; font-weight: 700; fill: #C62A2A; }
      .boundary-label { font-size: 12.5px; font-weight: 700; fill: #59636D; }
      .callout-title { font-size: 13px; font-weight: 700; fill: #20252B; }
      .callout-sub { font-size: 12px; fill: #444444; }
      .foot { font-size: 11px; font-style: italic; fill: #59636D; }
      .axis { stroke: #333333; stroke-width: 2; fill: none; }
      .boundary { stroke: #9AA8B5; stroke-width: 2; fill: none; stroke-dasharray: 6 6; }
      .proxy { stroke: #6A4FC7; stroke-width: 3; fill: none; stroke-linecap: round; }
      .reference { stroke: #1E9E48; stroke-width: 3; fill: none; stroke-linecap: round; }
      .panel { fill: #F5F8FA; stroke: #9AA8B5; stroke-width: 1.1; }
      .leader { stroke: #333333; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="840" height="450" fill="#FFFFFF"/>
  <g class="font">
    <rect x="110" y="55" width="215" height="300" fill="#F5F8FA"/>
    <rect x="325" y="55" width="340" height="300" fill="#FDECEC"/>

    <text class="region-good" x="217" y="340" text-anchor="middle">Observed support region</text>
    <text class="region-open" x="495" y="340" text-anchor="middle">Unsupported extrapolation</text>

    <line class="boundary" x1="325" y1="55" x2="325" y2="355"/>
    <text class="boundary-label" x="325" y="44" text-anchor="middle">End of observed support</text>

    <polyline class="axis" points="110 60 110 355 665 355"/>
    <text class="axis-label" x="388" y="392" text-anchor="middle">Search progression</text>
    <text class="axis-label" x="92" y="205" text-anchor="middle" transform="rotate(-90, 92, 205)">Normalized objective value</text>

    <path class="proxy" d="M 110 315 C 235 220, 315 185, 390 145 C 485 98, 560 79, 625 70"/>
    <path class="reference" d="M 110 315 C 225 228, 290 194, 325 190 C 395 185, 450 252, 625 304"/>

    <text class="proxy-label" x="674" y="75">Proxy score</text>
    <text class="reference-label" x="674" y="306">Stronger reference</text>

    <rect class="panel" x="670" y="160" width="160" height="72"/>
    <text class="callout-title" x="750" y="185" text-anchor="middle">Possible divergence</text>
    <text class="callout-sub" x="750" y="204" text-anchor="middle">Search reaches candidates</text>
    <text class="callout-sub" x="750" y="220" text-anchor="middle">outside observed support</text>
    <path class="leader" d="M 670 210 L 450 245" marker-end="url(#arrow)"/>

    <text class="foot" x="388" y="425" text-anchor="middle">Conceptual normalized curves, not measured data. Support coverage does not establish held-out agreement.</text>
  </g>
</svg>
