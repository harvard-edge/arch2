<!--
  Numeric ranges are written $3\text{--}5\ \text{GHz}$, which is correct on the
  LaTeX/PDF path: in text mode `--` ligatures into an en-dash. MathJax has no
  such ligature, so the same source renders a literal double hyphen on the web
  and can even line-break between the two characters.

  MathJax's pageReady hook runs before typesetting, so rewriting the TeX source
  here fixes the web rendering without touching the manuscript or the PDF.
-->
<script>
  window.MathJax = window.MathJax || {};
  window.MathJax.startup = Object.assign({}, window.MathJax.startup, {
    pageReady: function () {
      document.querySelectorAll(".math").forEach(function (n) {
        if (n.textContent && n.textContent.indexOf("\\text{-") !== -1) {
          n.textContent = n.textContent
            .replace(/\\text\{---\}/g, "\\text{\u2014}")
            .replace(/\\text\{--\}/g, "\\text{\u2013}");
        }
      });
      return window.MathJax.startup.defaultPageReady();
    }
  });
</script>
