<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="100%" height="100%">
  <!-- Definitions for gradients, filters, and markers -->
  <defs>
    <!-- Drop Shadow for Cards -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
    <filter id="hub-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="hub-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Arrowheads -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" fill="#FFFFFF" rx="16"/>
  <rect x="2" y="2" width="1396" height="796" fill="none" stroke="#E2E8F0" stroke-width="2" rx="14"/>

  <!-- Title -->
  <text x="700" y="50" font-family="sans-serif" font-weight="bold" font-size="28" fill="#1E293B" text-anchor="middle">The Authoring Engine as an Out-of-Order CPU Datapath</text>

  <!-- ========================================== -->
  <!-- CONNECTION BUSES (Orthogonal)              -->
  <!-- ========================================== -->
  <g fill="none" stroke-width="3" opacity="0.8">
    <!-- Fetch to Decode -->
    <path d="M 200 210 L 200 240" stroke="#3B82F6" marker-end="url(#arrow-blue)"/>
    <!-- Decode to Dispatch -->
    <path d="M 330 280 L 370 280 L 370 380 L 415 380" stroke="#3B82F6" marker-end="url(#arrow-blue)"/>
    <!-- Branch Predictor to Fetch -->
    <path d="M 200 370 L 200 340 L 90 340 L 90 180 L 110 180" stroke="#94A3B8" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>

    <!-- Dispatch to ALUs -->
    <path d="M 505 180 L 535 180" stroke="#8B5CF6" marker-end="url(#arrow-purple)"/>
    <path d="M 505 270 L 535 270" stroke="#8B5CF6" marker-end="url(#arrow-purple)"/>
    <path d="M 505 360 L 535 360" stroke="#8B5CF6" marker-end="url(#arrow-purple)"/>
    <path d="M 505 450 L 535 450" stroke="#8B5CF6" marker-end="url(#arrow-purple)"/>
    <path d="M 505 540 L 535 540" stroke="#8B5CF6" marker-end="url(#arrow-purple)"/>

    <!-- Inter-Unit Bypass Buses -->
    <!-- Draw vertical bypass line on the right side of execution units -->
    <path d="M 865 180 L 885 180 L 885 540 L 865 540" stroke="#F59E0B" stroke-dasharray="4,4"/>
    <path d="M 885 270 L 865 270" stroke="#F59E0B" marker-end="url(#arrow-gold)"/>
    <path d="M 885 360 L 865 360" stroke="#F59E0B" marker-end="url(#arrow-gold)"/>
    <path d="M 885 450 L 865 450" stroke="#F59E0B" marker-end="url(#arrow-gold)"/>
    <text x="895" y="365" font-family="sans-serif" font-size="12" fill="#D97706" text-anchor="start" transform="rotate(-90 895 365)">&lt;--- Inter-Unit Bypass Buses ---&gt;</text>

    <!-- ALUs to Pruning Filter (Misprediction) -->
    <path d="M 700 580 L 700 635" stroke="#EF4444" marker-end="url(#arrow-gray)"/>

    <!-- Pruning filter back to Dispatch / Flush -->
    <path d="M 550 670 L 460 670 L 460 595" stroke="#EF4444" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>

    <!-- ALUs to ROB -->
    <path d="M 850 180 L 920 180 L 920 340 L 965 340" stroke="#8B5CF6" marker-end="url(#arrow-purple)"/>
    <path d="M 850 540 L 920 540 L 920 380 L 965 380" stroke="#8B5CF6" marker-end="url(#arrow-purple)"/>

    <!-- ROB to Retirement -->
    <path d="M 1045 440 L 1045 495" stroke="#F59E0B" marker-end="url(#arrow-gold)"/>

    <!-- Retirement to Harness -->
    <path d="M 1160 535 L 1220 535 L 1220 340 L 1225 340" stroke="#F59E0B" marker-end="url(#arrow-gold)"/>
  </g>

  <!-- ========================================== -->
  <!-- STAGE 1: FRONTEND FETCH & BRANCH SPECULATION -->
  <!-- ========================================== -->
  <g transform="translate(50, 100)" filter="url(#shadow)">
    <!-- Stage Box -->
    <rect x="0" y="0" width="300" height="400" rx="12" fill="#F0F4F8" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Stage Header -->
    <path d="M0 12 C0 5 5 0 12 0 L288 0 C295 0 300 5 300 12 L300 40 L0 40 Z" fill="#3B82F6"/>
    <text x="150" y="25" font-family="sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF" text-anchor="middle">STAGE 1: FRONTEND FETCH</text>
    <text x="150" y="38" font-family="sans-serif" font-weight="bold" font-size="12" fill="#DBEAFE" text-anchor="middle">&amp;amp; BRANCH SPECULATION</text>

    <!-- Instruction Fetch Unit -->
    <g transform="translate(20, 60)">
      <rect width="260" height="60" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
      <text x="130" y="25" font-family="sans-serif" font-weight="bold" font-size="14" fill="#1E3A8A" text-anchor="middle">Instruction Fetch Unit</text>
      <text x="130" y="45" font-family="sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Formulating intent &amp;amp; backward design</text>
    </g>

    <!-- Instruction Decode Unit -->
    <g transform="translate(20, 150)">
      <rect width="260" height="60" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
      <text x="130" y="25" font-family="sans-serif" font-weight="bold" font-size="14" fill="#1E3A8A" text-anchor="middle">Instruction Decode Unit</text>
      <text x="130" y="45" font-family="sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Structuring arguments &amp;amp; evidence callouts</text>
    </g>

    <!-- Branch Predictor & Speculation Unit -->
    <g transform="translate(20, 270)">
      <rect width="260" height="80" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
      <text x="130" y="25" font-family="sans-serif" font-weight="bold" font-size="14" fill="#9A3412" text-anchor="middle">Branch Predictor</text>
      <text x="130" y="45" font-family="sans-serif" font-weight="bold" font-size="14" fill="#9A3412" text-anchor="middle">&amp;amp; Speculation Unit</text>
      <text x="130" y="65" font-family="sans-serif" font-size="12" fill="#B45309" text-anchor="middle">Latent-space LLM exploration</text>
    </g>
  </g>


  <!-- ========================================== -->
  <!-- STAGE 2: OUT-OF-ORDER EXECUTION & RES. STATIONS -->
  <!-- ========================================== -->
  <g transform="translate(400, 100)" filter="url(#shadow)">
    <!-- Stage Box -->
    <rect x="0" y="0" width="480" height="640" rx="12" fill="#F0ECFA" stroke="#C4B5FD" stroke-width="2"/>
    <!-- Stage Header -->
    <path d="M0 12 C0 5 5 0 12 0 L468 0 C475 0 480 5 480 12 L480 40 L0 40 Z" fill="#8B5CF6"/>
    <text x="240" y="25" font-family="sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF" text-anchor="middle">STAGE 2: OUT-OF-ORDER EXECUTION &amp;amp; RESERVATION STATIONS</text>

    <!-- Dispatch Bus & Reservation Stations -->
    <g transform="translate(20, 60)">
      <rect width="70" height="420" rx="6" fill="#EDE9FE" stroke="#A78BFA" stroke-width="2"/>
      <text x="35" y="210" font-family="sans-serif" font-weight="bold" font-size="13" fill="#5B21B6" text-anchor="middle" transform="rotate(-90 35 210)">Dispatch Bus &amp;amp; Reservation Stations</text>
      <text x="35" y="210" font-family="sans-serif" font-size="11" fill="#7C3AED" text-anchor="middle" transform="rotate(-90 35 210) translate(0, 15)">(Dispatches draft units)</text>
    </g>

    <!-- 5 Parallel Execution Units -->
    <g transform="translate(130, 60)">
      <!-- ALU 1: Student Panel -->
      <g transform="translate(0, 0)">
        <rect width="320" height="60" rx="6" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
        <text x="15" y="35" font-family="sans-serif" font-size="20">🎓</text>
        <text x="50" y="25" font-family="sans-serif" font-weight="bold" font-size="14" fill="#4C1D95">ALU 1: Student Panel</text>
        <text x="50" y="45" font-family="sans-serif" font-size="12" fill="#6D28D9">Pedagogical clarity &amp;amp; intuition</text>
      </g>

      <!-- ALU 2: Architect Panel -->
      <g transform="translate(0, 90)">
        <rect width="320" height="60" rx="6" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
        <text x="15" y="35" font-family="sans-serif" font-size="20">🔬</text>
        <text x="50" y="25" font-family="sans-serif" font-weight="bold" font-size="14" fill="#4C1D95">ALU 2: Architect Panel</text>
        <text x="50" y="45" font-family="sans-serif" font-size="12" fill="#6D28D9">Technical rigor &amp;amp; physical limits</text>
      </g>

      <!-- ALU 3: EDA/ML Panel -->
      <g transform="translate(0, 180)">
        <rect width="320" height="60" rx="6" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
        <text x="15" y="35" font-family="sans-serif" font-size="20">💻</text>
        <text x="50" y="25" font-family="sans-serif" font-weight="bold" font-size="14" fill="#4C1D95">ALU 3: EDA/ML Panel</text>
        <text x="50" y="45" font-family="sans-serif" font-size="12" fill="#6D28D9">CAD flows &amp;amp; modern tool state</text>
      </g>

      <!-- FPU 1: Citation Auditors -->
      <g transform="translate(0, 270)">
        <rect width="320" height="60" rx="6" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
        <text x="15" y="35" font-family="sans-serif" font-size="20">📚</text>
        <text x="50" y="25" font-family="sans-serif" font-weight="bold" font-size="14" fill="#4C1D95">FPU 1: Citation Auditors</text>
        <text x="50" y="45" font-family="sans-serif" font-size="12" fill="#6D28D9">BibTeX receipts &amp;amp; math checks</text>
      </g>

      <!-- AGU 1: Prose Linters -->
      <g transform="translate(0, 360)">
        <rect width="320" height="60" rx="6" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
        <text x="15" y="35" font-family="sans-serif" font-size="20">✏️</text>
        <text x="50" y="25" font-family="sans-serif" font-weight="bold" font-size="14" fill="#4C1D95">AGU 1: Prose Linters</text>
        <text x="50" y="45" font-family="sans-serif" font-size="12" fill="#6D28D9">Active voice, 0 colons, preambles</text>
      </g>
    </g>

    <!-- Branch Misprediction & Pruning Filter -->
    <g transform="translate(130, 540)">
      <rect width="320" height="70" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
      <path d="M 15 35 L 35 35 M 25 25 L 25 45" stroke="#EF4444" stroke-width="3" transform="rotate(45 25 35)"/>
      <text x="50" y="30" font-family="sans-serif" font-weight="bold" font-size="14" fill="#B91C1C">Branch Misprediction &amp;amp; Pruning Filter</text>
      <text x="50" y="50" font-family="sans-serif" font-size="12" fill="#DC2626">Cuts unverified speculative text</text>
    </g>
  </g>


  <!-- ========================================== -->
  <!-- STAGE 3: REORDER BUFFER (ROB) & IN-ORDER RETIREMENT -->
  <!-- ========================================== -->
  <g transform="translate(920, 100)" filter="url(#shadow)">
    <!-- Stage Box -->
    <rect x="0" y="0" width="240" height="500" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>
    <!-- Stage Header -->
    <path d="M0 12 C0 5 5 0 12 0 L228 0 C235 0 240 5 240 12 L240 40 L0 40 Z" fill="#F59E0B"/>
    <text x="120" y="18" font-family="sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF" text-anchor="middle">STAGE 3: REORDER BUFFER (ROB)</text>
    <text x="120" y="32" font-family="sans-serif" font-weight="bold" font-size="12" fill="#FEF3C7" text-anchor="middle">&amp;amp; IN-ORDER RETIREMENT</text>

    <!-- Central ROB Hub -->
    <g transform="translate(120, 200)" filter="url(#hub-shadow)">
      <!-- Outer Glow / Ring -->
      <circle r="90" fill="none" stroke="url(#gold-grad)" stroke-width="4" stroke-dasharray="10, 5" opacity="0.8"/>
      <!-- Main Hub Body -->
      <circle r="80" fill="url(#hub-grad)"/>

      <!-- Hub Icon (Author) -->
      <g transform="translate(-16, -30)" fill="#F59E0B">
        <path d="M16 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm-8 16c0-3.3 2.7-6 6-6h4c3.3 0 6 2.7 6 6v2H8v-2z" transform="scale(1.2)"/>
      </g>

      <!-- Hub Text -->
      <text x="0" y="15" font-family="sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF" text-anchor="middle">Central ROB Hub</text>
      <text x="0" y="32" font-family="sans-serif" font-size="11" fill="#93C5FD" text-anchor="middle">Vijay Janapa Reddi</text>
      <text x="0" y="47" font-family="sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">(Harvard University / ETH Zürich)</text>
    </g>

    <!-- In-Order Commit & Retirement Gate -->
    <g transform="translate(20, 400)">
      <rect width="200" height="70" rx="6" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
      <text x="100" y="30" font-family="sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle">In-Order Commit &amp;amp;</text>
      <text x="100" y="45" font-family="sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle">Retirement Gate</text>
      <rect x="10" y="52" width="180" height="14" rx="4" fill="#FFFFFF" opacity="0.2"/>
      <text x="100" y="62" font-family="sans-serif" font-weight="bold" font-size="10" fill="#FFFFFF" text-anchor="middle">100% Authorial Responsibility</text>
    </g>
  </g>


  <!-- ========================================== -->
  <!-- STAGE 4: SYSTEM SIGNOFF & BUILD HARNESS    -->
  <!-- ========================================== -->
  <g transform="translate(1200, 100)" filter="url(#shadow)">
    <!-- Stage Box -->
    <rect x="0" y="0" width="160" height="380" rx="12" fill="#E7F5EC" stroke="#86EFAC" stroke-width="2"/>
    <!-- Stage Header -->
    <path d="M0 12 C0 5 5 0 12 0 L148 0 C155 0 160 5 160 12 L160 50 L0 50 Z" fill="#10B981"/>
    <text x="80" y="22" font-family="sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle">STAGE 4:</text>
    <text x="80" y="38" font-family="sans-serif" font-weight="bold" font-size="11" fill="#D1FAE5" text-anchor="middle">SYSTEM SIGNOFF &amp;amp;</text>
    <text x="80" y="48" font-family="sans-serif" font-weight="bold" font-size="11" fill="#D1FAE5" text-anchor="middle">BUILD HARNESS</text>

    <!-- Validation Harness -->
    <g transform="translate(15, 70)">
      <rect width="130" height="290" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
      <text x="65" y="30" font-family="sans-serif" font-weight="bold" font-size="12" fill="#047857" text-anchor="middle">Validation Harness</text>

      <g transform="translate(10, 60)">
        <rect x="0" y="0" width="110" height="50" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="55" y="30" font-family="monospace" font-weight="bold" font-size="12" fill="#334155" text-anchor="middle">./arch2 build</text>
      </g>

      <g transform="translate(10, 130)">
        <rect x="0" y="0" width="110" height="50" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="55" y="30" font-family="monospace" font-weight="bold" font-size="12" fill="#334155" text-anchor="middle">Quarto</text>
      </g>

      <g transform="translate(10, 200)">
        <rect x="0" y="0" width="110" height="50" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="55" y="30" font-family="monospace" font-weight="bold" font-size="12" fill="#334155" text-anchor="middle">EPUBCheck</text>
      </g>
    </g>
  </g>

</svg>
