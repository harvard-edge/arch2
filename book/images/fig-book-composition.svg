<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="100%" height="100%" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="800" height="680" fill="#FFFFFF"/>

  <!-- Three field circles: pale tint fills, colored strokes (house palette) -->
  <!-- Computer Architecture (Top Left) -->
  <circle cx="300" cy="270" r="180" fill="#e0f2fe" fill-opacity="0.65" stroke="#0284c7" stroke-width="3"/>
  <!-- Machine Learning (Top Right) -->
  <circle cx="500" cy="270" r="180" fill="#f3e8ff" fill-opacity="0.65" stroke="#7c3aed" stroke-width="3"/>
  <!-- EDA (Bottom Center) -->
  <circle cx="400" cy="440" r="180" fill="#dcfce7" fill-opacity="0.65" stroke="#059669" stroke-width="3"/>

  <!-- Outer Field Headers and Subtitles -->
  <!-- Computer Architecture -->
  <g text-anchor="middle">
    <text x="160" y="55" font-size="18" font-weight="800" fill="#0369a1">Computer Architecture</text>
    <text x="160" y="75" font-size="12" font-weight="600" fill="#475569">processors • memory • interconnect</text>
  </g>

  <!-- Machine Learning -->
  <g text-anchor="middle">
    <text x="640" y="55" font-size="18" font-weight="800" fill="#6d28d9">Machine Learning</text>
    <text x="640" y="75" font-size="12" font-weight="600" fill="#475569">models • training • inference</text>
  </g>

  <!-- EDA -->
  <g text-anchor="middle">
    <text x="400" y="642" font-size="18" font-weight="800" fill="#047857">Electronic Design Automation</text>
    <text x="400" y="662" font-size="12" font-weight="600" fill="#475569">synthesis • verification • signoff</text>
  </g>

  <!-- Single-Field Hints (Light Italic) -->
  <g font-size="12" font-style="italic" fill="#64748b" text-anchor="middle" style="paint-order: stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">
    <text x="210" y="225">classical architecture</text>
    <text x="590" y="225">core ML</text>
    <text x="400" y="555">core EDA</text>
  </g>

  <!-- Pairwise Intersections with Crisp White Text Halos -->
  <!-- Architecture + ML -->
  <g text-anchor="middle" style="paint-order: stroke" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round">
    <text x="400" y="185" font-size="15" font-weight="800" fill="#0f172a">ML for Systems</text>
    <text x="400" y="204" font-size="12" font-weight="600" fill="#334155">evidence: simulator benchmarks</text>
  </g>

  <!-- Architecture + EDA -->
  <g text-anchor="middle" style="paint-order: stroke" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round">
    <text x="285" y="395" font-size="15" font-weight="800" fill="#0f172a">Chip Design</text>
    <text x="285" y="414" font-size="12" font-weight="600" fill="#334155">evidence: signoff &amp; silicon</text>
  </g>

  <!-- ML + EDA -->
  <g text-anchor="middle" style="paint-order: stroke" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round">
    <text x="515" y="395" font-size="15" font-weight="800" fill="#0f172a">ML for CAD</text>
    <text x="515" y="414" font-size="12" font-weight="600" fill="#334155">evidence: post-route metrics</text>
  </g>

  <!-- Center Core: Architecture 2.0 (Triple Intersection) -->
  <g text-anchor="middle" style="paint-order: stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">
    <text x="400" y="315" font-size="21" font-weight="900" fill="#0f172a" letter-spacing="0.5px">Architecture 2.0</text>
    <text x="400" y="337" font-size="13" font-weight="700" fill="#1e293b">AI across system and chip design</text>
    <text x="400" y="357" font-size="12" font-weight="800" fill="#b91c1c" font-style="italic">must satisfy all three</text>
  </g>
</svg>
