<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 645" font-family="Arial, Arimo, Liberation Sans, sans-serif">
  <rect x="0" y="0" width="760" height="645" fill="#FFFFFF"/>

  <!-- Three field circles: pale tint fills, colored strokes (house palette) -->
  <circle cx="285" cy="255" r="165" fill="#E4F1F6" fill-opacity="0.62" stroke="#1683A6" stroke-width="2.5"/>
  <circle cx="475" cy="255" r="165" fill="#F0ECFA" fill-opacity="0.62" stroke="#6A4FC7" stroke-width="2.5"/>
  <circle cx="380" cy="420" r="165" fill="#E7F5EC" fill-opacity="0.62" stroke="#1E9E48" stroke-width="2.5"/>

  <!-- Field labels, outside their arcs -->
  <text x="150" y="62" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#136680">Computer Architecture</text>
  <text x="150" y="78" text-anchor="middle" font-size="10" fill="#59636D">processors &#183; memory &#183; interconnect</text>

  <text x="612" y="62" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#59429E">ML</text>
  <text x="612" y="78" text-anchor="middle" font-size="10" fill="#59636D">models &#183; training &#183; inference</text>

  <text x="380" y="614" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#157A38">EDA</text>
  <text x="380" y="630" text-anchor="middle" font-size="10" fill="#59636D">synthesis &#183; verification &#183; signoff</text>

  <!-- Single-field region hints (light) -->
  <text x="205" y="215" text-anchor="middle" font-size="9.5" fill="#9AA8B5" font-style="italic">classical</text>
  <text x="205" y="227" text-anchor="middle" font-size="9.5" fill="#9AA8B5" font-style="italic">architecture</text>
  <text x="556" y="215" text-anchor="middle" font-size="9.5" fill="#9AA8B5" font-style="italic">core ML</text>
  <text x="380" y="528" text-anchor="middle" font-size="9.5" fill="#9AA8B5" font-style="italic">core EDA</text>

  <!-- Pairwise-intersection communities (white halo for legibility) -->
  <g font-size="12.5" font-weight="bold" fill="#20252B" text-anchor="middle"
     style="paint-order: stroke" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round">
    <text x="380" y="185">ML for systems</text>
    <text x="284" y="379">Chip design</text>
    <text x="476" y="379">ML for CAD</text>
  </g>
  <g font-size="9" fill="#59636D" text-anchor="middle"
     style="paint-order: stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">
    <text x="380" y="199">evidence: simulator benchmarks</text>
    <text x="284" y="393">evidence: signoff &amp; silicon</text>
    <text x="476" y="393">evidence: post-route metrics</text>
  </g>

  <!-- Center: the triple intersection -->
  <g text-anchor="middle" style="paint-order: stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">
    <text x="380" y="301" font-size="13.5" font-weight="bold" fill="#20252B">Architecture 2.0</text>
    <text x="380" y="316" font-size="10.5" fill="#59636D">the governed design loop, end to end</text>
    <text x="380" y="331" font-size="9.5" font-style="italic" fill="#C62A2A">no inherited evidence standard</text>
  </g>
</svg>
