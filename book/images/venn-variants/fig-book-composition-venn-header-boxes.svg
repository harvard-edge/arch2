<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="center-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1F5F7A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="750" fill="#FFFFFF"/>

  <!-- Three field circles: sophisticated harmonious palette -->
  <!-- Computer Architecture (Top Left) -->
  <circle cx="335" cy="300" r="205" fill="#EAF3F8" fill-opacity="0.72" stroke="#1F5F7A" stroke-width="2.5"/>
  <!-- Machine Learning (Top Right) -->
  <circle cx="565" cy="300" r="205" fill="#F3EEF9" fill-opacity="0.72" stroke="#5E4DB2" stroke-width="2.5"/>
  <!-- EDA (Bottom Center) -->
  <circle cx="450" cy="490" r="205" fill="#ECF6F0" fill-opacity="0.72" stroke="#2D7C5D" stroke-width="2.5"/>

  <!-- Outer Field Headers -->
  <!-- Computer Architecture -->
  <g transform="translate(170, 75)" text-anchor="middle">
    <rect x="-140" y="-22" width="280" height="46" rx="8" fill="#FFFFFF" filter="url(#soft-shadow)" stroke="#D1E4EE" stroke-width="1.2"/>
    <text x="0" y="-1" font-size="16" font-weight="700" fill="#1F5F7A">Computer Architecture</text>
    <text x="0" y="15" font-size="11" font-weight="500" fill="#64748B">processors • memory • interconnect</text>
  </g>

  <!-- Machine Learning -->
  <g transform="translate(730, 75)" text-anchor="middle">
    <rect x="-130" y="-22" width="260" height="46" rx="8" fill="#FFFFFF" filter="url(#soft-shadow)" stroke="#E4D9F5" stroke-width="1.2"/>
    <text x="0" y="-1" font-size="16" font-weight="700" fill="#5E4DB2">Machine Learning</text>
    <text x="0" y="15" font-size="11" font-weight="500" fill="#64748B">models • training • inference</text>
  </g>

  <!-- EDA -->
  <g transform="translate(450, 705)" text-anchor="middle">
    <rect x="-160" y="-22" width="320" height="46" rx="8" fill="#FFFFFF" filter="url(#soft-shadow)" stroke="#CEEAD8" stroke-width="1.2"/>
    <text x="0" y="-1" font-size="16" font-weight="700" fill="#2D7C5D">Electronic Design Automation</text>
    <text x="0" y="15" font-size="11" font-weight="500" fill="#64748B">synthesis • verification • signoff</text>
  </g>

  <!-- Single-Field Subtitles / Pure Domains -->
  <g font-size="12" font-style="italic" fill="#59636D" text-anchor="middle">
    <text x="230" y="250">classical architecture</text>
    <text x="670" y="250">core ML</text>
    <text x="450" y="620">core EDA</text>
  </g>

  <!-- Pairwise Intersection Badges (Cards) -->
  <!-- Architecture + ML: ML for Systems -->
  <g transform="translate(450, 205)" text-anchor="middle">
    <rect x="-95" y="-20" width="190" height="40" rx="6" fill="#FFFFFF" filter="url(#soft-shadow)" stroke="#CBD5E1" stroke-width="1"/>
    <text x="0" y="-3" font-size="13" font-weight="700" fill="#0F172A">ML for Systems</text>
    <text x="0" y="12" font-size="10" font-weight="500" fill="#475569">evidence: simulator benchmarks</text>
  </g>

  <!-- Architecture + EDA: Chip Design -->
  <g transform="translate(315, 435)" text-anchor="middle">
    <rect x="-85" y="-20" width="170" height="40" rx="6" fill="#FFFFFF" filter="url(#soft-shadow)" stroke="#CBD5E1" stroke-width="1"/>
    <text x="0" y="-3" font-size="13" font-weight="700" fill="#0F172A">Chip Design</text>
    <text x="0" y="12" font-size="10" font-weight="500" fill="#475569">evidence: signoff &amp; silicon</text>
  </g>

  <!-- ML + EDA: ML for CAD -->
  <g transform="translate(585, 435)" text-anchor="middle">
    <rect x="-85" y="-20" width="170" height="40" rx="6" fill="#FFFFFF" filter="url(#soft-shadow)" stroke="#CBD5E1" stroke-width="1"/>
    <text x="0" y="-3" font-size="13" font-weight="700" fill="#0F172A">ML for CAD</text>
    <text x="0" y="12" font-size="10" font-weight="500" fill="#475569">evidence: post-route metrics</text>
  </g>

  <!-- Center Core: Architecture 2.0 (Tripartite Intersection Badge) -->
  <g transform="translate(450, 360)" text-anchor="middle">
    <rect x="-125" y="-42" width="250" height="84" rx="12" fill="#FFFFFF" filter="url(#center-shadow)" stroke="#1F5F7A" stroke-width="2"/>
    <rect x="-125" y="-42" width="250" height="4" rx="2" fill="#1F5F7A"/>
    <text x="0" y="-12" font-size="18" font-weight="800" fill="#1F5F7A" letter-spacing="0.3px">Architecture 2.0</text>
    <text x="0" y="9" font-size="11.5" font-weight="600" fill="#20252B">AI across system and chip design</text>
    <text x="0" y="27" font-size="10" font-weight="700" fill="#A9671E" letter-spacing="0.2px">MUST SATISFY ALL THREE STANDARDS</text>
  </g>
</svg>
