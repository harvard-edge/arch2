<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 780" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="card-shadow-cu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="badge-shadow-cu" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="nexus-glow-cu" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1F5F7A" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="grad-arch-cu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F5F7A"/>
      <stop offset="100%" stop-color="#2B7E9E"/>
    </linearGradient>
    <linearGradient id="grad-ml-cu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E4DB2"/>
      <stop offset="100%" stop-color="#7C68D6"/>
    </linearGradient>
    <linearGradient id="grad-eda-cu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D7C5D"/>
      <stop offset="100%" stop-color="#3EA37C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="920" height="780" fill="#FFFFFF"/>

  <!-- Shaded Equilateral Connecting Triangle -->
  <polygon points="230,205 690,205 460,600" fill="#F6F9FA" stroke="#DCE7EC" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="230,205 690,205 460,600" fill="none" stroke="#1F5F7A" stroke-width="1" stroke-dasharray="5 4" stroke-opacity="0.35"/>

  <!-- Three Pairwise Sloped Badges Aligned with the Triangle Frame -->
  <!-- 1. Top Edge: ML for Systems (Horizontal at top edge) -->
  <g transform="translate(460, 205)" text-anchor="middle">
    <rect x="-95" y="-21" width="190" height="42" rx="8" fill="#FFFFFF" filter="url(#badge-shadow-cu)" stroke="#CBD5E1" stroke-width="1.2"/>
    <circle cx="-76" cy="0" r="3.5" fill="#1F5F7A"/>
    <text x="6" y="-2" font-size="13" font-weight="700" fill="#0F172A">ML for Systems</text>
    <text x="6" y="12" font-size="10" font-weight="500" fill="#64748B">simulator benchmarks</text>
  </g>

  <!-- 2. Left Edge: Chip Design (Rotated Clockwise 59.5 deg along the left edge) -->
  <g transform="translate(345, 402.5) rotate(59.5)" text-anchor="middle">
    <rect x="-95" y="-21" width="190" height="42" rx="8" fill="#FFFFFF" filter="url(#badge-shadow-cu)" stroke="#CBD5E1" stroke-width="1.2"/>
    <circle cx="-76" cy="0" r="3.5" fill="#1F5F7A"/>
    <text x="6" y="-2" font-size="13" font-weight="700" fill="#0F172A">Chip Design</text>
    <text x="6" y="12" font-size="10" font-weight="500" fill="#64748B">signoff &amp; physical silicon</text>
  </g>

  <!-- 3. Right Edge: ML for CAD (Rotated Anti-Clockwise -59.5 deg along the right edge) -->
  <g transform="translate(575, 402.5) rotate(-59.5)" text-anchor="middle">
    <rect x="-95" y="-21" width="190" height="42" rx="8" fill="#FFFFFF" filter="url(#badge-shadow-cu)" stroke="#CBD5E1" stroke-width="1.2"/>
    <circle cx="-76" cy="0" r="3.5" fill="#5E4DB2"/>
    <text x="6" y="-2" font-size="13" font-weight="700" fill="#0F172A">ML for CAD</text>
    <text x="6" y="12" font-size="10" font-weight="500" fill="#64748B">post-route proxy metrics</text>
  </g>

  <!-- Three Main Domain Cards (Vertices) -->
  <!-- Top Left: Computer Architecture -->
  <g transform="translate(115, 115)">
    <rect x="0" y="0" width="230" height="125" rx="12" fill="#FFFFFF" filter="url(#card-shadow-cu)" stroke="#D1E4EE" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="36" rx="12" fill="url(#grad-arch-cu)"/>
    <rect x="0" y="20" width="230" height="16" fill="url(#grad-arch-cu)"/>
    <text x="115" y="23" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Computer Architecture</text>
    <text x="115" y="58" font-size="11.5" font-weight="600" fill="#1F5F7A" text-anchor="middle">Physical Trade-offs &amp; Intent</text>
    <text x="115" y="78" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">processors • memory • interconnect</text>
    <text x="115" y="102" font-size="9" font-weight="700" fill="#1F5F7A" text-anchor="middle" letter-spacing="0.5px">DOMAIN STANDARDS</text>
  </g>

  <!-- Top Right: Machine Learning -->
  <g transform="translate(575, 115)">
    <rect x="0" y="0" width="230" height="125" rx="12" fill="#FFFFFF" filter="url(#card-shadow-cu)" stroke="#E4D9F5" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="36" rx="12" fill="url(#grad-ml-cu)"/>
    <rect x="0" y="20" width="230" height="16" fill="url(#grad-ml-cu)"/>
    <text x="115" y="23" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Machine Learning</text>
    <text x="115" y="58" font-size="11.5" font-weight="600" fill="#5E4DB2" text-anchor="middle">Search &amp; Surrogate Methods</text>
    <text x="115" y="78" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">models • training • inference</text>
    <text x="115" y="102" font-size="9" font-weight="700" fill="#5E4DB2" text-anchor="middle" letter-spacing="0.5px">EVALUATION STANDARDS</text>
  </g>

  <!-- Bottom: EDA & Silicon Tools -->
  <g transform="translate(345, 590)">
    <rect x="0" y="0" width="230" height="125" rx="12" fill="#FFFFFF" filter="url(#card-shadow-cu)" stroke="#CEEAD8" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="36" rx="12" fill="url(#grad-eda-cu)"/>
    <rect x="0" y="20" width="230" height="16" fill="url(#grad-eda-cu)"/>
    <text x="115" y="23" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">EDA &amp; Silicon Tools</text>
    <text x="115" y="58" font-size="11.5" font-weight="600" fill="#2D7C5D" text-anchor="middle">Executable Physical Signoff</text>
    <text x="115" y="78" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">synthesis • timing • verification</text>
    <text x="115" y="102" font-size="9" font-weight="700" fill="#2D7C5D" text-anchor="middle" letter-spacing="0.5px">SILICON SIGNOFF STANDARDS</text>
  </g>

  <!-- Central Nexus Hub (Architecture 2.0) -->
  <g transform="translate(460, 365)" text-anchor="middle">
    <circle cx="0" cy="0" r="82" fill="#FFFFFF" filter="url(#nexus-glow-cu)" stroke="#1F5F7A" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="74" fill="#F0F8FA" stroke="#B8DCE8" stroke-width="1"/>
    <text x="0" y="-18" font-size="17" font-weight="800" fill="#1F5F7A" letter-spacing="0.3px">Architecture 2.0</text>
    <text x="0" y="4" font-size="10.5" font-weight="600" fill="#20252B">AI across system &amp; chip</text>
    <text x="0" y="24" font-size="9" font-weight="800" fill="#A9671E" letter-spacing="0.2px">MUST SATISFY ALL 3</text>
    <text x="0" y="40" font-size="8.5" font-weight="600" fill="#59636D">Joint Physical Rigor</text>
  </g>
</svg>
