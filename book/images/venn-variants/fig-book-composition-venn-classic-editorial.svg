<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="badge-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="center-shadow-d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1F5F7A" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="880" height="720" fill="#FFFFFF"/>

  <!-- Three overlapping field circles with subtle harmonious tints -->
  <!-- Computer Architecture (Top Left) -->
  <circle cx="325" cy="290" r="205" fill="#EAF4F9" fill-opacity="0.75" stroke="#1F5F7A" stroke-width="2.4"/>
  <!-- Machine Learning (Top Right) -->
  <circle cx="555" cy="290" r="205" fill="#F3EFFB" fill-opacity="0.75" stroke="#5E4DB2" stroke-width="2.4"/>
  <!-- EDA (Bottom Center) -->
  <circle cx="440" cy="475" r="205" fill="#EDF7F1" fill-opacity="0.75" stroke="#2D7C5D" stroke-width="2.4"/>

  <!-- Main Discipline Titles (Integrated above/below circles) -->
  <!-- Top Left: Computer Architecture -->
  <g text-anchor="middle">
    <text x="210" y="58" font-size="18" font-weight="800" fill="#1F5F7A" letter-spacing="-0.2px">Computer Architecture</text>
    <text x="210" y="78" font-size="11.5" font-weight="500" fill="#59636D">processors • memory • interconnect</text>
  </g>

  <!-- Top Right: Machine Learning -->
  <g text-anchor="middle">
    <text x="670" y="58" font-size="18" font-weight="800" fill="#5E4DB2" letter-spacing="-0.2px">Machine Learning</text>
    <text x="670" y="78" font-size="11.5" font-weight="500" fill="#59636D">models • training • inference</text>
  </g>

  <!-- Bottom: EDA -->
  <g text-anchor="middle">
    <text x="440" y="670" font-size="18" font-weight="800" fill="#2D7C5D" letter-spacing="-0.2px">Electronic Design Automation</text>
    <text x="440" y="690" font-size="11.5" font-weight="500" fill="#59636D">synthesis • verification • signoff</text>
  </g>

  <!-- Pure Single-Domain Markers -->
  <g font-size="11.5" font-style="italic" fill="#64748B" text-anchor="middle">
    <text x="220" y="240">classical architecture</text>
    <text x="660" y="240">core ML</text>
    <text x="440" y="600">core EDA</text>
  </g>

  <!-- Pairwise Intersection Badges -->
  <!-- Top Intersection: ML for Systems -->
  <g transform="translate(440, 195)" text-anchor="middle">
    <rect x="-90" y="-19" width="180" height="38" rx="7" fill="#FFFFFF" filter="url(#badge-shadow)" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="-72" cy="0" r="3.5" fill="#1F5F7A"/>
    <text x="6" y="-2" font-size="13" font-weight="700" fill="#0F172A">ML for Systems</text>
    <text x="6" y="12" font-size="10" font-weight="500" fill="#475569">simulator benchmarks</text>
  </g>

  <!-- Bottom-Left Intersection: Chip Design -->
  <g transform="translate(305, 420)" text-anchor="middle">
    <rect x="-85" y="-19" width="170" height="38" rx="7" fill="#FFFFFF" filter="url(#badge-shadow)" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="-67" cy="0" r="3.5" fill="#1F5F7A"/>
    <text x="6" y="-2" font-size="13" font-weight="700" fill="#0F172A">Chip Design</text>
    <text x="6" y="12" font-size="10" font-weight="500" fill="#475569">signoff &amp; physical silicon</text>
  </g>

  <!-- Bottom-Right Intersection: ML for CAD -->
  <g transform="translate(575, 420)" text-anchor="middle">
    <rect x="-85" y="-19" width="170" height="38" rx="7" fill="#FFFFFF" filter="url(#badge-shadow)" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="-67" cy="0" r="3.5" fill="#5E4DB2"/>
    <text x="6" y="-2" font-size="13" font-weight="700" fill="#0F172A">ML for CAD</text>
    <text x="6" y="12" font-size="10" font-weight="500" fill="#475569">post-route proxy metrics</text>
  </g>

  <!-- Center Convergence Hub: Architecture 2.0 -->
  <g transform="translate(440, 350)" text-anchor="middle">
    <rect x="-120" y="-42" width="240" height="84" rx="14" fill="#FFFFFF" filter="url(#center-shadow-d)" stroke="#1F5F7A" stroke-width="2.2"/>
    <rect x="-120" y="-42" width="240" height="5" rx="2" fill="#1F5F7A"/>
    <text x="0" y="-12" font-size="18" font-weight="800" fill="#1F5F7A" letter-spacing="0.2px">Architecture 2.0</text>
    <text x="0" y="8" font-size="11" font-weight="600" fill="#20252B">AI across system and chip design</text>
    <text x="0" y="26" font-size="9.5" font-weight="800" fill="#A9671E" letter-spacing="0.3px">MUST SATISFY ALL THREE STANDARDS</text>
  </g>
</svg>
