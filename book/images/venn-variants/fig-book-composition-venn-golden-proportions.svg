<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="pill-shadow-g" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="center-glow-g" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1F5F7A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="800" fill="#FFFFFF"/>

  <!-- Three Overlapping Field Circles -->
  <!-- Computer Architecture (Top Left) -->
  <circle cx="330" cy="295" r="215" fill="#EBF5F9" fill-opacity="0.75" stroke="#1F5F7A" stroke-width="2.4"/>
  <!-- Machine Learning (Top Right) -->
  <circle cx="570" cy="295" r="215" fill="#F3EEFA" fill-opacity="0.75" stroke="#5E4DB2" stroke-width="2.4"/>
  <!-- EDA (Bottom Center) -->
  <circle cx="450" cy="490" r="215" fill="#EDF7F1" fill-opacity="0.75" stroke="#2D7C5D" stroke-width="2.4"/>

  <!-- Main Discipline Headers (Proportional Hierarchy: 18.5px / 12px) -->
  <!-- Top Left: Computer Architecture -->
  <g text-anchor="middle">
    <text x="210" y="46" font-size="18.5" font-weight="800" fill="#1F5F7A" letter-spacing="-0.2px">Computer Architecture</text>
    <text x="210" y="67" font-size="12" font-weight="500" fill="#59636D">processors • memory • interconnect</text>
  </g>

  <!-- Top Right: Machine Learning -->
  <g text-anchor="middle">
    <text x="690" y="46" font-size="18.5" font-weight="800" fill="#5E4DB2" letter-spacing="-0.2px">Machine Learning</text>
    <text x="690" y="67" font-size="12" font-weight="500" fill="#59636D">models • training • inference</text>
  </g>

  <!-- Bottom: Electronic Design Automation -->
  <g text-anchor="middle">
    <text x="450" y="746" font-size="18.5" font-weight="800" fill="#2D7C5D" letter-spacing="-0.2px">Electronic Design Automation</text>
    <text x="450" y="767" font-size="12" font-weight="500" fill="#59636D">synthesis • verification • signoff</text>
  </g>

  <!-- Single-Domain Region Markers (Elevated to 13px Medium Italic with balanced color) -->
  <g font-size="13" font-weight="500" font-style="italic" fill="#59636D" text-anchor="middle">
    <text x="220" y="245">classical architecture</text>
    <text x="680" y="245">core ML</text>
    <text x="450" y="625">core EDA</text>
  </g>

  <!-- Pairwise Intersection Floating Badges (13.5px / 10.5px) -->
  <!-- Top: ML for Systems -->
  <g transform="translate(450, 195)" text-anchor="middle">
    <rect x="-92" y="-20" width="184" height="40" rx="20" fill="#FFFFFF" filter="url(#pill-shadow-g)" stroke="#CBD5E1" stroke-width="1.1"/>
    <circle cx="-72" cy="0" r="3.8" fill="#1F5F7A"/>
    <text x="6" y="-2" font-size="13.5" font-weight="700" fill="#0F172A">ML for Systems</text>
    <text x="6" y="12" font-size="10.5" font-weight="500" fill="#64748B">simulator benchmarks</text>
  </g>

  <!-- Bottom-Left: Chip Design -->
  <g transform="translate(305, 430)" text-anchor="middle">
    <rect x="-88" y="-20" width="176" height="40" rx="20" fill="#FFFFFF" filter="url(#pill-shadow-g)" stroke="#CBD5E1" stroke-width="1.1"/>
    <circle cx="-68" cy="0" r="3.8" fill="#1F5F7A"/>
    <text x="6" y="-2" font-size="13.5" font-weight="700" fill="#0F172A">Chip Design</text>
    <text x="6" y="12" font-size="10.5" font-weight="500" fill="#64748B">signoff &amp; physical silicon</text>
  </g>

  <!-- Bottom-Right: ML for CAD -->
  <g transform="translate(595, 430)" text-anchor="middle">
    <rect x="-88" y="-20" width="176" height="40" rx="20" fill="#FFFFFF" filter="url(#pill-shadow-g)" stroke="#CBD5E1" stroke-width="1.1"/>
    <circle cx="-68" cy="0" r="3.8" fill="#5E4DB2"/>
    <text x="6" y="-2" font-size="13.5" font-weight="700" fill="#0F172A">ML for CAD</text>
    <text x="6" y="12" font-size="10.5" font-weight="500" fill="#64748B">post-route proxy metrics</text>
  </g>

  <!-- Center Convergence Hub: Architecture 2.0 (Proportional Core: 18px / 11px / 9px) -->
  <g transform="translate(450, 360)" text-anchor="middle">
    <circle cx="0" cy="0" r="76" fill="#FFFFFF" filter="url(#center-glow-g)" stroke="#1F5F7A" stroke-width="2.4"/>
    <circle cx="0" cy="0" r="68" fill="#F0F8FA" stroke="#BAE6FD" stroke-width="0.9"/>
    <text x="0" y="-15" font-size="17.5" font-weight="800" fill="#1F5F7A" letter-spacing="0.2px">Architecture 2.0</text>
    <text x="0" y="5" font-size="10.5" font-weight="600" fill="#1E293B">AI across system &amp; chip</text>
    <text x="0" y="23" font-size="9" font-weight="800" fill="#C2410C" letter-spacing="0.35px">MUST SATISFY ALL THREE</text>
  </g>
</svg>
