<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 740" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <filter id="nexus-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1F5F7A" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="grad-arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F5F7A"/>
      <stop offset="100%" stop-color="#2B7E9E"/>
    </linearGradient>
    <linearGradient id="grad-ml" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E4DB2"/>
      <stop offset="100%" stop-color="#7C68D6"/>
    </linearGradient>
    <linearGradient id="grad-eda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D7C5D"/>
      <stop offset="100%" stop-color="#3EA37C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="920" height="740" fill="#FAFCFD"/>

  <!-- Triangular connection bridges -->
  <path d="M 260 210 L 660 210 L 460 550 Z" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Pairwise Bridge Ribbons -->
  <!-- Top Bridge: ML for Systems -->
  <g transform="translate(460, 210)" text-anchor="middle">
    <rect x="-100" y="-22" width="200" height="44" rx="8" fill="#FFFFFF" filter="url(#card-shadow)" stroke="#CBD5E1" stroke-width="1"/>
    <text x="0" y="-3" font-size="13.5" font-weight="700" fill="#0F172A">ML for Systems</text>
    <text x="0" y="13" font-size="10.5" font-weight="500" fill="#64748B">simulator benchmarks</text>
  </g>

  <!-- Left-Down Bridge: Chip Design -->
  <g transform="translate(330, 400)" text-anchor="middle">
    <rect x="-90" y="-22" width="180" height="44" rx="8" fill="#FFFFFF" filter="url(#card-shadow)" stroke="#CBD5E1" stroke-width="1"/>
    <text x="0" y="-3" font-size="13.5" font-weight="700" fill="#0F172A">Chip Design</text>
    <text x="0" y="13" font-size="10.5" font-weight="500" fill="#64748B">signoff &amp; physical silicon</text>
  </g>

  <!-- Right-Down Bridge: ML for CAD -->
  <g transform="translate(590, 400)" text-anchor="middle">
    <rect x="-90" y="-22" width="180" height="44" rx="8" fill="#FFFFFF" filter="url(#card-shadow)" stroke="#CBD5E1" stroke-width="1"/>
    <text x="0" y="-3" font-size="13.5" font-weight="700" fill="#0F172A">ML for CAD</text>
    <text x="0" y="13" font-size="10.5" font-weight="500" fill="#64748B">post-route proxy metrics</text>
  </g>

  <!-- Three Pillar Main Nodes (Cards) -->
  <!-- Top Left: Computer Architecture -->
  <g transform="translate(150, 130)">
    <rect x="0" y="0" width="230" height="125" rx="12" fill="#FFFFFF" filter="url(#card-shadow)" stroke="#D1E4EE" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="36" rx="12" fill="url(#grad-arch)"/>
    <rect x="0" y="20" width="230" height="16" fill="url(#grad-arch)"/>
    <text x="115" y="23" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Computer Architecture</text>
    <text x="115" y="58" font-size="11.5" font-weight="600" fill="#1F5F7A" text-anchor="middle">Physical Trade-offs &amp; Intent</text>
    <text x="115" y="78" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">processors • memory • interconnect</text>
    <text x="115" y="102" font-size="9.5" font-weight="600" fill="#64748B" text-anchor="middle">DOMAIN STANDARDS</text>
  </g>

  <!-- Top Right: Machine Learning -->
  <g transform="translate(540, 130)">
    <rect x="0" y="0" width="230" height="125" rx="12" fill="#FFFFFF" filter="url(#card-shadow)" stroke="#E4D9F5" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="36" rx="12" fill="url(#grad-ml)"/>
    <rect x="0" y="20" width="230" height="16" fill="url(#grad-ml)"/>
    <text x="115" y="23" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Machine Learning</text>
    <text x="115" y="58" font-size="11.5" font-weight="600" fill="#5E4DB2" text-anchor="middle">Search &amp; Surrogate Methods</text>
    <text x="115" y="78" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">models • training • inference</text>
    <text x="115" y="102" font-size="9.5" font-weight="600" fill="#64748B" text-anchor="middle">EVALUATION STANDARDS</text>
  </g>

  <!-- Bottom: EDA -->
  <g transform="translate(345, 545)">
    <rect x="0" y="0" width="230" height="125" rx="12" fill="#FFFFFF" filter="url(#card-shadow)" stroke="#CEEAD8" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="36" rx="12" fill="url(#grad-eda)"/>
    <rect x="0" y="20" width="230" height="16" fill="url(#grad-eda)"/>
    <text x="115" y="23" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">EDA &amp; Silicon Tools</text>
    <text x="115" y="58" font-size="11.5" font-weight="600" fill="#2D7C5D" text-anchor="middle">Executable Physical Signoff</text>
    <text x="115" y="78" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">synthesis • timing • verification</text>
    <text x="115" y="102" font-size="9.5" font-weight="600" fill="#64748B" text-anchor="middle">SILICON SIGNOFF STANDARDS</text>
  </g>

  <!-- Central Core Nexus (The Convergence) -->
  <g transform="translate(460, 365)" text-anchor="middle">
    <circle cx="0" cy="0" r="82" fill="#FFFFFF" filter="url(#nexus-glow)" stroke="#1F5F7A" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="74" fill="#F0F8FA" stroke="#B8DCE8" stroke-width="1"/>
    <text x="0" y="-18" font-size="17" font-weight="800" fill="#1F5F7A" letter-spacing="0.3px">Architecture 2.0</text>
    <text x="0" y="4" font-size="10.5" font-weight="600" fill="#20252B">AI across system &amp; chip</text>
    <text x="0" y="24" font-size="9" font-weight="700" fill="#C2410C" letter-spacing="0.2px">MUST SATISFY ALL 3</text>
    <text x="0" y="40" font-size="8.5" font-weight="500" fill="#59636D">Joint Physical Rigor</text>
  </g>
</svg>
