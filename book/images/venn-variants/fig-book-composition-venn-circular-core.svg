<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="pill-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <filter id="center-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#1F5F7A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="880" height="770" fill="#FFFFFF"/>

  <!-- Three Overlapping Field Circles with Refined Pastel Fills -->
  <!-- Computer Architecture (Top Left) -->
  <circle cx="320" cy="280" r="210" fill="#EBF5F9" fill-opacity="0.75" stroke="#1F5F7A" stroke-width="2.2"/>
  <!-- Machine Learning (Top Right) -->
  <circle cx="560" cy="280" r="210" fill="#F3EEFA" fill-opacity="0.75" stroke="#5E4DB2" stroke-width="2.2"/>
  <!-- EDA (Bottom Center) -->
  <circle cx="440" cy="470" r="210" fill="#EDF7F1" fill-opacity="0.75" stroke="#2D7C5D" stroke-width="2.2"/>

  <!-- Main Discipline Titles (Generous padding & clear hierarchy) -->
  <!-- Top Left: Computer Architecture -->
  <g text-anchor="middle">
    <text x="205" y="50" font-size="17.5" font-weight="800" fill="#1F5F7A" letter-spacing="-0.2px">Computer Architecture</text>
    <text x="205" y="70" font-size="11.5" font-weight="500" fill="#59636D">processors • memory • interconnect</text>
  </g>

  <!-- Top Right: Machine Learning -->
  <g text-anchor="middle">
    <text x="675" y="50" font-size="17.5" font-weight="800" fill="#5E4DB2" letter-spacing="-0.2px">Machine Learning</text>
    <text x="675" y="70" font-size="11.5" font-weight="500" fill="#59636D">models • training • inference</text>
  </g>

  <!-- Bottom: Electronic Design Automation (Moved down with 35px breathing room below circle) -->
  <g text-anchor="middle">
    <text x="440" y="722" font-size="17.5" font-weight="800" fill="#2D7C5D" letter-spacing="-0.2px">Electronic Design Automation</text>
    <text x="440" y="742" font-size="11.5" font-weight="500" fill="#59636D">synthesis • verification • signoff</text>
  </g>

  <!-- Pure Single-Domain Markers -->
  <g font-size="11.5" font-style="italic" fill="#64748B" text-anchor="middle">
    <text x="215" y="230">classical architecture</text>
    <text x="665" y="230">core ML</text>
    <text x="440" y="600">core EDA</text>
  </g>

  <!-- Pairwise Intersection Floating Badges -->
  <!-- Top: ML for Systems -->
  <g transform="translate(440, 185)" text-anchor="middle">
    <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#FFFFFF" filter="url(#pill-shadow)" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="-67" cy="0" r="3.5" fill="#1F5F7A"/>
    <text x="6" y="-2" font-size="12" font-weight="700" fill="#0F172A">ML for Systems</text>
    <text x="6" y="11" font-size="9.5" font-weight="500" fill="#64748B">simulator benchmarks</text>
  </g>

  <!-- Bottom-Left: Chip Design -->
  <g transform="translate(300, 415)" text-anchor="middle">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#FFFFFF" filter="url(#pill-shadow)" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="-63" cy="0" r="3.5" fill="#1F5F7A"/>
    <text x="6" y="-2" font-size="12" font-weight="700" fill="#0F172A">Chip Design</text>
    <text x="6" y="11" font-size="9.5" font-weight="500" fill="#64748B">signoff &amp; silicon</text>
  </g>

  <!-- Bottom-Right: ML for CAD -->
  <g transform="translate(580, 415)" text-anchor="middle">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#FFFFFF" filter="url(#pill-shadow)" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="-63" cy="0" r="3.5" fill="#5E4DB2"/>
    <text x="6" y="-2" font-size="12" font-weight="700" fill="#0F172A">ML for CAD</text>
    <text x="6" y="11" font-size="9.5" font-weight="500" fill="#64748B">post-route metrics</text>
  </g>

  <!-- Center Convergence Hub: Architecture 2.0 (Circular Illuminated Shield) -->
  <g transform="translate(440, 345)" text-anchor="middle">
    <circle cx="0" cy="0" r="72" fill="#FFFFFF" filter="url(#center-glow)" stroke="#1F5F7A" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="65" fill="#F0F8FA" stroke="#BAE6FD" stroke-width="0.8"/>
    <text x="0" y="-14" font-size="16" font-weight="800" fill="#1F5F7A" letter-spacing="0.2px">Architecture 2.0</text>
    <text x="0" y="4" font-size="10" font-weight="600" fill="#20252B">AI across system &amp; chip</text>
    <text x="0" y="21" font-size="8.5" font-weight="800" fill="#C2410C" letter-spacing="0.3px">MUST SATISFY ALL THREE</text>
  </g>
</svg>
