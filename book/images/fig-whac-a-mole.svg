<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 578" role="img" aria-labelledby="whac-title whac-desc">
  <title id="whac-title">A rollback restores the earlier candidate</title>
  <desc id="whac-desc">Three candidate states run top to bottom. Candidate S sub t has signature H of S sub t, before repair. A physical repair produces candidate S sub t plus 1, whose signature differs from H of S sub t because physical artifacts changed. A rollback produces candidate S sub t plus 2, whose signature equals H of S sub t because earlier artifacts are restored. A red dashed return path labeled matching candidate signatures links the third candidate back to the first. A note lists the signature inputs: canonical netlist, placement and routing database, and effective loaded constraints. A second note says that before retrying, the workflow should check tool configuration, random state, policy state, and action history, because a candidate match alone does not establish a workflow cycle.</desc>
  <defs>
    <marker id="wm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="wm-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C62A2A"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .box { stroke-width: 1.7; }
      .workload { fill: #E4F1F6; stroke: #1683A6; }
      .method   { fill: #FBF0DE; stroke: #E68A17; }
      .neutral  { fill: #F5F8FA; stroke: #7E8B96; }
      .head { font-size: 15px; font-weight: 700; fill: #20252B; }
      .title { font-size: 15px; font-weight: 700; fill: #20252B; }
      .math { font-size: 15px; fill: #20252B; }
      .sub { font-size: 13px; fill: #444444; }
      .note { font-size: 13px; fill: #20252B; }
      .edge-label { font-size: 13px; fill: #20252B; }
      .edge { fill: none; stroke: #333333; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#wm-arrow); }
      .revise { fill: none; stroke: #C62A2A; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; stroke-dasharray: 6 4; marker-end: url(#wm-arrow-red); }
      .revise-text { font-size: 12.5px; font-weight: 700; fill: #C62A2A; }
    </style>
  </defs>

  <rect width="800" height="578" fill="#FFFFFF"/>
  <g class="font">

    <text class="head" x="470" y="36" text-anchor="middle">A rollback restores the earlier candidate</text>

    <!-- Candidate S_t -->
    <rect class="box workload" x="170" y="58" width="600" height="86"/>
    <text class="title" x="470" y="84" text-anchor="middle">Candidate <tspan font-style="italic">S</tspan><tspan dy="4" font-size="10" font-style="italic">t</tspan><tspan dy="-4"></tspan></text>
    <text class="math" x="470" y="108" text-anchor="middle">Signature <tspan font-style="italic">H</tspan>(<tspan font-style="italic">S</tspan><tspan dy="4" font-size="10" font-style="italic">t</tspan><tspan dy="-4">)</tspan></text>
    <text class="sub" x="470" y="130" text-anchor="middle">Before repair</text>

    <!-- Physical repair -->
    <path class="edge" d="M 470 144 V 184"/>
    <text class="edge-label" x="486" y="169">Physical repair</text>

    <!-- Candidate S_t+1 -->
    <rect class="box method" x="170" y="184" width="600" height="86"/>
    <text class="title" x="470" y="210" text-anchor="middle">Candidate <tspan font-style="italic">S</tspan><tspan dy="4" font-size="10"><tspan font-style="italic">t</tspan>+1</tspan><tspan dy="-4"></tspan></text>
    <text class="math" x="470" y="234" text-anchor="middle"><tspan font-style="italic">H</tspan>(<tspan font-style="italic">S</tspan><tspan dy="4" font-size="10"><tspan font-style="italic">t</tspan>+1</tspan><tspan dy="-4">)</tspan><tspan dx="4">≠</tspan><tspan dx="4" font-style="italic">H</tspan>(<tspan font-style="italic">S</tspan><tspan dy="4" font-size="10" font-style="italic">t</tspan><tspan dy="-4">)</tspan></text>
    <text class="sub" x="470" y="256" text-anchor="middle">Physical artifacts changed</text>

    <!-- Rollback -->
    <path class="edge" d="M 470 270 V 310"/>
    <text class="edge-label" x="486" y="295">Rollback</text>

    <!-- Candidate S_t+2 -->
    <rect class="box workload" x="170" y="310" width="600" height="86"/>
    <text class="title" x="470" y="336" text-anchor="middle">Candidate <tspan font-style="italic">S</tspan><tspan dy="4" font-size="10"><tspan font-style="italic">t</tspan>+2</tspan><tspan dy="-4"></tspan></text>
    <text class="math" x="470" y="360" text-anchor="middle"><tspan font-style="italic">H</tspan>(<tspan font-style="italic">S</tspan><tspan dy="4" font-size="10"><tspan font-style="italic">t</tspan>+2</tspan><tspan dy="-4">)</tspan><tspan dx="4">=</tspan><tspan dx="4" font-style="italic">H</tspan>(<tspan font-style="italic">S</tspan><tspan dy="4" font-size="10" font-style="italic">t</tspan><tspan dy="-4">)</tspan></text>
    <text class="sub" x="470" y="382" text-anchor="middle">Earlier artifacts restored</text>

    <!-- Recurrence links candidate artifacts, not controller state -->
    <path class="revise" d="M 170 353 H 132 V 101 H 170"/>
    <text class="revise-text" x="120" y="210" text-anchor="end">Matching</text>
    <text class="revise-text" x="120" y="228" text-anchor="end">candidate</text>
    <text class="revise-text" x="120" y="246" text-anchor="end">signatures</text>

    <!-- Signature inputs -->
    <text class="note" x="470" y="432" text-anchor="middle">Signature inputs: canonical netlist, placement/routing</text>
    <text class="note" x="470" y="450" text-anchor="middle">database, and effective loaded constraints.</text>

    <!-- Before retrying -->
    <rect class="box neutral" x="170" y="474" width="600" height="76"/>
    <text class="note" x="470" y="498" text-anchor="middle">Before retrying: check tool configuration, random state,</text>
    <text class="note" x="470" y="516" text-anchor="middle">policy state, and action history. A candidate match alone</text>
    <text class="note" x="470" y="534" text-anchor="middle">does not establish a workflow cycle.</text>

  </g>
</svg>
