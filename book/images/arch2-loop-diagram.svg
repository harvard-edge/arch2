<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">Architecture 2.0 complete system, bounded studies, and optional design loop</title>
  <desc id="desc">A complete AI-assisted design system contains people and authority, represented design state, methods, environments and tools, checks, and records. The system supports multiple bounded architecture studies. Within one study, a question and scope lead to a work request, tool results, and a decision or honest stop. An optional return arrow permits revision, while a study may also close after one pass.</desc>
  <defs>
    <style>
      .head { fill: #20252B; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 760; }
      .label { fill: #20252B; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 720; }
      .small { fill: #59636D; font-family: Georgia, "Times New Roman", serif; font-size: 12.5px; }
      .section { fill: #59636D; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 750; letter-spacing: 1.6px; }
      .arrow { fill: none; stroke: #1F5F7A; stroke-width: 2.8; stroke-linecap: butt; vector-effect: non-scaling-stroke; }
      .return { fill: none; stroke: #A42A38; stroke-width: 2.4; stroke-dasharray: 7 5; vector-effect: non-scaling-stroke; }
      .box { fill: #FFFFFF; stroke: #9AA8B5; stroke-width: 1.2; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="11" refX="12" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 5.5L0 11Z" fill="#1F5F7A"/>
    </marker>
    <marker id="return-arrow" markerWidth="12" markerHeight="11" refX="12" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 5.5L0 11Z" fill="#A42A38"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="978" height="498" rx="3" fill="#F7FAFB" stroke="#6F7E8B" stroke-width="1.6"/>
  <text x="28" y="34" class="head">Complete AI-Assisted Design System</text>
  <text x="952" y="34" class="small" text-anchor="end">persistent across studies</text>

  <rect x="28" y="52" width="924" height="93" rx="3" fill="#EDF3F6" stroke="#9AA8B5" stroke-width="1.1"/>
  <text x="46" y="73" class="section">SYSTEM CAPABILITIES</text>

  <g>
    <rect x="46" y="84" width="164" height="45" rx="2" class="box"/>
    <text x="128" y="102" class="label" text-anchor="middle">People + Authority</text>
    <text x="128" y="120" class="small" text-anchor="middle">questions, actions, decisions</text>
  </g>
  <g>
    <rect x="226" y="84" width="164" height="45" rx="2" class="box"/>
    <text x="308" y="102" class="label" text-anchor="middle">Represented State</text>
    <text x="308" y="120" class="small" text-anchor="middle">designs, history, unknowns</text>
  </g>
  <g>
    <rect x="406" y="84" width="160" height="45" rx="2" class="box"/>
    <text x="486" y="102" class="label" text-anchor="middle">Methods</text>
    <text x="486" y="120" class="small" text-anchor="middle">predict, generate, optimize</text>
  </g>
  <g>
    <rect x="582" y="84" width="176" height="45" rx="2" class="box"/>
    <text x="670" y="102" class="label" text-anchor="middle">Environments + Tools</text>
    <text x="670" y="120" class="small" text-anchor="middle">execute and measure</text>
  </g>
  <g>
    <rect x="774" y="84" width="160" height="45" rx="2" class="box"/>
    <text x="854" y="102" class="label" text-anchor="middle">Checks + Records</text>
    <text x="854" y="120" class="small" text-anchor="middle">qualify and retain results</text>
  </g>

  <rect x="28" y="165" width="704" height="304" rx="3" fill="#FFFFFF" stroke="#1F5F7A" stroke-width="1.8"/>
  <text x="48" y="190" class="section">ONE BOUNDED ARCHITECTURE STUDY</text>
  <text x="712" y="190" class="small" text-anchor="end">one question • one scope • one decision or honest stop</text>

  <g>
    <rect x="52" y="229" width="144" height="72" rx="3" fill="#F1F3F5" stroke="#9AA8B5" stroke-width="1.2"/>
    <text x="124" y="253" class="label" text-anchor="middle">Question + Scope</text>
    <text x="124" y="275" class="small" text-anchor="middle">intent and legal changes</text>
    <text x="124" y="291" class="small" text-anchor="middle">comparison and budget</text>
  </g>
  <g>
    <rect x="220" y="229" width="144" height="72" rx="3" fill="#EEF7FB" stroke="#1F5F7A" stroke-width="1.2"/>
    <text x="292" y="253" class="label" text-anchor="middle">Work Request</text>
    <text x="292" y="275" class="small" text-anchor="middle">candidate or experiment</text>
    <text x="292" y="291" class="small" text-anchor="middle">with allowed actions</text>
  </g>
  <g>
    <rect x="388" y="229" width="144" height="72" rx="3" fill="#EEF7FB" stroke="#1F5F7A" stroke-width="1.2"/>
    <text x="460" y="253" class="label" text-anchor="middle">Tool Results</text>
    <text x="460" y="275" class="small" text-anchor="middle">measurements, failures,</text>
    <text x="460" y="291" class="small" text-anchor="middle">conditions, and limits</text>
  </g>
  <g>
    <rect x="556" y="229" width="148" height="72" rx="3" fill="#FBF0F1" stroke="#A42A38" stroke-width="1.4"/>
    <text x="630" y="253" class="label" text-anchor="middle">Decision or Stop</text>
    <text x="630" y="275" class="small" text-anchor="middle">act, revise, defer,</text>
    <text x="630" y="291" class="small" text-anchor="middle">or record not run</text>
  </g>

  <path class="arrow" d="M196 265H220" marker-end="url(#arrow)"/>
  <path class="arrow" d="M364 265H388" marker-end="url(#arrow)"/>
  <path class="arrow" d="M532 265H556" marker-end="url(#arrow)"/>

  <path class="return" d="M630 302V385H292V305" marker-end="url(#return-arrow)"/>
  <text x="461" y="340" class="label" text-anchor="middle" fill="#A42A38">Optional Revision</text>
  <text x="461" y="363" class="small" text-anchor="middle">return only when a result supports another permitted action</text>

  <path d="M484 413L493 422L511 400" fill="none" stroke="#A42A38" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="611" y="408" class="small" text-anchor="middle">a study may close after one pass</text>
  <text x="611" y="427" class="small" text-anchor="middle">while its question and</text>
  <text x="611" y="446" class="small" text-anchor="middle">decision authority remain visible</text>

  <rect x="756" y="165" width="196" height="304" rx="3" fill="#F3F7F4" stroke="#6E9072" stroke-width="1.4"/>
  <text x="854" y="190" class="section" text-anchor="middle">OTHER STUDIES</text>
  <g>
    <rect x="778" y="222" width="152" height="62" rx="3" class="box"/>
    <text x="854" y="246" class="label" text-anchor="middle">Study B</text>
    <text x="854" y="267" class="small" text-anchor="middle">different question or scope</text>
  </g>
  <g>
    <rect x="778" y="301" width="152" height="62" rx="3" class="box"/>
    <text x="854" y="325" class="label" text-anchor="middle">Study C</text>
    <text x="854" y="346" class="small" text-anchor="middle">different decision or owner</text>
  </g>
  <text x="854" y="404" class="small" text-anchor="middle">Reuse current project state,</text>
  <text x="854" y="421" class="small" text-anchor="middle">tool interfaces, checks,</text>
  <text x="854" y="438" class="small" text-anchor="middle">and operating policies.</text>
</svg>
