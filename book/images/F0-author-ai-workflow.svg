<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .bg { fill: #ffffff; }

      /* Card Fills and Borders */
      .card-header { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 6; }

      /* Harvard Crimson and ETH Zurich Palette */
      .hub-author { fill: #fcfcfd; stroke: #a51c30; stroke-width: 2.5; rx: 10; }
      .hub-bar-crimson { fill: #a51c30; rx: 3; }
      .hub-bar-eth { fill: #1f407a; rx: 3; }
      .hub-badge { fill: #a51c30; rx: 4; }

      .card-gen-container { fill: #f8fafc; stroke: #2563eb; stroke-width: 1.5; rx: 8; }
      .card-panel-container { fill: #f8fafc; stroke: #6a4fc7; stroke-width: 1.5; rx: 8; }
      .subcard-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 4; }

      .card-harness { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; rx: 8; }

      /* Typography */
      .head-hub { font-size: 16px; font-weight: 800; fill: #0f172a; letter-spacing: 0.5px; }
      .sub-hub-harvard { font-size: 12px; fill: #a51c30; font-weight: 800; }
      .sub-hub-eth { font-size: 12px; fill: #1f407a; font-weight: 800; }
      .head-stage { font-size: 12.5px; font-weight: 800; fill: #1e293b; letter-spacing: 0.5px; }
      .head-gen { font-size: 12px; font-weight: 800; fill: #1d4ed8; }
      .head-panel { font-size: 12px; font-weight: 800; fill: #59429e; }
      .head-harness { font-size: 13px; font-weight: 800; fill: #15803d; letter-spacing: 0.5px; }

      .text-bold { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .text-main { font-size: 10.5px; fill: #1e293b; }
      .text-sub { font-size: 9.5px; fill: #475569; }

      /* Connectors and Flow Lines */
      .path-flow { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow-slate); }
      .path-inward { stroke: #2563eb; stroke-width: 1.8; fill: none; marker-end: url(#arrow-blue); }
      .path-interact { stroke: #8b5cf6; stroke-width: 1.4; fill: none; marker-end: url(#arrow-purple); marker-start: url(#arrow-purple-start); }
      .path-inter-gen { stroke: #3b82f6; stroke-width: 1.3; fill: none; marker-end: url(#arrow-blue-small); marker-start: url(#arrow-blue-start-small); }

      .label-loop { font-size: 9.5px; font-weight: 700; fill: #2563eb; }
      .label-flow { font-size: 9.5px; font-weight: 700; fill: #475569; }
    </style>

    <!-- Crisp Arrowhead Markers -->
    <marker id="arrow-slate" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-purple" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M 0 0 L 5 2.5 L 0 5 z" fill="#8b5cf6" />
    </marker>
    <marker id="arrow-purple-start" markerWidth="5" markerHeight="5" refX="1" refY="2.5" orient="auto">
      <path d="M 5 0 L 0 2.5 L 5 5 z" fill="#8b5cf6" />
    </marker>
    <marker id="arrow-blue-small" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M 0 0 L 5 2.5 L 0 5 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-blue-start-small" markerWidth="5" markerHeight="5" refX="1" refY="2.5" orient="auto">
      <path d="M 5 0 L 0 2.5 L 5 5 z" fill="#3b82f6" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- STAGE 1: BACKWARD DESIGN AND LATENT-SPACE EXPLORATION (TOP ROW) -->
  <g transform="translate(30, 15)">
    <rect width="940" height="75" class="card-header" />
    <text x="15" y="18" class="head-stage">STAGE 1: BACKWARD DESIGN AND LATENT-SPACE EXPLORATION</text>

    <!-- Box A1 -->
    <rect x="15" y="26" width="280" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4" />
    <g transform="translate(25, 32)">
      <circle cx="9" cy="12" r="7" fill="none" stroke="#0f172a" stroke-width="1.3" />
      <circle cx="9" cy="12" r="4" fill="none" stroke="#0f172a" stroke-width="1.3" />
      <circle cx="9" cy="12" r="1.5" fill="#0f172a" />
      <text x="22" y="10" class="text-bold">1. Desired Outcomes</text>
      <text x="22" y="22" class="text-sub">Learning objectives &amp; concepts</text>
    </g>

    <path d="M 295 45 H 325" class="path-flow" />

    <!-- Box A2 -->
    <rect x="330" y="26" width="280" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4" />
    <g transform="translate(340, 32)">
      <rect x="3" y="10" width="3" height="7" fill="#0f172a" />
      <rect x="8" y="6" width="3" height="11" fill="#0f172a" />
      <rect x="15" y="3" width="3" height="14" fill="#0f172a" />
      <text x="22" y="10" class="text-bold">2. Core Arguments &amp; Evidence</text>
      <text x="22" y="22" class="text-sub">Structure &amp; key claims</text>
    </g>

    <path d="M 610 45 H 640" class="path-flow" />

    <!-- Box A3 -->
    <rect x="645" y="26" width="280" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4" />
    <g transform="translate(655, 32)">
      <path d="M 10 3 L 11.5 8.5 L 17 10 L 11.5 11.5 L 10 17 L 8.5 11.5 L 3 10 L 8.5 8.5 Z" fill="#0f172a" />
      <text x="22" y="10" class="text-bold">3. Latent-Space Explorer</text>
      <text x="22" y="22" class="text-sub">Broad ideation &amp; alternatives</text>
    </g>
  </g>

  <!-- CONNECTOR: Stage 1 -> Central Human Hub -->
  <path d="M 785 90 V 105 H 500 V 113" class="path-flow" />

  <!-- STAGE 2: HUMAN-CENTERED ORCHESTRATION ENGINE (MIDDLE ROW) -->

  <!-- LEFT CONTAINER: MULTI-AGENT GENERATION SWARM (PROPOSING DRAFTS) -->
  <g transform="translate(30, 120)">
    <rect width="260" height="270" class="card-gen-container" />
    <g transform="translate(15, 10)">
      <path d="M 2 4 H 14 V 14 H 2 Z M 5 7 H 11 M 5 10 H 11" fill="none" stroke="#1d4ed8" stroke-width="1.3" />
      <text x="20" y="12" class="head-gen">Multi-Agent Generation Swarm</text>
    </g>
    <text x="15" y="34" class="text-sub">Inter-Agent Collaboration &amp; Proposals</text>

    <line x1="15" y1="40" x2="245" y2="40" stroke="#bfdbfe" stroke-width="1" />

    <!-- Gen Subagent 1: Drafters -->
    <g transform="translate(12, 45)">
      <rect width="236" height="34" class="subcard-panel" stroke="#3b82f6" fill="#eff6ff" />
      <path d="M 14 6 L 22 6 L 24 14 L 14 14 Z" stroke="#1d4ed8" fill="none" stroke-width="1.2" />
      <text x="32" y="14" font-size="10" font-weight="700" fill="#1e40af">Synthesis &amp; Concept Drafters</text>
      <text x="32" y="26" font-size="8.5" fill="#1d4ed8">Section outlines &amp; main exposition</text>
    </g>

    <!-- Inter-Agent Communication Arrow 1-2 -->
    <path d="M 130 79 V 87" class="path-inter-gen" />

    <!-- Gen Subagent 2: Code Generators -->
    <g transform="translate(12, 89)">
      <rect width="236" height="34" class="subcard-panel" stroke="#0284c7" fill="#f0f9ff" />
      <path d="M 14 8 L 18 12 L 14 16 M 22 8 L 18 12 L 22 16" stroke="#0369a1" fill="none" stroke-width="1.2" />
      <text x="32" y="14" font-size="10" font-weight="700" fill="#0369a1">Code &amp; Harness Generators</text>
      <text x="32" y="26" font-size="8.5" fill="#0284c7">Reference scripts &amp; EDA tool flows</text>
    </g>

    <!-- Inter-Agent Communication Arrow 2-3 -->
    <path d="M 130 123 V 131" class="path-inter-gen" />

    <!-- Gen Subagent 3: Benchmark Collectors -->
    <g transform="translate(12, 133)">
      <rect width="236" height="34" class="subcard-panel" stroke="#0d9488" fill="#f0fdfa" />
      <rect x="14" y="8" width="4" height="8" fill="#0f766e" />
      <rect x="20" y="5" width="4" height="11" fill="#0f766e" />
      <text x="32" y="14" font-size="10" font-weight="700" fill="#0f766e">Benchmark &amp; Data Collectors</text>
      <text x="32" y="26" font-size="8.5" fill="#0d9488">Data aggregation &amp; trade-offs</text>
    </g>

    <!-- Inter-Agent Communication Arrow 3-4 -->
    <path d="M 130 167 V 175" class="path-inter-gen" />

    <!-- Gen Subagent 4: Literature Search -->
    <g transform="translate(12, 177)">
      <rect width="236" height="34" class="subcard-panel" stroke="#475569" fill="#f8fafc" />
      <circle cx="18" cy="11" r="4" stroke="#334155" fill="none" stroke-width="1.2" />
      <path d="M 21 14 L 25 18" stroke="#334155" stroke-width="1.2" />
      <text x="32" y="14" font-size="10" font-weight="700" fill="#334155">Literature &amp; Context Search</text>
      <text x="32" y="26" font-size="8.5" fill="#475569">Historical context &amp; paper receipts</text>
    </g>
  </g>

  <!-- FLOW CONNECTOR: Left Generation Swarm -> Center Human Hub -->
  <path d="M 290 230 H 334" class="path-inward" />
  <text x="312" y="222" text-anchor="middle" class="label-loop">Draft Proposals</text>

  <!-- CENTRAL HUB: VIJAY JANAPA REDDI (JUDGMENT, REFINEMENT & COMMITMENT) -->
  <g transform="translate(340, 120)">
    <rect width="320" height="270" class="hub-author" />

    <!-- Top Dual Highlight Bars (Harvard Crimson & ETH Zurich Blue) -->
    <rect x="0" y="0" width="160" height="8" class="hub-bar-crimson" />
    <rect x="160" y="0" width="160" height="8" class="hub-bar-eth" />

    <text x="160" y="32" text-anchor="middle" class="head-hub">VIJAY JANAPA REDDI</text>

    <g text-anchor="middle">
      <text x="105" y="48" class="sub-hub-harvard">Harvard University</text>
      <text x="160" y="48" font-size="12" fill="#94a3b8" font-weight="400">/</text>
      <text x="215" y="48" class="sub-hub-eth">ETH Zürich</text>
    </g>

    <line x1="20" y1="58" x2="300" y2="58" stroke="#cbd5e1" stroke-width="1" />

    <text x="160" y="75" text-anchor="middle" font-size="11" font-weight="800" fill="#a51c30">Authorial Judgment, Refinement &amp; Commit</text>
    <text x="20" y="96" class="text-main">• Applies critical selection &amp; intent</text>
    <text x="20" y="116" class="text-main">• Prunes ungrounded AI prose</text>
    <text x="20" y="136" class="text-main">• Audits primary literature &amp; math</text>
    <text x="20" y="156" class="text-main">• Refines tone &amp; pedagogical flow</text>
    <text x="20" y="176" class="text-main">• Evaluates trade-offs &amp; intuition</text>

    <rect x="20" y="206" width="280" height="32" class="hub-badge" />
    <text x="160" y="227" text-anchor="middle" font-size="10.5" font-weight="800" fill="#ffffff">100% AUTHORIAL RESPONSIBILITY</text>
  </g>

  <!-- FLOW CONNECTOR: Center Human Hub <-> Right Review Panels -->
  <path d="M 660 230 H 704" class="path-interact" />
  <text x="682" y="222" text-anchor="middle" class="label-flow">Critique &amp; Directives</text>

  <!-- RIGHT CONTAINER: SIMULATED REVIEW PANELS (TESTING & CRITIQUE) -->
  <g transform="translate(710, 120)">
    <rect width="260" height="270" class="card-panel-container" />
    <g transform="translate(15, 10)">
      <rect x="2" y="2" width="12" height="9" rx="2" fill="none" stroke="#59429e" stroke-width="1.3" />
      <circle cx="5" cy="6" r="1" fill="#59429e" />
      <circle cx="11" cy="6" r="1" fill="#59429e" />
      <path d="M 5 14 L 11 14" stroke="#59429e" stroke-width="1.3" />
      <text x="20" y="12" class="head-panel">Simulated Review Panels</text>
    </g>
    <text x="15" y="34" class="text-sub">Subagent Swarms &amp; Style Linters</text>

    <line x1="15" y1="40" x2="245" y2="40" stroke="#ddd6fe" stroke-width="1" />

    <!-- Panel 1: Students -->
    <g transform="translate(12, 45)">
      <rect width="236" height="34" class="subcard-panel" stroke="#3b82f6" fill="#f0f5ff" />
      <path d="M 12 6 L 19 3 L 26 6 L 19 9 Z" fill="#1e40af" />
      <path d="M 15 8.5 V 12.5 C 15 14, 23 14, 23 12.5 V 8.5" fill="none" stroke="#1e40af" stroke-width="1" />
      <text x="32" y="14" font-size="10" font-weight="700" fill="#1e40af">Learner &amp; Student Panel</text>
      <text x="32" y="26" font-size="8.5" fill="#1e3a8a">Pedagogical clarity &amp; intuition</text>
    </g>

    <!-- Inter-Panel Arrow 1-2 -->
    <path d="M 130 79 V 87" class="path-interact" />

    <!-- Panel 2: Architects -->
    <g transform="translate(12, 89)">
      <rect width="236" height="34" class="subcard-panel" stroke="#0d9488" fill="#f0fdfa" />
      <circle cx="18" cy="8" r="3" fill="none" stroke="#0f766e" stroke-width="1.2" />
      <path d="M 14 15 H 22 M 18 11 V 15" stroke="#0f766e" stroke-width="1.2" />
      <text x="32" y="14" font-size="10" font-weight="700" fill="#0f766e">Senior Architect Panel</text>
      <text x="32" y="26" font-size="8.5" fill="#134e4a">Technical rigor &amp; physical limits</text>
    </g>

    <!-- Inter-Panel Arrow 2-3 -->
    <path d="M 130 123 V 131" class="path-interact" />

    <!-- Panel 3: EDA / ML -->
    <g transform="translate(12, 133)">
      <rect width="236" height="34" class="subcard-panel" stroke="#0284c7" fill="#f0f9ff" />
      <rect x="13" y="5" width="12" height="8" rx="1" fill="none" stroke="#0369a1" stroke-width="1.2" />
      <path d="M 16 13 L 14 16 M 22 13 L 24 16 M 14 16 H 24" stroke="#0369a1" stroke-width="1.2" />
      <text x="32" y="14" font-size="10" font-weight="700" fill="#0369a1">EDA &amp; ML Systems Panel</text>
      <text x="32" y="26" font-size="8.5" fill="#0c4a6e">CAD flows &amp; tool integration</text>
    </g>

    <!-- Inter-Panel Arrow 3-4 -->
    <path d="M 130 167 V 175" class="path-interact" />

    <!-- Panel 4: Citation Auditors -->
    <g transform="translate(12, 177)">
      <rect width="236" height="34" class="subcard-panel" stroke="#d97706" fill="#fffbeb" />
      <path d="M 14 5 H 24 V 15 H 14 Z M 16 7 H 22 M 16 10 H 22 M 16 13 H 20" stroke="#b45309" fill="none" stroke-width="1.2" />
      <text x="32" y="14" font-size="10" font-weight="700" fill="#b45309">Citation &amp; BibTeX Auditors</text>
      <text x="32" y="26" font-size="8.5" fill="#78350f">Receipts &amp; math checks</text>
    </g>
  </g>

  <!-- STAGE 3: DETERMINISTIC VALIDATION HARNESS & IP BOUNDARY (BOTTOM ROW) -->
  <g transform="translate(30, 420)">
    <rect width="940" height="100" class="card-harness" />
    <text x="15" y="18" class="head-harness">STAGE 3: DETERMINISTIC VALIDATION HARNESS &amp; IP BOUNDARY</text>

    <!-- Harness Card C1: Multi-Target Build -->
    <rect x="15" y="26" width="280" height="62" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4" />
    <g transform="translate(25, 32)">
      <path d="M 2 4 L 8 9 L 2 14 M 10 14 H 16" stroke="#15803d" stroke-width="1.5" fill="none" />
      <text x="24" y="12" class="text-bold" fill="#15803d">1. Multi-Target Build Engine</text>
      <text x="24" y="26" class="text-main">Automated publishing harness</text>
      <text x="24" y="42" class="text-sub">HTML, PDF &amp; EPUB target compilation</text>
    </g>

    <path d="M 295 57 H 325" class="path-flow" />

    <!-- Harness Card C2: Strict Quality Audit -->
    <rect x="330" y="26" width="280" height="62" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4" />
    <g transform="translate(340, 32)">
      <path d="M 2 8 L 7 13 L 16 3" stroke="#0f766e" stroke-width="1.5" fill="none" />
      <text x="24" y="12" class="text-bold" fill="#0f766e">2. Strict Quality Audit</text>
      <text x="24" y="26" class="text-main">EPUB &amp; layout validation</text>
      <text x="24" y="42" class="text-sub">Reference key &amp; citation integrity audit</text>
    </g>

    <path d="M 610 57 H 640" class="path-flow" />

    <!-- Harness Card C3: IP Boundary & Deliverables (With Lock Icon) -->
    <rect x="645" y="26" width="280" height="62" fill="#ffffff" stroke="#b45309" stroke-width="1.2" rx="4" />
    <g transform="translate(655, 32)">
      <!-- Vector Lock Icon 🔒 -->
      <rect x="4" y="8" width="10" height="8" rx="1" fill="#b45309" />
      <path d="M 6 8 V 5 C 6 3.5, 12 3.5, 12 5 V 8" fill="none" stroke="#b45309" stroke-width="1.3" />

      <text x="22" y="12" class="text-bold" fill="#b45309">3. Private Engine vs Open Outputs</text>
      <text x="22" y="26" font-size="9" fill="#1e293b">• 🔒 <tspan font-weight="700">Private IP:</tspan> Workflows &amp; skill prompts</text>
      <text x="22" y="42" font-size="9" fill="#15803d">• 🌐 <tspan font-weight="700">Open Deliverable:</tspan> Manuscript &amp; code</text>
    </g>
  </g>

  <!-- Flow: Human Hub -> Validation Harness -->
  <path d="M 500 390 V 414" class="path-flow" />
</svg>
