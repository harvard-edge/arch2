<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 755" role="img">
  <title>Methods Playbook: Optimization Design Tasks</title>
  <desc>Decision framework conditioning algorithm choice on evaluation budget, historical data availability, gradient feasibility, search space cardinality, and sequential transition dynamics.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#59636D"/>
    </marker>
  </defs>

  <rect width="1340" height="755" fill="#FFFFFF"/>

  <!-- Start Node -->
  <rect x="530" y="18" width="280" height="44" rx="22" fill="#F0ECFA" stroke="#6A4FC7" stroke-width="1.6"/>
  <text x="670" y="45" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#20252B">Define Hardware Problem</text>

  <!-- Arrow to Decision 1 -->
  <path d="M670 62 V90" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Decision 1: Evaluation Cost -->
  <rect x="460" y="90" width="420" height="62" rx="6" fill="#E4F1F6" stroke="#1683A6" stroke-width="1.6"/>
  <text x="670" y="115" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#20252B">Is candidate evaluation expensive relative to budget?</text>
  <text x="670" y="137" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#59636D">e.g., hours/days (signoff tools) vs. seconds/minutes (analytical/functional models)</text>

  <!-- Level 1 Bus -->
  <path d="M670 152 V180 M250 180 H975 M250 180 V210 M975 180 V210" fill="none" stroke="#59636D" stroke-width="1.8"/>
  <path d="M250 205 V210" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M975 205 V210" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Level 1 Labels -->
  <rect x="360" y="169" width="180" height="22" rx="3" fill="#FDE8E8" stroke="#D32F2F" stroke-width="1"/>
  <text x="450" y="184" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="#991B1B">Yes (Expensive: Hours/Days)</text>

  <rect x="730" y="169" width="160" height="22" rx="3" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1"/>
  <text x="810" y="184" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="#166534">No (Fast: Secs/Mins)</text>

  <!-- Decision 2A (Left / High Cost) -->
  <rect x="100" y="212" width="300" height="60" rx="6" fill="#E4F1F6" stroke="#1683A6" stroke-width="1.6"/>
  <text x="250" y="237" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" fill="#20252B">Relevant historical data available?</text>
  <text x="250" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#59636D">Prior tapeouts, synthesis logs, or verified traces</text>

  <!-- Branches from 2A -->
  <path d="M250 272 V298 M135 298 H365 M135 298 V326 M365 298 V326" fill="none" stroke="#59636D" stroke-width="1.8"/>
  <path d="M135 321 V326" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M365 321 V326" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="145" y="287" width="105" height="20" rx="3" fill="#E4F1F6" stroke="#1683A6" stroke-width="1"/>
  <text x="197" y="301" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0E5A73">Yes (Data available)</text>

  <rect x="270" y="287" width="95" height="20" rx="3" fill="#E4F1F6" stroke="#1683A6" stroke-width="1"/>
  <text x="317" y="301" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0E5A73">No (Cold start)</text>

  <!-- Box 1: Surrogate (x=30) -->
  <rect x="30" y="328" width="210" height="175" rx="6" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.6"/>
  <text x="42" y="355" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1B5E20">Supported Surrogate</text>
  <text x="42" y="373" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#59636D">or Offline RL</text>
  <text x="42" y="397" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Train learned surrogate</text>
  <text x="42" y="417" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Prune expensive runs</text>
  <text x="42" y="437" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Offline RL additionally</text>
  <text x="50" y="455" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#59636D">needs sequential data</text>
  <text x="42" y="477" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Guard against proxy drift</text>

  <!-- Box 2: Bayesian Opt (x=260) -->
  <rect x="260" y="328" width="210" height="175" rx="6" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.6"/>
  <text x="272" y="355" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1B5E20">Bayesian Optimization</text>
  <text x="272" y="373" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#59636D">Sample-efficient search</text>
  <text x="272" y="397" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Gaussian Process / TPE</text>
  <text x="272" y="417" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Acquisition function (EI)</text>
  <text x="280" y="435" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#59636D">balances explore / exploit</text>
  <text x="272" y="457" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Effective for &lt;1,000 runs</text>
  <text x="272" y="477" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Fits tight budget regimes</text>

  <!-- Decision 2B (Right / Low Cost) -->
  <rect x="800" y="212" width="350" height="60" rx="6" fill="#E4F1F6" stroke="#1683A6" stroke-width="1.6"/>
  <text x="975" y="237" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" fill="#20252B">Useful gradients or continuous relaxation?</text>
  <text x="975" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#59636D">Differentiable analytical model or surrogate</text>

  <!-- Branches from 2B -->
  <path d="M975 272 V298 M595 298 H975 M595 298 V326 M975 298 V326" fill="none" stroke="#59636D" stroke-width="1.8"/>
  <path d="M595 321 V326" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M975 321 V326" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="710" y="287" width="115" height="20" rx="3" fill="#E4F1F6" stroke="#1683A6" stroke-width="1"/>
  <text x="767" y="301" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0E5A73">Yes (Differentiable)</text>

  <rect x="988" y="302" width="75" height="20" rx="3" fill="#E4F1F6" stroke="#1683A6" stroke-width="1"/>
  <text x="1025" y="316" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0E5A73">No (Discrete)</text>

  <!-- Box 3: Gradient Descent (x=490) -->
  <rect x="490" y="328" width="210" height="175" rx="6" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.6"/>
  <text x="502" y="355" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1B5E20">Gradient Descent</text>
  <text x="502" y="373" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#59636D">Continuous optimization</text>
  <text x="502" y="397" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Gradient-based solvers</text>
  <text x="502" y="417" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Rapid convergence</text>
  <text x="502" y="437" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Project relaxed results</text>
  <text x="510" y="455" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#59636D">back to legal discretes</text>
  <text x="502" y="477" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Confirm with signoff tools</text>

  <!-- Decision 3: Cardinality -->
  <rect x="825" y="328" width="300" height="60" rx="6" fill="#E4F1F6" stroke="#1683A6" stroke-width="1.6"/>
  <text x="975" y="353" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" fill="#20252B">Does enumeration exceed budget?</text>
  <text x="975" y="374" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#59636D">Compare total points |S| against eval capacity</text>

  <!-- Branches from Decision 3 -->
  <path d="M975 388 V414 M765 414 H1115 M765 414 V442 M1115 414 V442" fill="none" stroke="#59636D" stroke-width="1.8"/>
  <path d="M765 437 V442" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M1115 437 V442" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="790" y="403" width="115" height="20" rx="3" fill="#E4F1F6" stroke="#1683A6" stroke-width="1"/>
  <text x="847" y="417" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0E5A73">No (Exhaustible |S|)</text>

  <rect x="980" y="403" width="115" height="20" rx="3" fill="#E4F1F6" stroke="#1683A6" stroke-width="1"/>
  <text x="1037" y="417" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0E5A73">Yes (Combinatorial)</text>

  <!-- Box 4: Grid / Random Search (x=660) -->
  <rect x="660" y="444" width="210" height="175" rx="6" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.6"/>
  <text x="672" y="471" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1B5E20">Grid / Random Search</text>
  <text x="672" y="489" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#59636D">Standard baseline</text>
  <text x="672" y="513" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Full grid or uniform random</text>
  <text x="672" y="533" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Zero fitting overhead</text>
  <text x="672" y="553" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Highly parallelizable</text>
  <text x="672" y="573" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Mandatory comparator</text>
  <text x="680" y="591" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#59636D">for learned methods</text>

  <!-- Decision 4: Sequential MDP -->
  <rect x="965" y="444" width="300" height="60" rx="6" fill="#E4F1F6" stroke="#1683A6" stroke-width="1.6"/>
  <text x="1115" y="469" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" fill="#20252B">Sequential / delayed rewards?</text>
  <text x="1115" y="490" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#59636D">Step-by-step Markov decision problem</text>

  <!-- Branches from Decision 4 -->
  <path d="M1115 504 V530 M1005 530 H1225 M1005 530 V558 M1225 530 V558" fill="none" stroke="#59636D" stroke-width="1.8"/>
  <path d="M1005 553 V558" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M1225 553 V558" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="1015" y="519" width="80" height="20" rx="3" fill="#E4F1F6" stroke="#1683A6" stroke-width="1"/>
  <text x="1055" y="533" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0E5A73">Yes (MDP)</text>

  <rect x="1135" y="519" width="80" height="20" rx="3" fill="#E4F1F6" stroke="#1683A6" stroke-width="1"/>
  <text x="1175" y="533" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0E5A73">No (One-shot)</text>

  <!-- Box 5: Reinforcement Learning (x=900) -->
  <rect x="900" y="560" width="210" height="175" rx="6" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.6"/>
  <text x="912" y="587" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1B5E20">Reinforcement Learning</text>
  <text x="912" y="605" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#59636D">Sequential policy</text>
  <text x="912" y="629" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Formulate as discrete MDP</text>
  <text x="912" y="649" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Sequential construction</text>
  <text x="920" y="667" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#59636D">(e.g., macro placement)</text>
  <text x="912" y="689" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Justify policy training</text>
  <text x="920" y="707" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#59636D">via multi-task reuse</text>

  <!-- Box 6: Evolutionary / Heuristics (x=1120) -->
  <rect x="1120" y="560" width="210" height="175" rx="6" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.6"/>
  <text x="1132" y="587" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1B5E20">Evolutionary / Heuristic</text>
  <text x="1132" y="605" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#59636D">Combinatorial search</text>
  <text x="1132" y="629" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Genetic algorithms (GA)</text>
  <text x="1132" y="649" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Simulated annealing (SA)</text>
  <text x="1132" y="669" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Multi-objective Pareto</text>
  <text x="1132" y="689" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#20252B">• Handles arbitrary discrete</text>
  <text x="1140" y="707" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#59636D">and non-linear rules</text>
</svg>
