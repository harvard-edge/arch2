<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 425" role="img">
  <title>Methods Playbook: Generative Design Tasks</title>
  <desc>Decision framework connecting RTL generation, trace repair, and new architecture exploration to LLM generation, retrieval-augmented generation, agentic loops, and evolutionary search.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#59636D"/>
    </marker>
  </defs>

  <rect width="1000" height="425" fill="#FFFFFF"/>

  <!-- Start Node -->
  <rect x="360" y="20" width="280" height="44" rx="22" fill="#F0ECFA" stroke="#6A4FC7" stroke-width="1.6"/>
  <text x="500" y="47" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#20252B">Define Hardware Problem</text>

  <!-- Arrow to Decision -->
  <path d="M500 64 V96" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Decision Box -->
  <rect x="325" y="96" width="350" height="66" rx="6" fill="#E4F1F6" stroke="#1683A6" stroke-width="1.6"/>
  <text x="500" y="123" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#20252B">What are you generating?</text>
  <text x="500" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#59636D">Identify target artifact and available specification</text>

  <!-- Clean branching bus from Decision to Endpoints -->
  <path d="M500 162 V195 M180 195 H820 M180 195 V235 M500 195 V235 M820 195 V235" fill="none" stroke="#59636D" stroke-width="1.8"/>
  <path d="M180 230 V235" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M500 230 V235" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M820 230 V235" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Branch Labels -->
  <rect x="235" y="177" width="170" height="20" rx="3" fill="#E4F1F6" stroke="#1683A6" stroke-width="1"/>
  <text x="320" y="191" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0E5A73">RTL from natural language</text>

  <rect x="415" y="205" width="170" height="20" rx="3" fill="#E4F1F6" stroke="#1683A6" stroke-width="1"/>
  <text x="500" y="219" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0E5A73">Fixing failing traces / vacuity</text>

  <rect x="600" y="177" width="180" height="20" rx="3" fill="#E4F1F6" stroke="#1683A6" stroke-width="1"/>
  <text x="690" y="191" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0E5A73">New architecture proposals</text>

  <!-- Endpoint 1: RAG -->
  <rect x="30" y="238" width="300" height="165" rx="6" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.6"/>
  <text x="45" y="268" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1B5E20">LLM Generation + RAG</text>
  <text x="45" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#20252B">• Consider LLM generation directly</text>
  <text x="45" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#20252B">• Retrieval-augmented generation (RAG)</text>
  <text x="55" y="338" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#59636D">when reference interfaces or manuals exist</text>
  <text x="45" y="362" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#20252B">• Anchor with few-shot verified modules</text>
  <text x="45" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#20252B">• Verify syntax before functional checks</text>

  <!-- Endpoint 2: Agentic Repair -->
  <rect x="350" y="238" width="300" height="165" rx="6" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.6"/>
  <text x="365" y="268" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1B5E20">Iterative Repair / Agentic Loop</text>
  <text x="365" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#20252B">• Run task-appropriate checking tools</text>
  <text x="375" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#59636D">(linters, formal vacuity, simulation traces)</text>
  <text x="365" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#20252B">• Form closed loop around failing counterexample</text>
  <text x="365" y="362" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#20252B">• Enforce explicit stop / escalation bounds</text>
  <text x="365" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#20252B">• Retain execution records for every attempt</text>

  <!-- Endpoint 3: EA + LLM Search -->
  <rect x="670" y="238" width="300" height="165" rx="6" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.6"/>
  <text x="685" y="268" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1B5E20">Generation + Search (EA / LLM)</text>
  <text x="685" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#20252B">• Generate candidate structural proposals</text>
  <text x="685" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#20252B">• Pair LLM mutations with evolutionary search</text>
  <text x="685" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#20252B">• Screen against legality and PPA proxies</text>
  <text x="685" y="362" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#20252B">• Retain multi-objective Pareto front</text>
  <text x="685" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#20252B">• Confirm top performers with signoff flow</text>
</svg>
