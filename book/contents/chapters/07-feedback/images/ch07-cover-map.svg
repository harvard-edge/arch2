<text x="831.0" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" fill="#64748B">IV - ECOSYSTEM</text>
<text x="14" y="58" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#136680" letter-spacing="0.7">QUALIFY, ROUTE, RETAIN</text>
<text x="14" y="83" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#20252B">A returned signal never explains itself</text>
<rect x="14" y="115" width="171" height="103" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1.5"/>
<text x="99.5" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#20252B">Returned signal</text>
<text x="99.5" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#3E474B">source + target + lineage</text>
<text x="99.5" y="181" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#3E474B">conditions</text>
<rect x="206" y="115" width="171" height="103" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.5"/>
<text x="291.5" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#157A38">Verification</text>
<text x="291.5" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#3E474B">property-appropriate check</text>
<text x="291.5" y="181" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#3E474B">uncertainty + assumptions</text>
