<text x="867.5" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#3E474B">run + project + later work</text>
<path d="M 761 166.5 H 782" fill="none" stroke="#20252B" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow-ink)"/>
<text x="480" y="249" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#157A38">Signals and checks stay bound to the source, property, and claim they qualify</text>
