<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 836" role="img" aria-labelledby="funnel-title funnel-desc">
  <title id="funnel-title">Multi-fidelity verification of generative candidate proposals</title>
  <desc id="funnel-desc">Generative candidate proposals pass downward through five verification tiers, each listing the checks it applies and example engines. Tier 1, syntax and elaboration, checks grammar, module hierarchy, and port types with engines such as Tree-Sitter, Verilator, or Slang. Tier 2, interface and interconnect, checks handshake rules, port widths, and clock-domain tags with schema linters or protocol checkers. Tier 3, functional and assertion checks, covers temporal properties, deadlocks, and coverage with SVA checkers, BMC, or simulators. Tier 4, static timing analysis, checks setup and hold under specified modes and corners with OpenSTA, PrimeTime, or Tempus. Tier 5, physical verification, checks design rules and layout versus schematic with Calibre, KLayout, or Netgen. The endpoint is an implementation passing the listed checks. Two recovery notes follow: an early structural or functional failure revises the generated RTL and reruns the affected checks, and a physical timing or DRC near-miss assesses a local ECO and reruns the affected checks.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .box { stroke-width: 1.7; }
      .workload   { fill: #E4F1F6; stroke: #1683A6; }
      .designspace { fill: #F0ECFA; stroke: #6A4FC7; }
      .constraint { fill: #FDECEC; stroke: #DE3D3C; }
      .method     { fill: #FBF0DE; stroke: #E68A17; }
      .evidence   { fill: #E7F5EC; stroke: #1E9E48; }
      .label { font-size: 15px; font-weight: 700; fill: #20252B; }
      .title { font-size: 15px; font-weight: 700; fill: #20252B; }
      .sub { font-size: 13px; fill: #444444; }
      .eng { font-size: 13px; font-style: italic; fill: #444444; }
      .tag { font-size: 12px; font-weight: 700; }
      .edge { fill: none; stroke: #333333; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-dark); }
    </style>
  </defs>

  <rect width="760" height="836" fill="#FFFFFF"/>
  <g class="font">
    <!-- Input -->
    <text class="label" x="380" y="44" text-anchor="middle">Generative candidate proposals</text>
    <line class="edge" x1="380" y1="56" x2="380" y2="80"/>

    <!-- Tier 1 -->
    <rect class="box workload" x="30" y="80" width="700" height="84"/>
    <text class="tag" x="48" y="108" fill="#136680">1</text>
    <text class="title" x="70" y="108">Syntax and elaboration</text>
    <text class="sub" x="70" y="130">Grammar, module hierarchy, and port types</text>
    <text class="eng" x="70" y="150">Example engines: Tree-Sitter / Verilator / Slang</text>
    <line class="edge" x1="380" y1="164" x2="380" y2="192"/>

    <!-- Tier 2 -->
    <rect class="box evidence" x="30" y="192" width="700" height="84"/>
    <text class="tag" x="48" y="220" fill="#157A38">2</text>
    <text class="title" x="70" y="220">Interface and interconnect</text>
    <text class="sub" x="70" y="242">Handshake rules, port widths, and clock-domain tags</text>
    <text class="eng" x="70" y="262">Example engines: Schema linters / protocol checkers</text>
    <line class="edge" x1="380" y1="276" x2="380" y2="304"/>

    <!-- Tier 3 -->
    <rect class="box method" x="30" y="304" width="700" height="84"/>
    <text class="tag" x="48" y="332" fill="#8A5310">3</text>
    <text class="title" x="70" y="332">Functional and assertion checks</text>
    <text class="sub" x="70" y="354">Temporal properties, deadlocks, and coverage</text>
    <text class="eng" x="70" y="374">Example engines: SVA checkers / BMC / simulators</text>
    <line class="edge" x1="380" y1="388" x2="380" y2="416"/>

    <!-- Tier 4 -->
    <rect class="box designspace" x="30" y="416" width="700" height="84"/>
    <text class="tag" x="48" y="444" fill="#59429E">4</text>
    <text class="title" x="70" y="444">Static timing analysis</text>
    <text class="sub" x="70" y="466">Setup and hold checks under specified modes and corners</text>
    <text class="eng" x="70" y="486">Example engines: OpenSTA / PrimeTime / Tempus</text>
    <line class="edge" x1="380" y1="500" x2="380" y2="528"/>

    <!-- Tier 5 -->
    <rect class="box constraint" x="30" y="528" width="700" height="84"/>
    <text class="tag" x="48" y="556" fill="#C62A2A">5</text>
    <text class="title" x="70" y="556">Physical verification</text>
    <text class="sub" x="70" y="578">Design rules and layout-versus-schematic checks</text>
    <text class="eng" x="70" y="598">Example engines: Calibre / KLayout / Netgen</text>
    <line class="edge" x1="380" y1="612" x2="380" y2="640"/>

    <!-- Endpoint -->
    <rect class="box evidence" x="190" y="640" width="380" height="46"/>
    <text class="title" x="380" y="668" text-anchor="middle">Implementation passing the listed checks</text>

    <!-- Recovery routes -->
    <rect class="box constraint" x="30" y="714" width="342" height="92"/>
    <text class="title" x="48" y="740">Early structural or</text>
    <text class="title" x="48" y="759">functional failure</text>
    <text class="sub" x="48" y="781">Revise generated RTL;</text>
    <text class="sub" x="48" y="798">rerun the affected checks.</text>

    <rect class="box designspace" x="388" y="714" width="342" height="92"/>
    <text class="title" x="406" y="740">Physical timing or</text>
    <text class="title" x="406" y="759">DRC near-miss</text>
    <text class="sub" x="406" y="781">Assess a local ECO;</text>
    <text class="sub" x="406" y="798">rerun the affected checks.</text>
  </g>
</svg>
