<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 578" role="img" aria-labelledby="sva-title sva-desc">
  <title id="sva-title">Routing a formal return to its next check</title>
  <desc id="sva-desc">A formal return records the property, model, assumptions, engine, and budget. Four outcomes each lead to an action. Counterexample, a returned violation trace, leads to checking reachability and realizability: repair a confirmed failure, or refine an abstraction or proof if the trace is spurious. Proved, a completed unbounded proof, leads to qualifying the scoped obligation: retain the property, model, assumptions, and relevant vacuity checks. Bounded-only, no violation through depth k, leads to retaining the bound: seek a completeness argument or a separate proof for unbounded safety. Inconclusive, a resource limit or unfinished query, leads to revising the verification plan: qualify any completed bound separately, because a timeout establishes no proof or violation.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .box { stroke-width: 1.7; }
      .workload    { fill: #E4F1F6; stroke: #1683A6; }
      .designspace { fill: #F0ECFA; stroke: #6A4FC7; }
      .constraint  { fill: #FDECEC; stroke: #DE3D3C; }
      .method      { fill: #FBF0DE; stroke: #E68A17; }
      .evidence    { fill: #E7F5EC; stroke: #1E9E48; }
      .neutral     { fill: #F5F8FA; stroke: #7E8B96; }
      .title { font-size: 15px; font-weight: 700; fill: #20252B; }
      .sub { font-size: 13px; fill: #444444; }
      .edge { fill: none; stroke: #333333; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-dark); }
    </style>
  </defs>

  <rect width="760" height="578" fill="#FFFFFF"/>
  <g class="font">
    <!-- Formal return -->
    <rect class="box workload" x="30" y="30" width="700" height="64"/>
    <text class="title" x="380" y="57" text-anchor="middle">Formal return</text>
    <text class="sub" x="380" y="79" text-anchor="middle">Property, model, assumptions, engine, and budget</text>

    <!-- Counterexample -->
    <rect class="box constraint" x="30" y="116" width="236" height="96"/>
    <text class="title" x="148" y="152" text-anchor="middle">Counterexample</text>
    <text class="sub" x="148" y="176" text-anchor="middle">Violation trace</text>
    <text class="sub" x="148" y="194" text-anchor="middle">returned</text>
    <line class="edge" x1="266" y1="164" x2="310" y2="164"/>
    <rect class="box neutral" x="310" y="116" width="420" height="96"/>
    <text class="title" x="330" y="150">Check reachability and realizability</text>
    <text class="sub" x="330" y="174">Repair a confirmed failure; refine an</text>
    <text class="sub" x="330" y="192">abstraction or proof if the trace is spurious.</text>
    <!-- Proved -->
    <rect class="box evidence" x="30" y="228" width="236" height="96"/>
    <text class="title" x="148" y="264" text-anchor="middle">Proved</text>
    <text class="sub" x="148" y="288" text-anchor="middle">Unbounded proof</text>
    <text class="sub" x="148" y="306" text-anchor="middle">completed</text>
    <line class="edge" x1="266" y1="276" x2="310" y2="276"/>
    <rect class="box neutral" x="310" y="228" width="420" height="96"/>
    <text class="title" x="330" y="262">Qualify the scoped obligation</text>
    <text class="sub" x="330" y="286">Retain property, model, assumptions,</text>
    <text class="sub" x="330" y="304">and relevant vacuity checks.</text>
    <!-- Bounded-only -->
    <rect class="box method" x="30" y="340" width="236" height="96"/>
    <text class="title" x="148" y="376" text-anchor="middle">Bounded-only</text>
    <text class="sub" x="148" y="400" text-anchor="middle">No violation through</text>
    <text class="sub" x="148" y="418" text-anchor="middle">depth <tspan font-style="italic">k</tspan></text>
    <line class="edge" x1="266" y1="388" x2="310" y2="388"/>
    <rect class="box neutral" x="310" y="340" width="420" height="96"/>
    <text class="title" x="330" y="374">Retain the bound</text>
    <text class="sub" x="330" y="398">Seek a completeness argument or a</text>
    <text class="sub" x="330" y="416">separate proof for unbounded safety.</text>
    <!-- Inconclusive -->
    <rect class="box designspace" x="30" y="452" width="236" height="96"/>
    <text class="title" x="148" y="488" text-anchor="middle">Inconclusive</text>
    <text class="sub" x="148" y="512" text-anchor="middle">Resource limit or</text>
    <text class="sub" x="148" y="530" text-anchor="middle">unfinished query</text>
    <line class="edge" x1="266" y1="500" x2="310" y2="500"/>
    <rect class="box neutral" x="310" y="452" width="420" height="96"/>
    <text class="title" x="330" y="486">Revise the verification plan</text>
    <text class="sub" x="330" y="510">Qualify any completed bound separately;</text>
    <text class="sub" x="330" y="528">a timeout establishes no proof or violation.</text>
  </g>
</svg>
