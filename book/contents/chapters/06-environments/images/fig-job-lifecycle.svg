<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" role="img" aria-labelledby="job-lifecycle-title job-lifecycle-desc">
  <title id="job-lifecycle-title">Asynchronous Job Lifecycle</title>
  <desc id="job-lifecycle-desc">State machine diagram showing a backend job moving from Queued to Running, branching to terminal states Completed or Failed, or to Evicted which can requeue back to Queued if retry policy permits.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#20252B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6A4FC7"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .teal   { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .green  { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
      .red    { fill: #FDECEC; stroke: #DE3D3C; stroke-width: 1.5; }
      .violet { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.5; }
      .label-title { font-size: 13.5px; font-weight: 700; fill: #20252B; }
      .label-sub   { font-size: 11px; fill: #3E474B; }
      .trans-label { font-size: 11px; font-weight: 600; fill: #20252B; }
      .trans-green { font-size: 11px; font-weight: 600; fill: #157A38; }
      .trans-red   { font-size: 11px; font-weight: 600; fill: #C62A2A; }
      .trans-purple{ font-size: 11px; font-weight: 600; fill: #59429E; }
      .flow { fill: none; stroke: #20252B; stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-dark); }
      .flow-dashed { fill: none; stroke: #6A4FC7; stroke-width: 1.8; stroke-dasharray: 6 4; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <rect width="980" height="340" fill="#FFFFFF"/>
  <g class="font">
    <!-- Entry Arrow -->
    <path class="flow" d="M 30 140 H 140"/>
    <text class="trans-label" x="85" y="128" text-anchor="middle">submit request</text>

    <!-- State 1: Queued -->
    <rect class="teal" x="140" y="105" width="160" height="70"/>
    <text class="label-title" x="220" y="134" text-anchor="middle">Queued</text>
    <text class="label-sub" x="220" y="154" text-anchor="middle">admitted / slot pending</text>

    <!-- Transition: Queued -> Running -->
    <path class="flow" d="M 300 140 H 430"/>
    <text class="trans-label" x="365" y="128" text-anchor="middle">allocate resources</text>

    <!-- State 2: Running -->
    <rect class="teal" x="430" y="105" width="160" height="70"/>
    <text class="label-title" x="510" y="134" text-anchor="middle">Running</text>
    <text class="label-sub" x="510" y="154" text-anchor="middle">active tool execution</text>

    <!-- Transition: Running -> Completed (upward orthogonal branch) -->
    <path class="flow" d="M 590 120 H 645 V 57 H 770"/>
    <text class="trans-green" x="705" y="49" text-anchor="middle">tool exits cleanly</text>

    <!-- State 3: Completed -->
    <rect class="green" x="770" y="25" width="170" height="65"/>
    <text class="label-title" x="855" y="52" text-anchor="middle">Completed</text>
    <text class="label-sub" x="855" y="72" text-anchor="middle">clean exit (code 0)</text>

    <!-- Transition: Running -> Failed (middle horizontal branch) -->
    <path class="flow" d="M 590 140 H 770"/>
    <text class="trans-red" x="680" y="132" text-anchor="middle">tool crashes or times out</text>

    <!-- State 4: Failed -->
    <rect class="red" x="770" y="108" width="170" height="65"/>
    <text class="label-title" x="855" y="135" text-anchor="middle">Failed</text>
    <text class="label-sub" x="855" y="155" text-anchor="middle">error / timeout / crash</text>

    <!-- Transition: Running -> Evicted (downward orthogonal branch) -->
    <path class="flow" d="M 590 160 H 645 V 222 H 770"/>
    <text class="trans-purple" x="705" y="214" text-anchor="middle">preemption event</text>

    <!-- State 5: Evicted -->
    <rect class="violet" x="770" y="190" width="170" height="65"/>
    <text class="label-title" x="855" y="217" text-anchor="middle">Evicted</text>
    <text class="label-sub" x="855" y="237" text-anchor="middle">scheduler preemption</text>

    <!-- Requeue / Retry loop: Evicted -> Queued -->
    <path class="flow-dashed" d="M 855 255 V 300 H 220 V 175"/>
    <text class="trans-purple" x="537" y="292" text-anchor="middle">retry policy allows (re-queue)</text>
  </g>
</svg>
