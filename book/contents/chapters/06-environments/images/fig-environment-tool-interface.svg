<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" role="img" aria-labelledby="tool-interface-title tool-interface-desc">
  <title id="tool-interface-title">Separate tool-interface responsibilities</title>
  <desc id="tool-interface-desc">Three request inputs enter a wrapper that validates and translates them. A valid request reaches the tool, while an invalid request goes directly to the harness record. The tool produces raw returned material and a separate execution outcome. The parser interprets raw material into structured fields, unclassified output, and a parse status. The harness records request identity, attempt and job identity, conditions, execution outcome, artifacts, parse status, cost, and lineage. Tool execution can fail, return partially, or complete without assigning those states to the parser.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#20252B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DE3D3C"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .outer { fill: #FFFFFF; stroke: #9AA8B5; stroke-width: 1.2; }
      .input { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .work { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.5; }
      .return { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
      .failure { fill: #FDECEC; stroke: #DE3D3C; stroke-width: 1.5; }
      .status { fill: #F5F8FA; stroke: #9AA8B5; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 700; fill: #20252B; }
      .small { font-size: 11.2px; fill: #3E474B; }
      .group { font-size: 11.2px; font-weight: 700; fill: #59636D; letter-spacing: 0.55px; }
      .arrow { fill: none; stroke: #20252B; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-dark); }
      .red-arrow { fill: none; stroke: #DE3D3C; stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-red); }
      .bus { fill: none; stroke: #20252B; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }
    </style>
  </defs>

  <rect width="920" height="600" fill="#FFFFFF"/>
  <g class="font">
    <text class="group" x="105" y="62" text-anchor="middle">TYPED REQUEST</text>
    <rect class="input" x="25" y="82" width="185" height="58"/>
    <text class="label" x="117.5" y="105" text-anchor="middle">question + workload</text>
    <text class="small" x="117.5" y="126" text-anchor="middle">comparison + fixed context</text>

    <rect class="input" x="25" y="176" width="185" height="58"/>
    <text class="label" x="117.5" y="199" text-anchor="middle">action schema</text>
    <text class="small" x="117.5" y="220" text-anchor="middle">knobs, edits, commands</text>

    <rect class="input" x="25" y="270" width="185" height="58"/>
    <text class="label" x="117.5" y="293" text-anchor="middle">constraints + metrics</text>
    <text class="small" x="117.5" y="314" text-anchor="middle">legal states, units, scope</text>

    <rect class="outer" x="250" y="32" width="645" height="520"/>
    <text class="group" x="572.5" y="58" text-anchor="middle">TOOL-CONNECTED ENVIRONMENT</text>

    <rect class="work" x="290" y="90" width="225" height="70"/>
    <text class="label" x="402.5" y="116" text-anchor="middle">wrapper</text>
    <text class="small" x="402.5" y="138" text-anchor="middle">validate + translate request</text>

    <rect class="work" x="630" y="90" width="225" height="70"/>
    <text class="label" x="742.5" y="116" text-anchor="middle">tool</text>
    <text class="small" x="742.5" y="138" text-anchor="middle">execute declared operation</text>

    <rect class="failure" x="290" y="215" width="225" height="64"/>
    <text class="label" x="402.5" y="239" text-anchor="middle">invalid request</text>
    <text class="small" x="402.5" y="260" text-anchor="middle">refused before tool execution</text>

    <rect class="return" x="630" y="205" width="225" height="74"/>
    <text class="label" x="742.5" y="230" text-anchor="middle">raw returned material</text>
    <text class="small" x="742.5" y="250" text-anchor="middle">files, logs, reports, warnings</text>
    <text class="small" x="742.5" y="266" text-anchor="middle">retained before interpretation</text>

    <rect class="return" x="290" y="322" width="225" height="82"/>
    <text class="label" x="402.5" y="348" text-anchor="middle">parser</text>
    <text class="small" x="402.5" y="369" text-anchor="middle">structured values + residual output</text>
    <text class="small" x="402.5" y="386" text-anchor="middle">parse status</text>

    <rect class="status" x="630" y="322" width="225" height="82"/>
    <text class="label" x="742.5" y="347" text-anchor="middle">runtime outcome</text>
    <text class="small" x="742.5" y="368" text-anchor="middle">tool failed / returned partially</text>
    <text class="small" x="742.5" y="385" text-anchor="middle">/ returned completely</text>

    <rect class="return" x="290" y="453" width="565" height="72"/>
    <text class="label" x="572.5" y="478" text-anchor="middle">harness record</text>
    <text class="small" x="572.5" y="499" text-anchor="middle">request + attempt/job identity + conditions + execution outcome</text>
    <text class="small" x="572.5" y="516" text-anchor="middle">artifacts + parse status + realized cost + lineage</text>

    <path class="bus" d="M 210 111 H 230 V 299"/>
    <path class="bus" d="M 210 205 H 230"/>
    <path class="bus" d="M 210 299 H 230"/>
    <path class="arrow" d="M 230 125 H 290"/>

    <path class="arrow" d="M 515 125 H 630"/>
    <path class="red-arrow" d="M 402.5 160 V 215"/>
    <path class="red-arrow" d="M 290 247 H 270 V 434 H 340 V 453"/>

    <path class="arrow" d="M 742.5 160 V 205"/>
    <path class="arrow" d="M 630 242 H 555 V 363 H 515"/>
    <path class="arrow" d="M 855 125 H 875 V 363 H 855"/>
    <path class="arrow" d="M 402.5 404 V 453"/>
    <path class="arrow" d="M 742.5 404 V 453"/>
  </g>
</svg>
