<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" role="img" aria-labelledby="runtime-state-title runtime-state-desc">
  <title id="runtime-state-title">Runtime objects and independent attempt entries</title>
  <desc id="runtime-state-desc">An authorized request creates an attempt. The attempt may be refused before a backend job exists, may create one job, or may create several jobs or execution segments. All paths remain attached to one attempt record. The record points separately to returned artifacts and realized cost, and it keeps scheduling state, terminal cause, artifact completeness, parser status, cancellation confirmation, and retry parent as independent entries.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#20252B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DE3D3C"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .teal { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .amber { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.5; }
      .green { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
      .red { fill: #FDECEC; stroke: #DE3D3C; stroke-width: 1.5; }
      .neutral { fill: #F5F8FA; stroke: #9AA8B5; stroke-width: 1.2; }
      .label { font-size: 13px; font-weight: 700; fill: #20252B; }
      .small { font-size: 11.2px; fill: #3E474B; }
      .field { font-size: 11.5px; font-weight: 700; fill: #20252B; }
      .group { font-size: 11.2px; font-weight: 700; fill: #59636D; letter-spacing: 0.55px; }
      .arrow { fill: none; stroke: #20252B; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-dark); }
      .red-arrow { fill: none; stroke: #DE3D3C; stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-red); }
      .stem { fill: none; stroke: #20252B; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }
    </style>
  </defs>

  <rect width="940" height="570" fill="#FFFFFF"/>
  <g class="font">
    <rect class="teal" x="30" y="62" width="190" height="64"/>
    <text class="label" x="125" y="88" text-anchor="middle">authorized request</text>
    <text class="small" x="125" y="110" text-anchor="middle">candidate + action + conditions</text>

    <rect class="amber" x="290" y="62" width="180" height="64"/>
    <text class="label" x="380" y="88" text-anchor="middle">attempt</text>
    <text class="small" x="380" y="110" text-anchor="middle">one authorized try</text>

    <rect class="red" x="565" y="42" width="315" height="52"/>
    <text class="label" x="722.5" y="64" text-anchor="middle">no backend job</text>
    <text class="small" x="722.5" y="82" text-anchor="middle">invalid setup or refused admission</text>

    <rect class="amber" x="565" y="118" width="145" height="58"/>
    <text class="label" x="637.5" y="143" text-anchor="middle">one job</text>
    <text class="small" x="637.5" y="162" text-anchor="middle">common path</text>

    <rect class="amber" x="735" y="118" width="145" height="58"/>
    <text class="label" x="807.5" y="140" text-anchor="middle">several jobs</text>
    <text class="small" x="807.5" y="158" text-anchor="middle">or execution segments</text>

    <rect class="green" x="290" y="222" width="590" height="66"/>
    <text class="label" x="585" y="248" text-anchor="middle">attempt record</text>
    <text class="small" x="585" y="270" text-anchor="middle">all paths retain request, attempt, job or segment, and parent identity</text>

    <rect class="green" x="290" y="330" width="250" height="66"/>
    <text class="label" x="415" y="355" text-anchor="middle">returned artifacts</text>
    <text class="small" x="415" y="377" text-anchor="middle">raw + structured + residual output</text>

    <rect class="red" x="630" y="330" width="250" height="66"/>
    <text class="label" x="755" y="355" text-anchor="middle">realized cost</text>
    <text class="small" x="755" y="377" text-anchor="middle">including failed, canceled, and retried work</text>

    <text class="group" x="460" y="438" text-anchor="middle">INDEPENDENT ATTEMPT ENTRIES</text>

    <rect class="neutral" x="20" y="458" width="135" height="76"/>
    <text class="field" x="87.5" y="484" text-anchor="middle">scheduling state</text>
    <text class="small" x="87.5" y="502" text-anchor="middle">pending / running</text>
    <text class="small" x="87.5" y="517" text-anchor="middle">/ terminal</text>

    <rect class="neutral" x="169" y="458" width="135" height="76"/>
    <text class="field" x="236.5" y="484" text-anchor="middle">terminal cause</text>
    <text class="small" x="236.5" y="506" text-anchor="middle">why execution ended</text>

    <rect class="neutral" x="318" y="458" width="135" height="76"/>
    <text class="field" x="385.5" y="480" text-anchor="middle">artifact</text>
    <text class="field" x="385.5" y="496" text-anchor="middle">completeness</text>
    <text class="small" x="385.5" y="515" text-anchor="middle">expected files present</text>

    <rect class="neutral" x="467" y="458" width="135" height="76"/>
    <text class="field" x="534.5" y="484" text-anchor="middle">parser status</text>
    <text class="small" x="534.5" y="506" text-anchor="middle">recognized + residual</text>

    <rect class="neutral" x="616" y="458" width="135" height="76"/>
    <text class="field" x="683.5" y="480" text-anchor="middle">cancellation</text>
    <text class="field" x="683.5" y="496" text-anchor="middle">confirmation</text>
    <text class="small" x="683.5" y="511" text-anchor="middle">processes ended</text>
    <text class="small" x="683.5" y="523" text-anchor="middle">licenses released</text>

    <rect class="neutral" x="765" y="458" width="135" height="76"/>
    <text class="field" x="832.5" y="484" text-anchor="middle">retry parent</text>
    <text class="small" x="832.5" y="506" text-anchor="middle">linked prior attempt</text>

    <path class="arrow" d="M 220 94 H 290"/>
    <path class="red-arrow" d="M 470 84 H 520 V 68 H 565"/>
    <path class="arrow" d="M 470 104 H 520 V 106 H 637.5 V 118"/>
    <path class="arrow" d="M 440 62 V 20 H 920 V 106 H 807.5 V 118"/>

    <path class="red-arrow" d="M 722.5 94 V 222"/>
    <path class="arrow" d="M 637.5 176 V 222"/>
    <path class="arrow" d="M 807.5 176 V 222"/>

    <path class="stem" d="M 585 288 V 309"/>
    <path class="arrow" d="M 585 309 H 415 V 330"/>
    <path class="arrow" d="M 585 309 H 755 V 330"/>
    <path class="arrow" d="M 585 396 V 423"/>
  </g>
</svg>
