<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="seq-title seq-desc">
  <title id="seq-title">Interaction protocol sequence diagram across life-cycle actors and tool tiers</title>
  <desc id="seq-desc">A sequence protocol diagram showing time flowing downward across five columns: Human Architect, AI Orchestrator, Execution Harness, Verification Engines, and Commitment Authority. The outer governance loop frames intent and in-order commitment, while an automated inner loop handles high-frequency proposal, tool execution, and formal verification repair at machine speed.</desc>
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#20252B"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1683A6"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6A4FC7"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E68A17"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E9E48"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DE3D3C"/>
    </marker>
    <marker id="arr-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D24D96"/>
    </marker>
    <style>
      .fnt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .col-box { stroke-width: 1.8; }
      .col-title { font-size: 13px; font-weight: 700; fill: #20252B; }
      .col-sub { font-size: 11px; fill: #59636D; }
      .lifeline { stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .msg-line { stroke-width: 1.8; stroke-linecap: square; }
      .msg-num { font-size: 11px; font-weight: 800; }
      .msg-lbl { font-size: 12px; font-weight: 700; }
      .msg-detail { font-size: 10.5px; fill: #475569; }
      .region-bg { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .region-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
      .status-pass { fill: #157A38; font-weight: 700; }
      .status-fail { fill: #C62A2A; font-weight: 700; }
      .note-box { fill: #FFFFFF; stroke-width: 1.2; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="620" fill="#FFFFFF"/>

  <g class="fnt">
    <!-- Actor Lifeline Coordinates:
         Col 0: Human Architect        x = 100
         Col 1: AI Orchestrator         x = 300
         Col 2: Execution Harness       x = 500
         Col 3: Verification Engines    x = 700
         Col 4: Commitment Authority    x = 900
    -->

    <!-- Inner Loop Shaded Region (Steps 2 to 7) -->
    <rect class="region-bg" x="220" y="155" width="560" height="305" rx="4"/>
    <text class="region-tag" x="235" y="176" fill="#64748B">Automated Inner Loop (Machine Speed: Sub-second to Hours)</text>

    <!-- Vertical Lifelines -->
    <line class="lifeline" x1="100" y1="80" x2="100" y2="590"/>
    <line class="lifeline" x1="300" y1="80" x2="300" y2="590"/>
    <line class="lifeline" x1="500" y1="80" x2="500" y2="590"/>
    <line class="lifeline" x1="700" y1="80" x2="700" y2="590"/>
    <line class="lifeline" x1="900" y1="80" x2="900" y2="590"/>

    <!-- Actor Header Boxes -->
    <!-- Col 0: Architect (Teal) -->
    <rect class="col-box" x="20" y="22" width="160" height="54" fill="#E4F1F6" stroke="#1683A6"/>
    <text class="col-title" x="100" y="43" text-anchor="middle">Human Architect</text>
    <text class="col-sub" x="100" y="60" text-anchor="middle">Formulation &amp; Synthesis</text>

    <!-- Col 1: AI Orchestrator (Violet) -->
    <rect class="col-box" x="220" y="22" width="160" height="54" fill="#F0ECFA" stroke="#6A4FC7"/>
    <text class="col-title" x="300" y="43" text-anchor="middle">AI Orchestrator</text>
    <text class="col-sub" x="300" y="60" text-anchor="middle">Search &amp; Proposal Policy</text>

    <!-- Col 2: Execution Harness (Amber) -->
    <rect class="col-box" x="420" y="22" width="160" height="54" fill="#FBF0DE" stroke="#E68A17"/>
    <text class="col-title" x="500" y="43" text-anchor="middle">Execution Harness</text>
    <text class="col-sub" x="500" y="60" text-anchor="middle">Wrappers, Schedulers, RTL</text>

    <!-- Col 3: Verification Engines (Green) -->
    <rect class="col-box" x="620" y="22" width="160" height="54" fill="#E7F5EC" stroke="#1E9E48"/>
    <text class="col-title" x="700" y="43" text-anchor="middle">Verification Engines</text>
    <text class="col-sub" x="700" y="60" text-anchor="middle">gem5, OpenSTA, SVA, UPF</text>

    <!-- Col 4: Commitment Authority (Magenta) -->
    <rect class="col-box" x="820" y="22" width="160" height="54" fill="#FBEDF4" stroke="#D24D96"/>
    <text class="col-title" x="900" y="43" text-anchor="middle">Commitment Authority</text>
    <text class="col-sub" x="900" y="60" text-anchor="middle">In-Order Mainline Signoff</text>

    <!-- ==================== PROTOCOL MESSAGES ==================== -->

    <!-- Step 1: Architect -> Orchestrator (Formulation Intent) -->
    <g transform="translate(0, 102)">
      <line class="msg-line" x1="100" y1="12" x2="292" y2="12" stroke="#1683A6" marker-end="url(#arr-teal)"/>
      <text class="msg-num" x="110" y="6" fill="#136680">1. FORMULATE INTENT</text>
      <text class="msg-detail" x="110" y="26">Scoped Study Contract: 2 MiB baseline, TDP &#8804; 3 W, Area &#8804; 1.5 mm&#178;, budget = 4 runs</text>
    </g>

    <!-- Step 2: Orchestrator -> Harness (Propose Candidate C1) -->
    <g transform="translate(0, 186)">
      <line class="msg-line" x1="300" y1="12" x2="492" y2="12" stroke="#6A4FC7" marker-end="url(#arr-violet)"/>
      <text class="msg-num" x="310" y="6" fill="#59429E">2. PROPOSE CANDIDATE C&#8321;</text>
      <text class="msg-detail" x="310" y="26">Configuration payload: 4 MiB L2 capacity, 16-way, SystemC TLM instantiation</text>
    </g>

    <!-- Step 3: Harness -> Verification (Dispatch Tool Run) -->
    <g transform="translate(0, 230)">
      <line class="msg-line" x1="500" y1="12" x2="692" y2="12" stroke="#E68A17" marker-end="url(#arr-amber)"/>
      <text class="msg-num" x="510" y="6" fill="#8A5310">3. DISPATCH &amp; SIMULATE</text>
      <text class="msg-detail" x="510" y="26">Run gem5 XRBench trace + SRAM macro area &amp; timing model (TSMC 3nm)</text>
    </g>

    <!-- Step 4: Verification -> Orchestrator (Fast Rejection Diagnostic) -->
    <g transform="translate(0, 274)">
      <line class="msg-line" x1="700" y1="12" x2="308" y2="12" stroke="#DE3D3C" marker-end="url(#arr-red)"/>
      <text class="msg-num" x="320" y="6" fill="#C62A2A">4. INNER REPAIR: REJECT C&#8321; (VIOLATION)</text>
      <text class="msg-detail" x="320" y="26"><tspan class="status-fail">FAIL:</tspan> Macro Area = 1.72 mm&#178; (&gt; 1.5 mm&#178; limit), Access = 2.8 ns (&gt; 2.5 ns) &#8594; Prune &amp; Mutate</text>
    </g>

    <!-- Step 5: Orchestrator -> Harness (Propose Revised Candidate C2) -->
    <g transform="translate(0, 322)">
      <line class="msg-line" x1="300" y1="12" x2="492" y2="12" stroke="#6A4FC7" marker-end="url(#arr-violet)"/>
      <text class="msg-num" x="310" y="6" fill="#59429E">5. PROPOSE REVISED C&#8322;</text>
      <text class="msg-detail" x="310" y="26">Mutated configuration: 3 MiB L2 capacity, adjusted banking partition, updated UPF table</text>
    </g>

    <!-- Step 6: Harness -> Verification (Dispatch Tool Run C2) -->
    <g transform="translate(0, 366)">
      <line class="msg-line" x1="500" y1="12" x2="692" y2="12" stroke="#E68A17" marker-end="url(#arr-amber)"/>
      <text class="msg-num" x="510" y="6" fill="#8A5310">6. EXECUTE QUALIFICATION</text>
      <text class="msg-detail" x="510" y="26">gem5 cycle-accurate simulation + OpenSTA timing extraction + UPF domain check</text>
    </g>

    <!-- Step 7: Verification -> Orchestrator (Qualified Evidence Return) -->
    <g transform="translate(0, 410)">
      <line class="msg-line" x1="700" y1="12" x2="308" y2="12" stroke="#1E9E48" marker-end="url(#arr-green)"/>
      <text class="msg-num" x="320" y="6" fill="#157A38">7. QUALIFIED EVIDENCE RETURN</text>
      <text class="msg-detail" x="320" y="26"><tspan class="status-pass">PASS:</tspan> Frame latency -14%, Power = 2.8 W (&#8804; 3 W), Area = 1.31 mm&#178; (&#8804; 1.5 mm&#178;)</text>
    </g>

    <!-- Step 8: Orchestrator -> Architect (Synthesized Study Record) -->
    <g transform="translate(0, 480)">
      <line class="msg-line" x1="300" y1="12" x2="108" y2="12" stroke="#1683A6" marker-end="url(#arr-teal)"/>
      <text class="msg-num" x="110" y="6" fill="#136680">8. SYNTHESIZED STUDY RECORD</text>
      <text class="msg-detail" x="110" y="26">Design-Loop Card: C&#8322; Pareto gain, causal mechanism (+18% hit rate), residual risk bounds</text>
    </g>

    <!-- Step 9: Architect -> Commitment Authority (Architecture PR Recommendation) -->
    <g transform="translate(0, 524)">
      <line class="msg-line" x1="100" y1="12" x2="892" y2="12" stroke="#D24D96" marker-end="url(#arr-magenta)"/>
      <text class="msg-num" x="110" y="6" fill="#A82E70">9. ARCHITECTURE RECOMMENDATION PACKET</text>
      <text class="msg-detail" x="110" y="26">Technical handoff: Recommend C&#8322; for gate-level RTL signoff; verified against 2 MiB baseline</text>
    </g>

    <!-- Step 10: Commitment Authority -> Architect (In-Order Commit Decision) -->
    <g transform="translate(0, 564)">
      <line class="msg-line" x1="900" y1="12" x2="108" y2="12" stroke="#20252B" marker-end="url(#arr-dark)"/>
      <text class="msg-num" x="110" y="6" fill="#20252B">10. IN-ORDER COMMIT DECISION</text>
      <text class="msg-detail" x="110" y="26"><tspan style="font-weight:700; fill:#157A38;">APPROVED:</tspan> Signoff candidate C&#8322; promoted to RTL synthesis milestone; signed record committed to mainline</text>
    </g>

  </g>
</svg>
