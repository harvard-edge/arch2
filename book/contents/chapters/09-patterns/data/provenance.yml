retained_sources: "mlperf-h100-sources/ keeps both mutable results sheets (fetched 2026-11-02; sha256 e3c23a4504fc... and c54094542bde...), the three system records, and the v2.1 ResNet scaling.json. mlperf-h100-hosts.csv is computed from the retained v3.0 sheet. The 150 raw logs, about 21 MB, are not retained. Each is refetchable from its commit, and collect_mlperf_h100_runs.py stops if a fetched file does not match the git blob SHA in the pinned tree. mlperf-h100-runs.csv also records each log's sha256."
collected_by: book/contents/chapters/09-patterns/data/collect_mlperf_h100_runs.py
analyzed_by: book/contents/chapters/09-patterns/data/analyze_mlperf_h100_runs.py
produced_by: book/contents/chapters/09-patterns/data/plot_mlperf_software_dividend.py
environment: "Collection needs gh and curl. Analysis needs Python 3 standard library only and repeats exactly under seed 20261102 with 20000 draws (run here on Python 3.14.4). The plot needs matplotlib: run here with Python 3.12.13 and matplotlib 3.11.1."
collect: "python3 book/contents/chapters/09-patterns/data/collect_mlperf_h100_runs.py"
reproduce: "python3 book/contents/chapters/09-patterns/data/analyze_mlperf_h100_runs.py && python book/contents/chapters/09-patterns/data/plot_mlperf_software_dividend.py  # python: an interpreter with matplotlib; bare python3 on this machine has none"

defects:
  - "The system records of both rounds leave host_processor_frequency and accelerator_frequency blank, so clock is unknown on both sides. The v2.1 preview system JSON also omits host-memory and detailed software fields, so complete machine identity beyond 8x H100-SXM5-80GB is not independently established. Before 2026-11-02 this record attributed the missing clock to the preview alone."
  - "Published training times do not isolate compiler effects from library, runtime, or hyperparameter adjustments."
  - "Published minutes carry no run-to-run spread. Before 2026-11-02 this record called the spread unavailable, but the per-run logs sit in the results repositories. mlperf-h100-pairs.csv now gives the pairwise intervals. With aborted runs held fixed 8 of 15 pairs separate, and 7 separate among draws with a valid comparison. BERT against RNN-T separates narrowly (lower bound 0.0011) with counts held fixed and not among valid draws, so that pair should not be relied on. Twelve pairs include BERT, ResNet-50, or Mask R-CNN, so they have draws with no valid comparison (no_comparison_draws: 5170 to 9114 of 20000) and depends_on_aborted_runs is yes. No lead is claimed for them. Before the third repair of 2026-11-02 this record and the chapter said four leads held under every treatment, through a holds_all column. An audit showed that BERT passed only because no-result draws were coded as wins for it. RNN-T over RetinaNet, the one separated pair with no such draws, is not claimed, because the two RNN-T run sets overlap. Among BERT, ResNet-50, Mask R-CNN, and RetinaNet, taken two at a time, BERT falls at or below ResNet-50 in 13 of 10886 valid draws and the other five pairs never reverse (valid_reverse_or_tie_draws). Before the fourth repair of 2026-11-02 the chapter said this order held in valid draws without that qualification. No count was taken over draws valid for all four at once."
  - "The 3D U-Net ratio is not a software gain the logs can establish: the interval crosses 1. The 1.03x time-per-epoch difference is not established either. All 40 v3.0 runs form one overlapping block, up to 10 at once, so v3.0 supplies one block, and the ten v2.1 blocks run 0.996x to 1.074x of the v3.0 value (from_block_tpu_ratio_min and _max). The time_per_unit interval is the run-independent bootstrap and is not an uncertainty for that difference. Before 2026-11-02 this record said the time-per-epoch gain was resolved. The bootstrap treats submitted runs as independent draws. Time per unit takes the last logged eval as the convergence point."
  - "The published v2.1 ResNet-50 time is the rule score multiplied by the factor in its scaling.json, and v3.0 has no such file. The published ratio is 1.084 and the plotted unscaled ratio is 1.080. Until 2026-11-02 this normalization was not recorded here."
  - "The v2.1 table heads its BERT column 'BERT [1]'. No text for that note was found, so what it qualifies is unknown, and BERT is the largest ratio."
  - "The intervals describe spread within one submission pair and are not the uncertainty of the gain. The MLCommons results pages for both rounds (mlcommons.netlify.app/en/training-normal-21/ and -30/, read 2026-11-02; fetched HTML sha256 15db5e7e2bc4... and 475a1caec246...) state that even the multiple-result average leaves imaging results very roughly +/- 2.5% and other benchmarks very roughly +/- 5%. The pages do not list which benchmarks count as imaging. Mask R-CNN and RetinaNet intervals are under 1% wide, and the five v3.0 runs of each started within 0.9 s and 31 s (to_start_span_s in mlperf-h100-spread.csv). Those sets, v3.0 RNN-T and 3D U-Net, and v2.1 RNN-T are each one overlapping block (from_overlap_blocks and to_overlap_blocks). A block is a timing statistic. Overlap does not show that a set came from one launch or session, because the logs carry no launch or machine identity and separately started runs can overlap. Before the fourth repair of 2026-11-02 this record and the chapter read overlap as one launch or session, and these columns were named from_launch_blocks and to_launch_blocks. Up to 10 eight-GPU runs were in progress at once (from_most_at_once and to_most_at_once), which at face value implies several machines, so spread within a set can include machine-to-machine spread. The logs do not name the machines. Before 2026-11-02 this record named only Mask R-CNN and RetinaNet. Published v3.0 minutes across the seven 8x H100 SXM submissions give ratios of 0.95 to 1.06 for Mask R-CNN and 0.95 to 1.10 for RNN-T (mlperf-h100-hosts.csv). Hosts differ, so those are not replicates, and two systems split their workloads across two result IDs. Before 2026-11-02 this record called the intervals coarse and did not state this."
  - "NVIDIA blog text states overall gains for BERT, ResNet-50, 3D U-Net, and Mask R-CNN and none for RNN-T, but blog Figure 1 plots RNN-T for H100 v2.1 and v3.0 with a visible gain (image fetched 2026-11-02, sha256 6d77e98ef84b..., not retained because NVIDIA owns it; chart-read by eye, no value taken from it). This record and the chapter previously said the blog gives no RNN-T gain, which held for the text only. The text does not scope its RetinaNet component gains (10%, 10%, and up to 7.5%) to eight GPUs, where the time-to-train gain is 2.8%."
  - "runs.jsonl in this folder logs collection, analysis, and plotting from 2026-11-02 on. Collection attempts before that log existed are not recorded and cannot be recovered from this repository, so their number, retries, failures, and elapsed times are unknown. Local agent transcripts hold a partial trace of fetches made on 2026-11-02. They are not an attempt record, they were not reconstructed here, and they are purged after about 30 days. A refetch reproducing the output byte for byte covers the output only."
  - "Three of the 150 runs did not converge (one each in v2.1 BERT, v3.0 ResNet-50, and v3.0 Mask R-CNN). They stay in mlperf-h100-runs.csv and count as slowest runs under the rules. Aborted-run rule of the plotted intervals: each draw resamples converged runs and holds the aborted count at its submitted value, so none of the three sets can lose its result. Under training_rules.adoc at mlcommons/training_policies a2285a6df9, a second aborted run in a set invalidates the result, and an invalid result has no time. A separate bootstrap resampling all submitted runs therefore gives 5294 (BERT), 5170 (ResNet-50), and 5195 (Mask R-CNN) of 20000 draws with no valid comparison (no_comparison_draws). These count the resampling and are not an abort rate. Those draws receive no value. Before the third repair of 2026-11-02 this record said such a set scores as infinite, and the analyzer turned that into ratios of 0 and inf with kept_ columns and sets_overlap_kept. An audit found that the rules use infinite only to rank sliding windows of an M>N submission, that the zero and the infinity were this project's construction, and that the sign of the result followed the round holding the abort. Those columns are removed and every retained column compares equal. Among draws with a valid comparison the intervals barely move (valid_ columns). The logged_ columns give an aborted run its logged minutes and so score sets the rules call invalid. They are not a rule score, and no claim rests on them. ResNet-50 stays above 1 there and Mask R-CNN falls to 0.63, which is retained as a record of how far that choice moves a result. Time per unit uses converged runs only, and 3D U-Net and RNN-T have no aborted runs."
  - "Converged times of the two rounds do not overlap for BERT, ResNet-50, Mask R-CNN, or RetinaNet. They overlap for RNN-T (8 of 10 v2.1 runs inside the v3.0 range) and 3D U-Net (37 of 40). This tests the ranges of converged runs only, leaves out the three aborted runs, and says nothing about causes."
  - "Four of ten v2.1 RNN-T runs (results 0, 1, 6, and 7) take at least 9.3% longer per epoch than the other six, and v3.0 has no such group. Without them the time-per-epoch ratio is 1.04x against 1.09x for all ten, below ResNet-50 and Mask R-CNN. The plotted point stays correct, and it ranks second partly because of this group. The cause is not in the logs. Before 2026-11-02 neither this record nor the chapter stated this."
  - "Until 2026-11-02 this record held three of six matched workloads without a recorded reason, omitting RNN-T, Mask R-CNN, and RetinaNet and so the two smallest gains. Its claimed floor of 1.08x was therefore too high."
  - "The chapter prose was shortened on 2026-11-02 after the audit passed. Treatment details now live only in this record and its CSVs: the pair counts of draws with no valid comparison, valid-draw intervals, RNN-T pairs among valid draws, the start span of v3.0 RetinaNet runs, the inference that overlapping eight-GPU runs imply several machines, the ten v2.1 3D U-Net overlap groups at 0.996x to 1.074x of the v3.0 value, the ResNet-50 unscaled and published ratios, and the result IDs. No value was changed. The chapter states that its aborted-run standard was set after inspecting the logs. The aborted-run treatments, the RNN-T step split, and the overlap groups were all defined post hoc, and no preregistration exists for this analysis."
exclusions:
  - "Recommendation: v3.0 replaced DLRM on 1TB Click Logs with DLRMv2 on a multi-hot Criteo variant, so no matched pair exists."
  - "MiniGo: dropped in v3.0, so no matched pair exists."

verified: "Producer checks, not an independent audit. 2026-10-10: three workload pairs checked against official MLCommons v2.1 and v3.0 result tables and system JSON records. 2026-11-02: all six pairs rechecked by script against the same tables, quality targets compared between training_rules.adoc at training_policies commits 7a0d1c002b and a2285a6df9, and rule scores from the 150 logs matched to all 12 published times by analyze_mlperf_h100_runs.py, which stops on any mismatch."
not_verified: "Independent benchmark re-execution on 8x H100 hardware; reference-code continuity across rounds; complete machine identity; the meaning of the v2.1 BERT [1] note; the chapter prose rewritten after that audit, which the audit does not bind."
