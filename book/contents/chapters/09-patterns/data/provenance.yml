schema: arch2-provenance/v1
study: ch09-mlperf-software-dividend
title: "Same-accelerator MLPerf Training v2.1 to v3.0 time-to-train comparisons on 8x NVIDIA H100-SXM5-80GB"
claim: "Across the six workloads (BERT, RNN-T, ResNet-50 v1.5, 3D U-Net, Mask R-CNN, RetinaNet) submitted by NVIDIA on 8x H100-SXM5-80GB in both MLPerf Training v2.1 (preview) and v3.0 (available), ratios of the published times range from 1.03x to 1.17x. No lead of one workload over another is claimed, BERT included: every pair containing BERT, ResNet-50, or Mask R-CNN has resampling draws with no valid comparison, so a lead there depends on how aborted runs are handled. What the published times and valid runs show is reported as such, and the 3D U-Net interval includes no gain. Those intervals are not the uncertainty of the gain. Numbers: mlperf-h100-spread.csv, mlperf-h100-pairs.csv, and mlperf-h100-hosts.csv."
evidence_class: transcribed
status: producer_checked_audit_passed  # data/audits/fig-ch09-mlperf-software-dividend.yml, PASS 2026-11-02 by codex-ch09-fifth, the fifth audit. The earlier audits failed; the defects below keep that history. The audit binds inputs, generator, caption, and alt text, not the chapter prose.

