<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 1080 408" role="img">
  <title>Transfer test from source record to target decision</title>
  <desc>A transfer test begins with an admission check comparing source and target decisions, then runs four stages: partitioning into transfer units, isolating changed dependencies, assigning target actions, and enforcing target checks before reaching a new target decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .source { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .admission { fill: #FFF7E6; stroke: #D9822B; stroke-width: 1.5; }
      .unit { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.5; }
      .change { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.5; }
      .action { fill: #F5F8FA; stroke: #9AA8B5; stroke-width: 1.5; }
      .check { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
      .decision { fill: #FBEDF4; stroke: #D24D96; stroke-width: 1.5; }
      .band { fill: #F5F8FA; stroke: #9AA8B5; stroke-width: 1.1; }
      .warning { fill: #FFF7F7; stroke: #DE3D3C; stroke-width: 1.2; }
      .label { font-size: 12.5px; font-weight: 700; fill: #222222; }
      .body { font-size: 11px; fill: #333333; }
      .small { font-size: 10.8px; fill: #59636D; }
      .note { font-size: 11px; font-weight: 700; fill: #1683A6; }
      .red-note { font-size: 11.4px; font-weight: 700; fill: #B62E2D; }
      .arrow { stroke: #333333; stroke-width: 1.8; fill: none; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="50" width="1080" height="408" fill="#FFFFFF"/>
  <g class="font">
    <rect class="source" x="20" y="70" width="125" height="148"/>
    <text class="label" x="82.5" y="98" text-anchor="middle">source record</text>
    <text class="body" x="82.5" y="124" text-anchor="middle">artifacts + data</text>
    <text class="body" x="82.5" y="144" text-anchor="middle">methods + tools</text>
    <text class="body" x="82.5" y="164" text-anchor="middle">checks + limits</text>
    <text class="body" x="82.5" y="184" text-anchor="middle">conclusion</text>

    <rect class="admission" x="165" y="70" width="125" height="148"/>
    <text class="label" x="227.5" y="98" text-anchor="middle">admission check</text>
    <text class="body" x="227.5" y="124" text-anchor="middle">compare decisions</text>
    <text class="body" x="227.5" y="144" text-anchor="middle">boundary + objective</text>
    <text class="body" x="227.5" y="164" text-anchor="middle">error cost match?</text>
    <text class="note" x="227.5" y="186" text-anchor="middle">pass &#8594; stages 1–4</text>

    <rect class="unit" x="310" y="70" width="125" height="148"/>
    <text class="label" x="372.5" y="98" text-anchor="middle">1. transfer units</text>
    <text class="body" x="372.5" y="124" text-anchor="middle">data + state</text>
    <text class="body" x="372.5" y="144" text-anchor="middle">methods + ifaces</text>
    <text class="body" x="372.5" y="164" text-anchor="middle">checks + artifacts</text>
    <text class="body" x="372.5" y="184" text-anchor="middle">dependencies</text>

    <rect class="change" x="455" y="70" width="140" height="148"/>
    <text class="label" x="525" y="98" text-anchor="middle">2. dependencies</text>
    <text class="body" x="525" y="126" text-anchor="middle">trace material change</text>
    <text class="body" x="525" y="148" text-anchor="middle">to dependent claims</text>
    <text class="body" x="525" y="170" text-anchor="middle">and interfaces</text>

    <rect class="action" x="615" y="70" width="120" height="148"/>
    <text class="label" x="675" y="98" text-anchor="middle">3. target actions</text>
    <text class="body" x="675" y="124" text-anchor="middle">carry / update</text>
    <text class="body" x="675" y="142" text-anchor="middle">retrain or</text>
    <text class="body" x="675" y="158" text-anchor="middle">recalibrate</text>
    <text class="body" x="675" y="176" text-anchor="middle">replace / retire</text>

    <rect class="check" x="755" y="70" width="135" height="148"/>
    <text class="label" x="822.5" y="98" text-anchor="middle">4. target checks</text>
    <text class="body" x="822.5" y="126" text-anchor="middle">check affected units</text>
    <text class="body" x="822.5" y="146" text-anchor="middle">and each interface</text>
    <text class="body" x="822.5" y="166" text-anchor="middle">to changed neighbors</text>

    <rect class="decision" x="910" y="70" width="145" height="148"/>
    <text class="label" x="982.5" y="98" text-anchor="middle">target decision</text>
    <text class="body" x="982.5" y="126" text-anchor="middle">new comparison</text>
    <text class="body" x="982.5" y="148" text-anchor="middle">target measurements</text>
    <text class="body" x="982.5" y="170" text-anchor="middle">supported conclusion</text>

    <line class="arrow" x1="145" y1="144" x2="165" y2="144"/>
    <line class="arrow" x1="290" y1="144" x2="310" y2="144"/>
    <line class="arrow" x1="435" y1="144" x2="455" y2="144"/>
    <line class="arrow" x1="595" y1="144" x2="615" y2="144"/>
    <line class="arrow" x1="735" y1="144" x2="755" y2="144"/>
    <line class="arrow" x1="890" y1="144" x2="910" y2="144"/>

    <rect class="warning" x="20" y="250" width="415" height="58"/>
    <text class="red-note" x="227.5" y="275" text-anchor="middle">components may move; the source conclusion does not</text>
    <text class="small" x="227.5" y="296" text-anchor="middle">keep it attached to the source conditions and limits</text>

    <rect class="band" x="455" y="250" width="280" height="58"/>
    <text class="label" x="595" y="275" text-anchor="middle">selective reopening</text>
    <text class="body" x="595" y="296" text-anchor="middle">reopen only claims affected by material changes</text>

    <rect class="band" x="755" y="250" width="300" height="58"/>
    <text class="label" x="905" y="271" text-anchor="middle">integration obligation</text>
    <text class="body" x="905" y="287" text-anchor="middle">changed interfaces require</text>
    <text class="body" x="905" y="301" text-anchor="middle">checks with neighbors</text>

    <path class="arrow" d="M 82.5 218 L 82.5 250"/>
    <path class="arrow" d="M 525 218 L 525 250"/>
    <path class="arrow" d="M 822.5 218 L 822.5 250"/>

    <rect class="source" x="82" y="360" width="220" height="74"/>
    <text class="label" x="192" y="388" text-anchor="middle">source component</text>
    <text class="body" x="192" y="413" text-anchor="middle">meaning comes from dependencies</text>

    <rect class="change" x="430" y="360" width="220" height="74"/>
    <text class="label" x="540" y="388" text-anchor="middle">target context</text>
    <text class="body" x="540" y="409" text-anchor="middle">changed neighbors reopen</text>
    <text class="body" x="540" y="426" text-anchor="middle">dependent claims</text>

    <rect class="check" x="778" y="360" width="220" height="74"/>
    <text class="label" x="888" y="388" text-anchor="middle">qualified target use</text>
    <text class="body" x="888" y="413" text-anchor="middle">new checks support a new decision</text>

    <line class="arrow" x1="302" y1="397" x2="430" y2="397"/>
    <line class="arrow" x1="650" y1="397" x2="778" y2="397"/>
  </g>
</svg>
