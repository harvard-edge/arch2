<text x="597.0" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">III - OPERATION &amp; OWNERSHIP</text>
<rect x="716.0" y="8" width="230.0" height="27" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="831.0" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" fill="#64748B">IV - ECOSYSTEM</text>
<text x="14" y="58" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#136680" letter-spacing="0.7">SEPARATE OWNERSHIP FROM COMMITMENT</text>
<text x="14" y="83" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#20252B">Technical assessment does not authorize itself</text>
<rect x="14" y="101" width="932" height="168" fill="#F8FAFB" stroke="#3E474B" stroke-width="1.7"/>
<text x="28" y="122" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#20252B">ACCOUNTABLE ORGANIZATION</text>
<text x="250" y="122" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#3E474B">assigns roles + supplies resources + owns product consequences</text>
<rect x="34" y="139" width="250" height="86" fill="#FBF0DE" stroke="#E68A17" stroke-width="1.5"/>
<text x="47" y="164" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8A5310">Substantial design work</text>
<text x="47" y="183" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#3E474B">AI-native system + specialists</text>
<text x="47" y="197" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#3E474B">formulate + generate + run</text>
<text x="47" y="211" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#3E474B">interpret + recommend</text>
<rect x="329" y="139" width="320" height="86" fill="#E4F1F6" stroke="#1683A6" stroke-width="1.5"/>
<text x="342" y="164" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#136680">Architectural ownership</text>
<text x="342" y="187" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#3E474B">frame + bound + reconcile evidence</text>
<text x="342" y="205" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#3E474B">state residual risk + reopen technical work</text>
