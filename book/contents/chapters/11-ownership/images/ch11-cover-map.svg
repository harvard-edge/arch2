      .line-main { fill: none; stroke: #20252B; stroke-width: 1.8; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #1683A6; stroke-width: 1.8; marker-end: url(#arrow-blue); }
      .line-green { fill: none; stroke: #059669; stroke-width: 1.8; stroke-dasharray: 5 4; marker-end: url(#arrow-green); }
