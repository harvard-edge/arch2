defects:
  - "Counts reflect submitted tile designs listed on tinytapeout.com/chips/ at query time (2026-08-22), not post-silicon yield or verified functional silicon."
  - "No raw capture of the rendered catalog from 2026-08-22 exists. The retained stand-in is the site source at commit 7a575614d5 (2026-07-27), the last commit to that file before the snapshot; the next commit is 2aa2f1edc9 (2026-09-08). This assumes the source matches what was deployed."
  - "DeliveryStatus records the catalog's label: Shipped <date>, or a bare date that the catalog lists as estimated delivery. Some estimates have since moved, and a run without the label may already have reached some users, so the label does not establish whether chips shipped. Tiny Tapeout called TTIHP25a freshly packaged on 2026-02-26 (tinytapeout.com/news/ttihp25a-name/, read 2026-11-02, sha256 c928a3a4c90c7b9f48904f76c270f19b533009162b7cc49fc5800af58e1a9cb8, not retained because the rights are unclear), yet the July 2026 source gives that run a bare estimate."
  - "Counts repeat designs. 333 of the 369 TT09 modules reappear by name on TTIHP25a (317 from the same repository, 134 at the same commit), and across the 21 plotted runs with module data 2,987 distinct module names underlie 4,022 rows, taken from the submission API and, for TT02 and TT03, from the shuttle index because the API omits them. The Efabless FAQ says most TT08, TT09, and TT10 digital designs were ported to TTIHP25a. Module names are a proxy for design identity and some repeats are organizer macros. TT01 is in neither the API nor the index (HTTP 404), so the estimate of 3,139 adds its 152 catalog entries unchanged and its internal repeats are unknown. Mixing the two sources assumes API top modules and index macros share a naming scheme. An earlier version read TT02 and TT03 as having no module data and gave 2,727 names, 3,607 rows, and 3,144."
  - "Module name can undercount as well as overcount. From the shuttle indexes, the name key gives 3,140 and the repository key 3,395, 8.1 percent higher (design-identity-sensitivity.json). 70 names have more than one owner. In the other direction, a port to a new repository counts twice under the repository key, and 880 names are built from a Wokwi project number. The 2025 dip and the 2026 high hold under each key. They depend on calendar-year bins: a year boundary moved four months removes the dip (new-name-readings.json). 2026 is partial, so a moved boundary also truncates the last bin. Wokwi names are counted at 880 under tt_um_wokwi_; a further 101 follow user_module_<id>, assumed to be Wokwi-generated, which is why the chapter says at least. The 3,395 is not an upper limit."
  - "The API and catalog differ by one row on TT07 (119 vs 120) and on TTIHP25a (546 vs 547), and the API lists TTCAD25a, TTIHP0p3, and TT10 outside the plotted rows. The index and catalog differ on TT02 (166 vs 165), TT03 (249 vs 100, see below), and TT05 (173 vs 174). TTIHP25a's 547 equals the distinct non-group modules in its shuttle index; the project table on its chip page has 548 rows."
  - "Plotted bars are the runs with a catalog count at the snapshot. The cancelled TT10 and the open TTIHP26b and TTSKY26c have none. At least five closed runs have indexes but no row in the catalog table: TT03p5 (29 modules), TTCAD25a (257), TTGF0p1 (24), TTIHP0p1 (24), and TTIHP0p3 (23). The index host publishes no list of runs, so this list can be incomplete."
  - "The catalog's TTSKY26a launch date read 2025-02-27 at the snapshot and was later corrected upstream to 2026-02-27 (72d32752f6, September 2026). The CSV keeps the snapshot value; an edit on 2026-09-29 (422ae1fef) changed it without disclosure and has been reverted. The field is not plotted."
  - "The catalog's TT03 count reads 100 with an asterisk; the CSV keeps 100 without it and the figure restores the mark on the TT03 tick label. The TT03 chip page says 100 projects submitted, 149 projects added from TT02, and its project table has 249 rows, as does the index. So TT03 alone among the bars is known to exclude ported designs. The index shows 155 of the 249 TT03 modules also on TT02, against the page's 149; neither source explains the gap of six. With the 149 included the total would be 4,175 and the mean 190; the CSV and the bars keep the catalog value."
  - "TT10 is cancelled in the catalog and has no design count, so it has no row."
  - "The Efabless FAQ describes TTCAD25a in differing terms: all TT08/09/10 designs in one line, all designs from TT09 and TT10 and most from TT08 in another, and most of the TT08-TT10 projects in a third. The chapter uses the third, the narrowest. The FAQ gives no later status for the Cadence TT09 dies."

verified: "2026-08-22: 22 shuttle runs and submitted tile counts transcribed from https://tinytapeout.com/chips/; the generator asserts the cumulative sum against the same CSV, and the inline cell in 12-ecosystem.qmd recomputes the total and the test-shuttle and shipped splits. These are internal arithmetic checks. tinytapeout-receipts/design_repeats.py compares 110 CSV fields with the pinned site source; the only difference is the TT03 asterisk disclosed above. The script does not go through data/run_study.py because this figure has no study directory, so no run log exists. This producer check is not an audit."
