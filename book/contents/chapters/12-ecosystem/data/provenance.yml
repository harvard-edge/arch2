study: ch12-tinytapeout-shuttle-submissions
title: "Tiny Tapeout public shuttle run design counts (TT01 through TTGF0p3)"
claim: "Across 22 public Tiny Tapeout shuttle runs launched between August 2022 and June 2026 on SkyWater SKY130, IHP SG13G2, and GlobalFoundries GF180MCU, 4,026 cumulative designs were listed (3,655 on 17 runs and 371 on the five runs the catalog labels test shuttles). The total usually counts a design again when it is listed on a later run, but the catalog's asterisked TT03 count of 100 leaves out 149 designs carried over from TT02. Counting each module name once gives an estimated 3,139."
evidence_class: transcribed
