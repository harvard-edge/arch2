<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 85 940 395" role="img" aria-labelledby="oai-title oai-desc">
  <title id="oai-title">The three core schemas of the Open Agentic Interface</title>
  <desc id="oai-desc">The Open Agentic Interface proposes three record classes: Design Problem Formulations, Attempt Lineage Headers, and Multi-Fidelity Environmental Contracts. Together they support selective metadata exchange subject to separate trust, access, and confidentiality controls.</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636D"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .eyebrow { font-size: 10.5px; font-weight: 700; fill: #59636D; letter-spacing: 0.7px; }
      .head { font-size: 15px; font-weight: 700; fill: #20252B; }
      .title { font-size: 13.5px; font-weight: 700; fill: #20252B; }
      .sub { font-size: 10.5px; fill: #4A5560; }
      .panel { fill: #F8FAFC; stroke: #9AA8B5; stroke-width: 1.4; }
      .source { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .learned { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.5; }
      .checked { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
      .decision { fill: #FBEDF4; stroke: #D24D96; stroke-width: 1.5; }
      .connector { fill: none; stroke: #59636D; stroke-width: 1.7; stroke-linecap: square; stroke-linejoin: miter; }
    </style>
  </defs>

  <rect width="980" height="500" fill="#FFFFFF"/>

  <g class="font">
    <!-- SCHEMA 1: Problem Formulation -->
    <text class="eyebrow" x="175" y="104" text-anchor="middle">SCHEMA 1: FORMULATION</text>
    <rect class="source" x="40" y="120" width="270" height="230"/>
    <text class="title" x="55" y="146">1. Design problem formulation</text>
    <text class="sub" x="55" y="172">Explicit search bounds &amp; constraints</text>
    <text class="sub" x="55" y="198">• Swept bounds: PE array 16x16 to 64x64,</text>
    <text class="sub" x="67" y="214">SRAM capacity 256 KB to 2 MB</text>
    <text class="sub" x="55" y="238">• System obligations: 3 W TDP limit,</text>
    <text class="sub" x="67" y="254">120 FPS frame rate constraint</text>
    <text class="sub" x="55" y="278">• ISA &amp; interconnect targets: RISC-V</text>
    <text class="sub" x="67" y="294">RV64GCV, UCIe die-to-die, CXL expansion</text>
    <text class="sub" x="55" y="318">• Technology evidence roles: predictive</text>
    <text class="sub" x="67" y="334">ASAP7 vs. foundry-qualified signoff</text>

    <path class="connector" d="M 310 235 L 355 235" marker-end="url(#arrow-gray)"/>

    <!-- SCHEMA 2: Lineage Header -->
    <text class="eyebrow" x="490" y="104" text-anchor="middle">SCHEMA 2: LINEAGE</text>
    <rect class="learned" x="355" y="120" width="270" height="230"/>
    <text class="title" x="370" y="146">2. Attempt lineage header</text>
    <text class="sub" x="370" y="172">Artifact identities &amp; signed declarations</text>
    <text class="sub" x="370" y="198">• Hashes identify prompt, parent commit,</text>
    <text class="sub" x="382" y="214">artifacts, configuration, and seed</text>
    <text class="sub" x="370" y="238">• Multi-level IR representations:</text>
    <text class="sub" x="382" y="254">AST, CDFG, MLIR/CIRCT dialects</text>
    <text class="sub" x="370" y="278">• Container image digest tracking:</text>
    <text class="sub" x="382" y="294">docker://arch2/tools@sha256:a5e8f9...</text>
    <text class="sub" x="370" y="318">• Tool CLI arguments &amp; UPF (IEEE 1801)</text>
    <text class="sub" x="382" y="334">power domain state declarations</text>

    <path class="connector" d="M 625 235 L 670 235" marker-end="url(#arrow-gray)"/>

    <!-- SCHEMA 3: Environmental Contract -->
    <text class="eyebrow" x="805" y="104" text-anchor="middle">SCHEMA 3: CONTRACT</text>
    <rect class="checked" x="670" y="120" width="270" height="230"/>
    <text class="title" x="685" y="146">3. Environmental contract</text>
    <text class="sub" x="685" y="172">Tool interface &amp; behavior assessment</text>
    <text class="sub" x="685" y="198">• Input prerequisites, output schemas,</text>
    <text class="sub" x="697" y="214">status semantics &amp; error assumptions</text>
    <text class="sub" x="685" y="238">• Assessed simulators &amp; EDA tools:</text>
    <text class="sub" x="697" y="254">gem5, Verilator, SCALE-Sim, Ramulator,</text>
    <text class="sub" x="697" y="270">OpenROAD, Yosys, and OpenSTA</text>
    <text class="sub" x="685" y="294">• Declared container capabilities:</text>
    <text class="sub" x="697" y="310">Protobuf state, checkpoint recovery,</text>
    <text class="sub" x="697" y="326">machine-parsable error channels</text>

    <!-- Connectors down to Bottom Box -->
    <path class="connector" d="M 175 350 V 380 H 490" marker-end="url(#arrow-gray)"/>
    <path class="connector" d="M 490 350 V 380"/>
    <path class="connector" d="M 805 350 V 380 H 490"/>

    <!-- BOTTOM HANDOFF BOX -->
    <rect class="decision" x="40" y="380" width="900" height="76"/>
    <text class="title" x="490" y="408" text-anchor="middle">Selective metadata exchange under separate trust and access policy</text>
    <text class="sub" x="490" y="430" text-anchor="middle">Schemas make selected records interoperable; hashes and attestations identify artifacts and issuers rather than proving semantic correctness.</text>
    <text class="sub" x="490" y="446" text-anchor="middle">Access control, redaction, confidentiality review, and trust-root governance remain independent requirements.</text>
  </g>
</svg>
