<text x="480" y="186" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#59429E">SHARED INFRASTRUCTURE  -  DEPENDENCY FOLLOWS THE CLAIM</text>
<rect x="54" y="198" width="266" height="72" fill="#F0ECFA" stroke="#6A4FC7" stroke-width="1.5"/>
<text x="187.0" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#59429E">Cross-team comparison</text>
<text x="187.0" y="241" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#3E474B">common record contracts</text>
<text x="187.0" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#3E474B">comparable disclosures</text>
<rect x="347" y="198" width="266" height="72" fill="#F0ECFA" stroke="#6A4FC7" stroke-width="1.5"/>
<text x="480.0" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#59429E">Physical or silicon claim</text>
<text x="480.0" y="241" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#3E474B">qualified path at named node</text>
<text x="480.0" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#3E474B">and declared checks</text>
<rect x="640" y="198" width="266" height="72" fill="#F0ECFA" stroke="#6A4FC7" stroke-width="1.5"/>
