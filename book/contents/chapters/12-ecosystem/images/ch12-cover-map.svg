<title id="cover-title-12">Chapter 12 opening map</title>
<desc id="cover-desc-12">One team can improve records and comparisons now, while cross-team, physical or silicon, and public-program claims require different shared infrastructure.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#20252B"/></marker></defs>
<rect x="0" y="0" width="960" height="285" fill="#FFFFFF"/>
<text x="14" y="58" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#136680" letter-spacing="0.7">SEPARATE EFFORT FROM COORDINATION</text>
<text x="14" y="83" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#20252B">Start locally; coordinate when the claim expands</text>
<rect x="54" y="104" width="852" height="63" fill="#E4F1F6" stroke="#1683A6" stroke-width="1.5"/>
<text x="480.0" y="129" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#136680">LOCAL PRACTICE NOW  -  NO CONSORTIUM REQUIRED</text>
<text x="480.0" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#3E474B">record total cost and lineage + retain failed attempts + run matched baselines</text>
