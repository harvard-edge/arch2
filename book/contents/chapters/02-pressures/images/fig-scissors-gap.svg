<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 628" role="img" aria-labelledby="scissors-title scissors-desc">
  <title id="scissors-title">Admitted checking work and waiting work</title>
  <desc id="scissors-desc">An unscaled flow runs downward: generate proposals produces candidate proposals; admission and screening applies scope, legality, and study budget and sends work that is not admitted to discard or defer. Admitted work waits for evaluation, is evaluated by running tools and required checks, waits for review, is reviewed by interpreting evidence and remaining risk, and ends in a completed decision to accept, reject, or seek more evidence. Dashed leaders tie both waiting stages to a note: backlog grows when admitted checking work exceeds completed work in the same interval; compare work as well as candidate counts, because checking costs differ. A closing note says to measure tool time and reviewer effort. Box sizes encode no quantities.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .box { stroke-width: 1.7; }
      .method      { fill: #FBF0DE; stroke: #E68A17; }
      .constraint  { fill: #FDECEC; stroke: #DE3D3C; }
      .evidence    { fill: #E7F5EC; stroke: #1E9E48; }
      .decision    { fill: #FBEDF4; stroke: #D24D96; }
      .designspace { fill: #F0ECFA; stroke: #6A4FC7; }
      .title { font-size: 15px; font-weight: 700; fill: #20252B; }
      .sub { font-size: 13px; fill: #444444; }
      .note { font-size: 13px; fill: #444444; }
      .edge { fill: none; stroke: #333333; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-dark); }
      .route { fill: none; stroke: #59636D; stroke-width: 1.6; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="820" height="628" fill="#FFFFFF"/>
  <g class="font">
    <!-- Main flow (left column) -->
    <rect class="box method" x="30" y="30" width="440" height="64"/>
    <text class="title" x="250" y="57" text-anchor="middle">Generate proposals</text>
    <text class="sub" x="250" y="79" text-anchor="middle">Candidate proposals</text>
    <line class="edge" x1="250" y1="94" x2="250" y2="122"/>

    <rect class="box method" x="30" y="122" width="440" height="64"/>
    <text class="title" x="250" y="149" text-anchor="middle">Admission and screening</text>
    <text class="sub" x="250" y="171" text-anchor="middle">Scope, legality, and study budget</text>
    <line class="edge" x1="250" y1="186" x2="250" y2="214"/>

    <rect class="box constraint" x="30" y="214" width="440" height="40"/>
    <text class="title" x="250" y="239" text-anchor="middle">Waiting for evaluation</text>
    <line class="edge" x1="250" y1="254" x2="250" y2="282"/>

    <rect class="box evidence" x="30" y="282" width="440" height="64"/>
    <text class="title" x="250" y="309" text-anchor="middle">Evaluate</text>
    <text class="sub" x="250" y="331" text-anchor="middle">Run tools and required checks</text>
    <line class="edge" x1="250" y1="346" x2="250" y2="374"/>

    <rect class="box constraint" x="30" y="374" width="440" height="40"/>
    <text class="title" x="250" y="399" text-anchor="middle">Waiting for review</text>
    <line class="edge" x1="250" y1="414" x2="250" y2="442"/>

    <rect class="box evidence" x="30" y="442" width="440" height="64"/>
    <text class="title" x="250" y="469" text-anchor="middle">Review</text>
    <text class="sub" x="250" y="491" text-anchor="middle">Interpret evidence and remaining risk</text>
    <line class="edge" x1="250" y1="506" x2="250" y2="534"/>

    <rect class="box decision" x="30" y="534" width="440" height="64"/>
    <text class="title" x="250" y="561" text-anchor="middle">Completed decision</text>
    <text class="sub" x="250" y="583" text-anchor="middle">Accept, reject, or seek more evidence</text>

    <!-- Not admitted -->
    <rect class="box designspace" x="530" y="122" width="260" height="64"/>
    <text class="title" x="660" y="149" text-anchor="middle">Discard or defer</text>
    <text class="sub" x="660" y="171" text-anchor="middle">Not admitted</text>
    <line class="edge" x1="470" y1="154" x2="530" y2="154"/>

    <!-- Backlog note tied to both waiting stages (leaders carry no flow) -->
    <rect class="box constraint" x="530" y="214" width="260" height="200"/>
    <text class="title" x="660" y="246" text-anchor="middle">Backlog grows when</text>
    <text class="sub" x="660" y="272" text-anchor="middle">admitted checking work</text>
    <text class="sub" x="660" y="290" text-anchor="middle">exceeds completed work</text>
    <text class="sub" x="660" y="308" text-anchor="middle">in the same interval.</text>
    <text class="sub" x="660" y="344" text-anchor="middle">Compare work as well</text>
    <text class="sub" x="660" y="362" text-anchor="middle">as candidate counts;</text>
    <text class="sub" x="660" y="380" text-anchor="middle">checking costs differ.</text>
    <path class="route" d="M 470 234 H 530"/>
    <path class="route" d="M 470 394 H 530"/>

    <text class="note" x="660" y="446" text-anchor="middle">Measure tool time</text>
    <text class="note" x="660" y="464" text-anchor="middle">and reviewer effort.</text>
  </g>
</svg>
