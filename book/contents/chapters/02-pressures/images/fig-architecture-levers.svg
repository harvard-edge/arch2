<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" role="img" aria-labelledby="levers-title levers-desc">
  <title id="levers-title">Architecture scales and the obligations each adds</title>
  <desc id="levers-desc">Five architecture scales are listed top to bottom as the system boundary expands: core (one microarchitecture), accelerator (one specialized function), SoC or chiplet (one composed package), wafer-scale (one physical fabric), and warehouse-scale (one deployed service). Each scale points to the obligations it adds, such as pipeline and cache policies for a core or network and facility limits for a warehouse-scale service. All five obligation sets join one path labeled comparison obligations accumulate, which feeds a cross-scale architecture comparison carrying constraints, interfaces, workload and software path, tool feedback, failures, rejected alternatives, and conditions that can reverse the decision.</desc>
  <defs>
    <marker id="lv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .box { stroke-width: 1.7; }
      .design   { fill: #F0ECFA; stroke: #6A4FC7; }
      .neutral  { fill: #F5F8FA; stroke: #7E8B96; }
      .evidence { fill: #E7F5EC; stroke: #1E9E48; }
      .head { font-size: 15px; font-weight: 700; fill: #20252B; }
      .col { font-size: 12px; font-weight: 700; fill: #3E474B; letter-spacing: 0.8px; }
      .title { font-size: 15px; font-weight: 700; fill: #20252B; }
      .sub { font-size: 13px; fill: #444444; }
      .flow-label { font-size: 13px; font-weight: 700; fill: #3E474B; }
      .edge { fill: none; stroke: #333333; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#lv-arrow); }
      .line { fill: none; stroke: #333333; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }
    </style>
  </defs>

  <rect width="900" height="712" fill="#FFFFFF"/>
  <g class="font">
    <text class="head" x="60" y="38">System boundary expands</text>
    <text class="col" x="60" y="70">SCALE</text>
    <text class="col" x="400" y="70">ADDED OBLIGATIONS</text>
    <!-- Boundary-expansion axis -->
    <path class="edge" d="M 36 84 V 512"/>
    <!-- Core -->
    <rect class="box design" x="60" y="84" width="290" height="76"/>
    <text class="title" x="80" y="116">Core</text>
    <text class="sub" x="80" y="138">one microarchitecture</text>
    <path class="edge" d="M 350 122 H 380"/>
    <rect class="box neutral" x="380" y="84" width="420" height="76"/>
    <text class="sub" x="400" y="108">pipeline and cache policies</text>
    <text class="sub" x="400" y="126">coherence and corner cases</text>
    <text class="sub" x="400" y="144">timing and physical checks</text>
    <path class="line" d="M 800 122 H 840"/>
    <!-- Accelerator -->
    <rect class="box design" x="60" y="172" width="290" height="76"/>
    <text class="title" x="80" y="204">Accelerator</text>
    <text class="sub" x="80" y="226">one specialized function</text>
    <path class="edge" d="M 350 210 H 380"/>
    <rect class="box neutral" x="380" y="172" width="420" height="76"/>
    <text class="sub" x="400" y="196">workload mapping</text>
    <text class="sub" x="400" y="214">programming interface</text>
    <text class="sub" x="400" y="232">data movement</text>
    <path class="line" d="M 800 210 H 840"/>
    <!-- SoC or chiplet -->
    <rect class="box design" x="60" y="260" width="290" height="76"/>
    <text class="title" x="80" y="292">SoC or chiplet</text>
    <text class="sub" x="80" y="314">one composed package</text>
    <path class="edge" d="M 350 298 H 380"/>
    <rect class="box neutral" x="380" y="260" width="420" height="76"/>
    <text class="sub" x="400" y="284">integration and package</text>
    <text class="sub" x="400" y="302">interconnect and opaque IP</text>
    <text class="sub" x="400" y="320">test and signoff</text>
    <path class="line" d="M 800 298 H 840"/>
    <!-- Wafer-scale -->
    <rect class="box design" x="60" y="348" width="290" height="76"/>
    <text class="title" x="80" y="380">Wafer-scale</text>
    <text class="sub" x="80" y="402">one physical fabric</text>
    <path class="edge" d="M 350 386 H 380"/>
    <rect class="box neutral" x="380" y="348" width="420" height="76"/>
    <text class="sub" x="400" y="372">yield and repair</text>
    <text class="sub" x="400" y="390">power delivery and reach</text>
    <text class="sub" x="400" y="408">placement and scheduling</text>
    <path class="line" d="M 800 386 H 840"/>
    <!-- Warehouse-scale -->
    <rect class="box design" x="60" y="436" width="290" height="76"/>
    <text class="title" x="80" y="468">Warehouse-scale</text>
    <text class="sub" x="80" y="490">one deployed service</text>
    <path class="edge" d="M 350 474 H 380"/>
    <rect class="box neutral" x="380" y="436" width="420" height="76"/>
    <text class="sub" x="400" y="460">network and facility limits</text>
    <text class="sub" x="400" y="478">failure and tail behavior</text>
    <text class="sub" x="400" y="496">deployment policy</text>
    <path class="line" d="M 800 474 H 840"/>
    <!-- All branches join one comparison path -->
    <path class="line" d="M 840 122 V 546 H 430"/>
    <path class="edge" d="M 430 546 V 576"/>
    <text class="flow-label" x="828" y="537" text-anchor="end">Comparison obligations accumulate</text>
    <rect class="box evidence" x="60" y="576" width="740" height="112"/>
    <text class="title" x="430" y="606" text-anchor="middle">Cross-scale architecture comparison</text>
    <text class="sub" x="430" y="630" text-anchor="middle">Constraints • interfaces • workload and software path</text>
    <text class="sub" x="430" y="649" text-anchor="middle">Tool feedback • failures • rejected alternatives</text>
    <text class="sub" x="430" y="668" text-anchor="middle">Conditions that can reverse the decision</text>
  </g>
</svg>
