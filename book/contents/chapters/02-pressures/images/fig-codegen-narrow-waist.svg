<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 604" role="img" aria-labelledby="cg-title cg-desc">
  <title id="cg-title">Executable software path for specialization</title>
  <desc id="cg-desc">A vertical diagram. Domain intent and workload distribution (semantics, input mix, QoS, deployment context, drift) flows down to a junction where architecture mechanisms (dataflow, memory, precision, accelerators, chiplets) and hardware constraints (power, area, timing, bandwidth, thermal, reliability, cost) also arrive; together they bind the target configuration. The bound configuration flows into the code-generation path (programming model, compiler IR, libraries, runtime, generated code), where specialization becomes usable. The code-generation path flows into tool results and measurements (tests, profiling, simulation, synthesis, telemetry), which sit above four checks: correctness, performance, portability, and maintainability.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .box { stroke-width: 1.7; }
      .workload    { fill: #E4F1F6; stroke: #1683A6; }
      .designspace { fill: #F0ECFA; stroke: #6A4FC7; }
      .constraint  { fill: #FDECEC; stroke: #DE3D3C; }
      .neutral     { fill: #F5F8FA; stroke: #7E8B96; }
      .title { font-size: 15px; font-weight: 700; fill: #20252B; }
      .sub { font-size: 13px; fill: #444444; }
      .note { font-size: 13px; font-style: italic; fill: #59636D; }
      .edge { fill: none; stroke: #333333; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-dark); }
    </style>
  </defs>

  <rect width="860" height="604" fill="#FFFFFF"/>
  <g class="font">
    <!-- Domain intent -->
    <rect class="box workload" x="170" y="28" width="520" height="68"/>
    <text class="title" x="430" y="55" text-anchor="middle">domain intent + workload distribution</text>
    <text class="sub" x="430" y="79" text-anchor="middle">semantics, input mix, QoS, deployment context, drift</text>
    <line class="edge" x1="430" y1="96" x2="430" y2="174"/>

    <!-- Mechanisms and constraints -->
    <rect class="box workload" x="40" y="142" width="310" height="88"/>
    <text class="title" x="195" y="170" text-anchor="middle">architecture mechanisms</text>
    <text class="sub" x="195" y="194" text-anchor="middle">dataflow, memory, precision,</text>
    <text class="sub" x="195" y="212" text-anchor="middle">accelerators, chiplets</text>

    <rect class="box workload" x="510" y="142" width="310" height="88"/>
    <text class="title" x="665" y="170" text-anchor="middle">hardware constraints</text>
    <text class="sub" x="665" y="194" text-anchor="middle">power, area, timing, bandwidth,</text>
    <text class="sub" x="665" y="212" text-anchor="middle">thermal, reliability, cost</text>

    <!-- Junction: bind target configuration -->
    <rect class="box neutral" x="411" y="174" width="38" height="24"/>
    <circle cx="430" cy="186" r="3.5" fill="#333333"/>
    <line class="edge" x1="350" y1="186" x2="411" y2="186"/>
    <line class="edge" x1="510" y1="186" x2="449" y2="186"/>
    <line class="edge" x1="430" y1="198" x2="430" y2="300"/>
    <text class="note" x="444" y="262">bind target configuration</text>

    <!-- Code-generation path -->
    <rect class="box designspace" x="230" y="300" width="400" height="106"/>
    <text class="title" x="430" y="328" text-anchor="middle">code-generation path</text>
    <text class="sub" x="430" y="352" text-anchor="middle">programming model, compiler IR,</text>
    <text class="sub" x="430" y="370" text-anchor="middle">libraries, runtime, generated code</text>
    <text class="note" x="430" y="392" text-anchor="middle">where specialization becomes usable</text>
    <line class="edge" x1="430" y1="406" x2="430" y2="446"/>

    <!-- Tool results -->
    <rect class="box workload" x="150" y="446" width="560" height="64"/>
    <text class="title" x="430" y="473" text-anchor="middle">tool results + measurements</text>
    <text class="sub" x="430" y="495" text-anchor="middle">tests, profiling, simulation, synthesis, telemetry</text>

    <!-- Checks -->
    <rect class="box constraint" x="100" y="530" width="156" height="46"/>
    <text class="title" x="178" y="558" text-anchor="middle">correctness</text>
    <rect class="box constraint" x="268" y="530" width="156" height="46"/>
    <text class="title" x="346" y="558" text-anchor="middle">performance</text>
    <rect class="box constraint" x="436" y="530" width="156" height="46"/>
    <text class="title" x="514" y="558" text-anchor="middle">portability</text>
    <rect class="box constraint" x="604" y="530" width="156" height="46"/>
    <text class="title" x="682" y="558" text-anchor="middle">maintainability</text>
  </g>
</svg>
