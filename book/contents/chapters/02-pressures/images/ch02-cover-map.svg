<text x="609" y="142" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" fill="#A82E70">Relieve the limiting work</text>
<text x="609" y="165" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#3E474B">point assistance / AI-native system</text>
<text x="609" y="183" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#3E474B">conventional method / no added assistance</text>
<text x="609" y="201" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#3E474B">authoritative checks remain</text>
