<text x="14" y="58" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#136680" letter-spacing="0.7">FIND THE LIMITING WORK</text>
<text x="14" y="83" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#20252B">Compounding pressures move the bottleneck</text>
<rect x="14" y="104" width="300" height="42" fill="#FDECEC" stroke="#DE3D3C" stroke-width="1.5"/>
<text x="27" y="121" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#C62A2A">Fading automatic gains</text>
<text x="27" y="139" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#3E474B">architecture must supply more</text>
<rect x="14" y="151" width="300" height="42" fill="#FDECEC" stroke="#DE3D3C" stroke-width="1.5"/>
<text x="27" y="168" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#C62A2A">Coupled design obligations</text>
<text x="27" y="186" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#3E474B">workload + software + hardware + physical</text>
<rect x="14" y="198" width="300" height="42" fill="#FDECEC" stroke="#DE3D3C" stroke-width="1.5"/>
<text x="27" y="215" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#C62A2A">Finite checking capacity</text>
<text x="27" y="233" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#3E474B">simulation + EDA + verification + review</text>
