<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 285" role="img">
  <title>Chapter 2 Stack Scope Map</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#20252B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#1683A6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#059669"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .ch-num { font-size: 11px; font-weight: 700; fill: #1683A6; letter-spacing: 1.0px; text-transform: uppercase; }
      .ch-title { font-size: 15px; font-weight: 700; fill: #20252B; }
      .box-head { font-size: 12.5px; font-weight: 700; fill: #20252B; }
      .box-sub { font-size: 11px; fill: #48535E; }
      .card-blue { fill: #E6F4F8; stroke: #1683A6; stroke-width: 1.4; rx: 0; }
      .card-purple { fill: #F2EBFB; stroke: #6A4FC7; stroke-width: 1.4; rx: 0; }
      .card-green { fill: #E7F5EC; stroke: #059669; stroke-width: 1.4; rx: 0; }
      .card-rose { fill: #FCEBF3; stroke: #DB2777; stroke-width: 1.4; rx: 0; }
      .stack-active { fill: #1683A6; stroke: #0E5C76; stroke-width: 1.0; rx: 0; }
      .stack-inactive { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1.0; rx: 0; }
      .stack-active-text { font-size: 10px; font-weight: 700; fill: #FFFFFF; }
      .stack-inactive-text { font-size: 10px; font-weight: 600; fill: #64748B; }
      .line-main { fill: none; stroke: #20252B; stroke-width: 1.8; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #1683A6; stroke-width: 1.8; marker-end: url(#arrow-blue); }
      .line-green { fill: none; stroke: #059669; stroke-width: 1.8; stroke-dasharray: 5 4; marker-end: url(#arrow-green); }
    </style>
  </defs>
  <rect class="stack-active" x="12" y="10" width="113" height="26" rx="0"/>
  <text x="68.5" y="27" text-anchor="middle" class="font stack-active-text">1. Workload</text>
  <rect class="stack-inactive" x="129" y="10" width="113" height="26" rx="0"/>
  <text x="185.5" y="27" text-anchor="middle" class="font stack-inactive-text">2. ISA &amp; ABI</text>
  <rect class="stack-active" x="246" y="10" width="113" height="26" rx="0"/>
  <text x="302.5" y="27" text-anchor="middle" class="font stack-active-text">3. Compute Org</text>
  <rect class="stack-inactive" x="363" y="10" width="113" height="26" rx="0"/>
  <text x="419.5" y="27" text-anchor="middle" class="font stack-inactive-text">4. Memory &amp; NoC</text>
  <rect class="stack-active" x="480" y="10" width="113" height="26" rx="0"/>
  <text x="536.5" y="27" text-anchor="middle" class="font stack-active-text">5. Power Intent</text>
  <rect class="stack-inactive" x="597" y="10" width="113" height="26" rx="0"/>
  <text x="653.5" y="27" text-anchor="middle" class="font stack-inactive-text">6. Compiler/RT</text>
  <rect class="stack-active" x="714" y="10" width="113" height="26" rx="0"/>
  <text x="770.5" y="27" text-anchor="middle" class="font stack-active-text">7. Physical Node</text>
  <rect class="stack-inactive" x="831" y="10" width="113" height="26" rx="0"/>
  <text x="887.5" y="27" text-anchor="middle" class="font stack-inactive-text">8. Verification</text>
  <g transform="translate(12, 48)">
    <path d="M 18 2 L 6 20 H 16 L 14 34 L 26 16 H 16 Z" fill="#E6F4F8" stroke="#D97706" stroke-width="2.0" stroke-linejoin="round"/>
  </g>
  <text x="62" y="62" class="font ch-num">CHAPTER STACK SCOPE — ACTIVE LAYERS 1, 3, 5, 7 (PHYSICAL &amp; VERIFICATION)</text>
  <text x="62" y="80" class="font ch-title">Compounding Pressures &amp; Verification Bottleneck</text>
  <rect class="card-blue" x="12" y="96" width="200" height="145" rx="0"/>
  <text x="24" y="119" class="font box-head">1. Physical Limits</text>
  <text x="24" y="140" class="font box-sub">• Dennard Scaling End</text>
  <text x="24" y="159" class="font box-sub">• Dark Silicon Thermal Wall</text>
  <text x="24" y="178" class="font box-sub">• SRAM Leakage Envelopes</text>
  <text x="24" y="197" class="font box-sub">• Sub-3nm Wire Resistance</text>
  <rect class="card-purple" x="250" y="96" width="230" height="145" rx="0"/>
  <text x="262" y="119" class="font box-head">2. Search Space</text>
  <text x="262" y="140" class="font box-sub">• 10^6 Candidate Combinations</text>
  <text x="262" y="159" class="font box-sub">• Coupled HW/SW Parameters</text>
  <text x="262" y="178" class="font box-sub">• Multi-Objective Trade-offs</text>
  <text x="262" y="197" class="font box-sub">• Non-Convex Pareto Fronts</text>
  <rect class="card-green" x="518" y="96" width="220" height="145" rx="0"/>
  <text x="530" y="119" class="font box-head">3. Sim Bottleneck</text>
  <text x="530" y="140" class="font box-sub">• Signoff P&amp;R / STA Delays</text>
  <text x="530" y="159" class="font box-sub">• Hours per Physical Run</text>
  <text x="530" y="178" class="font box-sub">• Uncalibrated Baseline Risk</text>
  <text x="530" y="197" class="font box-sub">• Compute Wall Bottlenecks</text>
  <rect class="card-rose" x="776" y="96" width="172" height="145" rx="0"/>
  <text x="788" y="119" class="font box-head">4. Scaling Gap</text>
  <text x="788" y="140" class="font box-sub">• Proposal Speed > Check Speed</text>
  <text x="788" y="159" class="font box-sub">• Verification Backlog Wall</text>
  <text x="788" y="178" class="font box-sub">• Need for AI Assistance</text>
  <text x="788" y="197" class="font box-sub">• Human Authority Limit</text>
  <path class="line-blue" d="M 212 168.5 H 250"/>
  <path class="line-main" d="M 480 168.5 H 518"/>
  <path class="line-main" d="M 738 168.5 H 776"/>
  <path class="line-green" d="M 628 241 V 258 H 365 V 241"/>
  <text x="496.5" y="272" text-anchor="middle" class="font box-sub" style="fill:#059669; font-weight:700;">Diagnostic Telemetry &amp; Requalification Loop</text>
</svg>
