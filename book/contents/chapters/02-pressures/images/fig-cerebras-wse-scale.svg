<?xml version="1.0" encoding="UTF-8"?>
<!--
  Scale drawing, 1 mm = 1.6 user units. Dimensions, not measurements, drawn to scale:
    300 mm wafer diameter; Cerebras WSE-1 die 215 x 215 mm (46,225 mm2, Cerebras 2019);
    NVIDIA V100 die 815 mm2 (Choquette et al. 2018), drawn as an area-equivalent
    square of side sqrt(815) = 28.55 mm because only its area is compared.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="540" fill="#FFFFFF"/>
  <!-- wafer: center (270, 270), r = 150 mm * 1.6 = 240 -->
  <circle cx="270" cy="270" r="240" fill="#F4F6F8" stroke="#3E474B" stroke-width="2"/>
  <!-- WSE-1: 215 mm * 1.6 = 344, centered -->
  <rect x="98" y="98" width="344" height="344" fill="#F0ECFA" stroke="#6A4FC7" stroke-width="3"/>
  <text x="270" y="258" text-anchor="middle" font-size="19" font-weight="700" fill="#59429E">Wafer-scale engine</text>
  <text x="270" y="284" text-anchor="middle" font-size="16" fill="#20252B">215 × 215 mm</text>
  <text x="270" y="306" text-anchor="middle" font-size="16" fill="#20252B">46,225 mm²</text>
  <!-- V100 die: 28.55 mm * 1.6 = 45.7, placed inside the WSE, top-left -->
  <rect x="120" y="120" width="45.7" height="45.7" fill="#1683A6" stroke="#136680" stroke-width="1.5"/>
  <line x1="165.7" y1="143" x2="200" y2="143" stroke="#136680" stroke-width="1.2"/>
  <text x="204" y="139" font-size="14" font-weight="700" fill="#136680">GPU die</text>
  <text x="204" y="156" font-size="13" fill="#20252B">815 mm² (area to scale)</text>
  <!-- wafer label -->
  <line x1="467" y1="132" x2="560" y2="66" stroke="#3E474B" stroke-width="1.2"/>
  <text x="566" y="56" font-size="15" font-weight="700" fill="#20252B">300 mm wafer</text>
  <text x="566" y="74" font-size="13" fill="#3E474B">diameter to scale</text>
  <!-- scale bar: 100 mm = 160 units -->
  <line x1="560" y1="470" x2="720" y2="470" stroke="#20252B" stroke-width="2"/>
  <line x1="560" y1="462" x2="560" y2="478" stroke="#20252B" stroke-width="2"/>
  <line x1="720" y1="462" x2="720" y2="478" stroke="#20252B" stroke-width="2"/>
  <text x="640" y="496" text-anchor="middle" font-size="14" fill="#20252B">100 mm</text>
  <!-- area ratio -->
  <text x="566" y="250" font-size="15" font-weight="700" fill="#20252B">Area ratio</text>
  <text x="566" y="272" font-size="14" fill="#20252B">46,225 / 815 ≈ 57</text>
</svg>
