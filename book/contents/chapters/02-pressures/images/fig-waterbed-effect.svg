<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 448" role="img" aria-labelledby="waterbed-title waterbed-desc">
  <title id="waterbed-title">Energy terms in a candidate-minus-baseline comparison</title>
  <desc id="waterbed-desc">Unscaled dependency diagram for a candidate compared with its baseline on the same workload and system boundary. Three boxes feed one summary box. Compute: the change in compute energy is negative, a local energy saving. Memory plus interconnect: the changes in memory and interconnect energy may rise with added traffic. Control plus leakage: the changes in control and leakage energy also enter the comparison. The summary box states that the system energy change equals the sum of the compute, memory, interconnect, control, and leakage changes, and that lower total energy requires the system energy change to be negative.</desc>
  <defs>
    <marker id="wb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .box { stroke-width: 1.7; }
      .workload { fill: #E4F1F6; stroke: #1683A6; }
      .method   { fill: #FBF0DE; stroke: #E68A17; }
      .design   { fill: #F0ECFA; stroke: #6A4FC7; }
      .neutral  { fill: #F5F8FA; stroke: #7E8B96; }
      .head { font-size: 14px; fill: #20252B; }
      .title { font-size: 15px; font-weight: 700; fill: #20252B; }
      .math { font-size: 15px; fill: #20252B; }
      .sub { font-size: 13px; fill: #444444; }
      .edge { fill: none; stroke: #333333; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#wb-arrow); }
    </style>
  </defs>

  <rect width="900" height="448" fill="#FFFFFF"/>
  <g class="font" text-anchor="middle">

    <text class="head" x="450" y="38">Candidate minus baseline</text>
    <text class="head" x="450" y="58">Same workload and system boundary</text>

    <!-- Compute -->
    <rect class="box workload" x="30" y="82" width="260" height="150"/>
    <text class="title" x="160" y="114">Compute</text>
    <text class="math" x="160" y="152">Δ<tspan font-style="italic">E</tspan><tspan dy="4" font-size="10">compute</tspan><tspan dy="-4" dx="4">&lt; 0</tspan></text>
    <text class="sub" x="160" y="196">Local energy</text>
    <text class="sub" x="160" y="214">saving</text>

    <!-- Memory + interconnect -->
    <rect class="box method" x="320" y="82" width="260" height="150"/>
    <text class="title" x="450" y="114">Memory + interconnect</text>
    <text class="math" x="450" y="144">Δ<tspan font-style="italic">E</tspan><tspan dy="4" font-size="10">memory</tspan><tspan dy="-4"></tspan></text>
    <text class="math" x="450" y="166">+ Δ<tspan font-style="italic">E</tspan><tspan dy="4" font-size="10">interconnect</tspan><tspan dy="-4"></tspan></text>
    <text class="sub" x="450" y="196">May rise with</text>
    <text class="sub" x="450" y="214">added traffic</text>

    <!-- Control + leakage -->
    <rect class="box design" x="610" y="82" width="260" height="150"/>
    <text class="title" x="740" y="114">Control + leakage</text>
    <text class="math" x="740" y="144">Δ<tspan font-style="italic">E</tspan><tspan dy="4" font-size="10">control</tspan><tspan dy="-4"></tspan></text>
    <text class="math" x="740" y="166">+ Δ<tspan font-style="italic">E</tspan><tspan dy="4" font-size="10">leakage</tspan><tspan dy="-4"></tspan></text>
    <text class="sub" x="740" y="196">Also enter the</text>
    <text class="sub" x="740" y="214">comparison</text>

    <!-- Dependencies into the system total -->
    <path class="edge" d="M 160 232 V 290"/>
    <path class="edge" d="M 450 232 V 290"/>
    <path class="edge" d="M 740 232 V 290"/>

    <!-- System total -->
    <rect class="box neutral" x="30" y="290" width="840" height="128"/>
    <text class="math" x="450" y="326">Δ<tspan font-style="italic">E</tspan><tspan dy="4" font-size="10">system</tspan><tspan dy="-4" dx="4">= Δ</tspan><tspan font-style="italic">E</tspan><tspan dy="4" font-size="10">compute</tspan><tspan dy="-4" dx="4">+ Δ</tspan><tspan font-style="italic">E</tspan><tspan dy="4" font-size="10">memory</tspan><tspan dy="-4"></tspan></text>
    <text class="math" x="450" y="350">+ Δ<tspan font-style="italic">E</tspan><tspan dy="4" font-size="10">interconnect</tspan><tspan dy="-4" dx="4">+ Δ</tspan><tspan font-style="italic">E</tspan><tspan dy="4" font-size="10">control</tspan><tspan dy="-4" dx="4">+ Δ</tspan><tspan font-style="italic">E</tspan><tspan dy="4" font-size="10">leakage</tspan><tspan dy="-4"></tspan></text>
    <text class="math" x="450" y="392">Lower total energy requires Δ<tspan font-style="italic">E</tspan><tspan dy="4" font-size="10">system</tspan><tspan dy="-4" dx="4">&lt; 0.</tspan></text>

  </g>
</svg>
