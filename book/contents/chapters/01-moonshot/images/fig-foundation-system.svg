<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" role="img"><title>A model within the surrounding design system</title><desc>The optional learned model, conventional methods, and design tools use the current experiment inputs. Evaluations are saved with their candidate and settings, and inform later experiments.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59636D"/></marker></defs>
<rect width="1000" height="505" fill="white"/>
<rect x="20" y="20" width="960" height="465" rx="4" fill="#FFFFFF" stroke="#9AA8B5" stroke-width="1.6"/>
<text x="40" y="51" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#20252B">Design system</text>
<rect x="40" y="80" width="280" height="115" rx="3" fill="#F0ECFA" stroke="#6A4FC7" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="55" y="107" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Learned model (optional)</text>
<text x="55" y="133" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Knowledge from prior designs</text>
<text x="55" y="155" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Proposals, estimates, or analysis</text>
<rect x="360" y="80" width="280" height="115" rx="3" fill="#FBF0DE" stroke="#E68A17" stroke-width="1.6"/>
<text x="375" y="107" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Experiment software</text>
<text x="375" y="133" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Conventional search and scripts</text>
<text x="375" y="155" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Select and prepare candidates</text>
<rect x="680" y="80" width="280" height="115" rx="3" fill="#F8FAFC" stroke="#9AA8B5" stroke-width="1.6"/>
<text x="695" y="107" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Engineering tools</text>
<text x="695" y="133" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Compile, simulate, implement,</text>
<text x="695" y="155" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">and check each candidate</text>
<path d="M320 137 H360" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<path d="M640 137 H680" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="300" width="430" height="135" rx="3" fill="#E4F1F6" stroke="#1683A6" stroke-width="1.6"/>
<text x="55" y="327" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Current experiment inputs</text>
<text x="55" y="353" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Requirements and workload</text>
<text x="55" y="375" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Matching hardware and software versions</text>
<text x="55" y="397" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Tool settings and process information</text>
<rect x="530" y="300" width="430" height="135" rx="3" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.6"/>
<text x="545" y="327" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Saved evaluations</text>
<text x="545" y="353" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Measurements, reports, and failed runs</text>
<text x="545" y="375" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Associated with the candidate and settings</text>
<text x="545" y="397" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Available for comparison and the next step</text>
<path d="M255 300 V245 H180 V195" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M255 245 H500 V195" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M500 245 H750 V195" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M860 195 V300" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M530 367 H470" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="500" y="468" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#59636D">The model’s learned parameters do not replace the current inputs and results.</text>
</svg>
