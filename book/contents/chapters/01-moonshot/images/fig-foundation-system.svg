<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 775" role="img">
  <title>A reusable learned component inside an AI-native architecture design system</title>
  <desc>Reusable architecture data can train or adapt an optional foundation model for several architecture tasks. Live project state remains separate and authoritative. Conventional methods, design tools, and checks interact with the learned component inside an AI-native design system. The architecture role supplies intent and constraints, reviews the supported result, and forms a supported technical recommendation. A separate commitment authority decides whether the project advances, holds, or rejects the recommendation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; fill: #20252B; }
      .head { font-size: 16px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 700; }
      .small { font-size: 12.5px; fill: #59636D; }
      .panel { fill: #F8FAFC; stroke: #9AA8B5; stroke-width: 1.4; }
      .data { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.5; }
      .model { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.5; }
      .method { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.5; }
      .evidence { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
      .decision { fill: #FBEDF4; stroke: #D24D96; stroke-width: 1.5; }
      .line { fill: none; stroke: #333333; stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .return { fill: none; stroke: #1E9E48; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }

      /* Vector Glyphs */
      .glyph-path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.4; }
      .glyph-blue { stroke: #1683A6; }
      .glyph-purple { stroke: #6A4FC7; }
      .glyph-amber { stroke: #8A5310; }
      .glyph-emerald { stroke: #1E9E48; }
      .glyph-pink { stroke: #D24D96; }
      .glyph-dark { stroke: #20252B; }
    </style>
  </defs>
  <rect width="1000" height="775" fill="#FFFFFF" y="0"/>
  <text class="font head" x="48" y="48" style="white-space: pre;">Reusable architecture knowledge</text>
  <rect class="data" x="48" y="65" width="232" height="128"/>
  <g transform="matrix(1, 0, 0, 1, 58, 81.363136)">
    <ellipse cx="6" cy="3" rx="5" ry="2" class="glyph-path glyph-blue"/>
    <path d="M 1 3 V 9 C 1 10, 11 10, 11 9 V 3" class="glyph-path glyph-blue"/>
  </g>
  <text class="font label" x="80" y="92" style="white-space: pre;">Prior projects + literature</text>
  <text class="font small" x="68" y="118" style="white-space: pre;">design artifacts + documents</text>
  <text class="font small" x="68" y="141" style="white-space: pre;">tool traces + measurements</text>
  <text class="font small" x="68" y="164" style="white-space: pre;">failures + reviewed results</text>
  <text class="font head" x="48" y="250" style="white-space: pre;">Current project record</text>
  <rect class="data" x="48" y="267" width="232" height="147"/>
  <g transform="matrix(1, 0, 0, 1, 58, 281.26767)">
    <path d="M 2 1 H 7 L 10 4 V 11 H 2 Z M 7 1 V 4 H 10" class="glyph-path glyph-blue"/>
  </g>
  <text class="font label" x="80" y="294" style="white-space: pre;">Versioned study state</text>
  <text class="font small" x="68" y="320" style="white-space: pre;">workload + software versions</text>
  <text class="font small" x="68" y="343" style="white-space: pre;">constraints + candidate identity</text>
  <text class="font small" x="68" y="366" style="white-space: pre;">tool, library + process versions</text>
  <text class="font small" x="68" y="389" style="white-space: pre;">current measurements + failures</text>
  <rect class="panel" x="326" y="40" width="626" height="464"/>
  <text class="font head" x="348" y="69" style="white-space: pre;">AI-native architecture design system</text>
  <rect class="model" x="365" y="99" width="265" height="96"/>
  <g transform="translate(378, 114)">
    <circle cx="3" cy="3" r="2.5" class="glyph-path glyph-purple"/>
    <circle cx="13" cy="3" r="2.5" class="glyph-path glyph-purple"/>
    <circle cx="8" cy="11" r="2.5" class="glyph-path glyph-purple"/>
    <line x1="3" y1="3" x2="8" y2="11" class="glyph-path glyph-purple"/>
    <line x1="13" y1="3" x2="8" y2="11" class="glyph-path glyph-purple"/>
    <line x1="3" y1="3" x2="13" y2="3" class="glyph-path glyph-purple"/>
  </g>
  <text class="font label" x="402" y="126" style="white-space: pre;">Architecture foundation model</text>
  <text class="font small" x="402" y="149" style="white-space: pre;">optional learned component</text>
  <text class="font small" x="402" y="171" style="white-space: pre;">adapted to the current task</text>
  <text class="font label" x="646" y="99" style="white-space: pre;">Architecture tasks</text>
  <path class="line" d="M 280 129 H 365"/>
  <path class="line" d="M 280 340 H 365"/>
  <path class="line" d="M 280 405 H 365"/>
  <path class="line" d="M 630 147 H 646"/>
  <rect class="model" x="646" y="114" width="267" height="35"/>
  <text class="font small" x="658" y="136" style="white-space: pre;">1. Workload analysis and classification</text>
  <rect class="model" x="646" y="158" width="267" height="35"/>
  <text class="font small" x="658" y="180" style="white-space: pre;">2. Surrogate performance prediction</text>
  <rect class="model" x="646" y="202" width="267" height="35"/>
  <text class="font small" x="658" y="224" style="white-space: pre;">3. Candidate software and RTL generation</text>
  <rect class="model" x="646" y="246" width="267" height="35"/>
  <text class="font small" x="658" y="268" style="white-space: pre;">4. Diagnostic classification of failure</text>
  <rect class="method" x="365" y="248" width="265" height="79"/>
  <g transform="translate(378, 260)">
    <rect x="0" y="0" width="16" height="12" rx="2" class="glyph-path glyph-amber"/>
    <path d="M 3 6 H 13 M 8 2 V 10" class="glyph-path glyph-amber"/>
  </g>
  <text class="font label" x="402" y="273" style="white-space: pre;">Current project record</text>
  <text class="font small" x="402" y="295" style="white-space: pre;">specifications + RTL + simulators</text>
  <text class="font small" x="402" y="313" style="white-space: pre;">+ physical design scripts</text>
  <rect class="method" x="365" y="357" width="265" height="96"/>
  <g transform="translate(378, 370)">
    <rect x="1" y="1" width="14" height="14" rx="2" class="glyph-path glyph-amber"/>
    <path d="M 5 5 L 11 11 M 11 5 L 5 11" class="glyph-path glyph-amber"/>
  </g>
  <text class="font label" x="402" y="382" style="white-space: pre;">Design tools and checks</text>
  <text class="font small" x="402" y="404" style="white-space: pre;">compilers + simulators + EDA engines</text>
  <text class="font small" x="402" y="422" style="white-space: pre;">+ formal property checkers</text>
  <text class="font small" x="402" y="440" style="white-space: pre;">+ independent verification</text>
  <rect class="evidence" x="646" y="324" width="267" height="129"/>
  <g transform="translate(660, 337)">
    <path d="M 2 14 L 6 2 L 10 9 L 14 5" class="glyph-path glyph-green"/>
  </g>
  <text class="font label" x="682" y="350" style="white-space: pre;">Empirical evidence</text>
  <text class="font small" x="658" y="372" style="white-space: pre;">tool returns + traces + DRC reports</text>
  <text class="font small" x="658" y="390" style="white-space: pre;">+ formal proofs + failed runs</text>
  <text class="font small" x="658" y="408" style="white-space: pre;">+ rejected alternatives</text>
  <text class="font small" x="658" y="434" style="white-space: pre;">updates live project state</text>
  <path class="line" d="M 630 263 H 646"/>
  <path class="line" d="M 779 281 V 324"/>
  <path class="line" d="M 630 405 H 646"/>
  <path class="return" d="M 646 439 H 620 V 484 H 315 V 340 H 280"/>
  <rect class="decision" x="508" y="534" width="444" height="88"/>
  <g transform="translate(522, 548)">
    <path d="M 95 5 L 100 7.5 L 100 11 C 100 14.5 94.831 19.785 94.831 19.785 C 94.831 19.785 90 14.5 90 11 L 90 7.5 L 95 5 Z" class="glyph-path glyph-pink"/>
  </g>
  <text class="font label" x="730" y="564" text-anchor="middle" style="white-space: pre;">Supported architecture result</text>
  <text class="font small" x="730" y="589" text-anchor="middle" style="white-space: pre;">comparison + measurements + assumptions + checks + limits</text>
  <path class="line" d="M 779 453 V 534"/>
  <rect class="panel" x="48" y="534" width="240" height="100"/>
  <g transform="translate(60, 545)">
    <circle cx="6" cy="4" r="3.5" class="glyph-path glyph-dark"/>
    <path d="M 1 13 C 1 9, 3 8, 6 8 C 9 8, 11 9, 11 13" class="glyph-path glyph-dark"/>
  </g>
  <text class="font label" x="80" y="558" style="white-space: pre;">Architecture role</text>
  <text class="font small" x="68" y="580" style="white-space: pre;">supplies intent + constraints</text>
  <text class="font small" x="68" y="602" style="white-space: pre;">reviews result and forms a</text>
  <text class="font small" x="68" y="620" style="white-space: pre;">supported recommendation</text>
  <path class="line" d="M 508 578 H 280"/>
  <path class="line" d="M 164 534 V 414"/>
  <rect class="decision" x="48" y="666" width="232" height="66"/>
  <g transform="translate(60, 678)">
    <rect x="1" y="5" width="10" height="8" fill="none" stroke="#D24D96" stroke-width="1.3"/>
    <path d="M 3 5 V 3 C 3 1.5, 9 1.5, 9 3 V 5" class="glyph-path glyph-pink"/>
  </g>
  <text class="font label" x="80" y="691" style="white-space: pre;">Commitment authority</text>
  <text class="font small" x="68" y="716" style="white-space: pre;">decides advance, hold, or reject</text>
  <path class="line" d="M 164 634 V 666"/>
  <text class="font small" x="500" y="758" text-anchor="middle" style="white-space: pre;">The moonshot is complete-system capability, not autonomous prompt-to-chip generation.</text>
</svg>
