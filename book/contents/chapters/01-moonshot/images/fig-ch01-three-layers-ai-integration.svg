  <text class="small" x="490.0" y="331" text-anchor="middle">placement (x, y)</text>
  <text class="note" x="402.0" y="368" text-anchor="middle">search changes parameter values only</text>
  <rect x="554" y="264" width="178" height="120" fill="#FBF0DE" stroke="#E68A17" stroke-width="1.4"/>
  <text class="head" x="643.0" y="282" text-anchor="middle">Closed-loop search</text>
  <text class="body" x="643.0" y="304" text-anchor="middle">Simulator or EDA tools</text>
