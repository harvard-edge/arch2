  <text class="body" x="643.0" y="334" text-anchor="middle"></text>
  <text class="body" x="643.0" y="349" text-anchor="middle">Returns best setting θ*</text>
  <text class="body" x="643.0" y="364" text-anchor="middle">found within Θ</text>
  <path class="edge" d="M 250 314 H 267"/>
  <path class="edge" d="M 536 314 H 553"/>
