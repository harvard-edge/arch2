  <text class="head" x="74" y="78" text-anchor="start">Specified by the team</text>
  <text class="item" x="74" y="98" text-anchor="start">Workload, PPA, correctness</text>
  <text class="item-open" x="74" y="115" text-anchor="start" text-decoration="line-through">Interfaces</text>
  <text class="state" x="240" y="115" text-anchor="end" fill="#157A38">open</text>
  <text class="item-open" x="74" y="132" text-anchor="start" text-decoration="line-through">Pipeline topology</text>
  <text class="state" x="240" y="132" text-anchor="end" fill="#157A38">open</text>
  <text class="item-open" x="74" y="149" text-anchor="start" text-decoration="line-through">Memory hierarchy</text>
  <text class="state" x="240" y="149" text-anchor="end" fill="#157A38">open</text>
  <text class="item-open" x="74" y="166" text-anchor="start" text-decoration="line-through">Arithmetic and datapath</text>
  <text class="state" x="240" y="166" text-anchor="end" fill="#157A38">open</text>
