  <path class="edge" d="M 250 110 H 267"/>
  <path class="edge" d="M 536 110 H 553"/>
  <path class="edge" d="M 554 136 H 537"/>
  <rect x="52" y="230" width="692" height="168" fill="#FBF0DE" stroke="#E68A17" stroke-width="1.7"/>
  <text class="layer" x="64" y="252" text-anchor="start">(b) Layer 2: Container-bound optimization</text>
  <text class="tag" x="732" y="252" text-anchor="end" fill="#8A5310">PARAMETER SEARCH IN A FIXED TEMPLATE</text>
  <rect x="64" y="264" width="186" height="120" fill="#FBF0DE" stroke="#E68A17" stroke-width="1.4"/>
  <text class="head" x="74" y="282" text-anchor="start">Specified by the team</text>
  <text class="item" x="74" y="302" text-anchor="start">Workload and PPA bounds</text>
