  <text class="small" x="314.0" y="331" text-anchor="middle">capacity θ<tspan dy="3" font-size="8">1</tspan></text>
  <rect x="362.0" y="296" width="80" height="46" fill="#F5F8FA" stroke="#7E8B96" stroke-width="1"/>
  <text class="stage" x="402.0" y="315" text-anchor="middle">Buffer</text>
  <text class="small" x="402.0" y="331" text-anchor="middle">depth θ<tspan dy="3" font-size="8">2</tspan></text>
  <rect x="450.0" y="296" width="80" height="46" fill="#F5F8FA" stroke="#7E8B96" stroke-width="1"/>
