<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 626" role="img" aria-labelledby="title-layers desc-layers">
  <title id="title-layers">Operational layers differ in what the design system may change</title>
  <desc id="desc-layers">Three stacked rows, Layer 1 at the bottom and Layer 3 at the top. Each row shows what the team specifies, what the system works on, and what returns as feedback. In Layer 1 the team specifies the whole design and the system drafts one RTL block inside a frozen pipeline, which an engineer reviews, integrates, and checks. In Layer 2 subsystem dimensions and macro placement become searchable parameters of a fixed template, and simulator or EDA feedback closes a search loop that returns the best setting found. In Layer 3 interfaces, pipeline topology, memory hierarchy, and arithmetic become open choices; the compiler schedule, instruction extensions, arithmetic format, and buffering are revised together under physical evaluation, while workload, PPA targets, and the correctness contract remain fixed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #20252B; }
      .layer { font-size: 14px; font-weight: 700; }
      .tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.7px; }
      .head { font-size: 12.5px; font-weight: 700; }
      .item { font-size: 11.5px; fill: #20252B; }
      .item-strong { font-size: 11.5px; font-weight: 700; }
      .item-open { font-size: 11.5px; fill: #7E8B96; }
      .state { font-size: 10px; font-weight: 700; letter-spacing: 0.3px; }
      .body { font-size: 11.5px; fill: #444444; }
      .stage { font-size: 10.5px; font-weight: 700; }
      .small { font-size: 10.5px; fill: #444444; }
      .small-strong { font-size: 10.5px; font-weight: 700; }
      .note { font-size: 10.5px; font-style: italic; fill: #444444; }
      .transition { font-size: 11.5px; font-style: italic; fill: #3E474B; }
      .axis { font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; fill: #3E474B; }
      .axis-end { font-size: 10px; fill: #3E474B; }
      .edge { fill: none; stroke: #333333; stroke-width: 1.6; stroke-linecap: square; marker-end: url(#arrow); }
      .edge-thin { fill: none; stroke: #333333; stroke-width: 1.2; stroke-linecap: square; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="760" height="626" fill="#FFFFFF"/>
  <rect x="52" y="26" width="692" height="168" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.7"/>
