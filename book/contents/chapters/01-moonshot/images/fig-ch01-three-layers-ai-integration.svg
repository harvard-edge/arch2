  <text class="note" x="402.0" y="170" text-anchor="middle">hardware and software revised together</text>
  <rect x="554" y="60" width="178" height="120" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.4"/>
  <text class="head" x="643.0" y="78" text-anchor="middle">Physical evaluation</text>
  <text class="body" x="643.0" y="100" text-anchor="middle">Timing, power, and layout</text>
  <text class="body" x="643.0" y="115" text-anchor="middle">checks guide revision</text>
  <text class="body" x="643.0" y="130" text-anchor="middle"></text>
  <text class="body" x="643.0" y="145" text-anchor="middle">Returns candidates,</text>
