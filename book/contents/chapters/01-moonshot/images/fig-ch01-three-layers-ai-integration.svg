<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 430" width="4.8in" height="4.3in" role="img" aria-labelledby="title-layers desc-layers">
  <title id="title-layers">Operational layers differ in permitted design changes</title>
  <desc id="desc-layers">Three rows connect inputs, permitted work, and feedback or results. Point assistance supports a local task in a human-coordinated study. Container-bound optimization searches choices encoded in a prescribed template. An AI-native design system revises hardware and software beyond that template while retaining the requirements and correctness contract. Every layer needs checks appropriate to its claims.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#59636D"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #20252B; }
      .layer { font-size: 13px; font-weight: 700; }
      .head { font-size: 11px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 11px; text-anchor: middle; }
      .note { font-size: 11px; text-anchor: middle; fill: #59636D; }
      .link { fill: none; stroke: #59636D; stroke-width: 1.2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="480" height="430" fill="#FFFFFF"/>

  <g transform="translate(0, 0)">
    <text class="layer" x="10" y="20" style="fill:#136680">(a) Layer 1: Point assistance</text>
    <g fill="#E4F1F6" stroke="#1683A6" stroke-width="1.1">
      <rect x="10" y="32" width="144" height="76" rx="3"/>
      <rect x="168" y="32" width="144" height="76" rx="3"/>
      <rect x="326" y="32" width="144" height="76" rx="3"/>
    </g>
    <text class="head" x="82" y="49">Inputs</text>
    <text class="body" x="82" y="72"><tspan x="82">Task within an</tspan><tspan x="82" dy="15">established design</tspan></text>
    <text class="head" x="240" y="49">Permitted work</text>
    <text class="body" x="240" y="72"><tspan x="240">Draft or analyze</tspan><tspan x="240" dy="15">one local artifact</tspan></text>
    <text class="head" x="398" y="49">Feedback and result</text>
    <text class="body" x="398" y="72"><tspan x="398">Engineer checks result</tspan><tspan x="398" dy="15">and selects next action</tspan></text>
    <path class="link" d="M 155 70 H 166"/>
    <path class="link" d="M 313 70 H 324"/>
  </g>

  <g transform="translate(0, 125)">
    <text class="layer" x="10" y="20" style="fill:#8A5310">(b) Layer 2: Container-bound optimization</text>
    <g fill="#FBF0DE" stroke="#E68A17" stroke-width="1.1">
      <rect x="10" y="32" width="144" height="76" rx="3"/>
      <rect x="168" y="32" width="144" height="76" rx="3"/>
      <rect x="326" y="32" width="144" height="76" rx="3"/>
    </g>
    <text class="head" x="82" y="49">Inputs</text>
    <text class="body" x="82" y="72"><tspan x="82">Workload, constraints,</tspan><tspan x="82" dy="15">and prescribed template</tspan></text>
    <text class="head" x="240" y="49">Permitted work</text>
    <text class="body" x="240" y="72"><tspan x="240">Search choices encoded</tspan><tspan x="240" dy="15">in the fixed template</tspan></text>
    <text class="head" x="398" y="49">Feedback and result</text>
    <text class="body" x="398" y="72"><tspan x="398">Tool results guide</tspan><tspan x="398" dy="15">parameter selection</tspan></text>
    <path class="link" d="M 155 70 H 166"/>
    <path class="link" d="M 313 64 H 324"/>
    <path class="link" d="M 325 82 H 314"/>
  </g>

  <g transform="translate(0, 250)">
    <text class="layer" x="10" y="20" style="fill:#157A38">(c) Layer 3: AI-native design system</text>
    <g fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.1">
      <rect x="10" y="32" width="144" height="76" rx="3"/>
      <rect x="168" y="32" width="144" height="76" rx="3"/>
      <rect x="326" y="32" width="144" height="76" rx="3"/>
    </g>
    <text class="head" x="82" y="49">Inputs</text>
    <text class="body" x="82" y="72"><tspan x="82">Requirements, limits,</tspan><tspan x="82" dy="15">and correctness contract</tspan></text>
    <text class="head" x="240" y="49">Permitted work</text>
    <text class="body" x="240" y="68"><tspan x="240">Revise hardware and</tspan><tspan x="240" dy="15">software beyond</tspan><tspan x="240" dy="15">the template</tspan></text>
    <text class="head" x="398" y="49">Feedback and result</text>
    <text class="body" x="398" y="72"><tspan x="398">Physical feedback</tspan><tspan x="398" dy="15">guides joint revision</tspan></text>
    <path class="link" d="M 155 70 H 166"/>
    <path class="link" d="M 313 64 H 324"/>
    <path class="link" d="M 325 82 H 314"/>
  </g>

  <text class="note" x="240" y="383">Each layer needs checks appropriate to its claims.</text>
  <text class="note" x="240" y="399">A study may return candidates, limits, or an unresolved result.</text>
  <text class="note" x="240" y="420">Moonshot target: a complete implementation that passes signoff.</text>
</svg>
