<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 595" role="img"><title>Three operational layers through a memory-design example</title><desc>L1 supplies a draft for the engineer. L2 repeatedly selects and evaluates cache configurations with fixed interfaces. L3 generates a new tiled organization and matching hardware and software, then uses evaluation feedback to generate and revise designs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59636D"/></marker></defs>
<rect width="1000" height="595" fill="white"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#20252B">L1  AI-Assisted: help with one task</text>
<rect x="30" y="55" width="290" height="95" rx="3" fill="#E4F1F6" stroke="#1683A6" stroke-width="1.6"/>
<text x="45" y="82" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Design choice</text>
<text x="45" y="108" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Request a cache controller</text>
<rect x="355" y="55" width="290" height="95" rx="3" fill="#F0ECFA" stroke="#6A4FC7" stroke-width="1.6"/>
<text x="370" y="82" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Automated work</text>
<text x="370" y="108" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Draft the controller</text>
<rect x="680" y="55" width="290" height="95" rx="3" fill="#FBEDF4" stroke="#D24D96" stroke-width="1.6"/>
<text x="695" y="82" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Next step</text>
<text x="695" y="108" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Engineer evaluates it</text>
<text x="695" y="130" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">and chooses the next step</text>
<path d="M320 102 H355" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M645 102 H680" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="30" y="215" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#20252B">L2  AI-Driven: search within fixed interfaces</text>
<rect x="30" y="230" width="290" height="95" rx="3" fill="#E4F1F6" stroke="#1683A6" stroke-width="1.6"/>
<text x="45" y="257" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Design choice</text>
<text x="45" y="283" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Choose cache capacity</text>
<text x="45" y="305" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">or replacement policy</text>
<rect x="355" y="230" width="290" height="95" rx="3" fill="#F0ECFA" stroke="#6A4FC7" stroke-width="1.6"/>
<text x="370" y="257" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Automated work</text>
<text x="370" y="283" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Evaluate the configuration</text>
<rect x="680" y="230" width="290" height="95" rx="3" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.6"/>
<text x="695" y="257" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Next step</text>
<text x="695" y="283" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Use the results to select</text>
<text x="695" y="305" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">another configuration</text>
<path d="M320 277 H355" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M645 277 H680" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M825 325 V351 H175 V325" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="500" y="374" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#59636D">Feedback selects another candidate</text>
<text x="30" y="415" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#20252B">L3  AI-Native: redesign hardware and software together</text>
<rect x="30" y="430" width="290" height="95" rx="3" fill="#F0ECFA" stroke="#6A4FC7" stroke-width="1.6"/>
<text x="45" y="457" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Generate an organization</text>
<text x="45" y="483" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Propose a tiled design</text>
<text x="45" y="505" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">with revised data transfers</text>
<rect x="355" y="430" width="290" height="95" rx="3" fill="#FBF0DE" stroke="#E68A17" stroke-width="1.6"/>
<text x="370" y="457" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Implement the proposal</text>
<text x="370" y="483" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Build matching hardware</text>
<text x="370" y="505" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">and software</text>
<rect x="680" y="430" width="290" height="95" rx="3" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.6"/>
<text x="695" y="457" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Evaluate the design</text>
<text x="695" y="483" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Measure behavior and cost</text>
<text x="695" y="505" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Check correctness and limits</text>
<path d="M320 477 H355" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M645 477 H680" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M825 525 V551 H175 V525" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="500" y="574" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#59636D">Feedback guides design generation and revision</text>
</svg>
