<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title-layers desc-layers">
  <title id="title-layers">Operational layers and the inversion of specification</title>
  <desc id="desc-layers">From Layer 1 to Layer 3, human structural specification is stripped away, expanding automated search from an isolated leaf slot to cross-layer closed-loop exploration grounded by physical signoff oracles.</desc>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#20252B"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#59636D"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#E68A17"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1E9E48"/>
    </marker>
    <!-- Start markers for bidirectional lines -->
    <marker id="arr-green-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1 L 0 5 L 8 9 z" fill="#1E9E48"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .axis-title { font-size: 10px; font-weight: 700; fill: #59636D; letter-spacing: 0.8px; }
      .tier-label { font-size: 13px; font-weight: 700; }
      .tier-tag { font-size: 9.5px; font-weight: 700; letter-spacing: 0.5px; }
      .box-title { font-size: 10.5px; font-weight: 700; fill: #20252B; text-anchor: middle; }
      .box-desc { font-size: 9px; fill: #3E474B; text-anchor: middle; }
      .pipe-txt { font-family: "Courier New", Courier, monospace; font-size: 10px; fill: #20252B; text-anchor: middle; font-weight: 600; }
      .knob-txt { font-size: 8.5px; font-weight: 700; fill: #8A5310; text-anchor: middle; }
      .trans-label { font-size: 9px; fill: #59636D; font-style: italic; }
    </style>
  </defs>

  <rect width="1000" height="480" fill="#FFFFFF"/>

  <g class="font">

    <!-- Left Axis: Increasing Freedom / Stripping Specification -->
    <g transform="translate(0, 0)">
      <line x1="64" y1="30" x2="64" y2="436" stroke="#59636D" stroke-width="1.5"/>
      <polygon points="60,30 68,30 64,18" fill="#59636D"/>
      <polygon points="60,436 68,436 64,448" fill="#59636D"/>

      <text x="64" y="12" text-anchor="middle" font-size="10px" font-weight="700" fill="#157A38">MAXIMAL</text>
      <text x="64" y="462" text-anchor="middle" font-size="10px" font-weight="700" fill="#59636D">MINIMAL</text>

      <text transform="translate(22, 235) rotate(-90)" class="axis-title" text-anchor="middle">
        ARCHITECTURAL FREEDOM (SPECIFICATION STRIPPED AWAY)
      </text>
    </g>

    <!-- ================= TIER 3 (TOP): LAYER 3 (AI-NATIVE / MOONSHOT) ================= -->
    <g transform="translate(120, 16)">
      <rect x="0" y="0" width="858" height="128" fill="#FFFFFF" stroke="#1E9E48" stroke-width="1.4"/>

      <!-- Tier Banner -->
      <rect x="0" y="0" width="858" height="24" fill="#E7F5EC"/>
      <text class="tier-label" x="12" y="17" fill="#157A38">(c) AI-Native (Layer 3)</text>
      <text class="tier-tag" x="846" y="17" text-anchor="end" fill="#157A38">THE MOONSHOT: ZERO IMMUTABLE STRUCTURAL TEMPLATE</text>

      <!-- Step 1: System Intent -->
      <g transform="translate(16, 32)">
        <rect x="0" y="0" width="170" height="86" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1.2"/>
        <text class="box-title" x="85" y="24">System Intent</text>
        <text class="box-desc" x="85" y="44">Workload graph &amp; golden spec</text>
        <text class="box-desc" x="85" y="62">PPA budget &amp; physical limits</text>
      </g>

      <path d="M 186 75 H 226" fill="none" stroke="#1E9E48" stroke-width="1.6" marker-end="url(#arr-green)"/>

      <!-- Step 2: Cross-Layer Co-Design Synthesis Fabric -->
      <g transform="translate(230, 30)">
        <rect x="0" y="0" width="390" height="90" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.3" stroke-dasharray="4 3"/>
        <text class="box-title" x="195" y="15" fill="#157A38">Cross-Layer Co-Design Synthesis Fabric</text>

        <!-- 2x2 interconnected modules with bidirectional co-design arrows -->
        <g transform="translate(16, 21)">
          <rect x="0" y="0" width="168" height="22" fill="#FFFFFF" stroke="#1E9E48" stroke-width="1"/>
          <text class="box-title" x="84" y="15" font-size="9.5px" fill="#157A38">Compiler / Schedule</text>

          <rect x="190" y="0" width="168" height="22" fill="#FFFFFF" stroke="#1E9E48" stroke-width="1"/>
          <text class="box-title" x="274" y="15" font-size="9.5px" fill="#157A38">Custom Vector ISA</text>

          <rect x="0" y="28" width="168" height="22" fill="#FFFFFF" stroke="#1E9E48" stroke-width="1"/>
          <text class="box-title" x="84" y="43" font-size="9.5px" fill="#157A38">Carry-Save ALU (Redundant)</text>

          <rect x="190" y="28" width="168" height="22" fill="#FFFFFF" stroke="#1E9E48" stroke-width="1"/>
          <text class="box-title" x="274" y="43" font-size="9.5px" fill="#157A38">Streaming FIFO Queues</text>

          <!-- Inter-module co-design couplings with bidirectional arrows -->
          <line x1="168" y1="11" x2="190" y2="11" stroke="#1E9E48" stroke-width="1.2" marker-start="url(#arr-green-start)" marker-end="url(#arr-green)"/>
          <line x1="168" y1="39" x2="190" y2="39" stroke="#1E9E48" stroke-width="1.2" marker-start="url(#arr-green-start)" marker-end="url(#arr-green)"/>
          <line x1="84" y1="22" x2="84" y2="28" stroke="#1E9E48" stroke-width="1.2"/>
          <line x1="274" y1="22" x2="274" y2="28" stroke="#1E9E48" stroke-width="1.2"/>
        </g>

        <text x="195" y="82" font-size="8px" fill="#157A38" text-anchor="middle" font-style="italic">Unconstrained joint HW/SW, arithmetic, and interface co-adaptation</text>
      </g>

      <!-- Bidirectional loop arrows -->
      <path d="M 620 63 H 654" fill="none" stroke="#1E9E48" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <path d="M 654 87 H 620" fill="none" stroke="#1E9E48" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- Step 3: Physical Oracles -->
      <g transform="translate(656, 32)">
        <rect x="0" y="0" width="186" height="86" fill="#FFFFFF" stroke="#1E9E48" stroke-width="1.3"/>
        <text class="box-title" x="93" y="19" fill="#157A38">Physical Signoff Oracles</text>
        <text class="box-desc" x="93" y="34" font-weight="600">STA • DRC/LVS • LEC/FPV</text>
        <text class="box-desc" x="93" y="47" font-weight="600">CDC • Dynamic IR-Drop</text>
        <line x1="18" y1="54" x2="168" y2="54" stroke="#D5DEE3" stroke-width="0.9"/>
        <text class="box-title" x="93" y="69" font-size="10.5px" fill="#157A38">Signed-Off Silicon</text>
        <text class="box-desc" x="93" y="80" font-size="8px">Tapeout-ready physical signoff</text>
      </g>
    </g>

    <!-- Transition guide: L2 to L3 (pointing upward) -->
    <path d="M 535 166 V 150" fill="none" stroke="#59636D" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#arr-gray)"/>
    <text class="trans-label" x="546" y="161">Container dissolved: cross-layer co-adaptation across SW and silicon ↑</text>

    <!-- ================= TIER 2 (MIDDLE): LAYER 2 (AI-DRIVEN) ================= -->
    <g transform="translate(120, 172)">
      <rect x="0" y="0" width="858" height="128" fill="#FFFFFF" stroke="#E68A17" stroke-width="1.3"/>

      <!-- Tier Banner -->
      <rect x="0" y="0" width="858" height="24" fill="#FBF0DE"/>
      <text class="tier-label" x="12" y="17" fill="#8A5310">(b) AI-Driven (Layer 2)</text>
      <text class="tier-tag" x="846" y="17" text-anchor="end" fill="#8A5310">PARAMETER SEARCH IN IMMUTABLE CONTAINER (Θ)</text>

      <!-- Step 1: Workload -->
      <g transform="translate(16, 32)">
        <rect x="0" y="0" width="170" height="86" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1.2"/>
        <text class="box-title" x="85" y="26">Fixed Workload &amp; Spec</text>
        <text class="box-desc" x="85" y="46">Target binary &amp; PPA targets</text>
        <text class="box-desc" x="85" y="64">Frozen interface contracts</text>
      </g>

      <path d="M 186 75 H 226" fill="none" stroke="#59636D" stroke-width="1.5" marker-end="url(#arr-gray)"/>

      <!-- Step 2: Fixed Container with Parameter Knobs -->
      <g transform="translate(230, 30)">
        <rect x="0" y="0" width="390" height="90" fill="#FBF0DE" stroke="#E68A17" stroke-width="1.4"/>
        <text class="box-title" x="195" y="17" fill="#8A5310">Fixed Architectural Template Θ (Container-Bound)</text>

        <!-- Knob 1: Cache Capacity -->
        <g transform="translate(70, 45)">
          <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#E68A17" stroke-width="1.3"/>
          <line x1="0" y1="0" x2="8" y2="-8" stroke="#8A5310" stroke-width="1.8"/>
          <text class="knob-txt" x="0" y="23">Cache Cap. θ</text>
        </g>

        <!-- Knob 2: Buffer Depth -->
        <g transform="translate(195, 45)">
          <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#E68A17" stroke-width="1.3"/>
          <line x1="0" y1="0" x2="8" y2="-8" stroke="#8A5310" stroke-width="1.8"/>
          <text class="knob-txt" x="0" y="23">Buffer Depth θ</text>
        </g>

        <!-- Knob 3: Macro Floorplan -->
        <g transform="translate(320, 45)">
          <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#E68A17" stroke-width="1.3"/>
          <line x1="0" y1="0" x2="8" y2="-8" stroke="#8A5310" stroke-width="1.8"/>
          <text class="knob-txt" x="0" y="23">Macro (x,y)</text>
        </g>

        <text x="195" y="85" font-size="8.5px" fill="#8A5310" text-anchor="middle" font-weight="600">Trapped by Memory Bandwidth Wall &amp; Routing Congestion</text>
      </g>

      <!-- Bidirectional loop arrows -->
      <path d="M 620 63 H 654" fill="none" stroke="#E68A17" stroke-width="1.5" marker-end="url(#arr-orange)"/>
      <path d="M 654 87 H 620" fill="none" stroke="#E68A17" stroke-width="1.5" marker-end="url(#arr-orange)"/>

      <!-- Step 3: Evaluator Loop -->
      <g transform="translate(656, 32)">
        <rect x="0" y="0" width="186" height="86" fill="#FFFFFF" stroke="#E68A17" stroke-width="1.3"/>
        <text class="box-title" x="93" y="20" fill="#8A5310">Closed-Loop Optimizer</text>
        <text class="box-desc" x="93" y="35">RL / Bayesian sweep (AlphaChip)</text>
        <text class="box-desc" x="93" y="48">Cycle sim &amp; fast EDA surrogates</text>
        <line x1="18" y1="54" x2="168" y2="54" stroke="#D5DEE3" stroke-width="0.9"/>
        <text class="box-title" x="93" y="69" font-size="10.5px" fill="#8A5310">Local Optimum θ*</text>
        <text class="box-desc" x="93" y="80" font-size="8px">Bounded by template perimeter</text>
      </g>
    </g>

    <!-- Transition guide: L1 to L2 (pointing upward) -->
    <path d="M 535 322 V 306" fill="none" stroke="#59636D" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#arr-gray)"/>
    <text class="trans-label" x="546" y="317">Parameters automated: numerical optimization within frozen topology ↑</text>

    <!-- ================= TIER 1 (BOTTOM): LAYER 1 (AI-ASSISTED) ================= -->
    <g transform="translate(120, 328)">
      <rect x="0" y="0" width="858" height="128" fill="#FFFFFF" stroke="#1683A6" stroke-width="1.3"/>

      <!-- Tier Banner -->
      <rect x="0" y="0" width="858" height="24" fill="#E4F1F6"/>
      <text class="tier-label" x="12" y="17" fill="#136680">(a) AI-Assisted (Layer 1)</text>
      <text class="tier-tag" x="846" y="17" text-anchor="end" fill="#136680">LOCALIZED POINT ASSISTANCE IN FROZEN LEGACY CONTEXT</text>

      <!-- Step 1: Human Task Query -->
      <g transform="translate(16, 32)">
        <rect x="0" y="0" width="170" height="86" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1.2"/>
        <text class="box-title" x="85" y="24">Task Prompt</text>
        <text class="box-desc" x="85" y="44">"Draft leaf RTL / testbench"</text>
        <text class="box-desc" x="85" y="62">within frozen human SoC</text>
      </g>

      <path d="M 186 75 H 226" fill="none" stroke="#59636D" stroke-width="1.5" marker-end="url(#arr-gray)"/>

      <!-- Step 2: Frozen Architecture with Tiny AI Slot -->
      <g transform="translate(230, 30)">
        <rect x="0" y="0" width="390" height="90" fill="#E4F1F6" stroke="#1683A6" stroke-width="1.3"/>
        <text class="box-title" x="195" y="17" fill="#136680">Human-Frozen Architecture (Rigid SoC)</text>

        <!-- 5-stage pipeline -->
        <g transform="translate(57, 25)">
          <!-- Fetch with AI slot -->
          <rect x="0" y="0" width="56" height="46" fill="#FFFFFF" stroke="#1683A6" stroke-width="1.1"/>
          <text class="pipe-txt" x="28" y="15">Fetch</text>
          <rect x="4" y="21" width="48" height="20" fill="#E4F1F6" stroke="#1683A6" stroke-width="0.9" stroke-dasharray="2 2"/>
          <text class="box-desc" x="28" y="34" font-size="8px" font-weight="700" fill="#136680">AI Leaf</text>

          <line x1="56" y1="23" x2="62" y2="23" stroke="#59636D" stroke-width="1" marker-end="url(#arr-gray)"/>

          <rect x="62" y="0" width="46" height="46" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1"/>
          <text class="pipe-txt" x="85" y="27">Decode</text>

          <rect x="114" y="0" width="50" height="46" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1"/>
          <text class="pipe-txt" x="139" y="27">Execute</text>

          <rect x="170" y="0" width="46" height="46" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1"/>
          <text class="pipe-txt" x="193" y="27">Mem</text>

          <rect x="222" y="0" width="44" height="46" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1"/>
          <text class="pipe-txt" x="244" y="27">WB</text>
        </g>

        <text x="195" y="85" font-size="8.5px" fill="#59636D" text-anchor="middle" font-style="italic">Fixed Interfaces • Frozen Microarchitecture • Open-Loop</text>
      </g>

      <path d="M 620 75 H 654" fill="none" stroke="#59636D" stroke-width="1.5" marker-end="url(#arr-gray)"/>

      <!-- Step 3: Isolated Output -->
      <g transform="translate(656, 32)">
        <rect x="0" y="0" width="186" height="86" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1.2"/>
        <text class="box-title" x="93" y="19">Syntactic Candidate</text>
        <text class="box-desc" x="93" y="33">Drafted Verilog without proof</text>
        <text class="box-desc" x="93" y="46" font-size="8px" fill="#C62A2A">Potential CDC &amp; timing flaws</text>
        <line x1="18" y1="54" x2="168" y2="54" stroke="#D5DEE3" stroke-width="0.9"/>
        <text class="box-title" x="93" y="69" font-size="10.5px">Manual Integration Tax</text>
        <text class="box-desc" x="93" y="80" font-size="8px">Human rewiring, lint &amp; signoff</text>
      </g>
    </g>

  </g>
</svg>
