<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title-layers desc-layers">
  <title id="title-layers">Operational layers and the inversion of specification</title>
  <desc id="desc-layers">From Layer 1 to Layer 3, human structural specification is stripped away, expanding automated search from an isolated leaf slot to cross-layer closed-loop exploration.</desc>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#20252B"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#59636D"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#E68A17"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1E9E48"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .axis-title { font-size: 10.5px; font-weight: 700; fill: #59636D; letter-spacing: 0.8px; }
      .tier-label { font-size: 13px; font-weight: 700; fill: #20252B; }
      .tier-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
      .box-title { font-size: 11px; font-weight: 700; fill: #20252B; text-anchor: middle; }
      .box-desc { font-size: 9.5px; fill: #3E474B; text-anchor: middle; }
      .pipe-txt { font-family: "Courier New", Courier, monospace; font-size: 10px; fill: #20252B; text-anchor: middle; font-weight: 600; }
      .knob-txt { font-size: 9px; font-weight: 700; fill: #8A5310; text-anchor: middle; }
      .trans-label { font-size: 9.5px; fill: #59636D; font-style: italic; }
    </style>
  </defs>

  <rect width="960" height="480" fill="#FFFFFF"/>

  <g class="font">

    <!-- Left Axis: Increasing Freedom / Stripping Specification -->
    <g transform="translate(30, 20)">
      <line x1="20" y1="20" x2="20" y2="420" stroke="#59636D" stroke-width="1.5"/>
      <polygon points="16,20 24,20 20,10" fill="#59636D"/>
      <polygon points="16,420 24,420 20,430" fill="#59636D"/>

      <text x="20" y="2" text-anchor="middle" font-size="9.5px" font-weight="700" fill="#157A38">MAXIMAL</text>
      <text x="20" y="444" text-anchor="middle" font-size="9.5px" font-weight="700" fill="#59636D">MINIMAL</text>

      <text transform="translate(5, 220) rotate(-90)" class="axis-title" text-anchor="middle">
        ARCHITECTURAL FREEDOM (SPECIFICATION STRIPPED AWAY)
      </text>
    </g>

    <!-- ================= TIER 3 (TOP): LAYER 3 (AI-NATIVE / MOONSHOT) ================= -->
    <g transform="translate(90, 20)">
      <rect x="0" y="0" width="840" height="126" fill="#FFFFFF" stroke="#1E9E48" stroke-width="1.4"/>

      <!-- Tier Banner -->
      <rect x="0" y="0" width="840" height="24" fill="#E7F5EC"/>
      <text class="tier-label" x="12" y="17" fill="#157A38">(c) AI-Native (Layer 3)</text>
      <text class="tier-tag" x="828" y="17" text-anchor="end" fill="#157A38">THE MOONSHOT HORIZON: ZERO STRUCTURAL TEMPLATE</text>

      <!-- Step 1: System Intent -->
      <g transform="translate(20, 37)">
        <rect x="0" y="0" width="160" height="76" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1.2"/>
        <text class="box-title" x="80" y="24">System Intent</text>
        <text class="box-desc" x="80" y="42">Workload graph</text>
        <text class="box-desc" x="80" y="58">PPA limits &amp; golden spec</text>
      </g>

      <path d="M 180 75 H 230" fill="none" stroke="#1E9E48" stroke-width="1.6" marker-end="url(#arr-green)"/>

      <!-- Step 2: Cross-Layer Co-Design Loop (Open Container) -->
      <g transform="translate(240, 35)">
        <rect x="0" y="0" width="350" height="80" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.3" stroke-dasharray="4 3"/>
        <text class="box-title" x="175" y="18" fill="#157A38">Cross-Layer Closed-Loop Exploration</text>

        <rect x="15" y="25" width="152" height="23" fill="#FFFFFF" stroke="#1E9E48" stroke-width="0.9"/>
        <text class="box-title" x="91" y="40" font-size="10px" fill="#157A38">Compiler / Schedule</text>

        <rect x="183" y="25" width="152" height="23" fill="#FFFFFF" stroke="#1E9E48" stroke-width="0.9"/>
        <text class="box-title" x="259" y="40" font-size="10px" fill="#157A38">Custom Vector ISA</text>

        <rect x="15" y="51" width="152" height="23" fill="#FFFFFF" stroke="#1E9E48" stroke-width="0.9"/>
        <text class="box-title" x="91" y="66" font-size="10px" fill="#157A38">Carry-Save ALU</text>

        <rect x="183" y="51" width="152" height="23" fill="#FFFFFF" stroke="#1E9E48" stroke-width="0.9"/>
        <text class="box-title" x="259" y="66" font-size="10px" fill="#157A38">Streaming FIFOs</text>
      </g>

      <!-- Bidirectional loop arrows -->
      <path d="M 590 63 H 640" fill="none" stroke="#1E9E48" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <path d="M 640 87 H 590" fill="none" stroke="#1E9E48" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- Step 3: Physical Oracles -->
      <g transform="translate(650, 37)">
        <rect x="0" y="0" width="170" height="76" fill="#FFFFFF" stroke="#1E9E48" stroke-width="1.2"/>
        <text class="box-title" x="85" y="21" fill="#157A38">Physical Oracles</text>
        <text class="box-desc" x="85" y="35">STA • DRC • LEC • CDC</text>
        <line x1="25" y1="44" x2="145" y2="44" stroke="#D5DEE3" stroke-width="0.9"/>
        <text class="box-title" x="85" y="60" font-size="10.5px" fill="#157A38">Signed-Off Silicon</text>
      </g>
    </g>

    <!-- Transition guide: L3 to L2 -->
    <path d="M 510 146 V 162" fill="none" stroke="#9AA8B5" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-gray)"/>
    <text class="trans-label" x="525" y="157">Structural container stripped away ↑</text>

    <!-- ================= TIER 2 (MIDDLE): LAYER 2 (AI-DRIVEN) ================= -->
    <g transform="translate(90, 168)">
      <rect x="0" y="0" width="840" height="126" fill="#FFFFFF" stroke="#E68A17" stroke-width="1.3"/>

      <!-- Tier Banner -->
      <rect x="0" y="0" width="840" height="24" fill="#FBF0DE"/>
      <text class="tier-label" x="12" y="17" fill="#8A5310">(b) AI-Driven (Layer 2)</text>
      <text class="tier-tag" x="828" y="17" text-anchor="end" fill="#8A5310">PARAMETER SEARCH IN IMMUTABLE CONTAINER (Θ)</text>

      <!-- Step 1: Workload -->
      <g transform="translate(20, 37)">
        <rect x="0" y="0" width="160" height="76" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1.2"/>
        <text class="box-title" x="80" y="32">Fixed Workload</text>
        <text class="box-desc" x="80" y="50">Target binary &amp; constraints</text>
      </g>

      <path d="M 180 75 H 230" fill="none" stroke="#59636D" stroke-width="1.5" marker-end="url(#arr-gray)"/>

      <!-- Step 2: Fixed Container with Parameter Knobs -->
      <g transform="translate(240, 35)">
        <rect x="0" y="0" width="350" height="80" fill="#FBF0DE" stroke="#E68A17" stroke-width="1.3"/>
        <text class="box-title" x="175" y="18" fill="#8A5310">Fixed Architectural Template Θ</text>

        <!-- Knob 1: Cache -->
        <g transform="translate(75, 45)">
          <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#E68A17" stroke-width="1.2"/>
          <line x1="0" y1="0" x2="8" y2="-8" stroke="#8A5310" stroke-width="1.6"/>
          <text class="knob-txt" x="0" y="24">Cache θ</text>
        </g>

        <!-- Knob 2: Predictor -->
        <g transform="translate(175, 45)">
          <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#E68A17" stroke-width="1.2"/>
          <line x1="0" y1="0" x2="8" y2="-8" stroke="#8A5310" stroke-width="1.6"/>
          <text class="knob-txt" x="0" y="24">TAGE θ</text>
        </g>

        <!-- Knob 3: Macro Floorplan -->
        <g transform="translate(275, 45)">
          <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#E68A17" stroke-width="1.2"/>
          <line x1="0" y1="0" x2="8" y2="-8" stroke="#8A5310" stroke-width="1.6"/>
          <text class="knob-txt" x="0" y="24">Macro (x,y)</text>
        </g>
      </g>

      <!-- Bidirectional loop arrows -->
      <path d="M 590 63 H 640" fill="none" stroke="#E68A17" stroke-width="1.5" marker-end="url(#arr-orange)"/>
      <path d="M 640 87 H 590" fill="none" stroke="#E68A17" stroke-width="1.5" marker-end="url(#arr-orange)"/>

      <!-- Step 3: Evaluator Loop -->
      <g transform="translate(650, 37)">
        <rect x="0" y="0" width="170" height="76" fill="#FFFFFF" stroke="#E68A17" stroke-width="1.2"/>
        <text class="box-title" x="85" y="21" fill="#8A5310">Closed-Loop Search</text>
        <text class="box-desc" x="85" y="35">Simulator / EDA sweep</text>
        <line x1="25" y1="44" x2="145" y2="44" stroke="#D5DEE3" stroke-width="0.9"/>
        <text class="box-title" x="85" y="60" font-size="10.5px" fill="#8A5310">Optimal Config θ*</text>
      </g>
    </g>

    <!-- Transition guide: L2 to L1 -->
    <path d="M 510 294 V 310" fill="none" stroke="#9AA8B5" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-gray)"/>
    <text class="trans-label" x="525" y="305">Parameters automated ↑</text>

    <!-- ================= TIER 1 (BOTTOM): LAYER 1 (AI-ASSISTED) ================= -->
    <g transform="translate(90, 316)">
      <rect x="0" y="0" width="840" height="126" fill="#FFFFFF" stroke="#1683A6" stroke-width="1.3"/>

      <!-- Tier Banner -->
      <rect x="0" y="0" width="840" height="24" fill="#E4F1F6"/>
      <text class="tier-label" x="12" y="17" fill="#136680">(a) AI-Assisted (Layer 1)</text>
      <text class="tier-tag" x="828" y="17" text-anchor="end" fill="#136680">POINT ASSISTANCE IN FROZEN CONTEXT</text>

      <!-- Step 1: Human Task Query -->
      <g transform="translate(20, 37)">
        <rect x="0" y="0" width="160" height="76" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1.2"/>
        <text class="box-title" x="80" y="24">Human Task Query</text>
        <text class="box-desc" x="80" y="42">"Draft branch predictor"</text>
        <text class="box-desc" x="80" y="58">within frozen SoC</text>
      </g>

      <path d="M 180 75 H 230" fill="none" stroke="#59636D" stroke-width="1.5" marker-end="url(#arr-gray)"/>

      <!-- Step 2: Frozen Architecture with Tiny AI Slot -->
      <g transform="translate(240, 35)">
        <rect x="0" y="0" width="350" height="80" fill="#E4F1F6" stroke="#1683A6" stroke-width="1.3"/>
        <text class="box-title" x="175" y="18" fill="#136680">Human-Frozen Architecture</text>

        <!-- 5-stage pipeline perfectly centered -->
        <g transform="translate(35, 25)">
          <!-- Fetch with AI slot -->
          <rect x="0" y="0" width="55" height="46" fill="#FFFFFF" stroke="#1683A6" stroke-width="1" stroke-dasharray="2 2"/>
          <text class="pipe-txt" x="27" y="16">Fetch</text>
          <rect x="4" y="23" width="47" height="18" fill="#E4F1F6" stroke="#1683A6" stroke-width="0.8"/>
          <text class="box-desc" x="27" y="35" font-size="8px" font-weight="700" fill="#136680">AI Leaf</text>

          <rect x="62" y="0" width="48" height="46" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1"/>
          <text class="pipe-txt" x="86" y="27">Decode</text>

          <rect x="117" y="0" width="52" height="46" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1"/>
          <text class="pipe-txt" x="143" y="27">Execute</text>

          <rect x="176" y="0" width="50" height="46" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1"/>
          <text class="pipe-txt" x="201" y="27">Mem</text>

          <rect x="233" y="0" width="48" height="46" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1"/>
          <text class="pipe-txt" x="257" y="27">WB</text>
        </g>
      </g>

      <path d="M 590 75 H 640" fill="none" stroke="#59636D" stroke-width="1.5" marker-end="url(#arr-gray)"/>

      <!-- Step 3: Isolated Output -->
      <g transform="translate(650, 37)">
        <rect x="0" y="0" width="170" height="76" fill="#FFFFFF" stroke="#D5DEE3" stroke-width="1.2"/>
        <text class="box-title" x="85" y="21">Isolated Candidate</text>
        <text class="box-desc" x="85" y="35">Drafted code snippet</text>
        <line x1="25" y1="44" x2="145" y2="44" stroke="#D5DEE3" stroke-width="0.9"/>
        <text class="box-title" x="85" y="60" font-size="10.5px">Manual Integration</text>
      </g>
    </g>

  </g>
</svg>
