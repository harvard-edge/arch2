  <text class="item" x="74" y="336" text-anchor="start">Pipeline topology</text>
  <text class="item-open" x="74" y="353" text-anchor="start" text-decoration="line-through">Subsystem sizes</text>
  <text class="state" x="240" y="353" text-anchor="end" fill="#8A5310">searched</text>
