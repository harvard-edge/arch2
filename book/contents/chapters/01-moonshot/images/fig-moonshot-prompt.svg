<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 505" width="4.8in" height="5.05in" role="img" aria-labelledby="title desc">
  <title id="title">The Lighthouse request, design decisions, and evaluations</title>
  <desc id="desc">A compact Lighthouse request expands into eight coupled domains: workload, ISA and ABI, compute organization, memory, power, software, physical constraints, and verification. These choices determine design experiments. Inputs pass through methods and tools to results and engineering review, which can lead to further experiments.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #20252B; }
      .heading { font-size: 13px; font-weight: 700; }
      .label { font-size: 12px; font-weight: 700; }
      .body { font-size: 11px; }
      .panel { fill: #F5F8FA; stroke: #7E8B96; stroke-width: 1.1; }
      .box { stroke-width: 1.1; }
      .flow { fill: none; stroke: #333333; stroke-width: 1.2; stroke-linecap: square; }
      .feedback { fill: none; stroke: #333333; stroke-width: 1.2; stroke-linecap: square; }
    </style>
  </defs>
  <rect width="480" height="505" fill="#FFFFFF"/>
  <rect class="panel" x="8" y="8" width="464" height="101"/>
  <text class="heading" x="20" y="28">Lighthouse prompt</text>
  <text class="body" x="20" y="47">64-bit RISC-V compute for XRBench-class real-time mobile XR</text>
  <text class="body" x="20" y="63">Vector-capable CPU, accelerator, or SoC block</text>
  <text class="body" x="20" y="79">3 W TDP target in a 3 nm-class low-power process</text>
  <text class="body" x="20" y="95">Report the tested candidates and their trade-offs.</text>
  <path class="flow" d="M 240 109 V 122" marker-end="url(#arrow)"/>
  <text class="heading" x="240" y="136" text-anchor="middle">Eight coupled domains: choices and constraints</text>

  <rect class="box" x="8" y="145" width="224" height="48" fill="#E4F1F6" stroke="#1683A6"/>
  <text class="label" x="20" y="165">XRBench workload</text>
  <text class="body" x="20" y="182">Multi-model streams, deadlines</text>
  <rect class="box" x="248" y="145" width="224" height="48" fill="#F0ECFA" stroke="#6A4FC7"/>
  <text class="label" x="260" y="165">ISA and ABI contract</text>
  <text class="body" x="260" y="182">Baseline, extensions, compatibility</text>

  <rect class="box" x="8" y="201" width="224" height="48" fill="#F0ECFA" stroke="#6A4FC7"/>
  <text class="label" x="20" y="221">CPU / accelerator / SoC block</text>
  <text class="body" x="20" y="238">Partitioning, vectors, interfaces</text>
  <rect class="box" x="248" y="201" width="224" height="48" fill="#F0ECFA" stroke="#6A4FC7"/>
  <text class="label" x="260" y="221">Memory and data movement</text>
  <text class="body" x="260" y="238">Locality, hierarchy, interconnect energy</text>

  <rect class="box" x="8" y="257" width="224" height="48" fill="#FDECEC" stroke="#DE3D3C"/>
  <text class="label" x="20" y="277">3 W power envelope</text>
  <text class="body" x="20" y="294">Activity, sustained power, temperature</text>
  <rect class="box" x="248" y="257" width="224" height="48" fill="#FBF0DE" stroke="#E68A17"/>
  <text class="label" x="260" y="277">Compiler/runtime stack</text>
  <text class="body" x="260" y="294">Code generation, libraries, deployment</text>

  <rect class="box" x="8" y="313" width="224" height="48" fill="#FDECEC" stroke="#DE3D3C"/>
  <text class="label" x="20" y="333">3 nm-class physical constraints</text>
  <text class="body" x="20" y="350">Process, timing, leakage, signoff</text>
  <rect class="box" x="248" y="313" width="224" height="48" fill="#E7F5EC" stroke="#1E9E48"/>
  <text class="label" x="260" y="333">Reliability and verification</text>
  <text class="body" x="260" y="350">Correctness, corner cases, rejection</text>

  <path class="flow" d="M 240 361 V 384" marker-end="url(#arrow)"/>
  <rect class="panel" x="8" y="386" width="464" height="111"/>
  <text class="heading" x="20" y="404">Evaluate the choices</text>
  <text class="body" x="20" y="420">Simulate workloads, implement candidates, and check correctness.</text>
  <rect class="box" x="20" y="431" width="92" height="34" fill="#E4F1F6" stroke="#1683A6"/>
  <text class="body" x="66" y="452" text-anchor="middle">Inputs</text>
  <path class="flow" d="M 112 448 H 136" marker-end="url(#arrow)"/>
  <rect class="box" x="136" y="431" width="92" height="34" fill="#FBF0DE" stroke="#E68A17"/>
  <text class="body" x="182" y="445" text-anchor="middle">Methods</text>
  <text class="body" x="182" y="459" text-anchor="middle">+ tools</text>
  <path class="flow" d="M 228 448 H 252" marker-end="url(#arrow)"/>
  <rect class="box" x="252" y="431" width="92" height="34" fill="#E7F5EC" stroke="#1E9E48"/>
  <text class="body" x="298" y="452" text-anchor="middle">Results</text>
  <path class="flow" d="M 344 448 H 368" marker-end="url(#arrow)"/>
  <rect class="box" x="368" y="431" width="92" height="34" fill="#FBEDF4" stroke="#D24D96"/>
  <text class="body" x="414" y="445" text-anchor="middle">Engineering</text>
  <text class="body" x="414" y="459" text-anchor="middle">review</text>
  <path class="feedback" d="M 414 465 V 482 H 66 V 465" marker-end="url(#arrow)"/>
  <rect x="128" y="475" width="224" height="16" fill="#F5F8FA"/>
  <text class="body" x="240" y="486" text-anchor="middle">Revise choices and run further experiments</text>
</svg>
