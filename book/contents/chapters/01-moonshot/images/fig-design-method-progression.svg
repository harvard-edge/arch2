<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 455" width="4.8in" height="4.55in" role="img" aria-labelledby="title desc">
  <title id="title">Design abstractions, implementations, and checks</title>
  <desc id="desc">Four established design methods are arranged in two rows. Each connects design intent to an implementation and dependable checking tools. A separate proposed AI-native design system connects system intent and current design inputs to methods, tools, checks, and evaluated alternatives.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #20252B; }
      .heading { font-size: 13px; font-weight: 700; }
      .body { font-size: 11px; }
      .note { font-size: 11px; fill: #3E474B; }
      .card { stroke-width: 1.1; }
      .divider { stroke: #FFFFFF; stroke-opacity: 0.9; stroke-width: 1; }
      .flow { fill: none; stroke: #333333; stroke-width: 1.2; stroke-linecap: square; }
    </style>
  </defs>
  <rect width="480" height="455" fill="#FFFFFF"/>
  <text class="heading" x="240" y="20" text-anchor="middle">Established shifts in design practice</text>

  <rect class="card" x="8" y="32" width="224" height="118" fill="#E4F1F6" stroke="#1683A6"/>
  <text class="heading" x="20" y="50">Mead–Conway VLSI</text>
  <text class="body" x="20" y="77">Chip + layout intent</text>
  <text class="body" x="20" y="93">→ scalable VLSI layout</text>
  <line class="divider" x1="20" y1="103" x2="220" y2="103"/>
  <text class="note" x="20" y="120">Design rules + tools</text>
  <text class="note" x="20" y="136">+ fabrication access</text>

  <rect class="card" x="248" y="32" width="224" height="118" fill="#FBF0DE" stroke="#E68A17"/>
  <text class="heading" x="260" y="50">RISC</text>
  <text class="body" x="260" y="77">Workload + software needs</text>
  <text class="body" x="260" y="93">→ hardware–software contract</text>
  <line class="divider" x1="260" y1="103" x2="460" y2="103"/>
  <text class="note" x="260" y="120">Architectural principles</text>
  <text class="note" x="260" y="136">+ quantitative tests</text>

  <rect class="card" x="8" y="162" width="224" height="118" fill="#F0ECFA" stroke="#6A4FC7"/>
  <text class="heading" x="20" y="180">RTL logic synthesis</text>
  <text class="body" x="20" y="207">Register-transfer behavior</text>
  <text class="body" x="20" y="223">→ gate-level implementation</text>
  <line class="divider" x1="20" y1="233" x2="220" y2="233"/>
  <text class="note" x="20" y="250">Timing analysis</text>
  <text class="note" x="20" y="266">+ equivalence checking</text>

  <rect class="card" x="248" y="162" width="224" height="118" fill="#E7F5EC" stroke="#1E9E48"/>
  <text class="heading" x="260" y="180">Reusable generators</text>
  <text class="body" x="260" y="207">Parameters + design intent</text>
  <text class="body" x="260" y="223">→ reusable design family</text>
  <line class="divider" x1="260" y1="233" x2="460" y2="233"/>
  <text class="note" x="260" y="250">Explicit constraints</text>
  <text class="note" x="260" y="266">+ implementation checks</text>

  <text class="body" x="240" y="301" text-anchor="middle">Each abstraction gained value through repeatable ways</text>
  <text class="body" x="240" y="317" text-anchor="middle">to produce implementations and check them.</text>

  <rect x="8" y="333" width="464" height="112" fill="#F5F8FA" stroke="#6A4FC7" stroke-width="1.1" stroke-dasharray="5 3"/>
  <text class="heading" x="240" y="352" text-anchor="middle">Proposed AI-native design system</text>
  <text class="note" x="240" y="368" text-anchor="middle">Research ambition</text>
  <rect x="20" y="381" width="132" height="52" fill="#E4F1F6" stroke="#1683A6"/>
  <text class="body" x="86" y="395" text-anchor="middle">System intent</text>
  <text class="body" x="86" y="410" text-anchor="middle">+ current</text>
  <text class="body" x="86" y="425" text-anchor="middle">design inputs</text>
  <path class="flow" d="M 152 407 H 174" marker-end="url(#arrow)"/>
  <rect x="174" y="381" width="132" height="52" fill="#FBF0DE" stroke="#E68A17"/>
  <text class="body" x="240" y="395" text-anchor="middle">Learned + conventional</text>
  <text class="body" x="240" y="410" text-anchor="middle">methods, tools,</text>
  <text class="body" x="240" y="425" text-anchor="middle">and checks</text>
  <path class="flow" d="M 306 407 H 328" marker-end="url(#arrow)"/>
  <rect x="328" y="381" width="132" height="52" fill="#E7F5EC" stroke="#1E9E48"/>
  <text class="body" x="394" y="395" text-anchor="middle">Evaluated alternatives</text>
  <text class="body" x="394" y="410" text-anchor="middle">power, performance,</text>
  <text class="body" x="394" y="425" text-anchor="middle">area, and limits</text>
</svg>
