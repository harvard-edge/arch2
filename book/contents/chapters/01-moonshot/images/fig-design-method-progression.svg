<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Design methods that widened what engineers could express, produce, and check</title>
  <desc id="desc">Four established changes in design practice are shown as historical examples. Mead and Conway connected chip and layout intent to scalable VLSI layouts through abstractions, design rules, tools, and fabrication access. RISC connected workload and software needs to a hardware-software contract through principles and quantitative tests. RTL logic synthesis connected register-transfer behavior to gate-level implementations through timing analysis and equivalence checking. Reusable generators connected parameters and design intent to reusable design families through explicit constraints and artifact checks. A separate prospective panel shows an AI-native design system connecting system intent and current project state, through learned and conventional methods, existing design tools, and checks, to a supported comparison or finding with stated alternatives and limits. The result may reject a candidate or retain the reference design. The prospective system is a research target rather than an inevitable next step or a prompt-to-chip flow.</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636D"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1683A6"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 700; fill: #59636D; letter-spacing: 0.7px; }
      .stage-title { font-size: 16px; font-weight: 700; fill: #20252B; }
      .field { font-size: 10.5px; font-weight: 700; fill: #59636D; letter-spacing: 0.45px; }
      .value { font-size: 13px; fill: #2D353C; }
      .note { font-size: 13.5px; font-weight: 700; fill: #2B596A; }
      .panel-title { font-size: 16.5px; font-weight: 700; fill: #20252B; }
      .panel-sub { font-size: 12.5px; fill: #3F4A53; }
      .history-card { fill: #FFFFFF; stroke: #9AA8B5; stroke-width: 1.3; }
      .history-head-blue { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.3; }
      .history-head-orange { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.3; }
      .history-head-purple { fill: #F0ECFA; stroke: #6A4FC7; stroke-width: 1.3; }
      .history-head-green { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.3; }
      .divider { stroke: #C8D0D7; stroke-width: 1; }
      .timeline { fill: none; stroke: #59636D; stroke-width: 1.5; }
      .timeline-node { fill: #FFFFFF; stroke: #59636D; stroke-width: 1.4; }
      .synthesis { fill: #F5F8FA; stroke: #9AA8B5; stroke-width: 1.2; }
      .prospective { fill: #FCFBFE; stroke: #6A4FC7; stroke-width: 1.6; stroke-dasharray: 7 4; }
      .input { fill: #E4F1F6; stroke: #1683A6; stroke-width: 1.3; }
      .method { fill: #FBF0DE; stroke: #E68A17; stroke-width: 1.3; }
      .tool { fill: #F5F8FA; stroke: #9AA8B5; stroke-width: 1.3; }
      .result { fill: #E7F5EC; stroke: #1E9E48; stroke-width: 1.5; }
      .flow { fill: none; stroke: #1683A6; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#FFFFFF"/>
  <g class="font">
    <text class="eyebrow" x="600" y="62" text-anchor="middle">ESTABLISHED SHIFTS IN DESIGN PRACTICE</text>

    <line class="timeline" x1="78" y1="86" x2="1122" y2="86" marker-end="url(#arrow-gray)"/>
    <circle class="timeline-node" cx="172.5" cy="86" r="5"/>
    <circle class="timeline-node" cx="457.5" cy="86" r="5"/>
    <circle class="timeline-node" cx="742.5" cy="86" r="5"/>
    <circle class="timeline-node" cx="1027.5" cy="86" r="5"/>

    <rect class="history-card" x="45" y="106" width="255" height="282"/>
    <rect class="history-head-blue" x="45" y="106" width="255" height="48"/>
    <text class="stage-title" x="172.5" y="136" text-anchor="middle">Mead–Conway VLSI</text>
    <line class="divider" x1="45" y1="230" x2="300" y2="230"/>
    <line class="divider" x1="45" y1="306" x2="300" y2="306"/>
    <text class="field" x="61" y="179">INPUT / INTENT</text>
    <text class="value" x="61" y="203">chip and layout intent</text>
    <text class="field" x="61" y="255">DESIGN OBJECT</text>
    <text class="value" x="61" y="279">scalable VLSI layout</text>
    <text class="field" x="61" y="331">DEPENDABLE THROUGH</text>
    <text class="value" x="61" y="354">abstractions + design rules</text>
    <text class="value" x="61" y="373">tools + fabrication access</text>

    <rect class="history-card" x="330" y="106" width="255" height="282"/>
    <rect class="history-head-orange" x="330" y="106" width="255" height="48"/>
    <text class="stage-title" x="457.5" y="136" text-anchor="middle">RISC</text>
    <line class="divider" x1="330" y1="230" x2="585" y2="230"/>
    <line class="divider" x1="330" y1="306" x2="585" y2="306"/>
    <text class="field" x="346" y="179">INPUT / INTENT</text>
    <text class="value" x="346" y="203">workload + software needs</text>
    <text class="field" x="346" y="255">DESIGN OBJECT</text>
    <text class="value" x="346" y="279">hardware–software contract</text>
    <text class="field" x="346" y="331">DEPENDABLE THROUGH</text>
    <text class="value" x="346" y="354">architectural principles</text>
    <text class="value" x="346" y="373">+ quantitative tests</text>

    <rect class="history-card" x="615" y="106" width="255" height="282"/>
    <rect class="history-head-purple" x="615" y="106" width="255" height="48"/>
    <text class="stage-title" x="742.5" y="136" text-anchor="middle">RTL Logic Synthesis</text>
    <line class="divider" x1="615" y1="230" x2="870" y2="230"/>
    <line class="divider" x1="615" y1="306" x2="870" y2="306"/>
    <text class="field" x="631" y="179">INPUT / INTENT</text>
    <text class="value" x="631" y="203">register-transfer behavior</text>
    <text class="field" x="631" y="255">DESIGN OBJECT</text>
    <text class="value" x="631" y="279">gate-level implementation</text>
    <text class="field" x="631" y="331">DEPENDABLE THROUGH</text>
    <text class="value" x="631" y="354">timing analysis</text>
    <text class="value" x="631" y="373">+ equivalence checking</text>

    <rect class="history-card" x="900" y="106" width="255" height="282"/>
    <rect class="history-head-green" x="900" y="106" width="255" height="48"/>
    <text class="stage-title" x="1027.5" y="136" text-anchor="middle">Reusable Generators</text>
    <line class="divider" x1="900" y1="230" x2="1155" y2="230"/>
    <line class="divider" x1="900" y1="306" x2="1155" y2="306"/>
    <text class="field" x="916" y="179">INPUT / INTENT</text>
    <text class="value" x="916" y="203">parameters + design intent</text>
    <text class="field" x="916" y="255">DESIGN OBJECT</text>
    <text class="value" x="916" y="279">reusable design family</text>
    <text class="field" x="916" y="331">DEPENDABLE THROUGH</text>
    <text class="value" x="916" y="354">explicit constraints</text>
    <text class="value" x="916" y="373">+ artifact checks</text>

    <rect class="synthesis" x="160" y="408" width="880" height="42"/>
    <text class="note" x="600" y="434" text-anchor="middle">Each shift joined a better abstraction to a repeatable way to produce and check designs.</text>

    <rect class="prospective" x="45" y="478" width="1110" height="210"/>
    <text class="panel-title" x="65" y="505">Prospective AI-Native Design System</text>
    <text class="eyebrow" x="1135" y="505" text-anchor="end">RESEARCH TARGET, NOT AUTOMATIC PROGRESSION</text>

    <rect class="input" x="70" y="530" width="220" height="54"/>
    <text class="stage-title" x="180" y="562" text-anchor="middle">System intent</text>
    <rect class="input" x="70" y="606" width="220" height="54"/>
    <text class="stage-title" x="180" y="638" text-anchor="middle">Current project state</text>

    <path class="flow" d="M 290 557 H 330 V 574 H 360" marker-end="url(#arrow-blue)"/>
    <path class="flow" d="M 290 633 H 330 V 616 H 360" marker-end="url(#arrow-blue)"/>

    <rect x="360" y="530" width="440" height="130" fill="#FFFFFF" stroke="#6A4FC7" stroke-width="1.5"/>
    <text class="stage-title" x="580" y="554" text-anchor="middle">AI-native design system</text>
    <rect class="method" x="385" y="572" width="190" height="58"/>
    <text class="panel-title" x="480" y="595" text-anchor="middle">Learned + conventional</text>
    <text class="panel-sub" x="480" y="615" text-anchor="middle">methods select actions</text>
    <rect class="tool" x="595" y="572" width="180" height="58"/>
    <text class="panel-title" x="685" y="595" text-anchor="middle">Tools + checks</text>
    <text class="panel-sub" x="685" y="615" text-anchor="middle">execute and test</text>
    <line class="flow" x1="575" y1="601" x2="595" y2="601" marker-end="url(#arrow-blue)"/>

    <line class="flow" x1="800" y1="595" x2="855" y2="595" marker-end="url(#arrow-blue)"/>
    <rect class="result" x="855" y="540" width="270" height="110"/>
    <text class="stage-title" x="990" y="570" text-anchor="middle">Supported Architecture Result</text>
    <text class="panel-sub" x="990" y="594" text-anchor="middle">supported comparison or finding</text>
    <text class="panel-sub" x="990" y="615" text-anchor="middle">alternatives + limits</text>
    <text class="panel-sub" x="990" y="636" text-anchor="middle">may reject candidate or retain reference</text>

    <text class="eyebrow" x="600" y="678" text-anchor="middle">THE TARGET IS SUPPORTED ARCHITECTURE WORK, NOT DIRECT PROMPT-TO-CHIP GENERATION</text>
  </g>
</svg>
