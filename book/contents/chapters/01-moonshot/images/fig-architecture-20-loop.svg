<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>A proposed design experiment loop</title><desc>Requirements guide generation of a design organization and matching hardware and software. Evaluation feedback guides further generation and revision, with results available for architect review.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#59636D"/></marker></defs>
<rect width="960" height="440" fill="white"/>
<rect x="30" y="20" width="900" height="70" rx="3" fill="#E4F1F6" stroke="#1683A6" stroke-width="1.6"/>
<text x="45" y="47" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Workload, requirements, and choices the experiment permits</text>
<text x="45" y="73" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">For example: generate a memory organization that meets the power budget and required software behavior</text>
<rect x="30" y="145" width="260" height="103" rx="3" fill="#F0ECFA" stroke="#6A4FC7" stroke-width="1.6"/>
<text x="45" y="172" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Generate and revise</text>
<text x="45" y="198" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Propose an organization</text>
<text x="45" y="220" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">and matching interfaces</text>
<rect x="350" y="145" width="260" height="103" rx="3" fill="#FBF0DE" stroke="#E68A17" stroke-width="1.6"/>
<text x="365" y="172" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Build the combination</text>
<text x="365" y="198" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Matching hardware, software,</text>
<text x="365" y="220" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">and test configurations</text>
<rect x="670" y="145" width="260" height="103" rx="3" fill="#E7F5EC" stroke="#1E9E48" stroke-width="1.6"/>
<text x="685" y="172" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Evaluate with tools</text>
<text x="685" y="198" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Simulation, implementation,</text>
<text x="685" y="220" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">and verification checks</text>
<path d="M160 90 V145" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M290 196 H350" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M610 196 H670" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M800 248 V295 H160 V248" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="480" y="323" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#59636D">Measurements and failures guide the next design</text>
<rect x="240" y="355" width="480" height="68" rx="3" fill="#FBEDF4" stroke="#D24D96" stroke-width="1.6"/>
<text x="255" y="382" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#20252B">Architect review</text>
<text x="255" y="408" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#20252B">Reconsider the candidate, the experiment, or its goals</text>
<path d="M800 295 V389 H720" fill="none" stroke="#59636D" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
