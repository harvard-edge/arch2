contract_version: "2.0"
study_id: "micro-loop-c-floorplan-congestion"
title: "Micro-Loop C: Physical Design, Macro Placement, and Routing Congestion"

domain: "physical_design"
target_system: "Systolic Compute & SRAM Tile"

constraints:
  die_width_um: 1000
  die_height_um: 1000
  max_peak_routing_congestion_pct: 85.0
  max_hpwl_um: 10000.0
  technology_node: "130nm"

modes:
  assisted:
    description: "LLM drafts initial floorplan macro coordinates without physical layout feedback."
    interaction: "open_loop"
    adaptation_scope: "script_drafting"

  driven:
    description: "Single-objective optimization (HPWL minimization) adjusting macro (x, y) coordinates."
    interaction: "closed_loop_single_layer"
    adaptation_scope: "macro_coordinates_only"

  native:
    description: "Multi-objective cross-layer adaptation: routing congestion heatmap feedback triggers macro pin re-orientation, channel widening, and memory banking repartitioning."
    interaction: "closed_loop_cross_layer"
    adaptation_scope: "macro_placement_plus_orientation_plus_memory_repartitioning"
    rejection_checks:
      - id: "routing_congestion"
        rule: "peak_congestion_pct <= 85.0"
      - id: "hpwl_bound"
        rule: "total_hpwl_um <= 10000.0"
      - id: "drc_overlap"
        rule: "macro_overlaps == 0"
