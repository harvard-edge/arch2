contract_version: "2.0"
study_id: "micro-loop-a-systolic-sweep"
title: "Micro-Loop A: Systolic Array Microarchitectural Search and the Memory Wall"

domain: "microarchitecture"
target_system: "Wearable XR Matrix Accelerator"

constraints:
  max_pe_budget: 1024
  target_clock_mhz: 500
  interface_bandwidth_words_per_cycle: 4  # 4 words/cyc * 2 bytes * 500 MHz = 4.0 GB/s (wearable LPDDR budget)
  sram_buffer_kib: 128
  workload: "workload/xr_gemm.csv"

modes:
  assisted:
    description: "AI generates a single proposed geometry based on prompt context."
    interaction: "open_loop"
    adaptation_scope: "single_point"

  driven:
    description: "Automated search across aspect ratios under a fixed Output Stationary dataflow."
    interaction: "closed_loop_single_layer"
    adaptation_scope: "pe_dimensions_only"
    search_space:
      rows: [8, 16, 32, 64, 128]
      cols: [128, 64, 32, 16, 8]

  native:
    description: "Evidence-triggered cross-abstraction co-adaptation: simulator reports memory wall saturation, triggering a dataflow reorientation to Weight Stationary and buffer repartitioning."
    interaction: "closed_loop_cross_layer"
    adaptation_scope: "geometry_plus_dataflow_plus_buffering"
    rejection_checks:
      - id: "pe_budget"
        rule: "rows * cols <= 1024"
      - id: "dram_traffic_limit"
        rule: "total_dram_writes <= 100000"
