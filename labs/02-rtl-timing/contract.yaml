contract_version: "2.0"
study_id: "micro-loop-b-rtl-timing-closure"
title: "Micro-Loop B: RTL Generation, Synthesis, and Timing Closure"

domain: "rtl_and_synthesis"
target_system: "Systolic PE Accumulator Datapath"

constraints:
  clock_period_ns: 2.0
  target_frequency_mhz: 500
  bitwidth: 32
  max_gate_count: 2500
  technology_node: "130nm"

modes:
  assisted:
    description: "Model drafts single-cycle naive ripple-carry accumulator RTL."
    interaction: "open_loop"
    adaptation_scope: "code_drafting"

  driven:
    description: "Automated synthesis tool parameter sweep (effort flags, flattening) on unchanged naive RTL."
    interaction: "closed_loop_single_layer"
    adaptation_scope: "synthesis_flags_only"

  native:
    description: "Evidence-triggered architectural RTL refactoring: negative setup slack on the carry chain triggers transformation to carry-save arithmetic with formal verification."
    interaction: "closed_loop_cross_layer"
    adaptation_scope: "microarchitectural_datapath_plus_formal_verification"
    rejection_checks:
      - id: "timing_slack"
        rule: "setup_slack_ns >= 0.0"
      - id: "area_budget"
        rule: "total_gate_count <= 2500"
      - id: "formal_equivalence"
        rule: "equivalence_check == PASS"
