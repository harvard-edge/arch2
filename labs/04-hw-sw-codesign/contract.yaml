contract_version: "2.0"
study_id: "micro-loop-d-hw-sw-codesign"
title: "Micro-Loop D: Hardware-Software Co-Design and Instruction Specialization"

domain: "codesign"
target_system: "Mobile XR Compute Subsystem (VexRiscv / RV32IMAF)"

constraints:
  workload_kernel: "XR Feature Point Detection 2D Filtering"
  input_dimension: 256
  max_hardware_area_ge: 15000
  target_cycle_budget: 50000

modes:
  assisted:
    description: "LLM drafts a custom dot-product opcode and scalar inline assembly wrapper."
    interaction: "open_loop"
    adaptation_scope: "isolated_instruction_drafting"

  driven:
    description: "Compiler autotuner sweeps unroll factors and scheduling passes on static hardware."
    interaction: "closed_loop_single_layer"
    adaptation_scope: "compiler_flags_only"

  native:
    description: "Profile-driven joint co-adaptation: profiler identifies register pressure and address calculation stalls, triggering simultaneous co-design of packed SIMD post-increment hardware and compiler lowering."
    interaction: "closed_loop_cross_layer"
    adaptation_scope: "instruction_semantics_plus_datapath_plus_compiler_scheduling"
    rejection_checks:
      - id: "area_budget"
        rule: "total_area_ge <= 15000"
      - id: "cycle_target"
        rule: "execution_cycles <= 50000"
      - id: "functional_correctness"
        rule: "kernel_numerical_error == 0.0"
